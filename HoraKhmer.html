<!DOCTYPE html>
<html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ហោរាសាស្រ្តខ្មែរ — Khmer Fortune Teller</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&family=Moul&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1f2e;--navy:#14213d;--gold:#c9a227;--muted:#6f6a5c;--line:#e4dccb;--bg:#f6f1e6;--card:#fff;--good:#1e6b34;--bad:#9b2c2c;--tr:#b5541b}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Kantumruy Pro',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
main{max-width:980px;margin:0 auto;padding:20px 16px 40px}
header{text-align:center;margin:8px 0 18px}
.kicker{color:var(--gold);letter-spacing:2px;font-size:.85rem}
h1{font-family:'Moul',serif;font-weight:400;color:var(--navy);font-size:1.9rem;margin:6px 0 2px;line-height:1.7}
h1 .en{display:block;font-family:"Kantumruy Pro",sans-serif;font-weight:600;font-size:1.05rem;letter-spacing:2px;color:var(--gold);line-height:1.4}
.sub{color:var(--muted);margin:0;font-size:.95rem}
h2{font-size:1.05rem;color:var(--navy);margin:0 0 .6rem;padding-bottom:.35rem;border-bottom:2px solid var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(20,33,61,.06);margin-bottom:16px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.form label,.form fieldset{display:grid;gap:4px;font-weight:600;font-size:.92rem;color:var(--navy);border:0;padding:0;margin:0}
.form legend{padding:0;margin-bottom:4px}
.full{grid-column:1/-1}
.field{height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-weight:400;background:#fffdf8;color:var(--ink);width:100%}
.field:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.field.sm{height:36px;width:auto}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;border:1px solid var(--line);background:#fffdf8;border-radius:999px;padding:7px 16px;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#f1dc9b}
.row{display:flex;gap:10px}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 22px;background:var(--navy);color:#f1dc9b;cursor:pointer}
.btn:hover{background:#22355f}.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line)}.btn.sm{padding:6px 12px;font-size:.85rem}
.err{color:var(--bad);margin:0}
.sum{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;background:linear-gradient(135deg,#14213d,#24406e);color:#eee6cf;border:0}
.sum .nm{font-family:'Moul',serif;font-size:1.35rem;color:#f1dc9b;line-height:1.7}.sum .muted{color:#c9c2ad}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 20px;flex:1;font-size:.93rem}
.facts span{display:inline-block;min-width:86px;color:var(--gold)}.facts b{color:#fff}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
.chart{width:100%;max-width:470px;display:block;margin:0 auto;font-family:'Kantumruy Pro',sans-serif}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;font-size:.82rem;color:var(--muted);margin-top:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}.dot.in{background:var(--navy)}.dot.out{background:var(--tr)}
.trow{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;justify-content:center;margin-top:10px;font-size:.85rem}.trow label{display:grid;gap:2px;color:var(--tr);font-weight:600}
table{border-collapse:collapse;width:100%}
th{background:var(--navy);color:#f1dc9b;font-weight:600;font-size:.82rem;padding:6px 8px;text-align:left;white-space:nowrap}
th.tr{background:#7a3a12}th.c{text-align:center}
td{border-bottom:1px solid var(--line);padding:6px 8px;font-size:.9rem;vertical-align:top}
tbody tr:nth-child(even) td{background:#fbf8f1}
tr.asc td{background:#fff3cf!important}
.pos td:nth-child(n+6){color:var(--tr)}.pos td{white-space:nowrap}
.scroll{overflow-x:auto}
.tag{display:inline-block;font-size:.72rem;border-radius:8px;padding:0 6px;margin:1px 3px 1px 0;white-space:nowrap}.tag.good{background:#dff1e2;color:var(--good)}.tag.bad{background:#f6dddd;color:var(--bad)}
.mini td{font-size:.84rem;padding:3px 6px}
.tk{width:auto;margin:4px auto}.tk td{border:0;border-right:2px solid var(--navy);border-bottom:2px solid var(--navy);text-align:center;min-width:64px;padding:6px 8px;background:transparent!important}
.tk tr td:last-child{border-right:0}.tk tr:last-child td{border-bottom:0}.tk b{display:block;font-size:1.25rem;color:var(--navy);line-height:1.2}.tk small{color:var(--muted);font-size:.72rem}
.note{font-size:.8rem;color:var(--muted);margin:.6rem 0 0}.note.c{text-align:center}
footer{text-align:center;font-size:.78rem;color:var(--muted);margin-top:20px}footer a{color:var(--navy)}
.fade{animation:f .4s ease}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
@media (max-width:760px){.grid2{grid-template-columns:1fr}.form{grid-template-columns:1fr}h1{font-size:1.5rem}}
</style></head><body><div id="root"></div>
