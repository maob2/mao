ng became regent, Guan Shu coveted power, spread rumors (\"Zhou Gong will harm King Cheng\"), and rebelled with dozens of states allied to Shang. This was a heavy blow to the three-year-old Zhou Dynasty."],"The cart loses its spokes and husband and wife quarrel; forcing ahead breaks things down."],"9.4":["Six in the Fourth Place","If you are sincere, blood vanishes and fear gives way. No blame.","With sincerity, danger recedes and caution is set aside — no blame.",["The Commentary on the Images says: With sincerity, caution is set aside — this aligns with the will of the superior."],["The Commentary on the Image states: With sincerity and release from caution, one aligns their will with the ruler (Nine in the Fifth Place)."],["As the only yin line in the hexagram, it restrains the five yang lines above and below. How to unite and attract the dominant Nine in the Fifth Place? Subordinates struggle to act, as they face the superior’s suspicion and even danger. Six in the Fourth Place must prioritize sincerity to gain Nine in the Fifth Place’s trust — like Zhuge Liang moving Liu Shan with the Chu Shi Biao (though Nine in the Fifth Place is a wiser ruler than Liu Shan)."],"Sincerity dispels danger and fear; no blame."],"9.5":["Nine in the Fifth Place","If you are sincere and loyally attached, you are rich in your neighbor.","Sincerity binds [them together], enriching one’s neighbors as well.",["The Commentary on the Images says: Sincerity binding [them together] means one does not enrich oneself alone."],["The Commentary on the Image states: \"Sincerity binding [them together]\" means one does not seek wealth alone."],["Nine in the Fifth Place sincerely cooperates to let Six in the Fourth Place fulfill its role. It must strengthen cooperation with Six in the Fourth Place through sincerity (like a clenched fist), dispelling Six in the Fourth Place’s suspicion of slander, so it can fully assist. This mirrors Liu Bei’s devotion to Zhuge Liang — their harmonious ruler-minister bond led Zhuge Liang to repay with lifelong dedication, a perfect example of superior-subordinate relations."],"Sincerity binds others to you, and you share your wealth with your neighbors."],"9.6":["Nine at the top","The rain comes, there is rest.This is due to the lasting effect of character.Perseverance brings the woman into danger. The moon is nearly full. If the superior man persists, misfortune comes.","The needed rain has fallen and settled; virtue is accumulated. A woman remaining steadfast in danger: the moon is nearly full — for the noble person, campaigning brings misfortune.",["The Commentary on the Images says: The rain has fallen and settled — virtue is accumulated. Campaigning brings misfortune to the noble person because of suspicion."],["The Commentary on the Image states: The needed rain has accumulated — this is the accumulation of virtue. Campaigning brings misfortune to the noble person due to suspicion."],["Minor Accumulation has reached its peak; yin-yang harmony brings rain, symbolizing the Perfection of yin restraining yang. Balance between yin and yang ensures stability — further development will reverse this, causing conflict. Zhou Gong expanded Western Zhou’s territory, humbly welcoming talents (his \"virtue accumulation\"), but his achievements threatened the ruler, Holding military power for campaigns aroused King Cheng’s suspicion, so Zhou Gong fled to Chu for political asylum, later recalled by King Cheng."],"The rain has fallen and gains are full; stop here and stay cautious as the moon nears full."],"10.1":["Nine at the beginning","Simple conduct. Progress without blame.","Plain treading — proceed without blame.",["The Commentary on the Images says: Plain conduct means acting on one’s own will."],["The Commentary on the Image states: Plain treading means proceeding according to one’s own will."],["New to the world, one should act simply, without pretense — this avoids fault (if not guaranteeing good fortune). To persist requires independence from trends: e.g., Li Siguang believed China had oil (despite foreign experts’ skepticism) and proved it through geological surveys."],"Plain, simple conduct: proceed without blame."],"10.2":["Nine in the Second Place","Treading a smooth, level course. The perseverance of a dark man Brings good fortune.","The path of treading is smooth; the secluded person is auspicious in constancy.",["The Commentary on the Images says: The secluded person’s auspicious constancy comes from not being disturbed while centered."],["The Commentary on the Image states: The secluded person’s auspicious constancy comes from remaining centered without disruptive intentions."],["Nine in the Second Place is a calm traveler who walks smoothly but plans for danger in advance — ensuring auspiciousness. This mirrors Napoleon, who prepared for emergencies as a habit, making him a successful general."],"A smooth, level road: calm, quiet steadiness brings good fortune."],"10.3":["Six in the Third Place","A one-eyed man is able to see, A lame man is able to tread. He treads on the tail of the tiger. The tiger bites the man. Misfortune. Thus does a warrior act on behalf of his great prince.","One-eyed yet sees; lame yet treads, Treading on a tiger’s tail, it bites — misfortune. A warrior seeks to be a great ruler.",["The Commentary on the Images says: One-eyed yet sees — insufficient clarity, Lame yet treads — insufficient mobility. The tiger’s bite brings misfortune — the position is improper.\" . The warrior seeks to be a great ruler: his will is firm."],["The Commentary on the Image states: \"One-eyed yet sees\" — not clear enough. \"Lame yet treads\" — not mobile enough. The tiger’s bite brings misfortune: the position is wrong. The warrior secks to be a great ruler — his will is just firm."],["Weakness plus recklessness leads to trouble — like a blind, lame person overestimating themselves and rushing out. Six in the Third Place is ambitious but incompetent and reckless; this warns that goals must match one’s ability and position, or danger follows."],"Overestimating yourself, you tread on the tiger's tail and it bites; reckless ambition brings misfortune."],"10.4":["Nine in the Fourth Place","He treads on the tail of the tiger. Caution and circumspection. Lead ultimately to good fortune.","Treading on a tiger’s tail, trembling but finally auspicious.",["The Commentary on the Images says: Trembling but finally auspicious — his will is carried out."],["The Commentary on the Image states: Trembling but finally auspicious — he acts with caution to fulfill his ambition."],["Nine in the Fifth Place represents the tiger; Nine in the Fourth Place treads close behind (the “tiger’s tail\"), but acts cautiously, acknowledges flaws, balances firmness and flexibility —making it capable (unlike the reckless Six in the Third Place)."],"You tread on the tiger's tail with care; fear turns into a good end."],"10.5":["Nine in the Fifth Place","Resolute conduct. Perseverance with awareness of danger.","Resolute treading — constancy through danger.",["The Commentary on the Images says: \"Resolute treading, constancy through danger — the position is correct.\""],["The Commentary on the Image states: Resolute treading, constancy through danger — the position is proper."],["Nine in the Fifth Place has absolute authority, acts resolutely but rigidly, lacks tolerance — leading to isolation (like a new leader rejected by colleagues and staff). Failing to use authority to resolve this leads to disaster."],"Resolute treading: firm decisions, but stay aware of the danger."],"10.6":["Nine at the top","Look to your conduct and weigh the favorable signs. When everything is fulfilled, supreme good fortune comes.","Examine one’s treading for good fortune; returning brings great auspiciousness.",["The Commentary on the Images says: Great auspiciousness at the top — there is great celebration."],["The Commentary on the Image states: Great auspiciousness at the top means great celebration."],["Top Nine constantly reflects on and improves its actions — reducing mistakes (like Confucius’ \"daily self-examination\"). This leads to great success (\"great celebration\"), emphasizing the value of self-reflection and correction for personal growth."],"Review your conduct and its results; reflection brings great good fortune."],"11.1":["Nine at the beginning","When ribbon grass is pulled up, the sod comes with it. Each according to his kind. Undertakings bring good fortune.","Pull up the thatch; its long roots bring its kind away from the soil. Marching to war is auspicious.",["The Commentary on the Images says: “Pull up the thatch, marching to war is auspicious” — the will is directed outward."],["The Commentary on the Images say: Pulling up the thatch and marching to war is auspicious, because one’s will is striving upward."],["Pulling up thatch is like “pulling a radish and bringing up the mud” — it means capturing the principal offender and his accomplices. The Son of Heaven is the Alliance Leader of the feudal states; those who disobey must be attacked with troops. Hexagram Tai represents peace and stability, so why start with conquest? Because no ancient golden age was without war: when people grew wealthy, the state became strong, and then expanded its territory — that is a historical pattern. One condition of a golden age is a vast territory; Tai literally means “the greatest of greatness” — how can there be no war?"],"Pull up the thatch and the roots come with it: act together with allies for good fortune."],"11.2":["Nine in the second place","Bearing with the uncultured in gentleness, fording the river with resolution, not neglecting what is distant, not regarding one's companions: thus one may manage to walk in the middle.","Embrace the eight wildernesses, wade rivers on foot, do not abandon friends in distant lands, do not form cliques for personal gain. This is the principle of balanced conduct.",["The Commentary on the Images says: “Embrace the wilderness, follow the balanced path” — this is to broaden (one’s virtue)."],["The Commentary on the Images says: Embracing the wilderness and following the balanced path shows that Nine in the Second Place has broad virtue."],["Nine in the Second Place has four key traits: 1. Magnanimous tolerance-able to accept all that is adverse , even petty people ; 2. Courage and resoluteness; 3. Not abandoning distant worthies; 4, Not forming cliques. Not abandoning the distant, not coddling the close — this is the ideal minister for governing. As a high official, Nine in the Second Place must also be loyal to the Meng Zhu (the Sun of Heaven , as the overlord of feudal states) loyalty means avoiding cliques, These are essential qualities for the ruling class in a golden age."],"Embrace the wilds and wade the rivers: be tolerant, brave, loyal to distant friends, and free of cliques."],"11.3":["Nine in the third place","No plain not followed by a slope. No going not followed by a return. He who remains persevering in danger is without blame. Do not complain about this truth; enjoy the good fortune you still Possess.","There is no plain without a slope, no going without returning. Enduring hardship with integrity brings no blame. Do not worry overmuch; be sincere at heart, and there will be good fortune in sustenance.",["The Commentary on the Images says: “No going without returning” — this is the boundary of heaven and earth."],["The Commentary on the Images says: There is no going without returning, for heaven and earth also have boundaries."],["Things develop through reversal: when Tai reaches its peak, it becomes Pi; when Pi reaches its peak, it becomes Tai. Nine in the Third Place is at the junction of Tai’s upper and lower trigrams — the “boundary of heaven and earth,” the peak of yang energy and the turning point to yin. How can one keep going without returning? There is no slope without a plain, no coming without going. Even in a golden age, injustices occur — so one must maintain perseverance and integrity."],"No plain without a slope: prosperity will turn, so stay steady and sincere and enjoy your blessings."],"11.4":["Six in the fourth place","He flutters down, not boasting of his wealth, together with his neighbor, guileless and sincere.","Lightly and not wealthy, associating with neighbors, without caution but with sincerity.",["The Commentary on the Images says: “Lightly and not wealthy” — all lack substance. “Without caution but with sincerity” — this is the wish of the heart."],["The Commentary on the Commentary says: “Lightly and not wealthy” because all lack solidity. “Without caution but with sincerity” because it is the heart’s desire."],["As a high state official, why is Six in the Fourth Place “lightly and not wealthy”? Because he is an honest official! A golden age cannot exist without honest officials: if high officials are wealthy and corrupt, how can a golden age emerge? Thus, a golden age needs not only a good emperor but also good officials, Six in the Fourth Place is a fine official: approachable, sincere, and trustworthy — people need not be wary of him. Ji Xiaolan and Liu Luoguo were such honest officials."],"Fluttering down with no show of wealth: be sincere with your neighbors without suspicion."],"11.5":["Six in the fifth place","The sovereign I gives his daughter in marriage. This brings blessing and supreme good fortune.","Emperor Yi marries off his younger sister; thus, there is good fortune, great auspiciousness.",["The Commentary on the Images says: “Thus, good fortune and great auspiciousness” — the balanced path fulfills the wish."],["The Commentary on the Images says: “Thus, good fortune and great auspiciousness” — following the balanced path fulfills one’s wish."],["When a feudal state grows strong, the alliance leader seeks to bond with it — by marrying of a younger sister or daughter. This was a classic governing method in feudal society. Before the Qin Dynasty, the enfeoffment system prevailed; states strengthened unity through marriage, but this led to internal strife. From the Yellow Emperor to the Warring States, most wars were power struggles among related ruling classes. Today, two competing corporations often turn enemies into friends (or kin) through a marriage."],"Emperor Yi marries off his sister: a humble ruler brings blessing and great good fortune."],"11.6":["Six at the top","The wall falls back into the moat. Use no army now. Make your commands known within your own town. Perseverance brings humiliation.","The city wall collapses into the moat; do not use troops. Issue orders from the city — even with integrity, there is regret.",["The Commentary on the Images says: “The city wall collapses into the moat” — the command is in chaos."],["The Commentary on the Images says: “The city wall collapses into the moat” means Hexagram Tai has turned from order to chaos at Six at the Top."],["This is the end of Hexagram Tai. The city wall was built from soil dug from the moat — just as Tai’s prosperity was built through long- term struggle. Now the wall collapses, and its soil fills the moat: this symbolizes Tai reaching its peak and returning to Pi. This is a historical inevitability, an inherent law of human society. Yet Pi will not last forever; when it peaks, it returns to Tai. History advances through cycles, rising in a spiral.","Tui Bei Tu, Hexagram 52: Interpreting Hexagram Tai Tai * Yi Mao RZ a cn"],"The wall collapses into the moat: peace ends; don't use troops, and persisting brings regret."],"12.1":["Six at the Beginning","When ribbon grass is pulled up, the sod comes with it.Each according to his kind.Perseverance brings good fortune and success.","Pull up the thatch; its long roots bring other thatch away from the soil. Upholding the right path is auspicious and prosperous.",["The Commentary on the Images says: “Pull up the thatch, auspicious to hold firm” — the will is directed toward the ruler."],["The Commentary on the Images says: Pulling up the thatch and upholding the right path is auspicious because the will is focused on the ruler — symbolizing purging petty people around the ruler."],["Six at the Beginning is impetuous and reckless. Staying still preserves safety; wait for change. Tai refers to the Son of Heaven’s majestic campaigns against rebellious states; this line refers to a low-ranking man of virtue invited by a minister to purge the ruler’s court (like heroes expelling Dong Zhuo in the Three Kingdoms). Success with integrity brings auspiciousness — Cao Cao, Liu Bei, and Sun Quan became heroes this way, showing “heroes emerge in troubled times.”"],"Pull up the thatch: worthy people withdraw together, and holding to the right path is good."],"12.2":["Six in the Second Place","They bear and endure.This means good fortune 12 for inferior people.The standstill serves to help the great man to attain success.","Embrace and endure. Auspicious for petty people; blocked for great people, yet prosperous.",["The Commentary on the Images says: “Great people are blocked, yet prosperous” — they do not join the petty crowd."],["The Commentary on the Images says: “Great people are blocked, yet prosperous” means the ruler (Nine in the Fifth Place) is not disrupted by petty cliques."],["This is a petty person who flatteringly serves the ruler (Nine in the Fifth Place), using compliance to win favor (even co-opting gentlemen), When petty people flourish, the gentleman accepts blockage, draws boundaries, remains pure, and waits for opportunity, avoiding temptation. Like Duke Zhao of Lu: though ruler, power was held by the Ji clan; the feudal Leader of an Alliance was a figurehead, and the Son of Heaven was controlled by a hegemon, Duke Zhao endured to survive, but when he challenged the Ji clan, he was exiled — showing the danger of Tai turning to Pi."],"Endure and tolerate: petty people thrive, while the great person accepts the blockage and still prospers."],"12.3":["Six in the Third Place","They bear shame.","Embrace shame.",["The Commentary on the Images says: “Embrace shame” — the position is improper."],["The Commentary on the Images says: “Embrace shame” because Six in the Third Place holds an improper position."],["Six in the Third Place is a high-ranking, unbalanced petty person — impetuous. In political blockage, they abandon the right path to climb the ranks quickly. This reflects a declining era: people lose shame, and licentiousness arises between men and women (hence “shame”."],"Bearing shame: an unqualified person in a high position is humiliated."],"12.4":["Nine in the Fourth Place","He who acts at the command of the highest remains without blame. Those of like mind partake of the blessing.","Given a mandate, no blame; others gather to share good fortune.",["The Commentary on the Images says: “Given a mandate, no blame” — the will is being carried out."],["The Commentary on the Images says: “Given a mandate, no blame” means Nine in the Fourth Place is acting to reverse the petty person’s path,"],["Scize the moment to turn Pi to Tai — premature action is futile. Nine in the Fourth Place (a high minister) reaches the threshold of prosperity, receives the ruler’s mandate to purge the court, and enlists Six at the Beginning (its corresponding line) to succeed. All share good fortune; though bold, the mandate ensures no blame."],"Acting under a mandate brings no blame, and others share in the good fortune."],"12.5":["Nine in the Fifth Place","Standstill is giving way. Good fortune for the great man. “What if it should fail, what if it should fail?” In this way he ties it to a cluster of mulberry shoots.","Cease Pi; great people are auspicious. “Perish, perish” — yet tied to a mulberry tree.",["The Commentary on the Images says: “Great people are auspicious” — the position is proper."],["The Commentary on the Images says: “Great people are auspicious” because Nine in the Fifth Place holds a balanced, proper position."],["The ruler’s petty attendants are finally removed. The restored ruler learns: “Be secure but not forget danger; exist but not forget ruin; govern but not forget chaos.” Guard against failure at the cusp of success — constant vigilance ensures the state endures."],"The standstill is ending: the great person is safe if he stays wary, as if tied to a mulberry tree."],"12.6":["Nine at the Top","The standstill comes to an end. First standstill, then good fortune.","Overthrow Pi; first blockage, then joy.",["The Commentary on the Images says: “Pi ends in 4 overthrow — how can it last?”"],["The Commentary on the Images says: “Pi ends in overthrow — how can it persist?”"],["The petty person’s path ends; blockage reaches its limit, and reversal occurs (Pi turns to Tai). Act with the trend — do not wait passively; human effort matters. Pi does not fall on its own: Nine at the Top (bold and unstoppable) seizes the moment to overthrow blockage, requiring judgment, wit, and courage.","Tui Bei Tu(The Prophecy of the Back-Pusher), Hexagram 4: Interpreting Hexagram Pi Pi + Ding Mao","a aS","D eres","pe am"],"Overturn the standstill: blockage first, then joy."],"13.1":["First Nine","Fellowship at the gate—no blame.","Unity begins at the gate, no blame. 9",["The Commentary on the Images says:Fellowship at the gate invites no blame."],["The Commentary on the Images says:Unity from the start ensures no harm."],["The first nine breaks down barriers: leaving home to find allies ensures progress. Like a ruler posting a royal edict to seek talent, it shows that collaboration begins with openness."],"Fellowship at the gate: an open, welcoming start leaves you free of blame."],"13.2":["Second Six","Fellowship within the clan—hindrance.","Clan-only unity leads to regret.",["The Commentary on the Images says:Fellowship limited to the clan is a path of regret."],["The Commentary on the Images says:Insular unity breeds stagnation and regret."],["The second six warns against insularity: like a family- run business that resists outside input, clan-only unity limits growth and invites collapse. True fellowship demands inclusivity."],"Fellowship only within the clan: narrow loyalty leads to regret."],"13.3":["Third Nine","Hiding troops in the grass, climbing the high hill—no action for three years.","Ambush in the grass, watch from the hill — no war for three years.",["The Commentary on the Images says:Ambush reflects a strong enemy; inaction ensures safety."],["The Commentary on the Images says:Caution in the face of strength prevents disaster."],["The third nine shows the risk of rivalry in unity: like a reckless warrior ambushing a stronger foe, impulsive action leads to defeat. Patience and strategic retreat are wiser."],"Ambush in the grass, watching from the hill: suspicion keeps conflict at bay for three years."],"13.4":["Fourth Nine","Climbing the wall, not conquering—auspicious.","Climb the wall, but do not conquer — auspicious.",["The Commentary on the Images says: Climbing the enemy’s wall but not conquering reflects moral restraint; good fortune comes from returning to principle in adversity."],["The Commentary on the Images says: Moral restraint ensures good fortune — return to principle when facing crisis,"],["The fourth nine embodies \"restraint in victory\": like a noble who spares a defeated foe, moral integrity ensures lasting loyalty. War’s purpose is submission, not destruction."],"Climbing the wall but not attacking: restraint brings good fortune."],"13.5":["Fifth Nine","Fellowship, first weeping then laughing. The great army meets and prevails.","Unity through adversity — weeping then laughing. The great army prevails.",["The Commentary on the Images says:Fellowship arises from integrity; the army’s victory reflects shared purpose."],["The Commentary on the Images says:Adversity unites through integrity; shared purpose ensures victory."],["The fifth nine’s journey — from grief to joy — mirrors the struggle to unite with allies. Despite obstacles, integrity and perseverance ensure victory, turning despair into celebration."],"Weeping, then laughing: unity forged through hardship ends in triumph."],"13.6":["‘Top Nine","Fellowship in the suburbs—no regret.","Fellowship in the suburbs — no regret.",["The Commentary on the Images says:Fellowship in the suburbs reflects unfulfilled ambition."],["The Commentary on the Images says:Fellowship in the suburbs shows ambition yet to be realized."],["The top nine represents the hermit: unable to achieve grand goals, he finds peace in simplicity. Like Zhuge Liang’s advice to \"aspire to lofty ideals and emulate the wise,\" it shows that integrity matters more than fame."],"Fellowship in the distant suburbs: ambition goes unfulfilled, but there is no regret."],"14.1":["Nine at the Beginning","No relationship with what is harmful; There is no blame in this. If one remains conscious of difficulty, One remains without blame.","No harm from interaction, no blame; enduring hardship brings no blame.",["The Commentary on the Images says: “Da You, Nine at the Beginning: No harm from interaction.”"],["The Commentary on the Images says: “Da You, Nine at the Beginning: No harm from interaction.”"],["Nine at the Beginning symbolizes a newly rich, low-status person (no influence, no conflict with superiors — avoids trouble). Caution is still needed. Unlike other yang lines (which connect to Six in the Fifth Place), Nine at the Beginning has no interaction — thus no harm from interaction, reflecting “misfortune breeds fortune, fortune breeds misfortune.”"],"Without contact with harmful things there is no blame; stay careful while things are still hard."],"14.2":["Nine in the Second Place","A bie wagon for loading.One may undertake something.No blame.","Loaded on a large cart, proceeding forward — no blame.",["The Commentary on the Images says: “Carried on a great wagon, balanced accumulation avoids failure.”"],["The Commentary on the Images says: “Loaded on a large cart: balanced accumulation avoids damage.”"],["Like a large cart loaded with wealth (moving steadily), prosperity means gifts are no longer trivial — hence “loaded on a large cart.” The cart carries both material and spiritual wealth."],"A great cart loaded and moving: you can carry heavy burdens, with no blame."],"14.3":["Nine in the Third Place","A prince offers it to the Son of Heaven.A petty man cannot do this.","The duke is feasted by the ruler; the petty person cannot do this.",["The Commentary on the Images says: “The duke presents offerings to the ruler: If a petty person does this ,it bring harm.”"],["The Commentary on the Images says: “The duke resents offerings to the ruler: Ifa petty person does this ,it bring harm,”"],["Nine in the Third Place symbolizes a wealthy, high- status person — who must offer material/spiritual respect to the ruler to maintain position, Petty people (short-sighted, stingy, ignoring authority) lose more for less, Wealth brings both benefit and risk — this distinguishes gentlemen from petty people."],"The duke is feasted by the ruler: a noble can share in great wealth, while a petty person can't handle it."],"14.4":["Nine in the Fourth Place","He makes a difference between himself and his neighbor. No blame.","Not excessive, without blame — because he discerns things clearly.",["The Commentary on the Images says: “Not arrogant, no blame: this is wisdom.”"],["The Commentary on the Images says: “Not displaying one's full strength, no blame: this is wisdom.”"],["Excessive wealth risks trouble. The solution is humility: avoid arrogance, reduce excess, and retreat when successful — this is wisdom. The line teaches: “Arrogance holds one back; humility advances one.”"],"Not excessive, and clear-sighted about it: no blame."],"14.5":["Six in the Fifth Place","He whose truth is accessible, yet dignified,Has good fortune.","Sincere in interaction, authoritative — auspicious,",["The Commentary on the Images says: “With sincerity that connects all.trust inspires will. Authoritative auspiciousness: approachable, no defensiveness.”"],["The Commentary on the Images says: “Sincere in interaction: trust inspires others’ will. Authoritative auspiciousness: approachable, so others let down their guard.”"],["Six in the Fifth Place (ruler) is firm yet authoritative — not tyrannical, but approachable, sincere, selfless, and respected (a kingly demeanor). A story: a princess married a pirate and joined his voyage (traditionally unlucky for men). The pirate agreed; months later, the princess was treated like a queen — because she was virtuous, not frivolous."],"Sincere yet dignified: a ruler who is approachable and authoritative has good fortune."],"14.6":["Nine at the Top","He is blessed by heaven.Good fortune.Nothing that does not further.","Protected by heaven, auspicious, nothing that does not further.",["The Commentary on the Images says: “Da You’s great auspiciousness comes from heaven’s protection.”"],["The Commentary on the Images says: “Da You’s great auspiciousness at Nine at the Top comes from heaven’s protection.”"],["At Da You’s end, one recognizes “fullness overflows, prosperity declines” — staying humble and consistent wins heaven’s protection (sustaining wealth), Wealth, experience, knowledge, or age can breed arrogance; “rich without pride” is hard, Only by not overvaluing one’s possessions can wealth be preserved. Heaven favors humility — so the next hexagram is Qian (humility).","Tui Bei Tu, Hexagram 8: Interpreting Hexagram Da You Da You + Xin Wei Mat","BT Re","Aer Ras","He @ { ay ie 4","CEN ye"],"Protected by heaven: good fortune, and nothing that does not benefit."],"15.1":["Six at the Beginning","A superior man modest about his modesty.May cross the great water. Good fortune.","The doubly humble gentleman crosses great rivers with humility — auspicious.",["The Commentary on the Images says: “The doubly humble gentleman” — he governs himself with modesty."],["The Commentary on the Images says: “The doubly humble gentleman” — he governs himself with modesty."],["Newcomers often show off — thus need double humility. Six at the Beginning (lowest position) is the most humble (doubly humble). This attitude avoids trouble; self-governance with humility prevents major mistakes — hence auspicious."],"Doubly humble, the gentleman can cross great rivers: good fortune."],"15.2":["Six in the Second Place","Modesty that comes to expression.Perseverance brings good fortune.","Vocal about humility, upholding the right path — auspicious.",["The Commentary on the Images says: “Humility that makes itself heard., auspicious” — this comes from inner balance."],["The Commentary on the Images says: “Vocal about humility, auspicious” — this arises from inner balance."],["Humble yet balanced, Six in the Second Place’s humility becomes well-known. However, fame can be fake (e.g., Wang Mang — humble to usurp power, but revealed as treacherous). Thus, humility must be sincere, not forced or deceptive."],"Humility that shows in your reputation and stays on the right path brings good fortune."],"15.3":["Nine in the Third Place","A superior man of modesty and merit.Carries things to conclusion. Good fortune.","The diligent and humble gentleman — good end, auspicious.",["The Commentary on the Images says: “The diligent and humble gentleman — good end, auspicious.” — all people submit."],["The Commentary on the Images says: “The diligent and humble gentleman” — all people submit."],["Nine in the Third Place (the only yang among five yin lines) stands out — symbolizing humility winning people’s hearts. Capable people work hard yet remain humble (this is “diligent humility”), Maintaining this is rare; such people earn respect (e.g., the Duke of Zhou — consolidated Western Zhou without pride, leading to prosperity)."],"The diligent, humble gentleman finishes well: good fortune."],"15.4":["Six in the Fourth Place","Nothing that would not furtherspreading humility.","No harm — exert humility.",["The Commentary on the Images says: “No harm — exert humility” — this does not violate the rules."],["The Commentary on the Images says: “No harm — exert humility” — this does not violate the rules."],["The risk is excessive humility (which may be fake). Sometimes one should not yield (e.g., when others are arrogant). Humility needs balance: not too little, not too much — “moderation” aligns with the principle of “balance.”"],"Nothing unfavorable: keep practicing humility actively."],"15.5":["Six in the Fifth Place","No boasting of wealth before one's neighbor. It is favorable to attack with force. Nothing that would not further.","Not self-sufficient, one relies on neighbors. — favorable for attack, no harm,",["The Commentary on the Images says: “Favorable for attack” — subdue the unyielding."],["The Commentary on the Images says: “Favorable for attack” — subdue the unyielding."],["Humility cannot solve all problems — attack is permissible to subdue the unyielding. Six in the Fifth Place (weak) uses humility to unite allies, but some resist (not heartily convinced, but out of pride). Thus, humility must be paired with force to subdue tyrants (avoiding appeasement)."],"Not boasting of wealth, you rely on neighbors; a justified attack brings no harm."],"15.6":["Six at the Top","Modesty that comes to expression.It is favorable to set armies marching to chastise one's own city and one's country.","Vocal about humility — favorable for military action, attacking cities.",["The Commentary on the Images says: “Vocal about humility” — aspirations unfulfilled. “Favorable for military action” — attack nearby states."],["The Commentary on the Images says: “Vocal about humility” — aspirations unfulfilled. “Favorable for military action” — attack nearby states."],["Six at the Top (overly humble) must use force to solve problems, Though highly humble (influential), Six at the Top is not firm — only able to attack nearby states. In politics, humility has limits; strength is decisive."],"Known for humility, you can act, even to discipline your own territory."],"16.1":["Six at the Beginning","Enthusiasm that expresses itself. Brings misfortune.","Boasting of joy — ominous.",["The Commentary on the Images says: “Six at the Beginning boasts of joy — resolve is exhausted, ominous.”"],["The Commentary on the Images says: “Six at the Beginning indulges in joy — no resolve remains, so it is ominous.”"],["A petty person (low position, unprincipled) relies on connections to gain favor, then boasts — showing narrowness, leading to danger. Contrast: Xie An (Eastern Jin) remained calm when winning the Fei River Battle, saying casually: “The boys defeated Qin’s army.”"],"Boasting about your enjoyment is a bad sign."],"16.2":["Six in the Second Place","Firm as a rock. Not a whole day.Perseverance brings good fortune.","Firm as stone, not indulging in joy all day — upholding the right path, auspicious.",["The Commentary on the Images says: “Not all day, auspicious in rectitude — due to balance and correctness.”"],["The Commentary on the Images says: “Not indulging all day, auspicious in rectitude — because Six in the Second Place holds the balanced, correct position.”"],["Six in the Second Place restrains desire, remains firm (like stone), and ignores temptation — contrasting Six at the Beginning. Example: Dong Zhongshu (Wen-Jing Reign) rejected luxury, studied classics, and became a great scholar."],"Firm as stone, not indulging in pleasure all day: staying correct brings good fortune."],"16.3":["Six in the Third Place","Enthusiasm that looks upward creates remorse. Hesitation brings remorse.","Flattering superiors to bewitch them with joy — regret. Regretting too late brings greater regret.",["The Commentary on the Images says: “Flattering for joy brings regret — due to improper position.”"],["The Commentary on the Images says: “Flattering to bewitch with joy brings regret — because Six in the Third Place (yin) occupies a yang position.”"],["A petty person flatters superiors and scorns inferiors — thrives in peace (via flattery, not merit), but fails in war (which needs courage/ strategy). Such people face punishment when their deceit is exposed."],"Flattering superiors to win favor brings regret, and regretting too late is worse."],"16.4":["Nine in the Fourth Place","The source of enthusiasm.He achieves great things.Doubt not.You gather friends around yous a hair clasp gathers the hair.","Joy comes naturally, great gain. Do not doubt; gather friends like a hairpin gathers hair.",["The Commentary on the Images says: “Joy comes naturally, great gain — will is fully fulfilled.”"],["The Commentary on the Images says: “Joy comes naturally, great gain — this is the result of unity.”"],["Nine in the Fourth Place (the only yang line) brings joy to others, gaining their support — thus joy and gain come naturally. Though in a “fearful position” (between trigrams), trust prevails as people rally around him."],"Joy comes naturally and brings great gain: don't doubt, and gather friends as a pin gathers hair."],"16.5":["Six in the Fifth Place","Persistently ill, and still does not die.","Afflicted with illness, long-lasting but not fatal.",["The Commentary on the Images says: “Six in the Fifth Place is ill — riding on firmness. Long-lasting but not fatal — balance remains.”"],["The Commentary on the Images says: “Six in the Fifth Place is ill — because it rides on the firm Nine in the Fourth Place. Long-lasting but not fatal — because it holds the central position.”"],["Weak and dim, Six in the Fifth Place relies on the strong minister (Nine in the Fourth Place), indulges in joy, and loses power — like a chronically ill puppet, surviving via balance, Metaphor: Nine in the Fourth Place (husband) has five wives (yin lines); Six in the Fifth Place (domineering wife) is “ill” from jealousy, teetering between life and death."],"Chronically ill but not dying: the pressure keeps you alive."],"16.6":["Six at the Top","Deluded enthusiasm. But if after completion one changes, There is no blame.","Indulging in joy blindly, but vice is reformed — no blame.",["The Commentary on the Images says: “Blind joy in high position — how can it last?”"],["The Commentary on the Images says: “Blind joy in high position — how can it persist?”"],["At Yu’s end, extreme joy leads to delirium and potential ruin. However, reforming vice carly avoids major blame. Example: Emperor Wu of Han pursued immortality, was deceived by alchemists (losing family/wealth), but repented and corrected his ways in old age.","Tui Bei Tu, Hexagram 26: Interpreting Hexagram Yu Yu + Ji Chou i: \\ \\ | sh (Si q ae"],"Blindly indulging in joy, but the vice can be reformed: no blame."],"17.1":["Nine at the Beginning","The standard is changing. Perseverance brings good fortune. To go out of the door in company produces deeds.","Official position changes, auspicious to uphold the right path. Going out and interacting brings success.",["The Commentary on the Images says: “Official position changes — following the right path is auspicious. Going out and interacting brings success —no loss.”"],["The Commentary on the Images says: “Official position changes — following the right path is auspicious. Going out and interacting brings success — no mistake.”"],["Nine at the Beginning (once high) now mingles with the people — high status can fade, but this lets one understand suffering and grow. Example: Duke Wen of Jin (Chong’er) endured 17 years of exile, strengthening his will; he later ruled wisely, becoming one of the “Five Hegemons” of the Spring and Autumn period."],"Your position shifts: stay on the right path and go out to mix with others for success."],"17.2":["Six in the Second Place","If one clings to the little boy, One loses the strong man.","Cling to the petty man, lose the husband.",["The Commentary on the Images says: “Attach to the young man — cannot have both,”"],["The Commentary on the Images says: “Attach to the young man (Nine at the Beginning) — cannot also have the husband (Nine in the Fifth Place).”"],["Six in the Second Place faces a choice (like a woman choosing between a low-status young man (Nine at the Beginning) and a powerful man (Nine in the Fifth Place)). She chooses the young man (closeness). As a high official, she chooses to care for the people (reducing taxes) over pleasing the ruler — since “those who win people win the world.”"],"Clinging to the lesser person means losing the worthier one."],"17.3":["Six in the Third Place","If one clings to the strong man, One loses the little boy. Through following one finds what one seeks. It furthers one to remain persevering.","Attach to the husband, lose the young man. Following those with aspirations brings gain, favorable to uphold the right path.",["The Commentary on the Images says: “Attach to the husband — resolve to abandon the lowly.”"],["The Commentary on the Images says: “Attach to the husband (Nine in the Fourth Place) — resolve to abandon the lowly (Nine at the Beginning).”"],["Six in the Third Place (higher status than Six in the Second Place) desires advancement (like a noble lady avoiding commoners, preferring a higher-ranked man (Nine in the Fourth Place)). She submits to Nine in the Fourth Place, losing the young man (Nine at the Beginning)."],"Attach to the worthy and let the lesser go: following people of real aspiration brings gain."],"17.4":["Nine in the Fourth Place","Following creates success. Perseverance brings misfortune. To go one's way with sincerity brings clarity. How could there be blame in this?","Gaining from following, but even perseverance brings misfortune. Acting with trust in the path, with clarity — no blame.",["The Commentary on the Images says: “Gaining from following — its meaning is ominous. Trust in the path — this is clear merit.”"],["The Commentary on the Images says: “Gaining from following — its meaning is ominous. Trust in the path — this is clear integrity.”"],["Gaining Six in the Third Place’s trust brings prestige but risk — Nine in the Fourth Place (close to the ruler) may outshine Nine in the Fifth Place (ruler). A blunt, meritorious official (who does not flatter) risks the ruler’s suspicion."],"A following can bring gain, but it is risky; act with sincerity and clear judgment to stay blameless."],"17.5":["Nine in the Fifth Place","Sincere in the good. Good fortune.","Trust in goodness, auspicious.",["The Commentary on the Images says: “Trust in goodness, auspicious — due to the central, correct position.”"],["The Commentary on the Images says: “Trust in goodness, auspicious — because Nine in the Fifth Place holds the central, correct position.”"],["A noble leader avoids stubbornness and listens to advice (excellent quality), Contrast: King Zhou of Shang killed his virtuous wife (Nine Marquis’s daughter) for rejecting his debauchery, then killed Nine Marquis and dismembered Earl E; King Wen of Zhou was imprisoned for sighing in pity."],"Trust in what is good: good fortune."],"17.6":["Six at the Top","He meets with firm allegianceAnd is still further boundThe king introduces himTo the Western Mountain.","Detain and bind; the king sacrifices at West Mountain.",["The Commentary on the Images says: “Detain and bind — at the top, exhausted.”"],["The Commentary on the Images says: “Detain and bind — at the top, the path is exhausted.”"],["Six at the Top’s willingness to follow is exhausted (now resisting). The ruler (Nine in the Fifth Place) uses force to detain, then sincerity to reform (like post-liberation prisoner reform). Detention leaves Six at the Top no choice but to submit.","Tui Bei Ta, Hexagram 32: Interpreting Hexagram Sui Sui + Yi Wei if ‘| « ) ct ke ae tl i Has aki way Fy [Ode Says] Willow catkins fall, sunlight fades;Five-colored jewels scatter come from the north. Sigh — the royal aura of Jinling ends; A touch of spring claims Chang’an."],"Firmly bound and held in loyalty: the king makes offerings on the Western Mountain."],"18.1":["Six at the Beginning","Setting right what has been spoiled by the father. If there is a son,No blame rests upon the departed father.Danger. In the end good fortune.","Correcting the father’s corruption — having such a son, the father avoids blame; dangerous but auspicious in the end.",["The Commentary on the Images says: “Correcting the father’s corruption — intending to sustain the father’s legacy.”"],["The Commentary on the Images says: “Correcting the father’s corruption — reviving the father’s enterprise.”"],["Corruption accumulates over generations — sons must correct fathers’ faults (even dangerously) to revive the enterprise. Examples: Emperor Wu of Han (reformed governance); Emperor Jiaqing (punished corrupt officials to change Qianlong’s political pattern)."],"Repairing the father's neglect: a capable son spares him blame; dangerous, but good in the end."],"18.2":["Nine in the Second Place","Setting right what has been spoiled by the mother. One must not be too persevering.","Correcting the mother’s corruption — do not rigidly uphold rectitude.",["The Commentary on the Images says: “Correcting the mother’s corruption — following the middle way.”"],["The Commentary on the Images says: “Correcting the mother’s corruption — following the balanced path.”"],["Nine in the Second Place (balanced talent) corrects a stubborn leader (Six in the Fifth Place). Avoid haste — negotiate flexibly to achieve reform."],"Repairing the mother's neglect: do it gently, without rigid insistence on being right."],"18.3":["Nine in the Third Place","Setting right what has been spoiled by the father.There will be little remorse. No great blame.","Correcting the father’s corruption — minor regret, no major blame.",["The Commentary on the Images says: “Correcting the father’s corruption — no blame in the end.”"],["The Commentary on the Images says: “Correcting the father’s corruption — no blame in the end.”"],["A low-ranking person corrects superiors’ corruption (admirable, but overly firm — causes minor regret). However, acting with integrity and adjusting strategies avoids major fault."],"Repairing the father's neglect with a bit too much zeal: small regret, no great blame."],"18.4":["Six in the Fourth Place","Tolerating what has been spoiled by the father. In continuing one sees humiliation.","The Commentary on the Images says: Indulging the father’s corruption — going forward brings regret.",["The Commentary on the Images says: “Indulging the father’s corruption — going forward gains nothing.”"],["The Commentary on the Images says:: “Indulging the father’s corruption — going forward gains nothing.”"],["Indulging corruption (timid, evasive) worsens problems. Example: Qin Er Shi (inherited Qin Shi Huang’s tyranny, worsened governance)."],"Tolerating the inherited rot: going on like this brings regret."],"18.5":["Six in the Fifth Place","Setting right what has been spoiled by the father. One meets with praise.","Correcting the father’s corruption — using praise (to govern).",["The Commentary on the Images says: “Correcting the father’s corruption — sustaining with virtue.”"],["The Commentary on the Images says: “Correcting the father’s corruption — sustaining the enterprise with virtue.”"],["Reform needs balance (not too slow/fast). Six in the Fifth Place uses virtue: example — Mao Zedong’s advocacy of frugality/selflessness improved social conduct (valuing virtue over power)."],"Repairing the father's neglect with honors and praise: reform earns acclaim."],"18.6":["Nine at the Top","He does not serve kings and princes, Sets himself higher goals.","Not serving lords — exalting one’s deeds,",["The Commentary on the Images says: “Not serving lords — this aspiration is worthy of emulation.”"],["The Commentary on the Images says: “Not serving lords — this aspiration is worthy of emulation.”"],["After reform succeeds, avoid pursuing power — retire with integrity. Seeking fame/power leads to corruption (harm self and society).","Tui Bei Tu, Hexagram 40: Interpreting Hexagram Gu Gu + GuiMao S Sd ws ee & 25S Ke . 1 i 2 NN S a!"],"Not serving lords: withdraw and set your sights on higher ideals."],"19.1":["Nine at the Beginning","Joint approach. Perseverance brings good fortune.","Sincere approach, auspicious to uphold the right path.",["The Commentary on the Images says: Sincere oversight brings steadfast good fortune, for the will and conduct are upright."],["The Commentary on the Images says: The Xiang Zhuan says: \"The sensed arrival is auspicious when steadfastness is maintained, for the will and actions are upright.”"],["At the initial stage of \"Overseeing,\" this symbolizes a leader who has just taken office or is starting out — not only upright in thought, governing the people through inspiration and moral influence, but also capable of opening up new prospects and achieving early success.For instance, in a well- managed enterprise, the performance of frontline workers is something leaders must grasp. Only then can product quality be improved, waste reduced, costs controlled, and standards raised. However, a general manager cannot spend all day supervising workers directly. The correspondence between the Nine at the Beginning and the Six in the Fourth Place indicates that every move of the frontline leader is observed by the Six in the Fourth Place and thereby reflected to the general manager."],"A joint, sincere approach: staying on the right path brings good fortune."],"19.2":["Nine in the Second Place","Joint approach.Good fortune. Everything furthers.","Sincere approach, auspicious with no harm.",["The Commentary on the Images says: Sincere oversight brings good fortune, meeting with no harm, as the mandate is not yet fully obeyed."],["The Commentary on the Images says: “When influence descends with awareness, it brings auspiciousness and is met with no harm — because the people are not yet in obedience to the ruler’s will.”"],["Nine in the Second Place also exercises leadership through inspiration and moral influence upon the masses, yet hidden unfavorable factors exist. Authority, power, and statecraft are inseparable; one must not abuse power, but instead focus on the art of leadership — harmonizing relationships among the people and establishing authority through influence.Since Nine in the Second Place resonates with Six in the Fifth Place, who represents the sovereign, its every action is recognized and appreciated by the ruler. How, then, could unfavorable factors truly arise?"],"A joint approach: good fortune, and nothing unfavorable."],"19.3":["Six in the Third Place","Comfortable approach. Nothing that would further. If one is induced to grieve over it, One becomes free of blame.","Sweet talk approach, no benefit; worrying about the situation avoids blame.",["The Commentary on the Images says:\"Sweetly overseeing, the position is improper. Yet if one worries over it, the fault shall not last long.\""],["The Commentary on the Images says:The Xiang Zhuan says: \"To preside sweetly is due to an improper position, Yet if one becomes concerned about this situation, the misfortune will not endure.\""],["Although Six in the Third Place holds more authority than the two yang lines above it, it fails to win the higher authority’s appreciation and thus finds itself in an unfavorable situation, Relying on empty promises to deceive public support is an unacceptable style of leadership. Breaking one's word inevitably leads to a loss of credibility and stirs resentment, bringing no benefit whatsoever. Deception cannot remain effective forever; there will inevitably come a time when one’s tricks are exhausted. However, if one recognizes the danger, feels concern, and changes course, it is possible to turn the situation around."],"A sweet-talking approach brings no benefit; worry about it, and you will avoid blame."],"19.4":["Six in the Fourth Place","Complete approach.No blame.","Thorough approach, no blame.",["The Commentary on the Images says: \"Perfect oversight incurs no blame, for the position is fitting.”"],["The Commentary on the Images says: \"Approaching without disaster is because the yin line in the fourth place occupies an even-numbered position, which is appropriate to its place.\""],["To understand the people’s conditions, one must go to the lowest levels, personally direct operations on the ground, draw near to the populace, and approach the masses with warmth and humility. A leadership style that is earnest and deeply engaged will certainly be welcomed. Such an inspection embodies \"perfect oversight.\" If a leader can achieve this, it is truly commendable — how could misfortune arise?"],"A thorough, close approach: no blame."],"19.5":["Six in the Fifth Place","Wise approach.This is right for a great prince. Good fortune.","Wise rule, fitting for a great lord, auspicious.",["The Commentary on the Images says: \"Perfect oversight entails no blame, for the position is appropriate.”"],["The Xiang Zhuan states: \"The utmost approach brings no blame, for the position is fitting.”"],["By observing the actual conditions of the people and reaching down to the most fundamental levels — personally directing matters on the ground, drawing near to the populace, and engaging with the masses in a gentle and humble manner — a leadership style that is earnest and deeply rooted will certainly be welcomed. This kind of presence embodies \"the utmost approach.\" When a leader achieves this, it is truly commendable, How, then, could misfortune arise?"],"Wise approach: a ruler who governs with insight, which is good fortune."],"19.6":["Six at the Top","Greathearted approach. Good fortune. No blame.","Kind approach, auspicious with no harm.",["The Commentary on the Images says: \"The good fortune of sincere governance lies in the commitment to internal harmony.\""],["The Commentary on the Images says: \"The auspiciousness that comes from governing with sincerity is due to the leader's genuine dedication to the inner well-being of the people.\""],["The top sixth line occupies a position akin to an elder statesman, When inspecting the people, they can grasp the true conditions on the ground and subsequently assist the ruler in formulating strategies for governing the realm, Representing the scholarly or hermit class, this line holds no official rank or power, enabling a deeper understanding of the people's sentiments and offering loyal counsel to the sovereign. In modern terms, this line corresponds to retired officials who continue to contribute their insight. After retirement, they maintain closer contact with ordinary citizens. By conveying these observations to relevant authorities, many practical issues can be effectively addressed.","Tui Bei Tu, Hexagram 51: Interpreting Hexagram Lin Lin + Jia Yin Anis CEL Prenat hss RX Ash |) Kasi bees 1°) lo rot"],"A kind, generous approach: good fortune, no blame."],"20.1":["Six at the beginning","Childlike Viewing — The petty person has no fault; the noble person faces regret.","Looking at things with a child’s perspective — the petty person avoids disaster, but the noble person encounters trouble.",["The Commentary on the Images says: First Six: Childlike viewing is the way of the petty person."],["The Commentary on the Images says: \"Childlike viewing\" in the First Six is the way petty people see things."],["This line speaks of the naivety of observation, like a child or a petty person. Children are ignorant, with weak perception and superficial understanding, unable to distinguish right from wrong. \"Petty person\" and \"noble person\" represent opposing classes: the noble person rules, while the petty person is the poor commoner. In medieval times, \"petty person\" was synonymous with ignorance. Later, as literacy spread, it came to mean women, the shallow, ignorant, unvirtuous, and rude. The lowest classes and slaves did not need knowledge; their simplicity kept them from disaster. But noble people, who govern the world, cannot afford such naivety."],"A child's shallow view: excusable in common people, shameful in the noble."],"20.2":["Six in the second place","Peeping View — Favorable for a woman to maintain integrity.","Peeping through a crack — favorable for a woman to uphold the right path.",["The Commentary on the Images says: Peeping view, favorable for a woman’s integrity — yet it is also shameful."],["The Commentary on the Images says: The commentary says: Peeping through a crack is favorable for a woman who upholds integrity, but for a noble person, it is unbecoming."],["This line speaks of the narrowness of observation, like a woman’s limited perspective (a traditional view). The Second Six is yin, soft, and weak, with limited vision, like someone who never leaves home, peeping through a crack to see only a fragment. For a woman who stays in her chamber and preserves her chastity, this is acceptable; for a man who must go out to accomplish great things, it is shameful, A true man should have a broad vision, take in the whole picture, and not be distracted by temporary gains or losses."],"Peeping through a crack: a narrow view that suits only a limited role."],"20.3":["Six in the third place","Observe My Life — Advance or Retreat.","Observe the environment of your existence to choose whether to advance or retreat.",["The Commentary on the Images says: Observe my life, advance or retreat — this does not depart from the way."],["The Commentary on the Images says: The commentary says: Observing one’s environment to decide advance or retreat does not stray from the correct path,"],["The First and Second Six lines discuss outward observation; the Third Six turns to self-reflection. After understanding the objective environment, one must adjust their subjective behavior to adapt. As Confucius said, \"Examine yourself three times a day\" to decide whether to persist in advancing or to retreat and conserve strength. To transform the external world, one must first transform oneself, This requires observing one’s situation, examining one’s actions, and deciding when to act or withdraw, advancing when possible and retreating when necessary."],"Observe your own life and its results to decide whether to advance or retreat."],"20.4":["Six in the fourth place","Observe the Splendor of the State — Favorable to Be a Guest of the King.","Witness the glory of state ceremonies — favorable to serve as the king’s guest.",["The Commentary on the Images says: Observe the splendor of the state — honoring the guest."],["The Commentary on the Images says: The commentary says: Observing the splendor of the state is to honor the rites between host and guest."],["This is the observation of someone aspiring to officialdom. The Fourth Six represents a feudal lord; when the Son of Heaven holds state ceremonies, he invites the lord to attend, showing great favor. Since the king esteems him, the lord should conduct himself well as the king’s guest. Although the Fourth Six is not in the central position, it is a yin line in an even (yin) position, which is appropriate, and it harmonizes with the Fifth Nine (yang) above. Thus, the lord will gain the king’s trust and importance."],"Witness the glory of the state: it is favorable to serve as the king's guest."],"20.5":["Nine in the fifth place","Observe My Life - The Noble Person Has No Fault.","Observe the environment of your existence — the noble person avoids disaster.",["The Commentary on the Images says : Observe my life — observe the people."],["The Commentary on the Images says: The commentary says: For a ruler, observing his own life means understanding the people’s conditions."],["The Fourth Six is an official serving the state; the Fifth Nine is the ruling king. The king sits at the peak of power, surrounded by praise and awe, making it hardest for him to see his own flaws — yet he most needs clear self-examination, which is extremely difficult. The goodness or corruption of popular customs and the people’s likes and dislikes are the true measures of a king’s governance and a mirror for self-reflection."],"Observe your own life and conduct: the noble person stays blameless."],"20.6":["Nine at the top","Observe Their Lives — The Noble Person Has No Fault.","Observe the lives of others — the noble person avoids disaster.",["The Commentary on the Images says: Observe their lives — aspirations are not yet at peace."],["The Commentary on the Images says: Observing the lives of others shows that the Sixth Nine has extraordinary aspirations."],["Those in high positions, under the watch of the people, will be vigilant and not grow complacent or indulge themselves — this contains the essence of democracy. The Sixth Nine stands at the highest position, an object of reverence for all; every action is watched by the people, so they must be especially mindful of their conduct and set an example. The Sixth Nine is like a retired emperor: by observing the lives of others, they understand the people’s customs and hardships, using this perspective to reflect on their own situation and learn from others’ experiences, thus avoiding disaster."],"Observe the lives of others as a mirror: the noble person stays blameless."],"21.1":["Nine at the beginning","His feet are fastened in the stocks,","Wearing a foot fetter that covers the toes; no disaster.",["The Commentary on the Images says: A foot fetter covers the toes; he cannot walk."],["The Commentary on the Images says: Wearing a foot fetter only prevents movement."],["For a first offense, the crime is minor — there is no need for severe punishment. As a yang line in a yang position, the person is aggressive and impulsive, so punishment is necessary. Sentencing to a light foot penalty prevents further transgression. The fetter does not cause injury but restricts movement, stopping him from continuing down the path of crime. What seems like punishment is actually salvation."],"A fetter over the toes: punishing small wrongs early prevents bigger ones; no blame."],"21.2":["Six in the second place","Bites through tender meat, so that his nose disappears. No blame.","Biting into flesh, the nose sinks into the meat; no disaster.",["The Commentary on the Images says: Biting through skin, the nose sinks in; he rides the firm."],["The Commentary on the Images says: Biting into flesh and the nose sinking in is because the second six rides above the firm initial nine."],["The second six symbolizes a gentle, upright, and impartial law enforcer, Such individuals must not rely solely on leniency when judging cases; they must uphold the severity of the law. To leverage strengths and avoid weaknesses, they must suppress the criminal's arrogance, asserting authority over them. Balancing mercy with rigor is essential to subduing offenders, The initial and top lines discuss sentencing from the criminal's perspective; lines two, three, four, and five examine interrogation and judgment from the enforcer's standpoint.","Initial nine and top nine represent criminals; second six, third six, fourth nine, and fifth six represent law enforcers."],"Biting through soft flesh: an easy case, but a harsh bite; no blame."],"21.3":["Six in the third place","Bites on old dried meat and strikes on something Ppoisonous.Slight humiliation. No blame.","Biting cured meat but encountering poison; a minor setback, but no disaster.",["The Commentary on the Images says: Encountering poison; the position is inappropriate."],["The Commentary on the Images says: Encountering poison is due to the third six being in an improper position."],["When the third six handles cases, criminals refuse to submit and even falsely accuse the enforcer. The third six is in an improper position — neither central nor aligned. As a yielding force in a role requiring firmness, criminals will exploit weakness and resist mildly, leading to minor troubles. However, the third six receives support from the strong fourth nine above. With a resolute superior backing them, the \"tough meat\" will eventually be bitten through, and the \"poison\" (setback) will not cause lasting harm."],"Biting cured meat and hitting poison: dealing with an old problem is unpleasant; small setback, no blame."],"21.4":["Nine in the fourth place","Bites on dried gristly meat. Receives metal arrows. It furthers one to be mindful of difficulties and to be persevering. Good fortune.","Eating dried meat from the bone and finding a bronze arrow; it is beneficial to uphold integrity in adversity, leading to good fortune.",["The Commentary on the Images says: Beneficial to persevere through hardship and be auspicious; the light is not yet shining."],["The Commentary on the Images says: Upholding integrity in hardship leads to good fortune, but the path is not yet fully illuminated,"],["Biting dried meat off the bone is harder than eating cured meat, symbolizing a more difficult case. Finding a bronze arrow implies the enforcer must be as unyielding as metal. While the fourth nine is upright and principled, two flaws remain: insufficient authority, and an inability to balance the middle way — such as morality vs, law, reward vs, punishment, leniency vs. rigor, speed vs. patience, and capture vs. leniency. The fourth nine has not yet mastered this balance,"],"Dried meat on the bone, with a bronze arrow inside: a hard case; persevere through adversity for good fortune."],"21.5":["Six in the fifth place","Bites on dried lean meat. Receives yellow gold. Perseveringly aware of danger. No blame.","Eating dried meat and finding gold; upholding integrity while remaining vigilant leads to no disaster.",["The Commentary on the Images says: Upholding integrity and being vigilant, no harm; the position is appropriate."],["The Commentary on the Images says: Upholding integrity and being vigilant brings no harm, as the fifth six occupies the correct position."],["Though the fifth six holds a high position, their gentle nature (a yin line in a yang position) leads to insufficient resolve when handling major cases, making it as hard as biting dried meat, Finding a piece of brass while chewing implies the need for greater firmness and decisiveness, using strength to overcome weakness. In justice, excessive harshness breeds cruelty, while excessive leniency leads to indulgence. The fifth six balances inner compassion with outer resolve, merging firmness and gentleness, leniency and rigor — making it ideal for upholding the law."],"Dried meat with yellow gold: a valuable but dangerous case; stay vigilant, no blame."],"21.6":["Nine at the top","His neck is fastened in the wooden cangue, So that his ears disappear. Misfortune.","Wearing a cangue that covers the ears; ominous.",["The Commentary on the Images says: Carrying a yoke that covers the ears; hearing and sight are unclear."],["The Commentary on the Images says: Wearing a cangue that covers the ears results from being unwise and blind to consequences."],["The initial nine and top nine represent criminals. The","initial nine commits a minor offense; the top nine commits a serious crime. These two lines symbolize the beginning and end of a criminal path. The initial nine is a first offender, so a light punishment is given to encourage reform and redemption. The top nine, however, represents the final stage — crimes have escalated to the point where severe punishment is necessary to deter others. Thus, the top nine faces execution, making it extremely ominous. Interpretation of Shi he from Tui Bei Tu, Image 38 Shihe + Xin Chou (Year of the Ox) aaa tt eT] ae ‘ i! r } Xs I lus ea)-:"],"Wearing a cangue over the ears: refusing to listen to warnings is ominous."],"22.1":["Nine at the beginning","He lends grace to his toes, leaves the carriage, and walks.","Decorating the toes and leaving the cart to travel on foot.",["The Commentary on the Images says: Abandoning the cart to walk; it is right not to ride."],["The Commentary on the Images says: Leaving the cart to walk is morally justified, as riding is unnecessary."],["At the initial stage of adornment, decoration is minimal. Wrapping the feet prepares one for a long journey on foot, embodying simple elegance. Why walk? As the lowest line, the initial nine represents a humble scholar of integrity who prefers walking over begging, using plain cloth and straw shoes as his modest adornment."],"Adorning the toes and leaving the carriage to go on foot: choose integrity over comfort."],"22.2":["Six in the second place","Lends grace to the beard on his chin.","Grooming the beard.",["The Commentary on the Images says: Adorning the beard; rising with those above."],["The Commentary on the Images says: Grooming the beard is to rise in harmony with the superior (third nine)."],["Grooming and trimming the beard was highly valued in ancient times — a tradition dating back centuries. Guan Yu of the Three Kingdoms period, with his flowing beard, was known as \"the Lord of the Beautiful Beard.\" The beard adorns the face, just as culture adorns character: the beard is the ornament, the face is the substance. Adornment cannot exist independently of its foundation."],"Grooming the beard: decoration should follow and enhance the substance."],"22.3":["Nine in the third place","Graceful and moist. Constant perseverance brings good fortune.","Adorned and radiant; upholding integrity leads to lasting good fortune.",["The Commentary on the Images says: The auspiciousness of upholding integrity; no one will ultimately overstep."],["The Commentary on the Images says: Upholding integrity brings lasting good fortune, as no one will ultimately surpass or oppress you."],["Situated between two yin lines, the third nine receives adornment from both above and below, earning widespread praise. However, while moderate decoration is essential, excess leads to \"culture overriding substance.\" Stay clear-minded and avoid being seduced by superficial grandeur. Culture must serve substance, not dominate it, Never prioritize adornment over essence."],"Radiant and glossy: steady integrity brings lasting good fortune."],"22.4":["Six in the fourth place","Grace or simplicity?A white horse comes as if on wings.He is not a robber, He will woo at the right time.","Adored and radiant, riding a white horse at full speed — they are not raiders, but suitors come to propose marriage.",["The Commentary on the Images says: Fourth six: In the correct position but doubtful. Not invaders, but suitors; ultimately no blame."],["The Commentary on the Images says: The fourth six holds the correct position but is suspicious. They are not invaders but suitors, so there will be no lasting regret."],["The third nine already shows a tendency for culture to override substance. The fourth six marks a return to simplicity after excess adornment, prioritizing essence over appearance. In a prosperous era, personal image becomes more important in courtship. Marriage customs evolve over time: from violent abduction to ghost-like rituals, and finally to refined proposals where suitors dress elegantly and ride white horses — reflecting greater affluence and civilization."],"Torn between show and simplicity: the white horse brings a suitor, not a raider; a sincere offer."],"22.5":["Six in the fifth place","Grace in hills and gardens. The roll of silk is meager and small.Humiliation, but in the end good fortune.","Decorating the hill and garden with bundles of silk; there is regret, but ultimately good fortune.",["The Commentary on the Images says: The auspiciousness of the fifth six; there is joy."],["The Commentary on the Images says: The fifth six's good fortune brings joyous events."],["As a yin line in a position of honor, the fifth six represents a benevolent ruler who avoids grand palaces and instead decorates simple hill gardens. His modest, unassuming style sets a powerful example of integrity in governance. The legendary sage-kings Yao and Shun similarly embraced frugality, living in thatched huts and sharing hardships with the people — exuding a quiet, profound charisma."],"Decorating the hill and garden with modest bundles of silk: it looks stingy, but ends in good fortune."],"22.6":["Nine at the top","Simple grace. No blame.","Adorning with white; no disaster.",["The Commentary on the Images says: White adornment, no harm; the top achieves its aspiration."],["The Commentary on the Images says: Adorning with white brings no harm, as the top nine embodies a simple and pure heart."],["While excess usually leads to decline, adornment reaches its peak in simplicity — returning to nature and prioritizing substance over form. This is the highest state of beauty: natural, unadorned, and authentic, like a lotus rising from clear water, where decoration would be sacrilege. Before the 1980s, people wore plain blue, green, or red clothing; as living standards rose, eccentric fashions emerged. Yet today, minimalist, single-color garments dominate the market, with white remaining a symbol of nobility for millennia and blue consistently the bestseller."],"Adorning in plain white: true simplicity, no blame."],"23.1":["Six at the beginning","The leg of the bed is split-Those who persevere are destroyed. Misfortune.","Decay begins at the bed's feet, with evil extinguishing justice — ominous.",["The Commentary on the Images says: Stripping the bed from the feet; destroying the foundation."],["The Commentary on the Images says: Decay starting at the bed’s feet signifies destruction from the bottom up."],["Erosion starts subtly, but its damage grows exponentially. If evil is not nipped in the bud, it will eventually overwhelm justice. Duke Huan of Qi failed to address small problems early: when Bian Que warned him of illness, he ignored it. By the time he sought treatment, the disease was terminal."],"Decay begins at the legs of the bed: foundations start to erode, which is ominous."],"23.2":["Six in the second place","The bed is split at the edge. Those who persevere are destroyed.Misfortune.","Decay spreads to the bed's frame, with evil growing to extinguish justice — ominous.",["The Commentary on the Images says: Stripping the bed from the frame; no allies."],["The Commentary on the Images says: Decay reaching the bed's frame occurs because the second six has no support from the fifth six."],["Decay reaching the bed's frame shows evil forces growing stronger, making them hard for rulers to eliminate — ultimately threatening the realm. The Western Han’s \"Rule of Wen and Jing\" was China's first golden age, yet corruption flourished alongside it: when Emperor Wen had an abscess, Deng Tong licked the pus to gain favor, In reward, the emperor granted Deng Tong a copper mountain in Sichuan and allowed him to mint his own money — exemplifying how petty figures rise."],"Decay spreads to the bed's frame: erosion advances, ominous."],"23.3":["Six in the third place","He splits with them. No blame.","Allowing decay to proceed — no disaster.",["The Commentary on the Images says: Stripping without harm; alienated from above and below."],["The Commentary on the Images says: Allowing decay without harm occurs because the third six is disconnected from the other yin lines (and aligns only with the top nine)."],["A golden age cannot exist if everyone lives in austerity; the pursuit of pleasure is inevitable. The third six indulges in enjoyment but avoids factionalism and harming state interests — like the Qing official Ji Xiaolan, who was upright but had many wives and concubines, As long as one does not seize women, embezzle funds, or betray the nation, and fulfills duties, there is no disaster."],"Splitting from the crowd of decay: no blame."],"23.4":["Six in the fourth place","The bed is split up to the skin. Misfortune.","Decay reaches the bed's surface, wounding the skin — ominous.",["The Commentary on the Images says: Stripping the bed to the skin; disaster is imminent."],["The Commentary on the Images says: Decay reaching the bed's surface and wounding the skin signals disaster is near."],["Decay reaching the bed's surface means the crisis is extreme — the very foundation of stability is crumbling. The fourth six holds great power but is insatiably greedy, oppressing the people and harming the state. Such blatant corruption ensures ruin, like the Qing official He Shen, whose wealth exceeded the emperor's — his crimes could not be hidden forever."],"Decay reaches the surface of the bed: the damage is now personal, ominous."],"23.5":["Six in the fifth place","A shoal of fishes. Favor comes through the court ladies. Everything acts to further.","Following the leader like a school of fish, favored as a palace lady — no adversity.",["The Commentary on the Images says: Favored as a palace lady; no lasting blame."],["The Commentary on the Images says: Being favored as a palace lady leads to no lasting blame."],["Though not a ruler, the fifth six unites the yin lines and governs with order, bringing good fortune — like Wu Zetian, who became emperor and ruled effectively, ensuring the Tang Dynasty's prosperity continued. Her success stemmed from governing by law, proving that capable leadership transcends gender."],"Leading like a string of fish and favored as a palace lady: order returns; no adversity."],"23.6":["Nine at the top","There is a large fruit still uneaten.The superior man receives a carriage.The house of the inferior man is split apart.","A great fruit remains uneaten; the noble person gains popular support, while the petty person loses their shelter.",["The Commentary on the Images says: The noble person gains a chariot — carried by the people. The petty person loses their hut — ultimately useless."],["The Commentary on the Images says: The noble person gains a chariot, symbolizing popular support. The petty person loses their shelter, showing their ultimate worthlessness."],["All yang lines have been stripped to yin, leaving only the top nine intact. If the noble person preserves this precious yang and seizes the moment of transformation, they can reverse decline and usher in a new era. Through restoring order, crisis turns to stability. If petty figures prevail and extinguish the last yang, all will perish — like a roof being torn off. The same situation can lead to vastly different outcomes; a small misstep leads to catastrophic failure."],"The great fruit is left uneaten: the noble is upheld by the people, while the petty lose their shelter."],"24.1":["Nine at the beginning","Return from a short distance. No need for remorse. Great good fortune.","Turning back before straying far; no deep regret, great good fortune.",["The Commentary on the Images says: Returning without going far; cultivating oneself."],["The Commentary on the Images says: Turning back early means returning to the path of virtue and self-cultivation."],["At the start of Return, straying from the path but turning back quickly avoids regret. Ancient people stayed home on the winter solstice; those who left but returned early avoided misfortune. This teaches: do not wander far from the right path — correcting course promptly brings good fortune."],"Turn back before straying far: no deep regret, great good fortune."],"24.2":["Six in the second place","Quiet return. Good fortune.","Halting the return; good fortune.",["The Commentary on the Images says: The auspiciousness of pausing in return; drawing near to benevolence below."],["The Commentary on the Images says: Pausing in return brings good fortune by drawing close to the virtuous (initial nine) below."],["As yang returns, the second six (yin) is gentle, centered, and aligned with the initial nine (yang), feeling its influence first. Embracing yang is auspicious, so the second six need not \"return\" — instead, it advances upward, nurturing the growing yang below. This conform the natural flow, showing wisdom in progress."],"Return gracefully, following a worthy example: good fortune."],"24.3":["Six in the third place","Repeated return. Danger. No blame.","Repeatedly turning back; danger, but no disaster.",["The Commentary on the Image
