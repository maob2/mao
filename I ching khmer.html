ognition.","Meeting one’s equal; within ten days, no blame — advancing brings honor.",["The Commentary on the Images says No blame within ten days; disaster follows beyond."],["The Commentary on the Images says Safety lasts only ten days; delay invites misfortune."],["When the first nine and the fourth nine meet, one mountain cannot hold two tigers — one is bound to be harmed. Yet if they are evenly matched and join forces, their combined power can be imagined.Such is the first","nine: seeing the fourth nine as its counterpart, it moves to align and cooperate. Working together not only avoids blame but leads to action, achieving the goal of “greatness” jointly."],"Meeting an equal partner: ten days without blame, and going forward earns esteem."],"55.2":["Six in the second place","The curtain is of such fullness that the polestars can be seen at noon.Through going one meets with mistrust and hate. If one rouses him through truth, good fortune comes.","The hut is overshadowed; the Dipper is visible at midday. Advancing brings suspicion, but sincerity inspires trust — auspicious.",["The Commentary on the Images says: Sincerity inspires trust, aligning intentions with virtue."],["The Commentary on the Images says: Authenticity fosters trust, transforming doubt into alignment."],["Centered and upright, it is the master of clarity. Though not yet grand, it is an open and honorable figure. Yet what disappoints the second six is that the hexagram’s ruler, the fifth six, is a foolish sovereign wrongly occupying the noble position. The second six’s brightness is obscured; even if it tries to accommodate the fifth six, it risks being suspected,The only way is to influence others with utmost sincerity. If successful, the fifth six awakens, suspicion turns to trust, and the outcome remains auspicious.The process is difficult, but one must consistently treat others with sincerity to attain good fortune."],"The hut is darkened and the Dipper shows at noon: suspicion greets you, but sincerity earns trust."],"55.3":["Nine in the third place","The underbrush is of such abundance that the small stars can be seen at noon. He breaks his right arm. No blame.","The canopy darkens; a storm falls at midday, breaking the right arm — no blame.",["The Commentary on the Images says: The canopy blocks light — great deeds are impossible. A broken arm renders one useless."],["The Commentary on the Images says: Darkness paralyzes action; a broken arm ends effectiveness."],["The situation is somewhat unfavorable. During a solar eclipse, thunder suddenly roars and lightning flashes as heavy rain falls. The advancing third nine breaks its right arm but is not in mortal danger.The third nine corresponds with the top six. Its own clarity and brightness are obscured by the top six’s dark nature, leaving its useful talents with no place to be applied.In the end, it cannot employ its abilities or achieve action. This is the fault of the top six, not the error of the third nine."],"The canopy is dark and stars show at noon; he breaks his right arm: no blame."],"55.4":["Nine in the fourth place","The curtain is of such fullness that the polestars can be seen at noon. He meets his ruler, who is of like kind. Good fortune.","The hut is overshadowed; the Dipper is visible at midday. Meeting one’s lord in darkness — auspicious.",["The Commentary on the Images says: Overshadowing reflects misalignment; the Dipper signifies darkness. Meeting one’s lord ensures progress — auspicious."],["The Commentary on the Images says: Misalignment causes darkness, but finding a loyal ally ensures forward movement."],["The fourth nine is also in the darkness of an eclipse. At noon, the sun cannot be seen, only the Big Dipper. Yet in this darkness, he encounters his lord. With the lord’s aid, he does not lose his way.It is like a wandering virtuous minister meeting his sovereign amid wartime chaos. The sovereign summons him back to his side, thus restoring him to office."],"Darkness in the hut and the Dipper at noon: meeting your lord in the dark brings good fortune."],"55.5":["Six in the fifth place","Lines are coming,blessing and fame draw near. Good fortune.","Summoning the virtuous brings celebration and praise — auspicious.",["The Commentary on the Images says: The fifth six’s fortune stems from celebration of virtue."],["The Commentary on the Images says: Prosperity comes from honoring talent and virtue."],["The fifth six celebrates a wise ruler who attracts talent, like a magnet drawing iron. By uniting virtue with capability, he transforms chaos into prosperity, earning lasting praise."],"Summon the worthy: celebration and praise bring good fortune."],"55.6":["Six at the top","His house is in a state of abundance. He screens off his family. He peers through the gate and no longer perceives anyone. For three years he sees nothing. Misfortune.","The mansion looms, overshadowing neighbors. Peering through the gate, it is deserted; for three years, no one appears — misfortune,",["The Commentary on the Images says: The mansion towers like a bird in flight; emptiness reflects self-isolation."],["The Commentary on the Images says: Arrogance leads to isolation; the empty mansion symbolizes self-inflicted exile."],["The top six possesses a grand house, immense wealth, and freedom to control his own time. Yet during this eclipse, he becomes the victim. The political darkness was caused by him — it is his tall house that overshadows other households, leaving others to live in gloom.When reform arrives, the corrupt are purged, and the top six can only hide. People gradually distance themselves, until no one associates with him anymore, leaving him isolated. Interpretation of Hexagram Feng from Tui Bei Tu, Image 14 Feng + Ding Chou Na iy he caacilt ft FA, AK i 1"],"A grand house shades the neighbors; no one is seen for three years: isolation is ominous."],"56.1":["Six at the beginning","If the wanderer busies himself with trivial things, he draws down misfortune upon himself.","Displaying wealth while traveling invites disaster.",["The Commentary on the Images says: Traveling ostentatiously reveals poverty of ambition and invites disaster."],["The Commentary on the Images says: Displaying wealth while traveling invites robbery and disaster."],["A yielding nature without resolve leads to weakness and short-sightedness, Obsessed with trivial gains and petty calculations, such behavior annoys others and breeds resentment, harming both the state and oneself. While traveling, the clink of jade ornaments attracts thieves — safety lies in modesty and discretion."],"Traveling and fussing over small things draws disaster upon yourself."],"56.2":["Six in the second place","The wanderer comes to an inn. He has his property with him. He wins the steadfastness of a young servant.","Staying at an inn with ample resources and a loyal servant.",["The Commentary on the Images says: Gaining a loyal servant ensures no lasting regret."],["The Commentary on the Images says:A loyal servant brings no lasting regret."],["Surviving abroad without harm or error is a victory. In ancient times, highways between feudal states had \"Iu\" (inns every 10 li), \"su\" (guesthouses every 30 li), and \"shi\" (markets every 50 li). Officials rested and ate there. The second six, wealthy and influential, stays in a state-run inn with loyal servants — safe from harm."],"The traveler reaches an inn, with money and a loyal servant."],"56.3":["Nine in the third place","The wanderer's inn burns down. He loses the steadfastness of his young servant. Danger.","The inn burns, losing a loyal servant — danger.",["The Commentary on the Images says:The burning inn causes injury; treating servants as travelers leads to their loss."],["The Commentary on the Images says:The burning inn causes harm; treating servants as temporary companions leads to their desertion."],["Treating servants as strangers ensures their abandonment. The third nine, a nobleman, loses his servants when his inn burns. This warns that kindness to retainers inspires loyalty, ensuring protection in times of crisis."],"The inn burns and the loyal servant is lost: danger."],"56.4":["Nine in the fourth place","The wanderer rests in a shelter. He obtains his property and an ax. My heart is not glad.","Settling in a place with resources, yet feeling dissatisfied.",["The Commentary on the Images says:","Settling in a place without achieving status brings no true satisfaction, even with resources."],["The Commentary on the Images says:Settling in a place without achieving status brings no true satisfaction, even with wealth."],["The fourth nine, exiled abroad, receives gifts from the fifth six (the ruler), securing a home and wealth, Yet he is unhappy, as his true desire is to reunite with his family and achieve nobility — mundane wealth cannot satisfy him."],"Resting in a safe place with resources, but your heart is not at ease."],"56.5":["Six in the fifth place","He shoots a pheasant. It drops with the first arrow. In the end this brings both praise and office.","Shooting a pheasant, losing an arrow, yet gaining honor.",["The Commentary on the Images says: Gaining honor in the end reflects favor from above."],["The Commentary on the Images says: The Xiang commentary says: \"The ultimate honorable fate is due to receiving the sovereign's favor.\""],["The fifth six, with gentle virtue, occupies the central position of the upper trigram, resembling a mild-tempered ruler.He shoots an arrow at a pheasant but misses, losing the arrow instead.He offers favors to win over the fourth nine, but the fourth nine refuses. This is like losing an arrow while missing the pheasant — \"failing to gain and losing what one already has.\"Yet he ultimately receives an honorable fate because the top nine aids him. Moreover, by treating his ministers generously, he attracts more worthy advisors to support him."],"You shoot a pheasant and lose an arrow, but gain honor in the end."],"56.6":["Nine at the top","The bird's nest burns up. The wanderer laughs at first, then must needs lament and weep. Through carelessness he loses his cow. Misfortune.","The bird’s nest burns; the traveler laughs, then weeps. Losing cattle at Yi — misfortune.",["The Commentary on the Images says:","A traveler in a position of authority invites disaster, like a burning nest. Losing cattle at Yi brings permanent loss."],["The Commentary on the Images says:","A traveler in authority invites disaster, like a burning nest. Losing cattle at Yi brings irreversible loss."],["A traveler who acts arrogantly invites ruin, like a bird whose nest burns. This refers to the historical figure Wang Hai, ancestor of the Shang people, who was killed trading in Hebei. His legacy lives on in the word \"shangren\" (merchant), originally meaning \"people of the Shang tribe.\""],"The bird's nest burns: the traveler laughs first and weeps later; losing the ox through carelessness."],"57.1":["Six at the beginning","In advancing and in retreating,The perseverance of a warrior furthers.","Hesitating between advance and retreat; beneficial for warriors to uphold integrity.",["The Commentary on the Images says:Hesitation reflects doubt; warriors’ integrity resolves confusion."],["The Commentary on the Images says:Hesitation stems from weakness and doubt; warriors’ integrity strengthens resolve."],["The first six, weak and indecisive, needs the warrior’s courage to resolve confusion. Strengthening resolve and upholding principle counteracts hesitation and chaos."],"Advancing and retreating in doubt: a warrior's resolve to stay correct is beneficial."],"57.2":["Nine in the second place","Penetration under the bed.Priests and magicians are used in great number. Good fortune. No blame.","Hiding under the bed, with priests and shamans praying — auspicious, no blame.",["The Commentary on the Images says:Auspicious prayer reflects alignment with centrality."],["The Commentary on the Images says:Auspicious prayer comes from the second nine’s central position."],["The second nine hides under the bed to protect the first six, part of a ritual to expel evil. Though seemingly undignified, it is an act of virtue, bringing auspiciousness and no blame."],"Wind under the bed: with priests and shamans in numbers, good fortune and no blame."],"57.3":["Nine in the third place","Repeated penetration. Humiliation.","Excessive compliance leads to regret.",["The Commentary on the Images says:Regret from excessive compliance reflects a lack of purpose."],["The Commentary on the Images says:Regret from excessive compliance stems from a lack of independent will."],["The third nine, lacking independent judgment, blindly follows the sixth four (a yin line), This reflects the ancient warning that trusting gossip (associated with women) leads to misfortune, as it distracts from important matters and breeds conflict."],"Repeated, forced submission brings regret."],"57.4":["Six in the fourth place","Remorse vanishes.During the hunt three kinds of game are caught.",", achieves great success — like hunting three types of game (chicken, ox, sheep, symbolizing allies). This reflects the power of strategic alliances and influence.",["The Commentary on the Images says: Hunting three types of game reflects achievement."],["The Commentary on the Images says:Hunting three types of game signifies success,"],["The fourth six, well-positioned and supported by yang"],"Regret vanishes: in the hunt you take three kinds of game."],"57.5":["Nine in the fifth place","Perseverance brings good fortune. Remorse vanishes. Nothing that does not further. No beginning, but an end. Before the change, three days. After the change, three days. Good fortune.","Upholding integrity brings good fortune, regret vanishes, and no disadvantage. A poor start leads to a good end; three days before Geng (Ding), three days after Geng (Gui) — auspicious.",["The Commentary on the Images says:The fifth nine’s good fortune comes from its central, correct position."],["The Commentary on the Images says:The fifth nine’s good fortune stems from its central, correct position."],["Reform requires careful planning: deliberate communication precedes implementation, with lessons learned along the way. The fifth nine, a yang line in a yang position, starts poorly but ends well by acting with prudence — announcing changes three days before Geng and enforcing them three days after, ensuring success through meticulous execution,"],"Staying steady brings good fortune: a poor start but a good end; consider three days before and after a change."],"57.6":["Nine at the top","Penetration under the bed.He loses his property and his ax.Perseverance brings misfortune.","Hiding under the bed, losing resources — upholding integrity brings misfortune.",["The Commentary on the Images says:","Hiding under the bed reflects exhaustion; losing resources confirms misfortune."],["The Commentary on the Images says: Hiding under the bed signifies despair; losing resources confirms misfortune."],["The top nine represents a deposed ruler, hiding in cowardice and losing his authority (symbolized by the axe). This warns that submission without integrity leads to ruin— like a prince overthrowing his father, true power lies in upholding virtue, not surrender."],"Wind under the bed: you lose your means and your axe, and persisting is ominous."],"58.1":["Nine at the beginning","Contented joyousness. Good fortune.","Harmonious joy — auspicious.",["The Commentary on the Images says:Harmonious joy is auspicious because actions are free of doubt."],["The Commentary on the Images says:Harmonious joy brings good fortune, as actions are free of hesitation."],["The first nine, a yang line in an odd position, finds joy in solitude — like Confucius’ disciples singing despite poverty. This reflects the Confucian ideal of inner contentment, which avoids suspicion by staying away from conflict."],"Harmonious joy: good fortune."],"58.2":["Nine in the second place","Sincere joyousness. Good fortune. Remorse disappears.","Sincere joy — auspicious, regret vanishes,",["The Commentary on the Images says: Sincere joy is auspicious because it reflects a faithful heart."],["The Commentary on the Images says: Sincere joy brings good fortune, rooted in a faithful heart."],["The second nine’s sincerity transforms the third six — like a man winning a partner with true affection. For the state, this mirrors a minister inspiring a lukewarm ruler with patriotism, spreading virtue through authenticity."],"Sincere joy: good fortune, regret vanishes."],"58.3":["Six in the third place","Coming joyousness. Misfortune.","Seeking joy — dangerous.",["The Commentary on the Images says:Seeking joy is dangerous due to misalignment."],["The Commentary on the Images says:Seeking joy brings danger, as it stems from an improper position."],["The third six, a yin line in an odd position, is like a woman playing both sides — chasing pleasure, not commitment. For the state, this represents a corrupt official currying favor for personal gain, which will be detected by the ruler, leading to ruin."],"Seeking joy from others: it's dangerous and leads to misfortune."],"58.4":["Nine in the fourth place","Joyousness that is weighed is not at peace.After ridding himself of mistakes a man has joy.","Negotiating joy, unsettled; overcoming minor flaws brings celebration.",["The Commentary on the Images says:The fourth nine’s joy is a cause for celebration."],["The Commentary on the Images says:The fourth nine’s joy is a cause for celebration."],["The fourth nine recognizes the danger of associating with the third six and distances himself — like a minister rejecting corruption to preserve his integrity, Cutting toxic ties ensures celebration and good fortune."],"Weighing joy, not at ease: setting aside small faults leads to celebration."],"58.5":["Nine in the fifth place","Sincerity toward disintegrating influences is dangerous.","Trusting those who erode virtue— dangerous.",["The Commentary on the Images says: Trusting those who erode is dangerous, even from a correct position."],["The Commentary on the Images says: Trusting those who erode virtue brings no benefit, even from a position of authority."],["The fifth nine warns a ruler against indulging desire — like King Jie of Xia or King Zhou of Shang, who lost their dynasties to favored concubines. Lust corrupts leadership, transferring power to those who erode virtue."],"Trusting someone who erodes virtue: danger."],"58.6":["Six at the top","Seductive joyousness.","Luring others with joy.",["The Commentary on the Images says: Luring joy reflects a lack of nobility."],["The Commentary on the Images says:Luring others with joy is not an act of true nobility."],["The top six uses charm to influence the fifth nine (the ruler) — like Wu Zetian, who rose to power through beauty but governed with integrity, ensuring stability. While her methods were unorthodox, her competence averted disaster."],"Luring others in with the promise of joy."],"59.1":["Six at the beginning","He brings help with the strength of a horse.Good fortune.","A strong horse for rescue — auspicious.",["The Commentary on the Images says:","The Xiang commentary says: The first six’s fortune comes from compliance."],["The Commentary on the Images says: The Xiang commentary says: The first six’s good fortune stems from flexibility and compliance."],["At the first sign of dispersion, rescue is still possible. The","first six represents early migration: a strong horse eases the journey, symbolizing how technology (like boats or horses) enabled humanity to spread across the globe, overcoming natural barriers."],"A strong horse for the rescue: good fortune."],"59.2":["Nine in the second place","At the dissolution he hurries to that which supports him. Remorse disappears.","Water rushes to the shore — regret vanishes.",["The Commentary on the Images says: The Xiang commentary says: Dispersion finding its resting place fulfills desire."],["The Commentary on the Images says: The Xiang commentary says: Water rushing to the shore reflects the second nine and first six’s shared desire for unity."],["The second nine, amid dispersion, secks safety with the first six — like finding shelter in a storm, Sometimes retreating to a trusted ally is wiser than fruitlessly trying to save a failing system, ensuring survival and eventual unity."],"When the flood comes, rush to a support: regret vanishes."],"59.3":["Six in the third place","He dissolves his self. No remorse.","Water strikes the body — no regret.",["The Commentary on the Images says: The Xiang commentary says: Dispersion affecting the body reflects an outward ambition."],["The Commentary on the Images says: Water striking the body reflects the third six’s desire to expand outward."],["The third six embodies the courage to venture into the unknown — like sailors crossing vast waters to find new lands. Leaving the familiar behind, even amid risk, is a necessary step toward progress and renewal."],"Dispersing the self: no regret."],"59.4":["Six in the fourth place","He dissolves his bond with his group.Supreme good fortune.Dispersion leads in turn to accumulation. This is something that ordinary men do not think of.","Water unites the crowd — great fortune, The dispersed gather into a mound, beyond ordinary understanding.",["The Commentary on the Images says: The Xiang commentary says: Dispersion uniting the crowd brings great fortune — expanding virtue."],["The Commentary on the Images says: The Xiang commentary says: Water uniting the crowd brings great fortune, as collective strength flourishes."],["The fourth six represents a selfless leader who dissolves factions and unites a divided state — turning dispersion into a unified \"mound.\" This requires integrity, vision, and the courage to prioritize the collective good over personal power."],"Dispersing cliques unites the crowd: great good fortune, beyond ordinary understanding."],"59.5":["Nine in the fifth place","His loud cries are as dissolving as sweat. Dissolution. Aking abides without blame.","A great flood arrives, people cry out, water reaches the palace — no blame.",["The Commentary on the Images says: The Xiang commentary says:The king’s residence is safe, as he holds the correct position."],["The Commentary on the Images says: The Xiang commentary says: The palace is safe because the fifth nine holds the central, correct position."],["The fifth nine uses a \"sweating\" metaphor for bold reform:","just as fever purges illness, decisive action clears societal stagnation. A visionary ruler (fifth nine) and capable minister (fourth six) together revitalize a fragmented state, ensuring stability and progress."],"Sweat and cries as the order is given out: dispersing the ruler's store; no blame."],"59.6":["Nine at the top","He dissolves his blood.Departing, keeping at a distance, going out, Is without blame.","Bloodshed, fleeing to safety — no blame.",["The Commentary on the Images says: The Xiang commentary says: Dispersion of blood reflects escaping harm."],["The Commentary on the Images says: The Xiang commentary says: Bloodshed teaches the lesson of fleeing harm."],["The top nine marks the resolution of crisis: after chaos, unity is restored, and old systems are replaced by new ones. The best way to heal dispersion is to dismantle its causes — dissolving factions and ending division, allowing the nation to coalesce into a stronger whole."],"Disperse the bloodshed and get away: no blame."],"60.1":["Nine at the beginning","Not going out of the door and the courtyard Is without blame.","Staying within the courtyard — no blame.",["The Commentary on the Images says:","Staying within the courtyard reflects understanding of when to advance or retreat."],["The Commentary on the Images says:","Staying within the courtyard shows wisdom in recognizing when to act and when to wait."],["The first nine understands when to pause: blocked by the second nine, he stays quiet, avoiding unnecessary risk. This reflects the Taoist principle of \"stillness in movement\" — waiting for the right moment to act ensures safety and effectiveness."],"Not going out the courtyard door: no blame."],"60.2":["Nine in the second place","Not going out of the gate and the courtyard Brings misfortune.","Staying behind the gate — dangerous.",["The Commentary on the Images says: Staying behind the gate reflects a critical loss of opportunity."],["The Commentary on the Images says: Staying behind the gate means missing a critical opportunity."],["The second nine, a yang line in a yin position, fails to act when needed — like Xiang Yu hesitating to kill Liu Bang at the Hongmen Banquet, leading to his own downfall. Excessive caution in moments of opportunity leads to disaster."],"Not going out the gate: missing your chance is bad."],"60.3":["Six in the third place","He who knows no limitation Will have cause to lament.No blame.","Lack of restraint leads to sorrow — no blame.",["The Commentary on the Images says: Sorrow from lack of restraint is self-inflicted."],["The Commentary on the Images says: Sorrow from excess is a consequence of one’s own choices."],["The third six indulges in excess, leading to regret — like someone who squanders fortune on pleasure, only to face poverty. While the outcome is sorrowful, it serves as a lesson, avoiding greater harm."],"Without restraint you lament, but you have only yourself to blame."],"60.4":["Six in the fourth place","Contented limitation. Success.","Embracing restraint brings success.",["The Commentary on the Images says: Success through peaceful restraint reflects alignment with higher principles."],["The Commentary on the Images says: Success through restraint comes from aligning with the fifth nine’s virtuous leadership."],["The fourth six, a loyal minister, lives modestly despite privilege, earning the ruler’s trust, This shows that integrity and moderation in power ensure lasting influence and prosperity."],"Peaceful, natural restraint brings success."],"60.5":["Nine in the fifth place","Sweet limitation brings good fortune.","Finding joy in restraint brings good fortune; advancing earns honor.",["The Commentary on the Images says: Joy in restraint comes from holding the central, correct position."],["The Commentary on the Images says: Finding joy in restraint reflects the fifth nine’s balanced, virtuous leadership."],["The fifth nine, the hexagram’s ruler, embodies virtuous restraint: governing with moderation preserves resources and protects the people. By practicing what he preaches, he inspires loyalty and ensures harmony — excess leads to ruin, while balance brings lasting success."],"Sweet restraint: good fortune, and going ahead earns esteem."],"60.6":["Six at the top","Galling limitation.Perseverance brings misfortune.","Excessive restraint brings danger, but no regret.",["The Commentary on the Images says: Bitter restraint leads to danger, as it violates natural balance."],["The Commentary on the Images says: Excessive restraint causes harm by rejecting flexibility and balance."],["The top six represents a miser who prioritizes hoarding over balance, leading to isolation and ruin. His refusal to regret reflects the danger of rigid ideology — true wisdom lies in adapting to changing circumstances."],"Bitter restraint: staying with it is ominous, but regret vanishes."],"61.1":["Nine at the beginning","Being prepared brings good fortune. If there are secret designs, it is disquieting.","Caution brings good fortune; suspicion causes unrest.",["The Commentary on the Images says:Cautious auspiciousness comes from unwavering resolve."],["The Commentary on the Images says:Caution brings good fortune when intentions remain steadfast."],["The first nine thrives on caution and loyalty — doubt or shifting allegiances lead to instability, His only ally is the fourth six, so staying true to that bond ensures safety and success."],"Be prepared and cautious: good fortune; if you hold other aims, there is no peace."],"61.2":["Nine in the second place","A crane calling in the shade. Its young answers it. have a good goblet. I will share it with you.","A crane calls in the shade; its chick answers. I have fine wine — let us share it.",["The Commentary on the Images says:The chick’s response reflects a sincere desire for connection."],["The Commentary on the Images says:The chick’s call echoes the parent’s, reflecting a genuine bond of trust."],["The second nine’s bond with the third six mirrors the crane and its chick — trust is reciprocal. Loyalty must be mutual to endure; without it, no meaningful connection can thrive."],"A crane calls from the shade, and her young answers: I have good wine, and I'll share it with you."],"61.3":["Six in the third place","He finds a comrade. Now he beats the drum, now he stops.Now he sobs, now he sings.","Overcoming the enemy — some drum, some rest, some weep, some sing.",["The Commentary on the Images says:Inconsistent action reflects misalignment."],["The Commentary on the Images says: Inconsistent behavior stems from an improper position and lack of sincerity."],["The third six’s inconsistency — drumming then resting, weeping then singing — reflects a lack of focus and sincerity, While the scene depicts camaraderie after victory, it warns that external validation and self-serving ambition undermine true loyalty to the collective."],"Facing a rival: now beating the drum, now stopping, now weeping, now singing."],"61.4":["Six in the fourth place","The moon nearly at the full. The team horse goes astray. No blame.","Near full moon, a horse is lost — no blame.",["The Commentary on the Images says:Losing the horse reflects breaking ties with the lower class to align with the higher."],["The Commentary on the Images says:Losing the horse signifies cutting ties with peers to align with the fifth nine."],["The fourth six faces a dilemma: balancing loyalty to the fifth nine (the ruler) and the first nine (a subordinate). Losing the horse symbolizes sacrificing personal bonds to serve the state, reflecting the Confucian ideal of “filial piety and loyalty cannot coexist perfectly.\""],"The moon is nearly full and the horse is lost: no blame."],"61.5":["Nine in the fifth place","He possesses truth, which links together.No blame.","Sincerity unites the realm — no blame.",["The Commentary on the Images says:Sincerity binds all because of correct positioning."],["The Commentary on the Images says:Sincerity unites the realm because the fifth nine holds the central, correct position."],["The fifth nine, the hexagram’s ruler, embodies sincere leadership. His \"binding sincerity\" unites the realm, as seen in Emperor Taizong of Tang’s \"releasing prisoners to retum for execution\" — trusting criminals to honor their word, and being trusted in return, leading to a harmonious society."],"Sincerity that binds others together: no blame."],"61.6":["Nine at the top","Cockcrow penetrating to heaven. Perseverance brings misfortune.","A rooster flies to the sky; integrity brings danger.",["The Commentary on the Images says: A rooster’s call reaching the sky cannot last."],["The Commentary on the Images says: A rooster flying to the sky cannot sustain its ascent."],["The top nine represents hollow ambition — like a rooster pretending to be a crane, its flight is unsustainable. Sincerity has been replaced by pretense, and its \"heavenly call\" is empty. True greatness lies in substance, not show."],"The rooster's sound rises to heaven: persisting in empty form is ominous."],"62.1":["Six at the beginning","The bird meets with misfortune through flying.","The bird brings danger.",["The Commentary on the Images says: The bird’s danger is unavoidable."],["The Commentary on the Images says: The bird’s danger cannot be averted."],["The first six, like a bird flying blindly, faces unavoidable danger. It mirrors Hua Mulan’s hidden identity — retirement cannot shield one from unintended consequences. Inaction, not flight, is the safest course."],"The bird flies upward and meets misfortune."],"62.2":["Six in the second place","She passes by her ancestor and meets her ancestress. He does not reach his prince and meets the official.No blame.","Surpassing the grandfather, meeting the grandmother; not reaching the ruler, meeting the minister —no blame.",["The Commentary on the Images says: Not reaching the ruler — ministers must not exceed their station."],["The Commentary on the Images says: Not reaching the ruler reflects the principle that ministers must not overstep their authority."],["The second six achieves more than his ancestors but stops short of challenging the ruler. Humility and acceptance of subordinate status ensure safety — ambition must be tempered by wisdom."],"Passing the grandfather and meeting the grandmother; not reaching the ruler but meeting the minister: no blame."],"62.3":["Nine in the third place","If one is not extremely careful, somebody may come up from behind and strike him.Misfortune.","Guarding against excess; blind following leads to danger.",["The Commentary on the Images says: Blind following leads to harm — how great the danger!"],["The Commentary on the Images says: Blind following causes harm — what can be done?"],["The third nine, arrogant and unguarded, falls victim to petty schemers, Blindly following others in politics invites disaster — vigilance and independence are essential."],"If you don't guard against danger, harm may come."],"62.4":["Nine in the fourth place","No blame. He meets him without passing by.Going brings danger. One must be on guard.Do not act. Be constantly persevering.","No blame; not exceeding, but encountering. Advancing brings danger — caution is essential; do not rigidly uphold integrity.",["The Commentary on the Images says:","Not exceeding, but encountering — misalignment. Advancing brings danger — caution is essential; stability cannot last."],["The Commentary on the Images says: Not exceeding, but encountering reflects misalignment. Advancing brings danger — caution is essential; stability is temporary."],["The fourth nine survives with the fifth six’s support, but faces the risk of \"outshining the ruler.\" Caution and restraint are vital — talent must be hidden to avoid suspicion."],"No blame; not going too far, but meeting it: don't persist in rigid stubbornness."],"62.5":["Six in the fifth place","Dense clouds,no rain from our western territory. The prince shoots and hits him who is in the cave.","Dense clouds, no rain, from the western suburbs; the duke shoots with a tethered arrow, catching prey in its lair.",["The Commentary on the Images says: Dense clouds, no rain — they have risen too high."],["The Commentary on the Images says: Dense clouds, no rain — they have ascended too high to fall."],["The fifth six, like clouds that never rain, holds power but cannot act. A ruler must humble himself to connect with the people — otherwise, authority becomes empty."],"Dense clouds but no rain from the western edge; the duke shoots and catches game in its den."],"62.6":["Six at the top","He passes him by, not meeting him.The flying bird leaves him.Misfortune.This means bad luck and injury.","Not encountering, but exceeding; the bird is trapped — danger, this is disaster.",["The Commentary on the Images says: Not encountering, but exceeding — excess has reached its peak."],["The Commentary on the Images says: Not encountering, but exceeding — excess has reached its zenith."],["The top six, like a bird trapped in a net, ignores the \"descend, do not ascend” principle. In turbulent times, humility and retreat ensure survival — arrogance leads to disaster."],"Not meeting, but passing by: the bird is caught; this is disaster."],"63.1":["Nine at the beginning","He brakes his wheels.He gets his tail in the water. No blame.","Dragging the wheel, wetting the tail — no blame.",["The Commentary on the Images says: Dragging the wheel is without blame, as it reflects prudence."],["The Commentary on the Images says: Dragging the wheel shows caution, ensuring no blame."],["When the first nine encounters smoothness in all things, it forgets the principle of staying vigilant in peace and remaining cautious from start to end.For example, one may receive awards for achievements and grow proud in the face of honor. This can easily lead to stagnation or even regression. Therefore, in the face of honor, one must be even more cautious and hold oneself to strict standards. Yet this is not easily achieved — throughout history, many have failed to escape the fate of character distortion amid great accomplishments."],"Dragging the wheel and wetting the tail: slow, careful start, no blame."],"63.2":["Six in the second place","The woman loses the curtain of her carriage. Do not run after it; On the seventh day you will get it.","The woman loses her hairpin; do not chase — regain it in seven days.",["The Commentary on the Images says: Regaining it in seven days reflects adherence to the middle way."],["The Commentary on the Images says: Recovery comes from maintaining balance and patience."],["Though originally aspiring to achieve great deeds, in the time of completion one must not act rashly but maintain stability. This means missing chances to display talent, causing inner discontent. Yet the second six, gentle and centered, exerts great self-restraint for the greater good.Crisis holds opportunities; prosperity may overlook the worthy. If the second six holds to the centered path, opportunity will eventually come."],"The woman loses her carriage screen: don't chase it, and it returns in seven days."],"63.3":["Nine in the third place","The Illustrious Ancestor disciplines the Devil's Country. After three years he conquers it. Inferior people must not be employed.","King Gaozong campaigns against Guifang, conquering it in three years; do not employ petty people.",["The Commentary on the Images says: Conquering in three years reflects exhaustion."],["The Commentary on the Images says: Victory comes at great cost, leaving the state exhausted,"],["The third nine warns that victory (like King Gaozong’s war) brings exhaustion and the challenge of governing petty people. Reward their service, but deny them power — their ambition threatens stability."],"King Gaozong attacks the Gui Fang and takes three years to conquer them; don't use petty people."],"63.4":["Six in the fourth place","The finest clothes turn to rags. Be careful all day long.","Silk robes become ragged; remain vigilant all day.",["The Commentary on the Images says: Vigilance stems from suspicion of hidden dangers."],["The Commentary on the Images says: Vigilance reflects awareness of impending decline."],["In the Completion hexagram, the inner trigram dominates; by the outer trigram, transition toward Incompletion begins, The fourth six lies at the start of the outer trigram — change is imminent but not yet realized. Yet the fourth six possesses deep philosophical insight. Dwelling in a position of many fears, it remains wary, vigilant in peace, and cautious all day to prevent trouble before it arises.Outwardly, in completion, all conflicts seem resolved. In truth, old contradictions have merely ceased while new ones are brewing. Thus, whether in incomplete or completed circumstances, the noble person must never slacken even for a moment."],"The fine silk is wearing to rags: be on guard all day."],"63.5":["Nine in the fifth place","The neighbor in the east who slaughters an ox does not attain as much real happiness as the neighbor in the west with his small offering.","The eastern neighbor slaughters an ox; the western neighbor's simple sacrifice is more blessed.",["The Commentary on the Images says: The eastern neighbor's grand sacrifice lacks timing; the western’s simplicity brings true blessing."],["The Commentary on the Images says: Sincerity in timing surpasses grandeur — blessing follows humility."],["When affairs are accomplished and things flourish, arrogance and extravagance most easily arise, leading to loss of sincerity and reverence.A ruler should govern with graceful ease, achieving \"non-action yet leaving nothing undone.\"King Zhou offered cattle in sacrifices to ancestors and deities — solemn yet unrewarded with blessing. The Zhou used simple offerings and received blessing, ultimately overthrowing the Shang to become the ruling dynasty.The reason: King Zhou sacrificed irregularly, while the Zhou sacrificed timely with sincerity. The implicit message is to maintain the current state without alteration."],"The eastern neighbor slaughters an ox, but the western neighbor's simple offering is truly blessed."],"63.6":["Six at the top","He gets his head in the water. Danger","Wetting the head — danger.",["The Commentary on the Images says: Wetting the head brings danger — how can it last?"],["The Commentary on the Images says: Extreme risk threatens survival — decline is inevitable."],["The pinnacle of perfection marks the beginning of decline. The Completion hexagram represents utmost perfection; thus, each line implies preserving or delaying that perfection. Yet the top six no longer carries this meaning, for the laws of change in all things transcend human will, One may delay the early decay of perfection but cannot prevent its decline.The top six is inherently tender and faces danger. If vigilance remains constant and caution endures from start to finish, crisis can still be averted. Interpretation of Hexagram Ji Ji from Tui Bei Tu, Image 12 Sidi + Yihai & i, , q yey | yy ‘sy ARN AER"],"Wetting the head: danger."],"64.1":["Six at the beginning","He gets his tail in the water. Humiliating.","Wetting the tail — regret.",["The Commentary on the Images says: Wetting the tail shows a failure to recognize limits."],["The Commentary on the Images says: Wetting the tail reflects a failure to acknowledge risk, leading to regret."],["The young fox wets its tail before reaching midstream, indicating deeper water ahead and an impossible crossing.To press forward would mean drowning, yet survival demands crossing. This is natural selection at work. Every disaster or turning point is a natural elimination — just as an incapable person bearing heavy responsibility is bound to falter."],"Wetting the tail: a rash start brings regret."],"64.2":["Nine in the second place","He brakes his wheels. Perseverance brings good fortune.","Dragging the wheel — integrity ensures good fortune.",["The Commentary on the Images says: The second nine’s good fortune comes from balanced integrity,"],["The Commentary on the Images says: Integrity and balance ensure the second nine’s success."],["The second nine represents the river’s center — the most critical and perilous point of crossing.Only with firm confidence and extreme caution can one smoothly escape danger.Though the second nine is not in its proper position, it receives aid from the first six, third six, and fifth six, ensuring rescue in peril and a successful crossing.In the trigram image, Kan represents a bow or wheel, hence the image of “pulling the wheel.” And because Kan symbolizes water, it implies driving a carriage across the river."],"Dragging the wheel: hold steady and good fortune follows."],"64.3":["Six in the third place","Before completion, attack brings misfortune. It furthers one to cross the great water.","Not yet crossed, war brings danger; crossing great rivers is favorable,",["The Commentary on the Images says: Campaigning while unready reflects misalignment."],["The Commentary on the Images says: Premature action leads to danger, as the third six is out of place."],["When matters remain unaccomplished, a yin-soft nature positioned above danger and improperly placed should not act rashly — especially not venture across great rivers, Forced advance will bring peril. The third six is the top line of the lower Kan trigram and the bottom line of the upper mutual Kan trigram, surrounded by water — symbolizing not yet having crossed the river. In such a fraught situation, engaging in battle is naturally unfavorable."],"Not yet crossed: campaigning now is dangerous; crossing great rivers is favorable."],"64.4":["Nine in the fourth place","Perseverance brings good fortune. Remorse disappears. Shok, thus to discipline the Devil's Country. For three years, great realms are awarded.","Integrity brings good fortune, regret vanishes; Zhen campaigns against Guifang, rewarded after three years.",["The Commentary on the Images says: Good fortune comes from resolute action."],["The Commentary on the Images says: Integrity and determination ensure the fourth nine’s success."],["Having escaped danger, fate begins to change — yet fortune does not fall from the sky. One must rise and struggle, engaging in arduous endeavor For instance, after Wu Ding, the Shang dynasty declined again, and feudal lords rebelled, Jili, father of King Wen of Zhou, led troops to aid the Shang emperor in conquering the Guifang state of the western Qiang. After three years, he defeated Guifang and was richly rewarded by the Shang emperor. This tale inspires the fourth nine to achieve merit and act boldly, like King Wen's father."],"Staying correct brings good fortune and regret vanishes; a long campaign is rewarded after three years."],"64.5":["Six in the fifth place","Perseverance brings good fortune. No remorse. The light of the superior man is true. Good fortune.","Integrity brings good fortune, no regret; the nobleman’s radiance and sincerity — auspicious.",["The Commentary on the Images says: The nobleman’s radiance brings lasting good fortune."],["The Commentary on the Images says: The nobleman’s virtue radiates, bringing harmony and good fortune."],["Symbolizing the noble one’s radiance, it represents a successful river crossing — the pivotal turn from Incompletion to Completion. The fifth six signifies receiving support from many worthy ministers. Not only does it maintain correctness and attain auspiciousness itself, but by responding to the second nine below, it leads all through the trials of Incompletion into the peaceful prosperity of Completion.Like the sun dispelling dark clouds, its light bathes the land and brings brightness to the people."],"Staying correct brings good fortune, no regret; the noble's radiance and sincerity are auspicious."],"64.6":["Nine at the top","There is drinking of wine in genuine confidence. No blame.But if one wets his head. He loses it, in truth.","Sincerity in drinking — no blame. Excess loses sincerity.",["The Commentary on the Images says: Excessive drinking reflects a lack of moderation."],["The Commentary on the Images says: Excess undermines sincerity, leading to loss of virtue."],["Finally having passed through danger, peace and stability arrive. People begin to drink and revel without restraint. Drunk yet still drinking, they end up pouring wine over their heads instead of into their mouths.Completion values stopping, Incompletion values action — yet the top nine of Incompletion acts excessively, lacking moderation. This warns one to act with measure and restraint, Interpretation of Hexagram Wei Ji from Tui Bei Tu, Image 44 Wei Ji > Ding wei ‘<< 4) Mg \"i L_ | | [Prophecy Says] Sun and moon shine in the sky, Yin forces submit Hundred spirits pay homage, Two wings, four legs. [Ode Says] A sage arises in China, Not a hero, but a unifier.Barbarians translate to hail the Son of Heaven, After darkness, spring comes to nine nations. [Jin Shengtan's Commentary] This image predicts the return of a sage, bringing global harmony and a new era of peace, Fortune Telling for Hexagram Wei Ji Luck Mixed fortune: initial decline, eventual growth. Blocked energy, unmet desires, ue imbalance. Challenging but transformative—\"unfinished” status holds unlimited potential Health Chronic illness risk; unstable symptoms. Seek treatment in the northeast"],"Sincerely drinking at the celebration: no blame; but drinking to excess loses it."]}}</script>
