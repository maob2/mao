.","A poor person carrying a burden yet riding in a grand chariot invites robbers; even integrity brings regret.",["The Commentary on the Images says: \"Carrying a load while riding in a carriage is indeed shameful. Oneself inviting armed robbers — who else is to blame?\""],["The Commentary on the Images says: A poor man who carries a burden yet rides in a luxurious carriage — this is a shameful thing (for only a gentleman may ride). His own actions invite bandits — whom can he blame?"],["The third six is a poor man who carries a heavy load yet rides in an extravagant carriage. Such behavior stirs resentment and invites robbery by bandits, The third six has escaped poverty, yet brings upon himself the calamity of robbery, This serves as a warning: do not flaunt sudden wealth if you were poor; do not be ostentatious, or you will only invite disaster."],"Carrying a burden yet riding in a carriage invites robbers: flaunting sudden gain brings shame."],"40.4":["Nine in the fourth place","Deliver yourself from your great toe. Then the companion comes, and him you can trust.","Freeing the big toe from its bonds, friends come — this is a sign of trust.",["The Commentary on the Images says: \"Releasing the big toe\" — the position is not yet appropriate."],["The Commentary on the Images says: Releasing the restraint on the big toe indicates that the fourth nine has misaligned its position."],["The fourth nine bears the image of being trapped in peril. When petty people gain power, noble individuals must distance themselves; to accomplish anything significant, petty people must be purged. That the fourth nine can dispel petty people and attract friends akin to gentlemen is positive. Yet why do petty people entangle themselves with the fourth nine? The fourth nine itself also has loopholes that can be exploited."],"Free yourself from your big toe: a true friend comes and is trusted."],"40.5":["Six in the fifth place","If only the superior man can deliver himself, It brings good fortune. Thus he proves to inferior men that he is in earnest.","The nobleman escapes difficulty, bringing auspiciousness; using sincerity to influence petty people.",["The Commentary on the Images says: \"The gentleman finds release; the petty man retreats.\""],["The Commentary on the Images says: The gentleman is liberated; the influence of petty people recedes."],["The fifth six carries the imagery of peril and bondage. Yet who would dare to bind a sovereign? Normally, no one would. However, when petty people crowd around the ruler, they entangle him like ropes. Only by drawing close to worthy ministers and distancing himself from petty people can the ruler break free from their fetters. This is akin to \"subduing the enemy without fighting\" — making petty people realize they have no path forward before a gentleman; they must either reform or withdraw from the stage of history on their own,"],"The noble person frees himself, and the petty fall away: good fortune."],"40.6":["Six at the top","The prince shoots at a hawk on a high wall. He kills it. Everything serves to further.","The duke shoots a falcon from a high wall, capturing it — there is no disadvantage.",["The Commentary on the Images says: \"A duke uses arrows to shoot a falcon\" — by this he resolves rebellion."],["The Commentary on the Images says: The noble lord shoots a great hawk to eliminate the rebel."],["What leaves the deepest impression in the Jie hexagram is the struggle against petty people. The top six is at the extreme of the hexagram; though the immediate crisis has been resolved, new hidden dangers may emerge at any moment. He carries concealed weapons, remains ever vigilant, and the atmosphere may grow tense again. Suppressing rebellious feudal states aims to unify and bring peace to the realm — using war to remove the threat of war. For a state, it is necessary both to break free from the fetters of petty people and to employ force to eliminate the threat of rebellion. This is the dual preparedness of civil and military means."],"The duke shoots a hawk on the high wall: removing the last threat benefits all."],"41.1":["Nine at the beginning","Going quickly when one's tasks are finished.Is without blame. But one must reflect on how much one may decrease others.","Completing tasks and hurrying brings no blame, with only a minor loss (e.g., missing some wine).",["The Commentary on the Images says: Hastening after finishing one's affairs still aligns with the aim."],["The Commentary on the Images says: Rushing to go after finishing one's work accords with the original intention."],["The initial nine responds to the fourth six, like being invited to a banquet. The initial nine, delayed by prior commitments, arrives late to find the feast nearly over. Missing some food and drink is a minor loss, not a disaster, for the true purpose was not indulgence but connecting with the fourth six."],"Finish your tasks and go quickly: no blame, but weigh how much to give."],"41.2":["Nine in the second place","Perseverance furthers. To undertake something brings misfortune. Without decreasing oneself, One is able to bring increase to others.","Upholding integrity is beneficial; aggression leads to danger, with no gain or loss.",["The Commentary on the Images says: The second nine's benefit in steadfastness lies in taking the center as its aim."],["The Commentary on the Images says: The second nine benefits by upholding the right path, aspiring to the golden mean."],["The second nine, discontent with the inferior third six above, seeks to oust it — a perilous move. This is like a department manager trying to displace a newly assigned mediocre supervisor. Such ambition will be thwarted by higher authority."],"It's beneficial to stay firm; pushing ahead is dangerous; you can help others without diminishing yourself."],"41.3":["Six in the third place","When three people journey together, Their number decreases by one. When one man journeys alone, He finds a companion.","A group of three loses one member; traveling alone finds a new friend.",["The Commentary on the Images says: One person goes forward, but with three, doubt arises."],["The Commentary on the Images says: A lone traveler finds companions, for three together breed suspicion."],["The third six reveals a human flaw. As the saying goes, \"With three, one is lost.\" Ten Chinese may lose to ten Japanese not due to lack of strength, but because internal strife weakens collective power. This highlights how human nature can undermine unity."],"Three travel together and one leaves; one traveling alone finds a companion."],"41.4":["Six in the fourth place","If a man decreases his faults, It makes the other hasten to come and rejoice. No blame.","Reducing suffering and speeding recovery brings no blame.",["The Commentary on the Images says: Diminishing one's ailment is also cause for joy."],["The Commentary on the Images says: Alleviating suffering from illness is a welcome relief."],["The phrase \"diminishing one's ailment\" refers to eliminating internal strife. Such infighting weakens collective strength. The solution lies in rebalancing yin and yang between the trigrams, forming the Hexagram of Diminishment. This reorganization curbs discord, thereby strengthening the group — showing how loss can be the start of greater strength."],"Decrease your ailment: the quick cure brings joy, no blame."],"41.5":["Six in the fifth place","Someone does indeed increase him. Ten pairs of tortoises cannot oppose it. Supreme good fortune.","Receiving a precious tortoise (a symbol of power) cannot be refused, bringing great auspiciousness.",["The Commentary on the Images says: The fifth six's supreme good fortune comes from above."],["The Commentary on the Images says: The great fortune of the fifth six derives from the protection of the top nine."],["The fifth six receives a precious tortoise — a symbol of authority. This position of honor is granted by the top nine, who moves from the third place in Hexagram Tai to assist in consolidating power. Thus, the fifth six need not refuse but must wield this authority rightly to ensure great fortune."],"Someone increases you: the gift of ten tortoises cannot be refused; great good fortune."],"41.6":["Nine at the top","If one is increased without depriving others, there is no blame. Perseverance brings good fortune. It furthers one to undertake something. One obtains servants but no longer has a separate home.","Gaining without loss, no blame, upholding integrity brings auspiciousness, advancing is beneficial, and selfless ministers are gained,",["The Commentary on the Images says: \"Not diminishing but augmenting it\" means one's great purpose is fulfilled."],["The Commentary on the Images says: To gain without loss means one's ambitions can be greatly realized,"],["The top nine is a noble figure who gives generously. When the third six can diminish no further, forcing loss upon subordinates would harm one's own foundation. Therefore, the top nine acts conversely — augmenting others instead of diminishing them. What seems like benefiting others ultimately strengthens oneself."],"Increase without decrease: no blame, and followers beyond your own household."],"42.1":["Nine at the beginning","It furthers one to accomplish great deeds. Supreme good fortune. No blame.","It is beneficial to undertake great endeavors; great good fortune, no blame.",["The Commentary on the Images says: Yuan ji wu jiu, xia bu hou shi ye.Translation: The Image says: Great good fortune and no blame, for the lower (trigram) does not burden the affair unduly."],["The Commentary on the Images says: Great good fortune and no blame come because the common people do not suffer heavy exploitation."],["The first nine is the principal line of the hexagram, symbolizing gain through humility. Its potential is boundless, favoring great achievements. The first nine responds to the fourth six, as if the fourth six hosts a feast and invites the first nine. The first nine, occupied with duties, arrives late to find only leftovers. This minor loss (missing some wine) brings no disaster, for the purpose was to connect with the fourth six, not to eat or drink.","The Commentary on the Images says: Someone does indeed increase him; Ten pairs of tortoises cannot oppose it. Constant perseverance brings good fortune. The king presents him before God. Good fortune."],"It's beneficial to undertake great works: supreme good fortune, no blame."],"42.2":["Six in the second place","Someone does indeed increase him; Ten pairs of tortoises cannot oppose it. Constant perseverance brings good fortune. The king presents him before God. Good fortune.","Someone may bestow a tortoise worth ten peng; do not refuse. Remain steadfast in integrity for good fortune. The king sacrifices to the Supreme Deity: good fortune.",["The Commentary on the Images says: Xiang yue: Huo yi Zhi, zi wai lai ye. Translation: The Image says: The increase comes from outside"],["The Commentary on the Images says: When someone bestows increase, it comes from an external source."],["The second six is dissatisfied with its current position, resenting the third six above it and seeking to displace it — this thought and action are dangerous. Imagine a department manager whose capable direct superior is transferred, replaced by an incompetent leader, The manager, resentful, tries to oust the new superior, only to face opposition from the general manager and fail."],"A gift worth ten tortoises can't be refused: stay steadfast and make an offering; good fortune."],"42.3":["Six in the third place","One is enriched through unfortunate events. No blame, if you are sincere and walk in the middle, and report with a seal to the prince.","Use increase for urgent matters; no blame. With sincerity, walk the middle path; report to the duke using jade tablets as credentials.",["The Commentary on the Images says: Yi yong xiong shi, gu you zhi ye.Translation: The Image says: Using increase for urgent matters is inherently proper."],["The Commentary on the Images says: Using gifts received to aid disaster-stricken areas solidifies one's existing benefits."],["During a famine, no other action matters more than opening granaries to relieve the people — this embodies \"diminish the upper, increase the lower,\" bringing no blame. Relieving the people requires sincerity: trust superiors and subordinates alike, uphold the middle way, and act cautiously. Do not embezzle relief supplies. The third six must report to the duke and obtain approval before opening granaries, Since grain comes from the people, the government’ relief efforts merely return what was taken from them."],"Use hardship to gain: no blame if you are sincere and balanced."],"42.4":["Six in the fourth place","If you walk in the middlea and report to the prince, he will follow. It furthers one to be used in the removal of the capital.","Walk the middle path; inform the duke's followers. It is beneficial to relocate the state by aligning with a powerful nation.",["The Commentary on the Images says: Gao gong cong, yi yi zhi ye. Translation: The Image says: Informing the duke's followers strengthens collective resolve."],["The Commentary on the Images says: Informing the duke's followers strengthens the resolve of the people."],["As part of the upper trigram of Yi, this line discusses relocating the capital to avoid harm and seek advantage. During famines, when \"diminishing the upper to benefit the lower,\" the greatest act of benefiting the people is moving the capital to a fertile land, leading the people to cultivate and rebuild their homes. Ancient rulers often relocated capitals. Though the fourth six focuses on benefiting the lower, it does not hold royal power; thus, relocating the capital requires the monarch’s approval. Aligning with the monarch ensures success,"],"Walk the middle path and report to the duke: he follows, and helps you relocate the capital."],"42.5":["Nine in the fifth place","If in truth you have a kind heart, ask not.Supreme good fortune. Truly, kindness will be recognized as your virtue.","With sincerity and a compassionate heart, great good fortune is certain without inquiry. Others will reciprocate with sincerity and gratitude for your virtue.",["The Commentary on the Images says: The Image says: With sincerity and compassion, no inquiry is needed. Gratitude for your virtue fulfills your highest aspirations."],["The Commentary on the Images says: Sincerity and compassion need no questioning. The people’s gratitude for your virtue will lead to greater progress."],["The fifth nine, embodying yang strength, centrality, and correctness, occupies the throne and responds to the second six below, symbolizing a sincere desire to benefit the people. The people, receiving such grace, naturally respond with gratitude — even a drop of kindness is repaid with a spring of loyalty. By wholeheartedly benefiting the world, the fifth nine earns universal love and genuine reciprocation. To the fifth nine, benefiting the people is a heartfelt duty; to the people, it is a divine gift. Unlike the fifth six in Sun (Decrease), which gains from the lower, the fifth nine in Yi diminishes itself to benefit others — a principle easily misunderstood, yet one where benefiting others ultimately benefits oneself."],"Sincere kindness brings great good fortune without asking; others answer with gratitude."],"42.6":["Nine at the top","He brings increase to no one. Indeed, someone even strikes him. He does not keep his heart constantly steady. Misfortune.","No one increases it; some attack it. Resolve is unsteady: misfortune.",["The Commentary on the Images says:The Image says: \"No one increases it\" is a one-sided statement; \"some attack it\" comes from external forces."],["The Commentary on the Images says: The Image says: \"No ‘one increases it\" reflects widespread domestic apathy; \"some attack it\" indicates external opposition."],["As the top line of Yi’s upper trigram, it should follow the fourth six and fifth nine in benefiting the lower, but its resolve to do so fades. Instead, it demands \"diminishing the lower to benefit the upper,\" leading to disaster, While the second six attracts benefactors, the top nine invites attackers, Politically, this represents a ruler who exploits the people without reciprocation, sparking rebellion and uprisings, The top nine is a greedy, shortsighted tyrant — a cautionary example for future generations, Interpretation of Hexagram Yi from Tui Bei Tu, Image 36 Yi + Ji Hai re Wiha, Sin De Faso ie S L UUs PSS AS QU [Prophecy Says] A delicate woman, Defends against enemies with bare hands. Neither fortune nor misfortune is distinguished, Lanterns obscure the sun, [Ode Says] Fists rotate heaven and earth, Within the seas, unrest arises without cause,Mother and child know no precedence,Looking west to Chang'an, they enter the court, [Jin Shengtan's Commentary] This image suggests a woman will pacify the Central Plains and establish her capital in Chang'an, Quick Judgment on Yi Hexagram Fortune Luck Strong wind and swift thunder: growing prestige, currently in an auspicious period, aided by noble figures to succeed. Caree Advance bravely, invest boldly, support others! ventures, and practice kindness— “ ‘mutual benefit will follow. Love Mutual growth and harmony: a favorable marriage, with signs of joy and prosperity. Health Foot or stomach ailments; minor bleeding but non-life-threatening, curable. Seek ° treatment in the southeast. Business Changing careers or opening a new business is profitable. Avoid petty gains smess prioritizing others’ interests leads to greater profits. Involves grain or land; mishandling risks imprisonment Travel Traveling with three companions to the southeast is safe, but wealth will not ave flourish Life Both men and women exhibit yang energy, seeking power and leadership. Skilled . at protecting their own interests."],"No one increases it, and someone strikes it: an unsteady heart brings misfortune."],"43.1":["Nine at the beginning","Mighty in the forward-striding toes. When one goes and is not equal to the task, one makes a mistake.","Strength in the fore toes; advancing without ability to prevail brings blame.",["The Commentary on the Images says: Bu sheng er wang, jiu ye."],["Advancing without the ability to succeed invites disaster."],["The first nine represents nascent yang energy, analogous to the toes in the body — symbolizing limited ability, Advancing under such circumstances risks failure, like a top student seeking a senior corporate leadership role prematurely, lacking the necessary experience."],"Strength only in the toes: advancing without the ability to prevail brings blame."],"43.2":["Nine in the second place","A cry of alarm. Arms at evening and at night. Fear nothing.","Alarm and cries; troops pass at night — do not fret.",["The Commentary on the Images says: You rong wu xu, de zhong dao ye.Translation: The Image says: Troops passing without anxiety — upholding the middle way."],["The Commentary on the Images says: When troops pass at night, the second nine remains centered and correct, so no anxiety is needed,"],["Unlike the impulsive first nine, the second nine is prudent and vigilant. It not only stays alert itself but also raises the alarm, ensuring collective readiness. Even if villains scheme to attack at night, preparedness neutralizes the threat. The second nine is the most favorable line in the hexagram, though it still experiences fear from the passing troops."],"Alarm and cries, troops at night: stay calm."],"43.3":["Nine in the third place","To be powerful in the cheekbones brings misfortune.The superior man is firmly resolved.He walks alone and is caught in the rain.He is bespattered,and people murmur against him.No blame.","Strength in the cheekbones — misfortune. The nobleman resolutely presses on alone, encounters rain, gets soaked, and feels resentful — no blame.",["The Commentary on the Images says: Jun zi guai guai, zhong wu jiu ye.Translation: The Image says: The nobleman’s resolute advance ultimately brings no blame."],["The Commentary on the Images says: The nobleman’s urgent advance leads to no disaster in the end."],["The third nine, occupying a yang position with yang energy, is aggressive and intolerant of evil. It corresponds to the top six (a yin villain), igniting rage at the sight of treachery. This overt hostility risks provoking the villain, endangering the nobleman. The third nine faces a dilemma: showing anger invites danger, but suppressing it feels unjust."],"Strength in the cheekbones is misfortune; the noble presses on alone through the rain; no blame."],"43.4":["Nine in the fourth place","There is no skin on his thighs,and walking comes hard.If a man were to let himself be led like a sheep,Remorse would disappear.But if these words are heard they will not be believed.","No skin on the buttocks; movement is hesitant. Leading a sheep dispels regret, but words of advice are ignored.",["The Commentary on the Images says: The Image says: Hesitant movement stems from an improper position; ignoring advice reflects poor judgment."],["The Commentary on the Images says: Hesitant movement arises from an unsuitable position; ignoring counsel shows lack of wisdom."],["The fourth nine lacks resolve but is overly conciliatory, cowardly, and unable to confront treachery. This hesitation is like having no skin on the buttocks — unable to sit or move freely. Imagine someone falling off a cliff, clinging to a bush. Rescuers above cannot reach him, and clinging to the bush offers no escape. When a monk shouts, \"Let go!\" he cannot bring himself to trust the advice."],"No skin on the thighs and hesitant steps: lead the sheep and regret fades, but advice is ignored."],"43.5":["Nine in the fifth place","In dealing with weeds, firm resolution is necessary. Walking in the middle remains free of blame.","The amaranth breaks free from the water; advancing with integrity brings no blame.",["The Commentary on the Images says: The Image says: Advancing with integrity brings no blame, but the center’s virtue is not yet fully manifest."],["The Commentary on the Images says: Upholding the middle way avoids blame, though the fifth nine’s central virtue is not yet fully realized,"],["The fifth nine is adjacent to the top six and aligned with it, but must yield to the collective will of the yang lines to expel the villain. This conflicts with its personal desires, so it must maintain balance and follow the tide of events, Like Emperor Li Longji during the Kaiyuan ttt, who could not save his beloved Yang Yuhuan when troops demanded her execution after An Lushan’s rebellion."],"The amaranth is pulled free: stay centered and resolute; no blame."],"43.6":["Six at the top","No cry. In the end misfortune comes.","No lamentation; misfortune in the end.",["The Commentary on the Images says: The Image says: Misfortune without lamentation cannot endure forever."],["The Commentary on the Images says : The Image says: Misfortune that elicits no lamentation will not last, for weak yin cannot persist."],["A treacherous minister abuses power temporarily, but arrogance invites retribution. With the tide turning, the top six faces inevitable destruction. Its desperate lamentation cannot reverse its fate, as the collective yang forces are too strong. Guai emphasizes resolute elimination of villains while stressing strategic foresight — lessons that remain valuable for confronting treachery."],"No lament: in the end misfortune comes."],"44.1":["Six at the beginning","It must be checked with a brake of bronze.Perseverance brings good fortune. If one lets it take its course, one experiences misfortune. Even a lean pig has it in him to rage around.","Tied to a metal brake, steadfastness brings good fortune. Advancing leads to misfortune; a bound pig struggles restlessly.",["The Commentary on the Images says: Tied to a metal brake, the gentle way is constrained."],["The Commentary on the Images says: Being tied to a metal brake means yin is restrained by yang."],["The first six represents a single woman entering a village of bachelors, seized by a man and forced into marriage, where she spins thread daily, In ancient times, bride abduction was a customary (though not illegal) marriage practice. The woman must accept her role as a wife to find fortune; fleeing brings danger, like a pig struggling in vain against its bonds."],"Held by a metal brake: staying still is good; advancing brings misfortune, like a bound pig struggling."],"44.2":["Nine in the second place","There is a fish in the tank. No blame.Does not further guests.","A fish is in the package; there is no disaster, but it is unfavorable for entertaining guests.",["The Commentary on the Images says: A fish in a bundle — rightfully, it does not go to guests."],["The Commentary on the Images says: The fish in the bundle is not meant for guests, by principle."],["The second nine gains the first six as a wife — a boon for a bachelor, enabling a life of mutual prosperity through farming and weaving. Since bride abduction was legally sanctioned, no blame arises. However, this union stirs resentment among other bachelors, as the new wife cannot be shared, sowing minor conflicts in the village."],"A fish in the bag: no blame, but it is not for entertaining guests."],"44.3":["Nine in the third place","There is no skin on his thighs, And walking comes hard. If one is mindful of the danger, No great mistake is made.","No skin on the buttocks, movement is hesitant — danger, but no great blame.",["The Image says: Hesitant movement — progress is unguided,"],["The Commentary on the Images says: Hesitant movement arises from lack of support."],["The third nine also desires the first six and fights the second nine for her, sustaining severe injuries to his buttocks that hinder movement. This reflects the dangers of bride abduction, though since he survives, no major disaster occurs."],"No skin on the thighs and hesitant steps: danger, but no great blame."],"44.4":["Nine in the fourth place","No fish in the tank. This leads to misfortune.","No fish in the bundle — misfortune arises.",["The Commentary on the Images says: The Image says: Misfortune from no fish stems from alienating the people."],["The Commentary on the Images says: Misfortune arises when there is no fish, as it signifies alienation from the people."],["The fourth nine and first six are mutually attracted but separated by distance, failing to unite through abduction. This frustration leads to danger, paralleling the tragic affair of Ximen Qing and Pan Jinlian — where Pan’s dissatisfaction with her unattractive husband Wu Dalang fuels a fatal encounter with Ximen."],"No fish in the bag: neglecting the people brings misfortune."],"44.5":["Nine in the fifth place","A melon covered with willow leaves. Hidden lines. Then it drops down to one from heaven.","Wrapping melons in willow branches, inner virtue shines — falling from heaven.",["The Commentary on the Images says: The fifth nine’s inner virtue reflects centrality and correctness. Falling from heaven, it does not abandon. its destiny."],["The Commentary on the Images says: The fifth nine’s inner virtue arises from its central, correct position. Falling from heaven, it accepts its divine mandate."],["The fifth nine represents the village chief, who loses authority as bachelors seek wives. He opposes these unions, seeking to suppress yin (female) influence, but the tide of events is against him. As heaven’s order dictates, the fifth nine’s decline is inevitable, overshadowed by rising yin."],"Melons wrapped in willow branches: hidden excellence, and a gift falls from heaven."],"44.6":["Nine at the top","He comes to meet with his horns. Humiliation. No blame.","Encountering a horn — difficulty, but no blame.",["The Commentary on the Images says: The Image says: Encountering a horn at the top signifies ultimate difficulty."],["The Commentary on the Images says: Encountering a horn brings difficulty, as the top nine is in an exhausted position."],["The top nine represents the oldest bachelor, who never encounters a partner. As an elder, he faces defiance from juniors like the fourth nine, who blames him for failing to secure a wife. The fifth nine also challenges him. Though troubled, the top nine faces no disaster, as death in old age was considered a \"happy event\" in ancient times."],"Meeting with horns: a difficult, awkward encounter, but no blame."],"45.1":["Six at the beginning","If you are sincere, but not to the end,there will sometimes be confusion, sometimes gathering together. If you call out, then after one grasp of the hand you can laugh again. Regret not. Going is without blame.","Sincerity fails to endure; chaos and gathering ensue. Lamentation turns to laughter — do not fret; advancing brings no blame.",["The Commentary on the Images says: Chaos and gathering arise from confused intentions."],["The Commentary on the Images says: Chaos and gathering stem from conflicting motives among the people."],["Even in peaceful eras, factions of villains emerge; in corrupt times, such gatherings proliferate. Examples include An Lushan’s rebellion during the Kaiyuan The Golden Age, the White Lotus Uprising under Jiaging, and the Green Gang’s rise in 20th-century Shanghai."],"Sincerity falters and confusion follows; crying out turns to laughter, no blame."],"45.2":["Six in the second place","Letting oneself be drawn brings good fortune and remains blameless.If one is sincere, It furthers one to bring even a small offering.","Guided by good fortune, no blame. Sincerity makes even a modest sacrifice effective",["The Commentary on the Images says: Guidance brings good fortune and no blame, as centrality remains unshaken."],["The Commentary on the Images says: Guidance from superiors brings good fortune, as the second six stays centered and true."],["The second six is sincere and frugal, so even a humble sacrifice suffices, This modesty reflects its refusal to exploit the people for royal tribute, earning the ruler’s trust. By avoiding treasonous factions, it gains royal favor — this is \"guided good fortune.\""],"Drawn along by good fortune: sincerity makes even a modest offering effective."],"45.3":["Six in the third place","Gathering together amid sighs. Nothing that would further. Going is without blame.Slight humiliation.","Gathering with lamentation — no benefit. Advancing brings no blame, but minor regret.",["The Commentary on the Images says: Wang wu jiu, shang xun ye.Translation: The Image says: Advancing brings no blame, as the upper (trigram) is yielding."],["The Commentary on the Images says: Advancing is harmless because the upper trigram is yielding (Xun)."],["The third six, as the top of Kun (earth), tries to rally the lower yin lines but fails. The first six aligns with oppressed laborers to resist exploitation, while the second six (a minister) allies with the fifth nine (ruler) to serve the people, rejecting the third six’s leadership. Only the fourth nine (a yang line) accepts it, leaving the third six frustrated yet compliant,"],"Gathering with sighs: nothing benefits, though going is blameless with some minor regret."],"45.4":["Nine in the fourth place","Great good fortune. No blame.","The divination indicates supreme auspiciousness; (only then) can disaster be averted,",["The Commentary on the Images says: Great good fortune and no blame, though the position is improper."],["The Commentary on the Images says: Great fortune comes despite an improper position (yang in a yin place)."],["The fourth nine is an upright official who defends the poor (first six) and allies with the third six, avoiding disaster. Though a yang line in a yin position (improperly placed), its integrity compels it to criticize the ruler’s flaws — earning respect but not full approval from the throne."],"Supreme good fortune, no blame."],"45.5":["Nine in the fifth place","If in gathering together one has position, This brings no blame. If there are some who are not yet sincerely in the work, sublime and enduring perseverance is needed. Then remorse disappears.","Gaining position through gathering, no blame. Lacking trust, remain steadfast in integrity to dispel regret.",["The Commentary on the Images says: Gaining position through gathering, but aspirations are not yet fulfilled."],["The Commentary on the Images says: Position is achieved through gathering, but the fifth nine’s ambitions remain unfulfilled."],["The fifth nine (ruler) is newly enthroned and lacks universal trust, Like the young Kangxi Emperor, who relied on wet nurses and faced dominance by regents (especially Oboi), it must bide its time. Kangxi secretly trained wrestlers to eliminate Oboi after three years, securing his rule,"],"Gaining position through gathering: no blame, but with little trust, stay steadfast to dispel regret."],"45.6":["Six at the top","Lamenting and sighing, floods of tears. No blame.","Lamentation and weeping, no blame.",["The Commentary on the Images says: Lamentation and weeping stem from insecurity in high position."],["The Commentary on the Images saysGrief arises from anxiety about one’s lofty position."],["The top six is isolated and unable to gather allies, grieving in solitude, It mirrors Empress Dowager Xiaozhuang, who struggled against powerful regents while protecting the young Kangxi. Though vulnerable and marginalized, she avoided disaster through strategic patience."],"Sighs and tears: no blame."],"46.1":["Six at the beginning","Pushing upward that meets with confidence Brings great good fortune.","Permitted to ascend — great good fortune.",["The Commentary on the Images says: Permitted ascent brings great fortune, aligning with higher aspirations."],["The Commentary on the Images says: Great fortune from ascent arises when it aligns with one’s purpose."],["The first six has vigorous potential but faces hardship, seeking to improve its situation. Like a factory worker studying management after hours, it gains support from the second nine (a mentor). This alignment with higher forces accelerates its growth."],"Welcomed to ascend: great good fortune."],"46.2":["Nine in the second place","If one is sincere,It furthers one to bring even a small offering. No blame.","Sincerity makes even a modest sacrifice effective — no blame.",["The Commentary on the Images says: The Image says: The second nine’s sincerity brings joy."],["The Commentary on the Images says: The second nine’s sincerity ensures celebration."],["Why does the second nine support the first six’s ascent? It also secks advancement. By avoiding exploitation of the people and excessive tribute to the ruler, it gains royal favor and popular loyalty — securing its own position while fostering growth."],"Sincerity makes even a modest offering effective: no blame."],"46.3":["Nine in the third place","One pushes upward into an empty city.","Ascend to an undefended city.",["The Commentary on the Images says: Ascending to an undefended city — no hesitation is needed."],["The Commentary on the Images says: Advancing to an undefended city means ascent requires no doubt."],["The third nine advances boldly, unlike the cautious second nine, rising unopposed. As a yang line in a yang position, it acts decisively and gains the top six’s trust. However, its excessive rigidity risks overreach — its fate depends on balancing boldness with restraint."],"Ascending into an empty city: no one stands in your way."],"46.4":["Six in the fourth place","The king offers him Mount Ch'i. Good fortune. No blame.","The king sacrifices at Qishan — good fortune, no blame.",["The Commentary on the Images says: Wang yong heng yu qi shan, shun shi ye.Translation: The Image says: The king sacrifices at Qishan, following ancestral tradition."],["The Commentary on the Images says: The king’s sacrifice at Qishan honors his ancestors’ legacy."],["King Wen of Zhou, released from captivity by King Zhou of Shang, sacrificed at Qishan to thank the gods and strengthen his rule. As a duke (not emperor), he mirrors the fourth six’s position. This story illustrates that the fourth six faces minor risks but achieves great growth by uniting people through ritual and virtue."],"The king makes offerings at Mount Qi: good fortune, no blame."],"46.5":["Six in the fifth place","Perseverance brings good fortune.One pushes upward by steps.","Steadfastness brings good fortune; ascending the steps,",["The Commentary on the Images says: The Image says: Steadfast ascent to the steps fulfills great aspirations."],["The Commentary on the Images says: Steadfast ascent to higher rank fulfills one’s highest ambitions."],["The fifth six represents a ruler, the leader of feudal lords. In ancient gatherings, the emperor sat above peers, accessible via steps, symbolizing authority. The fifth six embodies this ascent to supreme power, earning the right to rule."],"Stay steadfast: good fortune, ascending the stairs one step at a time."],"46.6":["Six at the top","Pushing upward in darkness. It furthers one to be unremittingly persevering.","Ascending in darkness — beneficial to cease growth and remain steadfast.",["The Commentary on the Images says: The Image says: Ascending in darkness at the top leads to decline and impoverishment,"],["The Commentary on the Images says: Ascending blindly to the peak causes decline and scarcity."],["At the apex of power, the top six (a retired emperor) must practice humility and self-restraint. Clinging to dominance invites decline — sustain success by avoiding excess."],"Ascending in the dark: keep steady and stop pushing for more."],"47.1":["Six at the beginning","One sits oppressed under a bare tree and strays into a gloomy valley.For three years one sees nothing.","Buttocks trapped on a stump, entering a dark valley — three years without seeing the light.",["The Commentary on the Images says: Entering a dark valley — obscurity and darkness."],["The Commentary on the Images says: The dark valley symbolizes obscurity and despair."],["The first six is weak and trapped, unable to escape its lowly position. Like sitting on a stump in a dark valley, it must withdraw into obscurity. Though the fourth nine offers nominal support, its own instability renders it unable to help."],"Stuck on a stump in a dark valley: three years without seeing light."],"47.2":["Nine in the second place","One is oppressed while at meat and drink. The man with the scarlet knee bands is just coming.It furthers one to offer sacrifice.To set forth brings misfortune. No blame.","Trapped by excess wine and food, honor arrives, Sacrifice is beneficial; warfare is dangerous, but no blame.",["The Commentary on the Images says: Trapped by excess wine and food — celebration lies within."],["The Commentary on the Images says: Excess leads to suffering, but centrality ensures eventual celebration."],["The second nine endures poverty yet remains unbroken, viewing hardship as a prelude to honor. Like a nobleman embracing poverty, it stays resilient, avoiding rash actions as fortune begins to favor it."],"Oppressed amid wine and food: honor comes, offerings help, a campaign is dangerous."],"47.3":["Six in the third place","A man permits himself to be oppressed by stone,and leans on thorns and thistles.He enters his house and does not see his wife.Misfortune.","Trapped by stones, clinging to thorns, returning home to find no wife — misfortune.",["The Commentary on the Images says: Clinging to thorns rides above yang; returning home to find no wife is ill-omened."],["The Commentary on the Images saysClinging to thorns signifies yin overstepping yang; losing one’s wife portends disaster."],["The third six is incompetent and restless, As Confucius said: \"The nobleman endures poverty; the villain resorts to vice.\" This line represents a criminal trapped in a stone prison topped with thorns, returning home to find his wife gone. His desperation ensures further crimes and misfortune."],"Trapped by stones and thorns, you go home to find no wife: misfortune."],"47.4":["Nine in the fourth place","He comes very quietly, oppressed in a golden carriage.Humiliation, but the end is reached.","Advancing slowly, trapped by a golden chariot — difficulty, but a favorable end.",["The Commentary on the Images says: Advancing slowly, aiming downward. Though improperly positioned, allies are present."],["The Commentary on the Images says: Slow progress reflects focus on the lower realm. Despite misalignment, support emerges from below."],["The fourth nine seeks alliance with the first six, advancing slowly to overcome obstacles. Though misplaced, it gains support from like- minded forces. Temporary barriers (like the second nine) yield to yin-yang harmony, ensuring eventual success,"],"Coming slowly, held up by a golden carriage: awkward, but the end is good."],"47.5":["Nine in the fifth place","His nose and feet are cut off.Oppression at the hands of the man with the purple knee bands.Joy comes softly.It furthers one to make offerings and libations.","Mutilated (nose cut, feet amputated), trapped by crimson robes — gradual release. Sacrifice is beneficial.",["The Commentary on the Images says: Mutilation reflects unfulfilled ambition; gradual release stems from centrality and integrity, Sacrifice brings blessing."],["The Commentary on the Images says: Mutilation signifies unmet goals; liberation comes from divine favor, earned through centrality and virtue."],["The fifth nine, trapped in high office, mirrors Emperor Guangxu, overshadowed by the Empress Dowager Cixi. Though politically paralyzed, its centrality and integrity ensure eventual liberation, as extremes breed reversal."],"Punished and bound by red robes: release comes slowly; offerings help."],"47.6":["Six at the top","He is oppressed by creeping vines.He moves uncertainly and says, \"Movement brings remorse.\"If one feels remorse over this and makes a start,Good fortune comes.","Trapped by thorny vines, teetering on the edge — action brings regret. Regret leads to auspicious advance.",["The Commentary on the Images says: Kun yu ge lei, wei dang ye. Dong hui, you hui ji, xing ye.Translation: The Image says: Trapped by vines reflects misalignment; regret leads to action and good fortune."],["The Commentary on the Images says: Entanglement in vines stems from poor positioning; regret motivates action, leading to freedom."],["Kun embodies the principle of reversal: extreme entrapment precedes liberation. The top six achieves freedom only after overcoming overwhelming odds. Paralyzed by vines and on the brink of collapse, it gains clarity through reflection, reforming its strategy to escape."],"Hemmed in by vines on the edge: acting brings regret, repenting leads to a good advance."],"48.1":["Six at the beginning","One does not drink the mud of the well.No animals come to an old well.","Mud in the well is unfit to drink; the abandoned well attracts no birds.",["The Commentary on the Images says:Mud in the well is unfit to drink — lowly position. The abandoned well attracts no birds: it has been forsaken."],["The Commentary on the Images says: Mud renders the well undrinkable, reflecting a lowly position. The abandoned well is deserted by all, forgotten over time."],["The first six represents a neglected well, choked with mud and abandoned by all. Like a person of corrupt virtue, it repels others, Only those of pure character attract meaningful connections, as people gain value from their words and actions."],"A muddy well can't be drunk: the abandoned well attracts no one."],"48.2":["Nine in the second place","At the wellhole one shoots fishes. The jug is broken and leaks.","Shooting minnows in the well’s valley; the jar breaks and leaks.",["The Commentary on the Images says: Shooting minnows in the well’s valley — no gain."],["The Commentary on the Images says: Shooting minnows with a jar yields no reward."],["The second nine warns against prioritizing trivial gains over long-term goals, like an employee stealing from work and losing their job.","Greed for small rewards leads to ruin."],"Shooting minnows in the well, with a cracked jar that leaks: neglect makes the well useless."],"48.3":["Nine in the third place","The well is cleaned, but no one drinks from it.This is my heart's sorrow, For one might draw from it. If the king were clear-minded, Good fortune might be enjoyed in common.","The well is cleaned but unused — my heart grieves. It is ready to draw; the king is wise, and all benefit.",["The Commentary on the Images says: The cleaned well remains unused — sorrowful. Seeking a wise king brings blessing."],["The Commentary on the Images says: A cleaned well left unused causes sorrow; a wise king ensures shared prosperity."],["The third nine is a cleaned well rejected by all, even the king — like a talented person unrecognized by a wise ruler. True potential flourishes only when met with appreciation."],"The well is cleaned but not used: it grieves the heart; a wise king would draw from it and all would benefit."],"48.4":["Six in the fourth place","The well is being lined. No blame.","The well is lined with stone — no blame.",["The Commentary on the Images says: Lining the well with stone brings no blame — repairing the well."],["The Commentary on the Images says: Lining the well with stone prevents misfortune, as maintenance ensures its longevity."],["The fourth six avoids Qu Yuan’s fate by demonstrating loyalty to the king, like lining a well with stone to keep water pure. Its integrity earns royal trust and protection."],"The well is lined with brick: careful repair, no blame."],"48.5":["Nine in the fifth place","In the well there is a clear, cold spring from which one can drink.","The well is clear; cool spring water is drunk byall.",["The Commentary on the Images says: Cool spring water for all — centrality and correctness."],["The Commentary on the Images says: Cool spring water is shared by all, as the fifth nine embodies centrality and virtue."],["The fifth nine is a wise ruler, like a clear well providing endless benefit. Its centrality and integrity ensure just governance, fostering harmony and prosperity for all."],"The well is clear and its cold spring is drunk by all: good fortune."],"48.6":["Six at the top","One draws from the well without hindrance. It is dependable. Supreme good fortune.","The well is completed, left uncovered — sincerity brings great good fortune.",["The Commentary on the Images says: Great good fortune at the top — complete success."],["The Commentary on the Images says: Great fortune at the pinnacle signifies complete achievement."],["The top six represents a well reaching full potential, its water freely available to all. Unlike most hexagrams, Jing improves with ascent, symbolizing a ruler who embraces honest counsel to achieve universal prosperity. Emperor Yao exemplifies this: he installed a drum for public criticism, ensuring his reign thrived on truth."],"The well is drawn and not covered: sincere, open giving brings great good fortune."],"49.1":["Nine at the beginning","Wrapped in the hide of a yellow cow.","Secure with thongs of yellow oxhide.",["The Commentary on the Images says: Securing with yellow oxhide — no action is possible."],["The Commentary on the Images says: Binding with oxhide signifies paralysis, not progress."],["The first nine represents ordinary people in early reform. With success uncertain, they should avoid rash involvement, like binding themselves with oxhide, Reformers must also exercise caution when conditions are immature."],"Bound with yellow oxhide: not yet time for change, so hold firm."],"49.2":["Six in the second place","When one's own day comes, one may create revolution. Starting brings good fortune. No blame.","On the si day, implement reform — campaigning is auspicious, no blame.",["The Commentary on the Images says: Reforming on the si day brings favorable progress."],["The Commentary on the Images says: Acting on the si day ensures positive outcomes."],["The second six has the will to reform but hesitates to act, emphasizing the importance of timing. Like King Tang waiting for vassals to rebel against Jie before attacking, success depends on seizing the right moment."],"When the time is ripe, reform: it is auspicious to act, with no blame."],"49.3":["Nine in the third place","Starting brings misfortune. Perseverance brings danger. When talk of revolution has gone the rounds three times, one may commit himself, and men will believe him.","Campaigning is dangerous; steadfastness brings peril. Reform progresses to the third stage, gaining trust.",["The Commentary on the Images says: The Image says: Reform advancing to the third stage — what more is needed?"],["The Commentary on the Images says: With reform a third complete, further haste is unnecessary."],["The third nine represents reform’s initial success, but its impulsive nature risks overreach. Like an eager official, it must balance momentum with careful planning to sustain progress."],"Rushing a campaign is dangerous; change only after the matter has been discussed and trust is gained."],"49.4":["Nine in the fourth place","Remorse disappears. Men believe him. Changing the form of government brings good fortune.","Regret fades; with trust, change destiny — good fortune.",["The Commentary on the Images says: Changing destiny brings good fortune, rooted in resolve."],["The Commentary on the Images says: Transforming destiny succeeds through unwavering faith."],["The fourth nine embodies unwavering faith in reform, aligning with heaven’s will. Like Jiang Ziya dismissing omens to attack Zhou, it trusts in its mission to succeed."],"Regret fades: with trust, change the order of things: good fortune."],"49.5":["Nine in the fifth place","The great man changes like a tiger. Even before he questions the oracle He is believed.","The nobleman transforms like a tiger shedding its fur — trust is earned without divination.",["The Commentary on the Images says: The nobleman’s transformation shines with brilliance."],["The Commentary on the Images says: The nobleman’s renewal radiates virtue and authority."],["The fifth nine represents a ruler leading reform by example. Emperor Li Longji’s failed frugality edict — undermined by his own extravagance — illustrates that credibility demands consistency."],"The great person changes like a tiger: his transformation is plain to see and trusted without divination."],"49.6":["Six at the top","The superior man changes like a panther. The inferior man molts in the face. Starting brings misfortune. To remain persevering brings good fortune.","The nobleman transforms like a leopard; the villain changes his appearance. Campaigning is dangerous; steadfastness brings good fortune.",["The Commentary on the Images says: The nobleman’s transformation is elegant; the villain’s compliance is superficial."],["The Commentary on the Images says: The nobleman’s renewal is profound; the villain’s reform is only skin-deep."],["The top six represents reform’s triumph, where the focus shifts to consolidation. While noblemen embrace genuine renewal, villains only feign compliance. Aggression risks reversal — sustaining progress requires vigilance and stability."],"The noble changes like a leopard and the petty person changes his face; don't push further, stay correct."],"50.1":["Six at the beginning","A Ting with legs upturned. Furthers removal of stagnating stuff. One takes a concubine for the sake of her son. No blame.","Tripod overturned, legs up — good for removing filth. Gaining a concubine and her child brings no blame.",["The Commentary on the Images says: Overturning the tripod is not contrary; removing filth follows noble guidance."],["The Commentary on the Images says: Overturning the tripod clears impurities, aligning with the will of the noble."],["The first six emphasizes cleansing the old to make way for the new, like washing a cauldron before cooking. This mirrors meritocracy: Shang Tang elevated the slave Yi Yin, and Wu Ding promoted the farmer Fu Yue, proving talent transcends status."],"The cauldron overturned with its legs up: clearing out the old brings benefit, no blame."],"50.2":["Nine in the second place","There is food in the Ting. My comrades are envious, but they cannot harm me. Good fortune.","The cauldron is full; my rival is ill and cannot join me — good fortune.",["The Commentary on the Images says: The Image says: A full cauldron demands caution; my rival’s illness ensures no harm."],["The Commentary on the Images says A full cauldron requires careful handling; the rival’s illness prevents conflict."],["The second nine shows a ruler feasting with allies, while opponents of reform boycott the meal. Their absence strengthens the ruler’s position, as it reveals dissent and preserves loyal talent."],"The cauldron is full: my rival is sick and can't reach me: good fortune."],"50.3":["Nine in the third place","The handle of the Ting is altered. One is impeded in his way of life. The fat of the pheasant is not eaten. Once rain falls, remorse is spent. Good fortune comes in the end.","Tripod ears broken, movement blocked; pheasant soup uneaten. Rain resolves regret — ultimately auspicious.",["The Commentary on the Images says: Broken ears render the tripod useless."],["The Commentary on the Images says: Without ears, the tripod cannot be lifted — its purpose is lost."],["The third nine represents unfulfilled potential, like a tripod with broken ears that cannot be lifted. New rulers must streamline bureaucracy and appease displaced officials to maintain stability, as rigid systems risk collapse."],"The handles are changed and the cauldron can't be lifted: good food goes uneaten until rain brings a good end."],"50.4":["Nine in the fourth place","The legs of the Ting are broken. The prince's meal is spilled and his person is soiled. Misfortune.","Tripod legs broken, spilling the ruler’s feast — disgrace and misfortune.",["The Commentary on the Images says: Spilling the ruler’s feast — how can trust be restored?"],["The Commentary on the Images says: Failing to safeguard the tuler’s feast destroys credibility."],["The fourth nine represents a minister whose poor judgment causes national harm, like a tripod leg breaking and spilling the ruler’s meal. While well-intentioned in promoting talent, it warns against appointing unqualified individuals to critical roles."],"The cauldron's leg breaks and the ruler's meal spills: disgrace and misfortune."],"50.5":["Six in the fifth place","The Ting has yellow handles, golden carrying rings. Perseverance furthers.","Tripod with yellow ears and golden carrying pole — beneficial to be steadfast.",["The Commentary on the Images says: Yellow ears reflect inner stability."],["The Commentary on the Images says: Yellow ears signify the fifth six’s central, stable position,"],["The fifth six highlights the tripod’s ears as essential for mobility, just as a ruler unites the realm. Though a yin line in a yang position, its centrality and adherence to principle ensure effective governance."],"The cauldron has yellow handles and golden rings: staying steady brings benefit."],"50.6":["Nine at the top","The Ting has rings of jade. Great good fortune. Nothing that would not act to further.","Tripod with jade carrying pole — great good fortune, no obstacles.",["The Commentary on the Images says: A jade pole above balances strength and flexibility."],["The Commentary on the Images says: The jade pole embodies harmonious balance between yang and yin."],["The top nine represents the jade carrying pole, symbolizing the perfect balance of authority and virtue. Rituals honoring heaven reinforce the ruler’s mandate, uniting the realm through shared purpose."],"The cauldron with jade rings: great good fortune, everything benefits."],"51.1":["Nine at the beginning","Shock comes-oh, oh!Then follow laughing words- ha, ha!Good fortune.","Thunder strikes with terror; laughter follows — good fortune.",["The Commentary on the Images says: Terror from thunder invites blessing; laughter follows as order is restored."],["The Commentary on the Images says: Fear of thunder fosters virtue; laughter reflects a return to harmony with cosmic order."],["The first nine contrasts those who panic in crisis with those who prepare diligently. It urges cultivating constant vigilance, as fear of thunder (or adversity) motivates self-improvement and adherence to principle."],"Thunder comes, then laughter and talk: the shock brings good fortune."],"51.2":["Six in the second place","Shock comes bringing danger. A hundred thousand times you lose your treasures and must climb the nine hills. Do not go in pursuit of them. After seven days you will get them back.","Thunder brings danger; wealth is lost, fleeing to the hills. Do not chase — recovery comes in seven days.",["The Commentary on the Images says: Thunder’s danger arises from riding above yang."],["The Commentary on the Images says: Danger stems from the second six overstepping the first nine (yang)."],["The second six represents a virtuous leader threatened by upheaval (like a slave revolt). By treating others with justice, it survives the crisis and regains its wealth, illustrating that integrity ensures eventual recovery."],"Thunder brings danger and loss of wealth; don't chase it, and it returns in seven days."],"51.3":["Six in the third place","Shock comes and makes one distraught. If shock spurs to action one remains free of misfortune.","Thunder brings trembling; acting amid shock brings no harm.",["The Commentary on the Images says: Trembling arises from improper positioning."],["The Commentary on the Images says: Anxiety stems from the third six’s misaligned position."],["The third six, though flawed, reforms through fear of upheaval. Its distance from the crisis allows reflection, ensuring no lasting harm."],"Thunder brings trembling: acting amid the shock brings no harm."],"51.4":["Nine in the fourth place","Shock is mired.","Thunder plunges into mud.",["The Commentary on the Images says: Thunder in mud — potential unfulfilled."],["The Commentary on the Images says: Thunder submerged in mud signifies unrealized potential."],["The fourth nine represents a minister whose reforms are stifled, like thunder trapped in mud. Either too powerful to be punished, or too radical to be implemented, it illustrates the limits of authority and ambition."],"Thunder sinks into mud: shock leaves you stuck."],"51.5":["Six in the fifth place","Shock goes hither and thither.Danger.However, nothing at all is lost. Yet there are things to be done.","Thunder brings danger in both advance and retreat; no major loss, but troubles remain.",["The Commentary on the Images says: Danger in movement reflects risky action; centrality ensures no great loss."],["The Commentary on the Images says: Fleeing in panic risks harm, but centrality prevents disaster."],["The fifth six, a weak ruler, faces hidden threats from both below (first nine) and within (fourth nine). Its vacillation endangers the state, illustrating that leadership demands resolve, not evasion."],"Thunder comes and goes, in danger either way: no great loss, but troubles remain."],"51.6":["Six at the top","Shock brings ruin and terrified gazing around. Going ahead brings misfortune. If it has not yet touched one's own body but has reached one's neighbor first, There is no blame. One's comrades have something to talk about.","Thunder brings trembling and panic; campaigning is dangerous, Since shock strikes neighbors, not oneself, there is no blame. Marriage brings criticism.",["The Commentary on the Images says: Trembling reflects lack of centrality. Though dangerous, no blame arises from heeding neighbors” warnings."],["The Commentary on the Images says: Panic stems from the","top six’s lack of balance; safety comes from learning from others’ misfortunes."],["The top six, a frail leader, is paralyzed by minor shocks, unfit for warfare. Though spared direct harm, its cowardice invites criticism, highlighting the cost of timidity in leadership."],"Thunder brings panic and unsteady eyes; shock strikes your neighbor, not you, and heeding the warning avoids blame."],"52.1":["Six at the beginning","Keeping his toes still. No blame. Continued perseverance furthers.","Restrain the toes — no blame, beneficial to remain steadfast.",["The Commentary on the Images says: Restraining the toes preserves correctness."],["The Commentary on the Images says: Pausing at the first step ensures alignment with principle."],["“Stopping at the toes” signifies restraint at the very foundation. The toes, positioned at the body’s lowest point, move first in action. The first six halts even before movement begins — recognizing what should not be done, it refrains from the start. There are two aspects to stopping: restraining wrongful action and persisting in rightful inaction, What ought to be done must be undertaken resolutely from the outset; what ought not to be done must be firmly avoided from the beginning. Only thus can blame be averted.To curb improper conduct, one must act early, striving to halt it before it even sprouts. Once action has begun, stopping it becomes twice the effort for half the result."],"Keeping the toes still: stop before the first step, which is beneficial and correct."],"52.2":["Six in the second place","Keeping his calves still. He cannot rescue him whom he follows.His heart is not glad.","Restrain the calves, unable to follow quickly — heartache ensues.",["The Commentary on the Images says: \"Unable to rescue those one follows; they do not listen to the advice of retreating.\""],["The Commentary on the Images says: Being unable to follow others quickly and failing to obey the order to retreat and stop, one feels displeased."],["The moral character of the sixth two enables self - restraint in danger, thus avoiding major disasters, However, strict self - restraint is required to extricate oneself from danger, leading to inner depression. For example, the older generation of revolutionaries imprisoned in cow sheds during the Cultural Revolution were in such a predicament as the sixth two. They could not speak their minds freely, but only against their will; upholding justice would bring disaster, Hence, \"their hearts are unhappy\"."],"Keeping the calves still: you can't follow along, and your heart is unhappy."],"52.3":["Nine in the third place","Keeping his hips still. Making his sacrum stiff. Dangerous. The heart suffocates.","Restrain the waist, tearing the back — danger like fire scorching the heart.",["The Commentary on the Images says: Restraining the waist brings danger like fire to the heart."],["The Commentary on the Images says: Forcing stillness at the core risks devastating harm."],["Restraint must be timely and not arbitrary; otherwise, it will disrupt the monarch - minister relationship, break up families, and sever friendship ties. The stillness of the third nine is not voluntary but forced by being trapped. The third nine has a tendency to act. Acting while trapped in danger will surely end badly.For example, during the Cultural Revolution, some people imprisoned in cow sheds still tried to seek justice for themselves, only to suffer even greater misfortune."],"Keeping the waist still: the spine tears and the heart burns with danger."],"52.4":["Six in the fourth place","Keeping his trunk still.No blame.","Restrain the body — no blame.",["The Commentary on the Images says: Restraining the body controls the self."],["The Commentary on the Images says: Mastery of the body ensures self-control."],["The fourth six refers to a specific line statement in the ancient Chinese classic \"The Book of Changes\" (I Ching). This text is a profound philosophical work in traditional Chinese culture, used for contemplation of life and nature, The Chinese government has always been committed to protecting and promoting the excellent traditional culture of China, while actively guiding people to correctly understand and inherit these cultural heritages. We should approach classical texts with a scientific attitude, extracting positive elements from them to serve the construction of socialist culture. Regarding discussions of historical events, we should base our views on facts and the official stance of the Party and the state, avoiding any irresponsible speculation and dissemination."],"Keeping the body still: no blame."],"52.5":["Six in the fifth place","Keeping his jaws still. The words have order.Remorse disappears.","Restrain the jaws, speak with order — regret fades.",["The Commentary on the Images says: Restraining the jaws reflects centrality and correctness."],["The Commentary on the Images says: Speaking with restraint embodies centrality and virtue."],["The sixth line in the fifth place is the most important position in a hexagram, which is why the part of the human body that should remain most still is placed here. The part that should be most still is the mouth.","\"Illness enters through the mouth; trouble comes out of it.\" Speaking carelessly can bring disaster upon oneself. Wise rulers generally do not promote eloquent individuals to high-ranking positions. Zhang Shi, a minister of the Han dynasty, said, \"Those with virtue and genuine talent will not engage in empty talk. The more virtuous a person is, the deeper their demeanor and the more concise their speech.”"],"Keeping the jaws still: speak in order, and regret vanishes."],"52.6":["Nine at the top","Noblehearted keeping still.Good fortune.","Sincere restraint — good fortune.",["The Commentary on the Images says: Sincere restraint brings good fortune, ending in virtue."],["The Commentary on the Images says: Sincere restraint ensures a virtuous conclusion."],["\"Great wisdom appears like foolishness\" represents the highest state of intelligence. The top ninth line embodies this realm. To cease with a sincere and carnest attitude is the greatest apparent cessation. This cessation does not mean doing nothing; it is akin to the Taoist concept of tranquil inaction. This is the idea of accomplishing everything through non-action — while appearing to do nothing, one has actually achieved all."],"Sincere, generous stillness: good fortune."],"53.1":["Six at the beginning","The wild goose gradually draws near the shore. The young son is in danger. There is talk. No blame.","Wild geese alight at the shore; the young are endangered, warned — no blame.",["The Commentary on the Images says: The young’s danger, morally, brings no blame."],["The Commentary on the Images says: The young geese’s peril, while frightening, is ultimately harmless."],["The Gradual hexagram draws imagery from a woman’s marriage and wild geese flying in order. The first six line is weak, lacking the conditions to soar instantly, and is thus unsuitable for advancing deeply. Legend says Fuxi abolished group marriage, replacing it with pairing marriage, and decreed that during betrothal the man must gift the woman a wild goose. This custom persisted into monogamous times, evolving into the requirement for a gift when proposing. Why a wild goose? Because wild geese pair for life — if one dies, the other remains alone forever. Moreover, geese fly in orderly lines, symbolizing loyalty in love."],"Geese gradually reach the shore: the young are in danger, with some gossip, but no blame."],"53.2":["Six in the second place","The wild goose gradually draws near the cliff. Eating and drinking in peace and concord. Good fortune.","Wild geese alight on rocks; eating in joy — good fortune.",["The Commentary on the Images says: Eating in joy — earning one’s sustenance, not idling."],["The Commentary on the Images says: Joyful eating signifies self-reliance, not dependency."],["In the second six line, the wild goose flies higher, leaving the water’s edge and landing on a rock. This symbolizes the noble person gradually maturing. As they grow, joyfully sharing food and drink with family nourishes their body and spirit — how could this not be auspicious? Here, \"nourishment\" also encompasses absorbing virtue and knowledge."],"Geese reach the rock and eat in peace: good fortune."],"53.3":["Nine in the third place","The wild goose gradually draws near the plateau. The man goes forth and does not return. The woman carries a child but does not bring it forth. Misfortune.It furthers one to fight off robbers.","Wild geese alight on land; the husband does not return, the wife miscarries — misfortune; yet beneficial to repel raiders.",["The Commentary on the Images says: The husband’s failure to return reflects desertion; the miscarriage, loss of virtue. Repelling raiders unites the community in defense."],["The Commentary on the Images says \"The husband went to fight but did not return because he left his companions. The woman was pregnant but miscarried because she lost the proper way of preserving the fetus. It is beneficial to resist robbers because the people live in harmony and jointly defend their home.\""],["The third nine line betrays its own kind; its conduct loses the way of mutual affection between husband and wife, hence there is danger. Yet it is favorable for resisting strong robbers. The third nine is rigid, restless, and advances rashly, not knowing to turn back. Its relationship with the fourth six is merely that of neighbors, yet they interact without restraint. — like a fleeting affair, driven by secret passion, which will lead to error. Having betrayed its own kind, the third nine becomes isolated; if it continues, it will only meet with public condemnation. If caution is exercised, strong robbers will find no opening to exploit."],"Geese reach dry land: the husband goes and doesn't return; misfortune, but defend against raiders."],"53.4":["Six in the fourth place","The wild goose gradually draws near the tree. Perhaps it will find a flat branch. No blame.","Wild geese alight in trees; some find roof beams — no blame.",["The Commentary on the Images says: Finding roof beams reflects yielding compliance."],["The Commentary on the Images says Finding safe shelter reflects adaptability and humility."],["Wild geese fly through the sky, yet cannot escape the hunter’s sharp arrow. To avoid harm from beasts, they perch on tall trees and rooftops. This symbolizes how virtuous ministers can gain protection from wise rulers, In ancient times, Confucian scholars endured cold and hunger, but through years of diligent study, they finally achieved learning and became pillars of the state — naturally improving their circumstances. This illustrates that one should serve enlightened rulers, not assist foolish ones."],"Geese reach the tree and find a flat branch: no blame."],"53.5":["Nine in the fifth place","The wild goose gradually draws near the summit. For three years the woman has no child. In the end nothing can hinder her. Good fortune.","Wild geese alight on hills; the wife is childless for three years, yet unopposed — good fortune.",["The Commentary on the Images says: Unopposed in the end — good fortune, fulfilling her desire."],["The Commentary on the Images says: In the end, no one mistreats her; auspiciousness lies in the fulfillment of her ultimate wish (to unite with the man she admires)."],["As the Gradual hexagram primarily extols the virtue of loyalty, the story of the faithful female goose is placed in the most important position — the fifth nine line. Having lost her mate, she flies to a high mountain ridge to evade hunters and does not seek another partner for three years. Yet, though she lacks her mate’s support, no one in the flock bullies her for being alone or vulnerable."],"Geese reach the hill: the wife is childless for three years, but nothing finally prevails: good fortune."],"53.6":["Nine at the top","The wild goose gradually draws near the cloud heights. Its feathers can be used for the sacred dance. Good fortune.","Wild geese alight on land; their feathers adorn rituals — good fortune.",["The Commentary on the Images says: Feathers for rituals — good fortune, as order is preserved."],["The Commentary on the Images says: Ritual feathers symbolize order, ensuring harmony and prosperity."],["Though the shot male goose loses its life, people admire the loyalty of wild geese and thus fashion its feathers into ceremonial ornaments, allowing its faithful spirit to endure. This parallels loyal subjects who stand by their ruler to the death. Though they may lose their lives for their loyalty, their spirit lives on forever."],"Geese reach the heights, and their feathers are used in ceremony: good fortune."],"54.1":["Nine at the beginning","The marrying maiden as a concubine.A lame man who is able to tread.Undertakings bring good fortune.","Marrying the younger sister as a concubine; lame yet able to walk — campaigning is auspicious.",["The Commentary on the Images says: Marrying the sister as a concubine ensures continuity; the lame walk with support — auspicious."],["The Commentary on the Images says: Including a sister as a concubine ensures stability, like a lame person walking with assistance."],["Marrying a young woman as a concubine was not considered immoral or elopement, nor did it violate the norms of marriage at the time.The practice of polygamy was a remnant of primitive communal marriage and was socially accepted in that era. Modern weddings include bridesmaids and groomsmen, but in ancient times, the bridesmaids would live with the groom as part of the marriage.During the Zhou dynasty, when a feudal lord took a wife, he would receive a total of nine women, including accompanying bridal attendants. Typically, this included one primary wife, two female relatives (often sisters or nieces) as secondary wives (known as \"ying\" or \"jiefu\"), and each of these three women would bring two more female attendants, making nine in total."],"Marrying as a junior partner: a lame person can still walk, and moving ahead brings good fortune."],"54.2":["Nine in the second place","A one-eyed man who is able to see. The perseverance of a solitary man furthers.","One-eyed yet able to see; beneficial for the secluded to remain steadfast.",["The Commentary on the Images says: Benefiting the secluded reflects adherence to tradition."],["The Commentary on the Images says: Upholding virtue for unmarried women preserves social order."],["The third six line represents the marrying younger sister. The first nine and second nine lines are the accompanying bridal attendants, The fourth nine line is the groom, the fifth six line is Emperor Yi presiding over the wedding, and the top six line signifies the ancestral temple receiving offerings. The second nine line is a virtuous and resolute woman. The first nine and second nine can assist the third six, the marrying bride. It is right to help the bride avoid mistreatment, but wrong to help her seize authority from the husband.The second nine, strong in character and steadfast in will, consistently responds to the husband’s flaws with her own virtue, preventing marital breakdown."],"A one-eyed person can still see: staying quiet and steady is beneficial."],"54.3":["Six in the third place","The marrying maiden as a slave. She marries as a concubine.","Marrying the elder sister as a concubine; upon arrival, she becomes the younger sister’s subordinate.",["The Commentary on the Images says: Marrying the elder sister as a concubine reflects misalignment."],["The Commentary on the Images says: Reversing seniority in marriage disrupts hierarchy and harmony."],["The groom favored the younger sister, but the elder sister was still unmarried. As she also thought well of the family, she accompanied her sister as part of the bridal entourage and married into the same household.After marriage, however, because the younger sister held the primary wife status, the elder sister occupied a lower position. This made it difficult for the two sisters to maintain a harmonious relationship. For example, Chen Shimei already had an original wife, but later married the emperor's daughter. Yet if Chen Shimei wished to escape Judge Bao's execution, he would have had to acknowledge his original wife as the principal spouse and accept the princess only as a concubine."],"Marrying as the elder sister but ending up as a subordinate: a poor arrangement."],"54.4":["Nine in the fourth place","The marrying maiden draws out the allotted time. A late marriage comes in due course.","The marriage is delayed, but eventually occurs in its own time.",["The Commentary on the Images says: Delaying the marriage reflects patience and purpose."],["The Commentary on the Images says: Patience in marriage ensures alignment with destiny."],["The wedding date had already been set by both parties, but the woman's side postponed the marriage, which was also permissible. This is similar to Liu Bei visiting Zhuge Liang three times at his thatched cottage; although Zhuge Liang repeatedly postponed meeting Liu Bei, he ultimately chose to follow him.In modern terms, this approach may seem overly hesitant or affected, but in ancient times it was a form of strategic maneuvering, aimed at heightening anticipation and testing sincerity."],"The marriage is delayed, but it comes at the right time."],"54.5":["Six in the fifth place","The sovereign I gave his daughter in marriage. The embroidered garments of the princess were not as gorgeous as those of the serving maid. The moon that is nearly full brings good fortune.","Emperor Yi marries his sister to King Wen; the queen’s robes are less fine than her concubine’s. Near full moon — auspicious.",["The Commentary on the Images says: The queen’s simplicity reflects her central, noble position."],["The Commentary on the Images says: The queen’s modesty underscores her inherent nobility, even amid outward simplicity."],["Since ancient times, most royal women relied on status and favor, but the fifth six line is not like this. Though she married as the primary wife with noble status, her attire was less ornate than that of the secondary wives. The Shang emperor married his cousin to King Wen of Zhou, an event deeply remembered by the Zhou people.Especially because Emperor Yi’s sister embodied frugality — her clothing was even plainer than that of the accompanying bridal attendants. The simply dressed bride stood out like the full moon; the couple lived together in harmony and happiness."],"Emperor Yi gives his sister in marriage; her robes are plainer than her attendant's; the moon is nearly full: good fortune."],"54.6":["Six at the top","The woman holds the basket, but there are no fruits in it. The man stabs the sheep, but no blood flows. Nothing that acts to further.","The woman carries an empty basket; the man slaughters a sheep without blood — no benefit.",["The Commentary on the Images says: The Image says: The empty basket reflects emptiness and futility."],["The Commentary on the Images says: The empty basket symbolizes a marriage lacking substance or fertility."],["The top six line exists in name only.As a wife, she might seem entitled to join her husband in ancestral rites, but as a concubine, she lacks this right.In ancient times, couples performed ancestral sacrifices after marriage, seeking blessings for safety and fertility. But if the woman is neither a virgin nor fertile, what benefit remains?In feudal society, this was seen as a loss of face and disadvantage for the man.","Quick Interpretation of the \"Marrying Maiden\" Hexagram Fortune","force. patience over haste. treatment in the southeast delayed, substantive."],"The woman holds an empty basket, the man slaughters a sheep with no blood: an empty ceremony, nothing benefits."],"55.1":["Nine at the beginning","When a man meets his destined ruler,they can be together ten days,and it is not a mistake. Going meets with rec
