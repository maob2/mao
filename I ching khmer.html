  --bg:#0f1512; --panel:#172019; --fg:#e6eee9; --muted:#9db0a6; --rule:#2a3830;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body)}
.wrap{max-width:760px;margin:0 auto;padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.eyebrow{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:30px;line-height:1.15;margin-top:6px}

footer p{margin:0}

label,.lab{font-size:13px;font-weight:600}

,["损","Sun","Decrease","Gen","Dui","110001"],["益","Yi","Increase","Xun","Zhen","100011"],["夬","Guai","Breakthrough","Dui","Qian","111110"],["姤","Gou","Coming to Meet","Qian","Xun","011111"],["萃","Cui","Gathering","Dui","Kun","000110"],["升","Sheng","Pushing Upward","Kun","Xun","011000"],["困","Kun","Oppression","Dui","Kan","010110"],["井","Jing","The Well","Kan","Xun","011010"],["革","Ge","Revolution","Dui","Li","101110"],["鼎","Ding","The Cauldron","Li","Xun","011101"],["震","Zhen","The Arousing","Zhen","Zhen","100100"],["艮","Gen","Keeping Still","Gen","Gen","001001"],["渐","Jian","Gradual Progress","Xun","Gen","001011"],["归妹","Gui Mei","The Marrying Maiden","Zhen","Dui","110100"],["丰","Feng","Abundance","Zhen","Li","101100"],["旅","Lü","The Wanderer","Li","Gen","001101"],["巽","Xun","The Gentle","Xun","Xun","011011"],["兑","Dui","The Joyous","Dui","Dui","110110"],["涣","Huan","Dispersion","Xun","Kan","010011"],["节","Jie","Limitation","Kan","Dui","110010"],["中孚","Zhong Fu","Inner Truth","Xun","Dui","110011"],["小过","Xiao Guo","Small Preponderance","Zhen","Gen","001100"],["既济","Ji Ji","After Completion","Kan","Li","101010"],["未济","Wei Ji","Before Completion","Li","Kan","010101"]],"T":{"Qian":"Heaven","Dui":"Lake","Li":"Fire","Zhen":"Thunder","Xun":"Wind","Kan":"Water","Gen":"Mountain","Kun":"Earth"},"L":{"1.1":["Nine at the beginning","Hidden dragon. Do not act.","\"First Nine\" is the name of the line. Here, \"Nine\" indicates a Yang line, and \"First\" means the bottommost. The meaning of this line statement is: Occupying a lowly position with the timing not yet ripe, one should, like a hidden dragon, refrain from displaying one's talents.",["The Commentary on the Images says: \"Hidden Dragon. Do not act.\" This is because the Yang is at the bottom.","The Commentary on the Words of the Text says: Regarding the First Nine: \"Hidden Dragon. Do not act.\" What does it mean? The Master said: \"The dragon is one who possesses virtue yet remains hidden. He does not change according to the world; he does not strive for worldly fame. Retiring from the world, he is not distressed; remaining unrecognized, he is not troubled, He acts upon what brings joy and avoids what brings sorrow. Firm and unshakable — such is the hidden dragon.\""],["The Commentary on the Images says: The reason the First Nine is \"Hidden Dragon. Do not act\" is because this Yang line's position is at the very bottom,","The Commentary on the Words of the Text says: \"Hidden Dragon. Do not act\" refers to a person who possesses the dragon's virtue yet remains hidden. Such a person does not change himself due to worldly influences, nor does he strive for worldly fame and glory. Retiring into seclusion, he is not distressed by poverty or by lacking official position and salary. He does what he is willing to do and avoids what goes against his will. Firmly holding to his aspirations without wavering — this is the hidden dragon.","Confucius elevated the meaning of the line statement to a higher philosophical level, teaching in greater detail how one should \"remain hidden.\" The dragon's virtue lies in its ability to be great or small, to bend or stretch, to hide or reveal, Here, Confucius focused on the dragon's hidden aspect. In Confucius's view, hiding is not about compromising to preserve oneself, but about finding contentment in one's own way."],["In the initial stage of Yang energy’s birth, the position is lowly and strength is weak. Everything has just begun; one must nurture one's essence and accumulate strength. It is like when one's learning and conduct are not yet accomplished, and one's words carry little weight — one must not force oneself to prominence or meddle in others' affairs, because the ability and conditions to \"raise clouds and produce rain\" are not yet present. One can only wait, lurking in the water like a dormant dragon."],"A hidden dragon: stay low and conceal your talent, because the time to act has not come."],"1.2":["Nine in the second place","Dragon appearing in the field.It furthers one to see the great man.","The dragon appears in the field. It is beneficial to meet with a great man and, through this, develop oneself.",["The Image says: \"Dragon appearing in the field\" signifies that virtue is bestowed widely.","The Commentary on the Words of the Text says: Regarding the Second","Nine: \"Dragon appearing in the field. It furthers one to see the great man.\" What does it mean? The Master said: \"The dragon is one who possesses virtue and maintains centrality and correctness. In ordinary speech, he is trustworthy; in ordinary actions, he is careful. He guards against depravity to preserve his sincerity, benefits the world without boasting, and transforms others through broad virtue. The Yi says: ‘Dragon appearing in the field. It furthers one to see the great man.' This is the virtue of a ruler.\""],["The Commentary on the Images says: \"Dragon appearing in the field\" refers to the Second Nine Yang line having reached the earth, where it can now exercise its virtue of nurturing all things.","The Commentary on the Words of the Text says: Confucius said: \"Dragon appearing in the ficld. It furthers one to see the great man.\" refers to those who possess the dragon's virtue and are able to maintain centrality and correctness. They are trustworthy in speech, cautious in action, guard against malicious slander affecting their reputation, benefit the world with virtue without contention or aggression, and transform people through broad morality. \"Dragon appearing in the field. It furthers one to see the great man\" — this is precisely the moral character of a true ruler."],["Possessing a firm and strong temperament, with sufficient ambition and boldness, yet also able to act appropriately — these constitute the qualities for success, Although one may have higher capabilities, they are not easy to bring forth. At this time, one must seize opportunities and leverage great men to develop oneself, For example, King Wen of Zhou bribed King Zhou of Shang, thereby obtaining the authority to campaign against other lords and strengthening his state's power, Another example is the four Liu Yongxing brothers in 1982, who sold their family property to raise 1,000 yuan to start a business, and 20 years later their assets reached 8.3 billion."],"The dragon appears in the field: your ability becomes visible, so seek out a great mentor."],"1.3":["Nine in the third place","All day long the superior man is creatively active.At nightfall his mind is still beset with cares.Danger. No blame.","The superior man strives tirelessly all day long. Every night he engages in deep self-reflection, maintaining a vigilant mind and examining his own mistakes, so as not to bring disaster upon himself.",["The Commentary on the Images says: \"All day long creatively active\" means repeatedly following the Dao.","The Commentary on the Words of the Text says: Regarding the Third","Nine: \"All day long the superior man is creatively active. At nightfall his mind is still beset with cares. Danger. No blame.\" What does it mean? The Master said: \"The superior man advances in virtue and cultivates his work. Loyalty and faithfulness are the means to advance virtue. Refining his words and establishing his sincerity are the means to settle his work. Knowing the point of arrival and arriving at it — he can be spoken with about subtleties, Knowing the point of ending and ending it — he can be associated with in preserving what is right. Therefore, occupying a high position, he is not arrogant; in a low position, he is not anxious, Thus, creatively active, and vigilant according to the time, though in danger he incurs no blame.\""],["The Commentary on the Images says: The Third Nine's \"all day long creatively active\" means repeatedly moving, never ceasing.","The Commentary on the Words of the Text says: What does \"All day long the superior man is creatively active. At nightfall his mind is still beset with cares. Danger. No blame.\" mean? Confucius said: The superior man elevates his moral cultivation primarily through loyalty and faithfulness; thus, his cultivation can be improved. His speech is pleasing but founded on honesty; thus, he can maintain his achievements. Knowing that an opportunity has arrived, he finds a way to obtain it; knowing that fortune has reached its end, he preserves a heart of righteousness, That is to say, he is not arrogant because of a high position, nor anxious because of a low one. Therefore, the superior man strives tirelessly, is constantly cautious and vigilant, and though in a dangerous place, incurs no disaster."],["One's undertaking is about to succeed but has not yet succeeded. It is like a dragon that has just taken flight into mid-air — it can neither rely on lofty prestige to gain respect, nor does it have a firm ground to o10 secure itself, Advancing, it cannot focus solely on flying upward; retreating, it cannot return to the ground. This is the most awkward period of being neither here nor there, It is like King Wen of Zhou just released from prison, with King Zhou of Shang above him and the feudal lords below him. If he incurred King Zhou's suspicion, great calamity would be imminent; if he aroused the dissatisfaction of the lords, there would also be danger."],"Work tirelessly by day and reflect at night; staying alert keeps danger from becoming blame."],"1.4":["Nine in the fourth place","Wavering flight over the depths.No blame.","Depending on the timing, one may leap to the Ninth Heaven or sink back into the depths; either way, there will be no calamity.",["The Commentary on the Images says: \"Wavering flight over the depths\" means advancing incurs no blame.","The Commentary on the Words of the Text says: Regarding the Fourth","Nine: \"Wavering flight over the depths. No blame.\" What does it mean? The Master said: \"Ascending and descending are not constant, but this is not for evil purposes. Advancing and retreating are not fixed, but this does not mean leaving the group. The superior man advances in virtue and cultivates his work, desiring to act in accordance with the time; therefore, there is no blame.\""],["The Commentary on the Images says: \"Wavering flight over the depths\" means that advancing (or retiring into seclusion) will incur no disaster.","The Commentary on the Words of the Text says: Confucius said: Leaping upward and retreating downward must be weighed according to the situation and handled flexibly; this does not constitute evil. Advancing and retreating are not rigidly fixed; acting this way will not separate one from the community of superior persons, The superior man improves his moral cultivation to establish achievements, always wishing not to miss the opportune moment; therefore, there is no disaster."],["Being in a place of many fears, remaining in the current position would be perilous. Only \"leaping\" and \"the depths\" are the solutions.","oll Leaping means ascending to a higher position; the depths means returning to a lower one. It is like King Wu developing into the largest feudal state of his time, with two-thirds of the Yin-Shang realm under his jurisdiction. At this point, even if he sent gifts to King Zhou, King Zhou understood that the greatest threat was King Wu. Therefore, he had only two ways out: either overthrow King Zhou, or surrender his lands and retire into seclusion to preserve himself."],"Poised to leap or to sink back: choose by timing, and either way no harm comes."],"1.5":["Nine in the fifth place","Flying dragon in the heavens.It furthers one to see the great man.","A flying dragon soars in the heavens. It is beneficial to meet with a great man.",["The Commentary on the Images says: \"Flying dragon in the heavens\" means the great man creates.","The Commentary on the Words of the Text says: Regarding the Fifth","Nine: \"Flying dragon in the heavens. It furthers one to see the great man.\" What does it mean? The Master said: \"Like sounds resonate; like energies attract. Water flows toward the moist; fire seeks the dry. Clouds follow the dragon; wind follows the tiger. When the sage emerges, all things look to him, What is rooted in heaven cleaves to the heights; what is rooted in earth cleaves to the depths — each follows its kind.\""],["The Commentary on the Images says: \"Flying dragon in the heavens\" indicates that a great man will appear and accomplish great deeds.","The Commentary on the Words of the Text says: Confucius said: Like musical notes resonate with each other; like scents attract each other (animals use scent to find mates of their own kind). On level ground, water flows towards moist areas; among combustible materials, fire burns brighter on dry objects. Clouds always follow the dragon; wind always follows the tiger. When a sage arises, all things can perceive it. Things that take heaven as their root draw close to heaven; things that take earth as their root draw close to earth — this is the principle of \"each follows its kind.\"","o12"],["This position is the most auspicious among all hexagrams, known as the \"ruler's position,\" representing the most perfect stage of development. This is the origin of the common term for emperor, \"the honored Ninth Five.\" One's virtue is high, position is high, encompassing moral character, wisdom, and status. Objective conditions are perfect; this is the time to soar to great heights and realize grand ambitions, Already a ruler, must one still meet with a great man? Beyond heaven there is heaven; beyond people there are people. Above the ruler are ancestors or individuals among the populace capable of assisting in governing the world."],"The flying dragon at the height of power: influence is at its peak, so meet great people."],"1.6":["Nine at the top","Arrogant dragon will have cause to repent.","If the dragon flies upward too high, there will be cause for regret.",["The Commentary on the Images says: \"Arrogant dragon will have cause to repent\" means fullness cannot last long.","The Commentary on the Words of the Text says: Regarding the Top Nine: \"Arrogant dragon will have cause to repent.\" What does it mean? The Master said: \"Honored yet without position; lofty yet without subjects; with worthy men in low positions but no assistance from them — therefore, acting brings regret.\""],["The Image says: \"Arrogant dragon will have cause to repent\" means that things cannot remain at their peak forever; extreme flourishing leads to decline, and the extreme of Yang gives birth to Yin.The Wenyan says: Confucius said: Honored yet without official position or authority; of high status yet without subjects; with worthy men below but unable to rise and provide assistance — therefore, if this line is moving, regretful events will occur."],["Objectively, the situation is at its peak; subjectively, one's consciousness is also full. It is time to cease advancing and retreat. If one advances without retreating, one will head toward the opposite. One must not go to extremes in anything, just as a person should not cat to overfullness, Due to Yang's nature to rise and Yin's to descend, the Top Nine cannot descend to the Fifth Nine position. It is like a ruler who has already passed the throne to the crown prince, has no power left, failed to plan a retreat, and thus begins to regret."],"The dragon that flies too high: arrogance at the summit leads to regret."],"1.7":["When all the lines are nines","There appears a flight of dragons without heads. Good fortune.","Using Nine is a unique line exclusive to the Qian hexagram, It is used only when all six lines of Qian are changing. The meaning of this line is: A group of dragons appears without a leader, yet each dragon fulfills its duty perfectly. This is very auspicious.",["The Commentary on the Images says: Using Nine — the virtue of heaven does not presume to take the lead.","The Commentary on the Words of the Text says: \"Hidden Dragon. Do not act\" — because the position is low. \"Dragon appearing in the field\" — because the time allows a dwelling. \"All day long creatively active\" — because one is engaged in affairs. \"Wavering flight over the depths\" — because one is testing oneself. \"Flying dragon in the heavens\" — because one governs from above. \"Arrogant dragon will have cause to repent\" — because exhaustion brings disaster. \"The Creative's origin, Using Nine\" — because under it the world is governed. \"Hidden Dragon. Do not act\" — because Yang energy lies hidden. \"Dragon appearing in the field\" — because under it the world becomes cultured and bright, \"All day long creatively active\" — because one acts in accord with the time, \"Wavering flight over the depths\" — because the way of the Creative undergoes change. \"Flying dragon in the heavens\" — because one is positioned in heavenly virtue, \"Arrogant dragon will have cause to repent\" — because one reaches the limit with the time. \"The Creative's origin, Using Nine” — because therein appears the celestial rule.","The Commentary on the Words of the Text says: The superior person takes the completion of virtue as his conduct, conduct that can be seen daily. \"Hidden\" means concealed and not yet visible; acting but not yet accomplished. Therefore, the superior person does not act. The superior person learns to accumulate, questions to distinguish, dwells in broad-mindedness, and acts with benevolence.","The Yi says: \"Dragon appearing in the field, It furthers one to see the great man.\" This is the ruler's virtue. The Third Nine — doubly firm but not central; above, not in heaven; below, not in the field. Therefore, creatively active, and vigilant according to the time, though in danger, no blame. The Fourth Nine — doubly firm but not central; above, not in heaven; below, not in the field; in the middle, not among men. Therefore, \"or.\" \"Or\" means to doubt, therefore no blame.","Now, the great man is he whose virtue is in harmony with heaven and earth; whose brightness is in harmony with sun and moon; whose order is in harmony with the four seasons; whose good fortune and misfortune are in harmony with the spirits and gods. Preceding heaven, heaven does not oppose him; following heaven, he accords with heaven's time. If even heaven does not oppose him, how much less do men? How much less the spirits and gods? \"Arrogant\" means knowing advancement but not retreat; knowing preservation but not ruin; knowing gain but not loss, Is it only the sage? He who knows advancement and retreat, preservation and ruin, without losing his correctness — is it only the sage?"],["Commentary on the Decision says: The virtue of firm strength does not consider itself infallible or display itself as the leader.","The Wenyan says: \"Hidden Dragon. Do not act\" is because the position is low. \"Dragon appearing in the field\" is because it is a time fitting for advancement. \"All day long creatively active\" is being engaged in tasks. \"Wavering flight over the depths\" is testing one’s own abilities. \"Flying dragon in the heavens\" is ascending to rulership and beginning to govern the state. \"Arrogant dragon will have cause to repent\" is the disaster brought by reaching a dead end.","\"The Creative's origin, Using Nine\" speaks of the most ideal method of governing the world, \"Hidden Dragon. Do not act\" is because Yang energy is in a hidden period, \"Dragon appearing in the field” is Yang energy reaching the earth, making the world cultured and bright. \"All day long creatively active\" is advancing with the times. \"Wavering flight over the depths\" is due to the transformation of the Creative way. \"Flying dragon in the heavens\" is governing the world with heavenly virtue. \"Arrogant dragon will have cause to repent\" is things reaching their extreme limit, \"The Creative's origin, Using Nine\" is the rule of the heavenly way.","ols","The Commentary on the Words of the Text says: The superior person takes the perfection of virtue as his conduct, conduct that can be manifested in daily life. \"Hidden\" means concealed and not yet revealed; one’s actions are not yet accomplished, Therefore, under such circumstances, the superior person does not exercise his function.","The superior person accumulates learning day by day, bit by bit; he questions others to resolve what he does not understand; he dwells with a tolerant heart and acts with benevolence. The Book of Changes says \"Dragon appearing in the field. It furthers one to see the great man.\" This is the morality a ruler should possess. The Third Nine line is a Yang line overlapping a Yang line, above not in the way of heaven, below not in the way of earth, Therefore, one can only strive tirelessly and be constantly cautious. Thus, though in a dangerous place, one incurs no disaster.","The Fourth Nine line's situation is the same as the Third Nine's, therefore it wavers. To waver means to doubt. Therefore, there is no blame. The great man possesses the virtue of heaven and earth, the quality of sun and moon shining upon all things, conforms to the laws of the four seasons’ changes, and understands divination to foresee good and bad fortune. In conforming to the way of heaven, he sets an example for all under heaven; he arranges his actions according to the changes of celestial timing. Heaven is in accord with his actions, how much more are men? How much more the spirits and gods?","‘What is called \"arrogant\" means knowing advancement but forgetting retreat; knowing preservation but forgetting ruin; knowing gain but forgetting loss. Only the sage, perhaps, is able to consider advancement and retreat, preservation and ruin comprehensively, and not lose his correctness."],["All hexagrams have only six line statements, but Qian uniquely has the additional \"Using Nine,\" and Kun uniquely has \"Using Six.\" \"Using Nine\" implies all six Yang lines changing to Yin, transforming Qian into Kun, \"Using Six\" implies all six Yin lines changing to Yang, transforming Kun into Qian. This expresses the idea of Qian and Kun mutually transforming into each other.","The hexagram obtained by \"Using Nine\" is neither purely Qian nor purely Kun. It is Qian, yet about to become Kun; becoming Kun, yet still essentially Qian. It is situated in the transformation between Qian and Kun, combining both firm strength and gentle softness, The firm are bold in advancing, but their flaw is being overbearing; the gentle are kind and tolerant, but their flaw is being weak and passive, Combining both yields perfection, The line statement says a flight of dragons without a leader brings good fortune — though there is no leader, each dragon fulfills its duty and handles its own affairs. This is the most enlightened method of governance for a ruler, namely Laozi's \"governing through non-action.\""],"All lines change: dragons without a head, each doing its own duty, with no single ruler; good fortune."],"2.1":["Six at the beginning","When there is hoarfrost underfoot,Solid ice is not far off.","When stepping on frost, one should realize that the days of ice formation are approaching.",["The Commentary on the Images says: \"Treading on frost, solid ice\" means Yin begins to condense, Following this path leads to solid ice.","The Commentary on the Words of the Text says: A household that accumulates good deeds will have abundant blessings; a household that accumulates evil deeds will have abundant calamities. When a minister kills his ruler or a son kills his father, it is not due to a single day's cause — it develops gradually from failure to discern and address it early. The Yi says: \"Treading on frost, solid ice is coming.\" This speaks of following a trend."],["The Image says: When stepping on frost, it signifies Yin energy begins to gather. From this, one knows the cold winter is approaching.","The Commentary on the Words of the Text says: A family that accumulates good deeds will have more blessings for its descendants; one that accumulates evil deeds will have more disasters for its descendants. When a minister kills his ruler or a son kills his father, such events are not caused in a single day but develop gradually over time due to failing to recognize and prevent this malignant trend early. The Book of Changes says \"Treading on frost, solid ice is coming,\" referring precisely to this gradual development."],["One must discern the significant from the subtle and prevent trouble before it starts. Therefore, one must be cautious and meticulous from the beginning. This is the characteristic and advantage of a gentle nature. Not only must one carefully detect subtle signs, but also predict trends from them. The insight of \"one leaf heralds autumn\" is not far-sighted enough; one should foresee autumn's frost and winter's ice already in summer. This is the wisdom of King Wen and the foresight a minister must possess."],"Frost underfoot: small early signs warn that solid ice, meaning trouble, is coming."],"2.2":["Six in the second place","Straight, square, great.Without purpose, Yet nothing remains unfurthered.","Upright, square, and magnanimous. Even without deliberate practice, nothing is unfavorable.",["The Image says: The movement of the Second Six is upright and square. \"Without practice, nothing unfavorable\" is due to the earth's way being bright.","The Commentary on the Words of the Text says: \"Straight\" refers to inner correctness; \"square\" refers to outer righteousness. The superior person uses reverence to straighten his inner self and righteousness to square his outer conduct. When reverence and righteousness are established, his virtue is not isolated. \"Straight, square, great. Without practice, nothing unfavorable\" means one does not doubt one's actions."],["The Commentary on the Images says: The movement of the Second Six is upright and square. No unfavorable outcome even without practice is due to the earth's way being vast and bright.","The Commentary on the Words of the Text says: \"Straight\" refers to inner uprightness; \"square\" refers to actions conforming to righteousness. The superior person should use reverence to maintain inner uprightness and righteousness to regulate outer conduct. Establishing reverence and righteousness ensures one is not isolated. \"Straight, square, great. Without practice, nothing unfavorable\" means with such virtue, one acts without hesitation and naturally handles matters well."],["When in a favorable position, fully utilize one's capabilities.","Moreover, be upright, square, and broad-minded. Achieving these three points and acting without inconsistency will earn the ruler's trust and the responsibility of assistance. Kun takes Qian as its master, following Qian’s lead. When Qian acts, Kun responds accordingly; no separate action is needed. This manner of conduct is optimal for Kun, leading to success everywhere."],"Straight, square, great: natural, upright virtue succeeds without deliberate effort."],"2.3":["Six in the third place","Hidden lines. One is able to remain persevering. If by chance you are in the service of a king,Seek not works, but bring to completion.","Holding virtue within allows steadfastness in the correct path. Or, serving the king's affairs, though achieving no personal glory, leads to a good outcome.",["The Image says: \"Containing adornment allows steadfastness\" means awaiting the time to act. \"Perhaps serving the king's affairs\" shows wisdom and brilliance.","The Commentary on the Words of the Text says: Though Yin possesses beauty, it contains it. Serving the king's affairs, it dares not claim success. This is the way of earth, the way of a wife, the way of a minister. Earth's way achieves nothing for itself, yet brings all things to completion."],["The Image says: \"Containing adornment allows steadfastness\" is to await the opportune moment, \"Serving the king's affairs\" is due to expansive wisdom.","The Commentary on the Words of the Text says: Gentleness is a beautiful quality. Serving the king with restraint and without ostentation, one must not claim credit arrogantly. This is the rule of earth's way, the way of a wife, the way of a minister, Earth's rule is not to display its own merit but to ensure all things reach a good end."],["With minor achievements, approaching higher levels, but the situation is unfavorable, requiring caution to avoid suspicion. When serving the king, do not overly display your talent; credit should be given to the king. If one can act without showing sharpness, not claim exclusive credit for successes, and achieve without arrogance — adopting an outwardly simple, inwardly clear manner — one can attain a good end. This is a difficult level of cultivation."],"Keep your excellence hidden: serve without seeking credit and bring the work to completion."],"2.4":["Six in the fourth place","A tied-up sack. No blame, no praise.","Tightening the mouth of a sack. There is neither disaster nor honor.",["The Image says: \"A tied sack, no blame\" means caution brings no harm.","The Commentary on the Words of the Text says: When heaven and earth change, plants flourish; when heaven and earth close, worthy people hide. The Yi says: \"A tied sack; no blame, no praise.\" This speaks of caution."],["The Image says: Tying the sack brings no disaster, for caution keeps one from harm.","The Commentary on the Words of the Text says: When heaven and earth transform, plants grow luxuriantly. When heaven and earth are closed, worthy people must retreat. The Book of Changes says \"A tied sack; no blame, no praise,\" teaching people to act cautiously in such situations."],["With heaven and earth closed, the situation is awkward, in a place of suspicion and dispute. The worthy should retreat, observing the dynamics of the times with great wisdom, withdrawing to preserve themselves and await the opportunity for service. To avoid suspicion and slander, one must be like a tied sack — speak not, act not. Only thus can calamity be avoided. Do no evil, but also do no conspicuous good. Doing no evil brings no blame; doing no conspicuous good brings no praise. Having neither fault nor honor is the way to avoid disaster."],"A tied-up sack: stay cautious and close-mouthed; you will get neither blame nor praise."],"2.5":["Six in the fifth place","A yellow lower garment brings supreme good fortune.","A yellow lower garment brings great good fortune.",["The Image says: \"A yellow lower garment brings supreme good fortune\" means culture is within.","The Commentary on the Words of the Text says: The superior person, yellow and central, penetrates principle, correct in position and embodying it. Beauty is within, flowing through the four limbs, manifesting in affairs — the height of beauty."],["The Image says: The reason \"a yellow lower garment brings great good fortune\" is that the Fifth Six possesses a gentle, cultured virtue and abides in the mean.","The Commentary on the Words of the Text says: The superior person in the Fifth Six position should, as the line indicates, maintain a moderate nature, penetrating principles, and correctly position himself in life. Inner ease allows smooth flow through the limbs; engaging in endeavors with an untroubled mind leads to supremely beautiful results."],["Positioned extremely high yet retaining a gentle nature, respectful and humble — this is an omen of great fortune. The superior person in the Fifth Six position should maintain a moderate nature. Like Zhuge Liang holding great power, supremely honored yet remaining respectful and humble to the later ruler Liu Shan, dedicating himself utterly. This spirit comes from inner loyalty. Thus, Zhuge Liang was always blessed; petty men around him repeatedly tried to harm him but could not succeed."],"The yellow lower garment: modest, central virtue brings supreme good fortune."],"2.6":["Six at the top","Dragons fight in the meadow.Their blood is black and yellow.","Battling dragons in the wilderness, with black and yellow blood staining the wilds.",["The Image says: \"Dragons fight in the wilderness\" means its way is exhausted.","The Commentary on the Words of the Text says: When Yin is doubted by Yang, conflict is inevitable. Because it seems as if Yang is absent, it is called \"dragon.\" Yet it has not left its category, so it is called \"blood.\" \"Black and yellow\" is the mixture of heaven and earth: heaven is black, earth is yellow."],["The Commentary on the Images says: \"Battling dragons in the wilderness\" is because earth's way has reached a dead end.","The Commentary on the Words of the Text says: When Yin energy is suspected by Yang energy, war is inevitable. Because all six lines are Yin, Yang suspects it has no place, hence the line mentions \"dragon.\" Since the top line is still of the Yin category, it is called \"blood.\" \"Black and yellow\" are the intermixed colors of heaven and earth: heaven is black, earth is yellow."],["When Yin energy is suspected by Yang energy, conflict is inevitable. Because all six lines are Yin, Yang suspects it has lost its place. Kun Yin has developed to its peak, contradicting its gentle, compliant nature toward Yang, striving to contend with Qian. The situation is terrible, inevitably leading to mutual damage and bloodshed everywhere. Therefore, the assistant at this time should remain lowly and quiet. When career and reputation are at their peak, be wary of conflict."],"Dragons fight in the wilds: yin overreaches its limit and both sides are wounded."],"2.7":["When all the lines are sixes","Lasting perseverance furthers.","Advantageous for eternally holding to the correct path.",["The Commentary on the Images says: \"Using Six, lasting steadfastness\" leads to a great end."],["The Commentary on the Images says: \"Using Six, lasting steadfastness\" allows the minister's way of Kun to achieve a great, good end."],["All six Yin lines change to Yang; Kun transforms into Qian. Though becoming Qian, Kun's nature remains, infused with Qian's spirit. Gentleness contains firmness, benefiting the eternal holding of Kun's way. Just as the ruler Qian should be firm but not stubborn, the assistant Kun Yin should be gentle but not blindly submissive. Qian's Using Nine is firmness capable of gentleness; Kun's Using Six is gentleness capable of firmness. Firmness and gentleness should balance. This illustrates that the minister's principle is lasting steadfastness, also the principle of a wife. Eternal loyalty leads to a great, good end. This is like the Duke of Zhou acting as regent. After King Wu's death, the teenage King Cheng succeeded. The Duke of Zhou governed in King Cheng's place, consolidating power before returning the throne to King Cheng and resuming his ministerial role — this is \"lasting steadfastness.\""],"All lines change: hold firmly to the correct path and it benefits you for the long term."],"3.1":["Nine at the beginning","Hesitation and hindrance.It furthers one to remain persevering.It furthers one to appoint helpers.","Firm as a boulder or a pillar, it is beneficial to abide by the correct path and suitable for establishing the authority of a feudal lord.",["The Commentary on the Images says: Though there is hesitation, the will and action are correct. The noble condescends to the lowly, greatly winning the people."],["The Commentary on the Images says:Though hesitant and difficult to advance, the desire to advance conforms to the correct path. Approaching the lowly with a noble position in an approachable manner will gain widespread support from the people."],["In the founding period, one must not act rashly but should hesitate before danger. It is like an employee with great ambitions working in a low-level position. For example, the Imperial Hotel in Tokyo, Japan, hired a young woman whose job was to clean toilets. Initially, she felt disgusted, but a supervisor gave her a demonstration: after patiently cleaning a toilet, he scooped a cup of water from it and drank it in one gulp. Inspired, she then cleaned toilets with utmost confidence. She later became the Minister of Posts and Telecommunications, Seiko Noda. When one is in a lowly position, as long as one harbors great aspirations, one is not base."],"Hesitation at the start: stay firm on the right path and build a base before acting."],"3.2":["Six in the second place","Difficulties pile up. Horse and wagon part. He is not a robber; He wants to woo when the time comes. The maiden is chaste, She does not pledge herself. Ten years-then she pledges herself.","The path is rugged and difficult to travel; riding a horse, one advances haltingly. It is not a bandit but a suitor coming to propose. The maiden holds fast to the correct path and does not marry. After ten years, she then marries,",["The Commentary on the Images says: The difficulty of the Second Six is due to riding on the hard, \"Ten years, then she pledges\" means returning to the norm."],["The Commentary on the Images says: The hardship of the Second Six is because it rides upon a hard (Yang) line. \"Ten years, then she pledges\" means a return to the normal course."],["Weak in strength, one is powerless during difficult beginnings. Though having high fighting spirit, one can only hesitate and waver before danger. The Second Six indicates that after clouds and rain between heaven and earth, all things grow, and people begin marriage activities. But the maiden does not marry the arriving suitor; the suitor is the powerful Fifth Nine. The central Second Six and the First Nine are childhood sweethearts. She waits for the First Nine, whom she loves, to achieve success in his career before marrying him. Thus, the key in choosing a mate lies not in wealth or status, but only in whether he is the one she desires and whether he harbors great ambitions. This insightful Second Six marries the successful First Nine ten years later."],"The way is blocked: the visitor is a suitor, not a bandit; hold to principle and wait."],"3.3":["Six in the third place","Whoever hunts deer without the forester.Only loses his way in the forest.The superior man understands the signs of the time.And prefers to desist.To go on brings humiliation.","Chasing a deer without a forest official as guide, one only gets lost in the forest. The superior man, possessing wit, would rather give up. To proceed further invites disaster.",["The Commentary on the Images says: \"He who hunts deer without the forester\" means he follows the game. \"The superior man gives it up\" means to go on leads to humiliation and exhaustion."],["The Commentary on the Images says: \"Chasing a deer without a forest official as guide\" means one can only follow the beast. \"The superior man gives it up\" is because proceeding would lead to being trapped."],["The Second Six tells a marriage story; the Third Six tells a hunting story. His nature makes him eager for advancement and greedy for gain, If he does not stop in time, it will be not only futile but also lead into difficulty. It is like a person chasing a deer into a forest — an unfamiliar forest. Without a guide and eager to get the deer, he faces the danger of getting lost. Continue the chase or give up? This person is wise; he chooses to give up. If one only wants to possess and is unwilling to let go, one will ultimately suffer the loss oneself."],"Hunting deer without a guide just gets you lost; the wise person gives up, and pressing on brings regret."],"3.4":["Six in the fourth place","Horse and wagon part. Strive for union. To go brings good fortune. Everything acts to further.","Riding a horse in circles, going forward to propose marriage. Advancement brings good fortune; there are no unfavorable consequences.",["The Commentary on the Images says: To seek and then go is enlightened."],["The Commentary on the Images says: To go for the purpose of proposing marriage is a wise choice."],["The line text says a group rides in a carriage pulled by four horses, moving slowly, the horses even circling. This is going to propose marriage, with nothing unfavorable. For example, there was a very wealthy comedy master in America, but he had no beloved. One day, riding his bicycle out, he met a girl on the street. Her beauty deeply moved the young man. He used his humorous talent to perform unique bicycle stunts. The girl was amused, and the two eventually married."],"Hold back, then advance with a partner: seeking union succeeds."],"3.5":["Nine in the fifth place","Difficulties in blessing. A little perseverance brings good fortune. Great perseverance brings misfortune.","Fifth Nine: Accumulating clouds and rain. Light rain brings good fortune; heavy rain brings misfortune.",["The Commentary on the Images says: \"Difficulties in blessing\" means bestowal is not yet bright."],["The Commentary on the Images says: \"Accumulating clouds and rain\" means the intention to bestow widely is not yet present."],["Nothing should be taken to excess, For instance, a husband loving his wife, children, and work is good, but if excessive, it produces bad consequences. Excessive love for a wife often makes her dependent; excessive spoiling of children harms their growth; excessive love for work neglects care for family. The line text mainly illustrates the harm of excessive behavior in marriage. Like ancient times when men seized brides; after seizing them, they became his property, to be wife, concubine, or slave according to the man's will."],"Blessings are held back: small steps bring good fortune, forcing big moves brings misfortune."],"3.6":["Six at the top","Horse and wagon part. Bloody tears flow.","Riding a horse with difficulty, tears of blood flow continuously, weeping like rain.",["The Commentary on the Images says: \"Bloody tears flow” — how can this last long?"],["The Commentary on the Images says: \"Weeping with bloody tears\" — how can such a situation last long?"],["The line text says the groom's party seized the bride, but the bride then ran back on the way. The groom's party came again to seize her; the bride ran again on the way, weeping tears of blood, crying like rain, The great talent the Duke of Zhou, who esteemed ritual, also sighed: How can such a marriage last long? Nowadays, many unions between men and women are not from their own wish — some are forced by parents, some due to age with no alternative, some because of premarital pregnancy necessitating marriage. May people learn from the ancient practice of bride seizure and understand that a melon twisted off by force is not sweet."],"Stranded at the end of the road: despair and tears, with no way forward."],"4.1":["Six at the beginning","To make a fool develop. It furthers one to apply discipline. The fetters should be removed. To go on in this way brings humi- liation.","In the early stage of ignorance, it is beneficial to use penal law to punish wrongdoers and remove shackles from the wrongly accused; otherwise, there will be regret and distress,",["The Commentary on the Images says: \"It is beneficial to apply punishment\" is to correct with law."],["The Commentary on the Images says: Benefiting from punishing wrongdoers is to strengthen people's concept of law."],["In this hexagram, the Second Nine is the good teacher; the Top Nine is the strict teacher, The Second Nine emphasizes having a clear purpose in teaching; the Top Nine emphasizes appropriate degree. The teaching method should be tolerant, but does not exclude severity when necessary. The hexagram contains the Fifth Six, a superior gentleman who loves learning, and also the Third Six, of poor quality and difficult to teach; also the immature and unruly First Six, and the Fourth Six who receives no teacher's instruction. One should include the ignorant rather than exclude them, helping them onto the right path. Simultaneously, combine education with punishment; severe measures are necessary at times.","The First Six is the most ignorant student, not adhering to the right path. However, being in the earliest stage of ignorance, it is highly malleable. Strict discipline yields excellent students under strict teachers. Punishment is necessary to set them on the right path. Why is using punishment beneficial in the early stage of ignorance? To make society stable and enable people to live better."],"Early ignorance needs discipline: guide with firm rules, but do not be harsh for its own sake."],"4.2":["Nine in the second place","To bear with fools in kindliness brings good fortune.To know how to take women. Brings supreme good fortune. The son is capable of taking charge of the household.","Tolerating ignorance brings good fortune. Taking a wife brings good fortune. The son can manage the household.",["The Commentary on the Images says: \"The son can manage the household\" means hard and soft connect."],["The Commentary on the Images says: The son managing the household is due to the hard and soft lines connecting."],["It is auspicious for the wise to be able to tolerate the ignorant. This line is the teacher who can tolerate ignorant students. The line text says, do not marry a woman who loses herself upon seeing a wealthy man. As the saying goes, \"comparing people, infuriates people.\" No matter how wealthy a man is, he will meet men wealthier than himself."],"Tolerate the ignorant: patient inclusiveness brings good fortune and a household that can be managed."],"4.3":["Six in the third place","Take not a maiden who, when she sees a man of bronze, Loses possession of herself. Nothing furthers.","Do not take this maiden, When she sees a wealthy man, she loses her propriety. Nothing is beneficial.",["The Commentary on the Images says: \"Take not a maiden\" because her conduct is not compliant."],["The Commentary on the Images says: Do not take this maiden because she lacks the compliant virtue of a woman."],["This line is also an ignorant student receiving instruction, but one who cannot be taught. His character is vile, insulting the good teacher Second Nine who is low in position but central, correct, firm, and bright, while currying favor with the Top Nine who, like himself, is neither central nor correct but in an extreme position. Education is not omnipotent; rotten wood cannot be carved. However, expelling from the school, abandoning without teaching, beating the drum to attack — sometimes these are special methods of instruction. The Third Six also represents a woman with many husbands. In a patriarchal society, such a woman surely has no market, In a private ownership society, whoever marries such a woman will have no good outcome."],"Do not take the woman who bends to a wealthy man; nothing good comes of it."],"4.4":["Six in the fourth place","Entangled folly brings humiliation.","Trapped in ignorance, there is regret and distress.",["The Commentary on the Images says: \"The humiliation of entangled folly\" is because it is alone and far from the solid."],["The Commentary on the Images says: The regret and distress of being trapped in ignorance is because the Fourth Six is alone and far from the solid Yang lines."],["The Fourth Six receives no instruction from an","enlightened teacher, is surrounded by ignorant and dark energy, and its own temperament is obscure, urgently needing instruction. It is like a juvenile","delinquent wandering the streets or a child who abandons studies for business, The Fourth Six is under the Gen trigram, as if pressed by a mountain, unable to escape a trapped fate. However, as the Fourth Six is in its proper place, there is no danger, only some regret and distress."],"Trapped in ignorance with no teacher: humiliation and distress."],"4.5":["Six in the fifth place","Childlike folly brings good fortune.","The ignorance of a child brings good fortune.",["The Commentary on the Images says: \"The good fortune of childlike folly\" is due to compliance and yielding."],["The Commentary on the Images says: The good fortune of childlike ignorance is because he is compliant and humble."],["In the whole hexagram, only the Second Nine and Fifth Six are auspicious. The Second Nine enlightens the multitude of ignorant — a teacher with the Dao; the Fifth Six occupies a respected position, compliant and humble — a gentleman who loves learning. The Second Nine and Fifth Six correspond correctly, an ideal teacher-student relationship, certainly auspicious. A child's ignorance is an expression of innocence. No one gets angry at a child's ignorance. Precisely because of their ignorance, children develop strong curiosity and desire for knowledge. Moreover, children are compliant and humble, listen to adults, and are important objects of adult protection. How could it not be auspicious?"],"Childlike openness to learning brings good fortune."],"4.6":["Nine at the top","In punishing folly. It does not further one To commit transgressions. The only thing that furthers Is to prevent transgressions.","Using force against ignorance is not beneficial for pursuing bandits, but beneficial for defending against bandits.",["The Commentary on the Images says: \"Beneficial for defending against bandits\" means above and below are compliant."],["The Commentary on the Images says: Beneficial for defending against bandits is because above and below are compliant."],["The two Yang lines in Meng represent two types of teachers with different teaching methods: The Second Nine can tolerate the multitude of ignorant, governing with leniency — called \"bearing with folly.\" The Top Nine, positioned high, extremely firm but not central, governs ignorance with severe measures — called \"punishing folly.\" Different teachers, different ways of handling ignorance. \"Punishing folly\" easily produces faults; one must pay attention to proportion. Appropriate severity can be taken but must not exceed limits; it should suffice to prevent the other from causing trouble. If the action is violent, striking too hard, how can it educate others?"],"Use force on ignorance only to prevent harm: defend against bandits, do not become one."],"5.1":["Nine at the beginning","Waiting in the meadow It furthers one to abide in what endures. No blame.","Wait in the suburbs; constancy brings no blame.",["The Commentary on the Images says: Waiting in the suburbs — do not rush into danger. Constancy brings no blame: you have not lost your senses,"],["The Commentary on the Images says: Waiting in the suburbs means not rushing into danger. Constancy brings no blame — you have not lost your reason,"],["Firm people easily lose reason (driven by talent, emotion, situation, gain), rushing into immature opportunities. Patience is key: e.g., Gou Jian of Yue endured hardship for 10 years to defeat Fu Chai of Wu. Even strong forces need preparation — plan thoroughly and act at the right time."],"Wait in the distant suburbs: patience far from danger leaves you free of blame."],"5.2":["Nine in the second place","Waiting on the sand. There is some gossip. The end brings good fortune.","Wait on the sand; minor verbal disputes, but auspicious in the end.",["The Commentary on the Images says: Waiting on the sand — generous and centered. Though there are minor disputes, it ends auspiciously."],["The Commentary on the Images says: Waiting on the sand (generous and centered) brings auspiciousness despite minor disputes."],["A fisherman’s life is comfortable (seafood, leisure) but has minor disputes (Xu’s inner trigram Dui means \"verbal conflict\"; Nine in the Second Place clashes with adjacent lines). Yet Dui also means \"joy,\" and Nine in the Second Place is centered — so life remains pleasant and auspicious."],"Wait on the sand: small quarrels arise, but it ends well."],"5.3":["Nine in the Third Place","Waiting in the mud.Brings about the arrival of the enemy.","Wait in the mud; this brings robbers.",["The Commentary on the Images says: Waiting in the mud — disaster is external. Bringing robbers on yourself: respect and caution prevent defeat."],["The Commentary on the Images says: Waiting in the mud (external disaster) brings robbers on yourself — respect and caution prevent defeat."],["Nine in the Third Place is like people trapped in mud while hunting — robbers steal their prey. In primitive times, people drove prey into marshes but faced theft by other groups: this shows the flaw of such hunting (and the need to yield to avoid harm)."],"Wait in the mud: danger is close and your stance invites robbers, so be careful."],"5.4":["Six in the Fourth Place","Waiting in blood.Get out of the pit.","Wait in bloodshed; escape from the cave.",["The Commentary on the Images says Waiting in bloodshed — submit and listen."],["The Commentary on the Images says: Waiting in bloodshed (submitting and listening) leads to survival."],["Trapped in danger (Kan) and injured, wait calmly in peril — submit to circumstances to survive. E.g., King Wen of Zhou, imprisoned by King Zhou of Shang, remained calm, studied the J Ching, and was released: this is extraordinary poise."],"Wait in the blood: you are in real danger, but yielding lets you escape the pit."],"5.5":["Nine in the Fifth Place","Waiting at meat and drink.Perseverance brings good fortune.","Wait amid wine and food; constancy brings auspiciousness.",["The Image says: Auspiciousness amid wine and food comes from central correctness."],["The Commentary on the Image states: Auspiciousness amid wine and food comes from the Nine in the Fifth Place (yang, centered)."],["Amid danger, few can enjoy wine and food calmly — this is the height of poise (like Yan Hui, who remained joyful in poverty, praised by Confucius). It requires great mind, courage, and wisdom."],"Wait with wine and food: calm, well-nourished waiting brings good fortune."],"5.6":["Six at the top","One falls into the pit.Three uninvited guests arrive.Honor them, and in the end there will be good fortune.","Enter the cave; three uninvited guests come — respect them, and it ends auspiciously.",["The Commentary on the Images says: Uninvited guests come — respect them, and it ends auspiciously, Though the position is improper, no great loss is incurred,"],["The Commentary on the Images says: Uninvited guests come — respect them for auspiciousness, Though Top Six’s position is improper, no great loss occurs."],["Trapped in extreme danger (Kan), Top Six waits for help. It corresponds with Nine in the Third Place who leads Nine in the Second and Initial Nine — \"three musketeers\" (chivalrous swordsmen)\"to rescue it, Though Top Six is high-ranking, it must respect the low-ranking but brave rescuers (its yin nature helps) — thus gaining aid."],"Enter the cave: three uninvited guests come; treat them with respect and it ends well."],"6.1":["Six at the beginning","If one does not perpetuate the affair, There is a little gossip. In the end, good fortune comes.","Do not persist in the matter; there is minor criticism, but auspiciousness in the end.",["The Commentary on the Images says: Do not persist in the matter — lawsuits cannot last. Though there is minor criticism, the debate clarifies [right and wrong]"],["The Commentary on the Image states: Do not persist in the lawsuit — litigation cannot endure. Though there is minor criticism, debate clarifies right and wrong."],["Lawsuits can be resolved by words; long litigation harms both sides, so rulings should be decisive. Conflicts are inevitable, but lawsuits escalate them — minor disputes can be clarified through debate."],"Do not prolong a dispute: a little criticism, but a good end."],"6.2":["Nine in the Second Place","One cannot engage in conflict; One returns home, gives way. The people of his town, Three hundred households, Remain free of guilt.","Fail in the lawsuit, return and flee; the three hundred households in his fief suffer no harm.",["The Commentary on the Images says: Failing the lawsuit, return and flee. Suing a superior from a lower position: disaster is self-invited."],["The Commentary on the Image states: Failing the lawsuit, return and hide. Suing a superior from a low position: disaster is self-inflicted."],["The situation is unfavorable: Nine in the Second Place (low position) clashes with the unbeatable Nine in the Fifth Place (high position), Nine in the Second Place will lose, so retreating from the lawsuit is wise."],"You lose the case and withdraw; the modest retreat spares your people."],"6.3":["Six in the Third Place","To nourish oneself on ancient virtue induces perseverance. Danger. In the end, good fortune comes. If by chance you are in the service of a king, Seek not works.","Live on ancestral virtue; constancy brings danger, but auspiciousness in the end. Or serve the king — no achievement.",["The Commentary on the Images says: Living on ancestral virtue — following superiors brings auspiciousness."],["The Commentary on the Image states: Living on ancestral virtue brings auspiciousness through the ancestors’ merit."],["Six in the Third Place avoids conflict, living on ancestral benefits —harmony brings auspiciousness. It corresponds with Top Nine (ancestral position). The saying \"When the cunning hares are dead, the hunting hound is boiled.\" warns against flaunting merit to superiors: \"no achievement\" can lead to \"achievement\" (a life dialectic)."],"Live on inherited virtue: danger, but a good end; serve without claiming the credit."],"6.4":["Nine in the Fourth Place","One cannot engage in conflict. One turns back and submits to fate, Changes one's attitude, And finds peace in perseverance. Good fortune.","Fail in the lawsuit, return and accept fate, change to peaceful constancy — auspicious.",["The Commentary on the Images says: Return and accept fate, change to peaceful constancy — auspicious, no loss."],["The Commentary on the Image states: Return and accept fate, become peaceful and constant — auspicious, with no loss."],["Opposite Initial Six, Nine in the Fourth Place bullies the weak (unpopular). Initial Six (yielding) defeats it with words, Nine in the Fourth Place (combative) admits moral defeat, corrects its ways, and resolves the conflict — like Li Kui in Water Margin (changing from aggressive to conciliatory).","063,"],"You lose the case, accept it, and turn to peaceful steadiness: good fortune."],"6.5":["Nine in the Fifth Place","To contend before him. Brings good fortune.","Judging lawsuits brings great auspiciousness.",["The Commentary on the Images says: Judging lawsuits brings great auspiciousness — due to central correctness."],["The Commentary on the Image states: Judging lawsuits brings great auspiciousness because the Nine in the Fifth Place (ruler’s position) upholds central correctness and impartial justice."],["Only Nine in the Fifth Place judges lawsuits (others are litigants). It is a wise judge—firm, central, impartial, resolving disputes fairly (like Bao Zheng, the \"Clear Sky\" judge admired by the people)."],"The fair judge: judging disputes justly and from the center brings great good fortune."],"6.6":["Nine at the top","Even if by chance a leather belt is bestowed on one, By the end of a morning. It will have been snatched away three times","May be granted a ceremonial belt , but have it stripped three times in a day.",["The Commentary on the Images says: Receiving attire through litigation is not worthy of respect."],["The Commentary on the Image states: Receiving official attire through litigation is unworthy of respect."],["Top Nine wins without litigation (Six in the Third Place yields) and is promoted — but this is unearned. Those who litigate excessively have bad endings: honors gained through lawsuits are disgraceful, condemned, and easily lost (e.g., a girdle stripped three times in a day). Ruin is self-inflicted."],"A ceremonial belt won in court is stripped away three times in a day; victory won't last."],"7.1":["Six at the beginning","An army must set forth in proper order. If the order is not good, misfortune threatens.","When the army sets out, it must follow discipline. Without it, there will be misfortune Initial Six: When the army deploys, strict military discipline is required; otherwise, danger will arise.",["The Commentary on the Images says: When the army sets out, it follows discipline; to lose discipline is to court misfortune."],["The Commentary on the Image states: When the army marches out, strict discipline is essential; without discipline, danger is certain."],["Discipline is the life of an army; military discipline takes precedence when deploying troops. Only a restrained army that acts in accordance with rules can be invincible. Initial Six is at the start of Hexagram Shi, representing the army’s first deployment. Unfortunately, the commander here is incompetent and fails to “lead the army with discipline.” If discipline is not enforced — if generals disobey the commander-in-chief, and soldiers disobey their generals — how can victory be achieved? However, “leading the army with discipline” is only a prerequisite for victory, not the sole condition; one cannot predict success or failure based on this alone."],"An army needs discipline from the start; without order it meets misfortune."],"7.2":["Nine in the Second Place","In the midst of the army.Good fortune. No blame.The king bestows a triple decoration.","In the midst of the army, auspicious and free from blame; the king bestows three mandates.Nine in the Second Place: While in the military camp, it is auspicious with no disaster; the ruler grants three awards.",["The Commentary on the Images says: Auspiciousness in the midst of the army comes from enjoying the favor of Heaven. The king bestows three mandates because he cares for all states."],["The Commentary on the Image states: Auspiciousness while in the military camp comes from gaining the ruler’s trust. The ruler grants three awards to pacify and win over all states ."],["As the core of the hexagram, this line symbolizes the army commander — someone fully qualified to lead, combining firmness with flexibility, and possessing both courage and strategy. Nine in the Second Place corresponds with Six in the Fifth Place (a gentle and balanced ruler), meaning the commander has the ruler’s full trust and can exert their talents. Though they hold authority over the army, they must not overstep their power, lest they arouse the ruler’s suspicion; the commander must master this balance. The ruler’s three rewards for the meritorious commander are not an encouragement of militarism, but a means to end the war quickly — a point the commander should understand,"],"The leader in the field, trusted and honored by the ruler: good fortune, no blame."],"7.3":["Six in the Third Place","Perchance the army carries corpses in the wagon. Misfortune.","The army may return with corpses in carts; misfortune. Six in the Third Place: Deploying troops may result in returning with bodies carried in carts; it is inauspicious.",["The Commentary on the Images says: The army returning with corpses in carts means great failure with no merit."],["The Commentary on the Image states: Returning from deployment with bodies in carts signifies a major defeat with no achievements."],["This symbolizes a commander who is unfit for heavy responsibility — inexperienced yet stubborn, advancing recklessly for glory despite unfavorable conditions, leading to a crushing defeat and total annihilation. Someone like Six in the Third Place is not fit to command an army. Examples include Zhao Kuo of Zhao, whose army was wiped out at Changping during the Warring States period, and Ma Su of Shu Han, who suffered a disastrous defeat at Jieting in the Three Kingdoms period — these are lessons paid for with blood."],"Divided command brings defeat: the army returns with corpses in carts."],"7.4":["Six in the Fourth Place","The army retreats. No blame.","The army withdraws leftward and encamps; there is no blame.Six in the Fourth Place: The troops retreat leftward to garrison. and defend; no disaster befalls them.",["The Commentary on the Images says: Withdrawing leftward brings no blame, for the usual principles [of warfare] are not violated."],["The Commentary on the Image states: Withdrawing leftward to garrison incurs no disaster, as Six in the Fourth Place does not depart from the usual laws of military operations."],["While Six in the Third Place advances recklessly and fails, Six in the Fourth Place retreats to preserve strength. He is in a perilous position with no reinforcements below, and the situation is unfavorable. Fortunately, he is cautious and avoids unnecessary risk, temporarily stepping back and holding his forces, thus preserving the army — far better than Six in the Third Place’s disastrous reckless advance. Warfare does not always demand victory; when success is impossible, one must know to retreat to maintain strength. Zhuge Liang lost all six campaigns to Qishan, but his clever arrangements during retreats avoided heavy casualties, so his reputation as a brilliant strategist remained intact."],"A tactical retreat to the left: withdrawing in time is no fault."],"7.5":["Six in the Fifth Place","There is game in the field. it furthers one to catch it.","There is game in the field; it is beneficial to uphold one’s cause, with no blame. The eldest son leads the army; the younger son returns with corpses in carts — even constancy brings misfortune.Six in the Fifth Place: Game is caught in the hunt; it is favorable to speak out, with no disaster. The eldest son leads troops to campaign; the younger son returns defeated with bodies in carts — even adhering to the right path leads to misfortune.",["The Commentary on the Images says: The eldest son leads the army because he acts with centered correctness. The younger son returns with corpses in carts because the appointment was inappropriate."],["The Commentary on the Image states: The eldest son commands the army because he acts in a centered and righteous manner; the younger son returns defeated because the assignment was unsuitable."],["During war, the top decision-maker must grasp two principles: first, fight a just war with a legitimate cause; second, employ people wisely. The ruler (Six in the Fifth Place) was wise when appointing Nine in the Second Place, but suddenly grew muddled — adding superfluous actions by appointing the mediocre Six in the Third Place to participate in command and divide Nine in the Second Place’s authority, driven by suspicion. Six in the Third Place disrupts the commander’s military arrangements, accomplishing nothing but causing failure, leading to a crushing defeat. This stems from the ruler’s poor appointment. For example, during the suppression of the An Lushan Rebellion, the emperor ordered Guo Ziyi to besiege the rebels, but also appointed the eunuch Yu Chao’en to control all armies, resulting in a devastating defeat of 600,000 Tang troops."],"Strike only when there is real cause and the right leader; a wrong leader brings disaster."],"7.6":["Six at the top","The great prince issues commands, Founds states, vests","The great ruler issues a mandate: establishing states and appointing households; do not employ petty people. Top Six: The Son of Heaven issues an edict, enfeoffing feudal lords and rewarding ministers; petty individuals must not be reused.",["The Commentary on the Images says: The great ruler issues a mandate to rectify merits. Do not employ petty people, for they will certainly bring chaos to the state."],["The Commentary on the Image states: The Son of Heaven issues an edict to reward those with merit; petty individuals are not reused because they will disrupt the state."],["This line concludes Hexagram Shi: the war ends, the army returns in triumph, and it is time to reward merit, Yet when bestowing rewards, special care must be taken to avoid employing petty people. Petty individuals have talent but lack virtue; even if they gain military merit, they should only be given wealth and land — not the opportunity to hold power. They are destabilizing elements; if they obtain real authority, they will seize the chance to stir up trouble. Gentlemen tend to cede credit and benefits, while petty people scramble for power and gain by any means — vigilance is needed."],"The war is won: the ruler rewards merit with states and estates, but keeps petty people out of power."],"8.1":["Six at the beginning","Hold to him in truth and loyalty; This is without blame. Truth, like a full earthen bowl: Thus in the end.Good fortune comes from without.","Connect with others with sincerity, and there will be no blame. Sincerity is like a jar full of fine wine; it will attract more people to associate with you, which is auspicious.",["The Commentary on the Images says: For Initial Six of Bi, the arrival of others brings good fortune."],["The Commentary on the Image states: Initial Six, at the bottom of the hexagram, makes many friends and receives unexpected good fortune."],["Initial Six is at the bottom of Hexagram Bi; strictly speaking, he cannot assist anyone yet, only make many friends. Since these friends, like him, are dedicated to assisting Nine in the Fifth Place, he gains unexpected good fortune. This emphasizes the importance of sincerity: for a ruler, sincerity attracts more states and tribes; for an individual, sincerity elevates academic and career achievements."],"Join others with sincerity: like a full jar of wine it draws people in; no blame."],"8.2":["Six in the Second Place","Hold to him inwardly. Perseverance brings good fortune.","Be kind to internal members and uphold the right path — this is auspicious.",["The Commentary on the Images says: Being kind to internal members ensures one does not suffer loss."],["The Commentary on the Image states: Being kind to internal members prevents one from incurring loss."],["Six in the Second Place unites the ruling class internally, upholds the right path, and dedicates himself to assisting Nine in the Fifth Place (the ruler), so he suffers no loss. Unity within is a prerequisite for great achievements. Six in the Second Place has excellent objective conditions, but will lose his advantage if he fails to uphold the right path subjectively. Ministers like Yi Yin, Lii Shang, and Zhuge Liang acted this way, achieving a harmonious ruler- minister bond."],"Bond from within: stay true to yourself and the right path, and good fortune follows."],"8.3":["Six in the Third Place","You hold together with the wrong people.","Associate with unrighteous people.",["The Commentary on the Images says: To associate with unrighteous people — how can one not be harmed?"],["The Commentary on the Image states: Associating with unrighteous people — how can you avoid harm?"],["Six in the Third Place is in a bad situation, seeking attachment but choosing the wrong person, Initial Six, Six in the Second, Third, and Fourth Places all want to attach to Nine in the Fifth Place (the only yang line). Six in the Second has a proper correspondence with Nine in the Fifth; Six in the Fourth has an attachment bond — both have favorable conditions. Initial Six has no proper correspondence or attachment, but as he is in the early stage, he incurs no blame and may even gain good fortune. Six in the Third Place is the worst: he has no correspondence or proximity to Nine in the Fifth, nor does he have a head start, Fortune or misfortune is undecided; he can only wait calmly for changes."],"You are associating with the wrong people."],"8.4":["Six in the Fourth Place","Hold to him outwardly also. Perseverance brings good fortune.","Associate with external friends; upholding the right path brings auspiciousness.",["The Commentary on the Images says: Associating with external worthies is to follow the superior."],["The Commentary on the Image states: Associating with virtuous people outside is to align with the ruler (Nine in the Fifth Place)."],["Six in the Fourth Place is beside the ruler, trusted by him, and occupies an even position as a yin line. He can interact with virtuous ministers below and jointly assist Nine in the Fifth Place, hence auspiciousness. On the basis of internal unity, one should also unite external forces — expanding the scope of \"fellowship.\" The key is to choose virtuous and wise allies; otherwise, allying with petty or improper groups will bring great harm."],"Ally with worthy people outside your circle and hold to the right path: good fortune."],"8.5":["Nine in the Fifth Place","Manifestation of holding together. In the hunt the king uses beaters on three sides only And foregoes game that runs off in front. The citizens need no warning. Good fortune.","Fellowship in the Light ; the king hunts with the \"three-sided drive\" ritual, losing the game in front. The townspeople are unafraid — this is auspicious.",["The Commentary on the Images says: The auspiciousness of open fellowship comes from the centered and correct position. Abandoning the rebellious and accepting the compliant leads to losing the game in front, The townspeople are unafraid because the superior acts with centeredness."],["The Commentary on the Image states: Open fellowship is auspicious because Nine in the Fifth Place maintains centered correctness. Abandoning rebels and accepting those who submit leads to losing the game in front; the people are unafraid because the ruler governs with centeredness and approachability."],["As the only yang line in the ruler’s position, all yin lines attach to him, He is impartial and unpartisan — called \"open fellowship,\" which is purely auspicious. For example, the king hunts by surrounding game on three sides but leaving one side open, letting the game escape. A ruler should treat attached people the same: accept those who come, let go of those who leave. The four yin lines below Nine in the Fifth Place all submit and are accepted; only Top Six (yin over yang) rebels and is let go. Cao Cao roughly did this: when Guan Yu left his service, Cao Cao initially tried to pursue and stop him, but finally let him go."],"Open, voluntary leadership: the ruler lets those who leave go, and people follow willingly; good fortune."],"8.6":["Six at the top","He finds no head for holding together.Misfortune.","Fellowship without a leader — misfortune.",["The Commentary on the Images says: Fellowship without a leader leads to no good end."],["The Commentary on the Image states: Fellowship without a leader will not end well."],["The top six lines represent someone who is arrogant and self-important, initially unwilling to associate with the ninth line (representing the ruler), hesitating and observing without sincerity. Only when everyone else has pledged allegiance to the ninth line does the top six, isolated and without support, passively seck alliance. But it is too late; the opportunity has been missed. The top six is like the peripheral forces of the Yin-Shang dynasty. After King Zhou was overthrown, these peripheral forces were not yet eliminated, and they naturally considered themselves superior to King Wu, thus refusing to assist him. The danger posed by these forces stemmed from the Duke of Zhou's eastern campaign. After King Wu's death, the Duke of Zhou became king, eliminating more than fifty vassal states and clearing out the peripheral forces of the Zhou dynasty, thus achieving true unification of the Western Zhou."],"Holding together with no leader: nothing binds the group, and it ends in misfortune."],"9.1":["Nine at the beginning","Return to the way.How could there be blame in this?Good fortune.","Return to the original right path — what blame could there be? Auspicious.",["The Commentary on the Images says: Returning to the original path is auspicious in meaning."],["The Commentary on the Image states: Returning to the original right path is auspicious in its significance."],["Initial Nine should not be impetuous; the wise choice is to return to one’s position, lie low, and wait for the opportunity. When one strays but corrects their ways and returns to the right path, it is naturally auspicious. This is like the peripheral forces of King Zhou stirring after King Wu’s death — Zhou Gong’s governance and military preparedness made some abandon dangerous plans, thus avoiding destruction."],"Return to your own right path, which is natural and free of blame: good fortune."],"9.2":["Nine in the Second Place","He allows himself to be drawn into returning. Good fortune.","Pull back [to the right path] — auspicious.",["The Commentary on the Images says: Pulling back while centered means one does not lose oneself."],["The Commentary on the Image states: Pulling back to the right path while remaining centered means one incurs no loss."],["Initial Nine and Nine in the Second Place are low in status, with immature strength; being restrained would bring danger, so they retreat to their positions together to resist accumulation. This is why both lines are auspicious. For example, after King Wu’s death, Shang remnants planned rebellion, but Ji Zi dissuaded others — after Zhou Gong’s Eastern Expedition, Ji Zi was enfeoffed with Song State, showing that leading others on the right path brings auspiciousness."],"You are drawn back to the path along with others: good fortune."],"9.3":["Nine in the Third Place","The spokes burst out of the wagon wheels. Husband and wife roll their eyes.","The cart loses its spokes; husband and wife turn against each other.",["The Commentary on the Images says Husband and wife turning against each other means the household cannot be properly governed."],["The Commentary on the Image states: Husband and wife turning against each other stems from the wife being above the husband, making the household impossible to govern properly."],["The situation is unfavorable to Nine in the Third Place; it loses dominance, and yin-yang conflict is inevitable — like a weak ruler controlled by a strong minister, leading to \"husband and wife turning against each other.\" The traitor was the ruler’s relative: Guan Shu, Zhou Gong’s brother. After Zhou Go
