s says: The danger of frequent return; morally, there is no blame."],["The Commentary on the Images says: The danger of repeated turning back is morally justified, so there is no blame."],["The second six joyfully returns to virtue, but the third six struggles to do so. Falling into vice is easy; returning to virtue is hard. Even reluctant efforts to correct course are essential — what matters is choosing the right path, not the ease of doing so."],"Returning again and again: restless and risky, but no disaster."],"24.4":["Six in the fourth place","Walking in the midst of others, One returns alone.","Turning back alone while others follow the crowd.",["The Commentary on the Images says: Returning alone in the midst of the crowd; following the path."],["The Commentary on the Images says: Turning back alone shows the courage to follow the right path."],["Most people follow the crowd, but the fourth six stands apart, choosing virtue over conformity. As the only yin line aligned with yang, it has a unique advantage: even surrounded by negativity, it can return to the light. When yang is nascent, recognize the trend, act decisively, and dare to stand alone."],"Returning alone while others follow the crowd: stay on the right path among the many."],"24.5":["Six in the fifth place","Noblehearted return. No remorse.","Returning with sincerity and depth; no regret.",["The Commentary on the Images says: Sincere return, no regret; examining oneself from the center."],["The Commentary on the Images says: Sincere return brings no regret, as the fifth six is centered and reflects on its actions."],["As a yin line in a position of honor, the fifth six is balanced, sincere, and committed to virtue. While external conditions matter, inner character is decisive. Though not directly linked to the initial nine (yang), its centeredness and self-reflection allow it to adapt to the times — choosing retreat when necessary, leaving no room for regret."],"A sincere and deep return: no regret."],"24.6":["Six at the top","Missing the return. Misfortune. Misfortune from within and without. If armies are set marching in this way, One will in the end suffer a great defeat, Disastrous for the ruler of the country. For ten years","Straying from the path of return; ominous, with disaster, Leading an army results in total defeat, endangering the ruler. No wars can be fought for a decade.",["The Commentary on the Images says: The ominousness of lost return; opposing the ruler's way."],["The Commentary on the Images says: Straying from the path of return is ominous because it violates the ruler's principles of governance."],["The top six is lost, unable to return to yang — symbolizing those who refuse to correct course, sliding deeper into error. It ignores the rising tide of yang and clings to outdated ways, like a blind man riding a blind horse at night, heading for disaster. In war, this leads to total defeat and national ruin."],"Lost on the way back: ominous, with disaster and defeat that lasts for years."],"25.1":["Nine at the beginning","Innocent behavior brings good fortune.","Free from delusion; advancing leads to good fortune.",["The Commentary on the Images says: Advancing without falsehood; aspirations are fulfilled."],["The Commentary on the Images says: Acting without delusion allows one to achieve their goals."],["As a yang line in a yang position, the initial nine is pure, free from delusion, and aligned with heaven's way — ensuring success in all actions, It symbolizes a promising start: like the man who moved the wooden pole for Shang Yang, following instructions precisely and earning a reward. Shang Yang's reforms, rooted in integrity and resolve, succeeded just as this line suggests."],"Free from scheming: advancing leads to good fortune."],"25.2":["Six in the second place","If one does not count on the harvest while plowing, nor on the use of the ground while clearing it,it furthers one to undertake something.","Gaining harvest without plowing, fertile 2u fields without clearing; advancing is beneficial.",["The Commentary on the Images says: Harvesting without plowing; not yet wealthy."],["The Commentary on the Images says: Gaining without effort reflects a lack of true prosperity."],["Gaining harvest without plowing or fertile fields without clearing seems ideal, but newly cleared land is overgrown with weeds and requires three years of cultivation to become productive. Acquiring already-tilled land thus depends on gifts or purchase. The second six signifies advancing to receive great rewards, hence \"beneficial to move forward.\""],"Reaping without plowing: do the work without expecting a reward; moving ahead benefits."],"25.3":["Six in the third place","Undeserved misfortune.The cow that was tethered by someone is the wanderer's gain, the citizen's loss.","A sudden calamity: a cow tied up is stolen by a passerby, and the villagers are wrongfully accused.",["The Commentary on the Images says: The traveler gains the cow; the villagers face disaster."],["The Commentary on the Images says: The traveler steals the cow, but the villagers suffer the consequences of false accusations."],["Calamity striking without cause is \"unexpected disaster.\" When a cow tied to a village tree is stolen by an outsider, the villagers are wrongfully accused and attacked. This teaches: to avoid misfortune, not only must one avoid wrongdoing, but also guard against being implicated by others. Ignoring problems with an \"it's not my business\" attitude will eventually lead to false accusations."],"Unexpected misfortune: a tied-up ox is stolen by a passerby and the villagers are blamed."],"25.4":["Nine in the fourth place","He who can be persevering remains without blame.","Maintaining the right path brings no disaster.",["The Commentary on the Images says: Upholding integrity brings no harm; this is inherent."],["The Commentary on the Images says: Upholding integrity to avoid harm is an inherent quality of the fourth nine."],["Balancing strength with flexibility helps navigate complexity; upholding integrity and avoiding recklessness ensures safety. In this position, focus on inner virtue and accept fate, as the fourth nine conflicts with the initial nine and sits uneasily in a yin position. Yet as the top of the inner Gen trigram (mountain) and center of the upper Xun trigram (wind), it can rely on resilience and adaptability to avoid disaster."],"Keep to the right path: no blame."],"25.5":["Nine in the fifth place","Use no medicine in an illness incurred through no fault of your own. It will pass of itself.","A sudden illness requires no treatment; good fortune follows.",["The Commentary on the Images says: Medicine for an unexpected illness should not be taken lightly."],["The Commentary on the Images says: Medicine for an unexplained illness should not be used hastily."],["The fifth nine is blameless, yet faces trouble from external forces: it responds to the second six, which harbors delusions of \"gaining without effort.\" Since the fifth nine itself is free from falsehood, treating its \"illness\" (problems) with force would contradict its own integrity. Thus, remain calm and uphold the status quo — peace will follow."],"A sudden illness needs no medicine; it passes and good fortune follows."],"25.6":["Nine at the top","Innocent action brings misfortune.Nothing furthers.","Avoid delusion; action leads to misfortune, and advancing is fruitless.",["The Commentary on the Images says: Acting without falsehood leads to disaster in extremity."],["The Commentary on the Images says: The commentary says: Reckless action in extreme positions leads to ruin."],["The top nine occupies the highest, most extreme position. Here, bold action is dangerous — inaction is wiser. It resembles someone with extreme emotions, unable to maintain balance. While harmless in normal times, such recklessness invites disaster during political upheaval, where one can be singled out as an example. Interpretation of Wu Wang from Tui Bei Tu, Image 37 Wu Wang + Geng Zi (Year of the Rat) 4 = (Bre BS = a —— a [Prophecy Says] The Han River vast and boundless, no unified rule, yet succession continues.North and south undivided, Uniting in harmony. [Ode Says] Clear waters will eventually dry up, turning arms in the eighth month.No ruler reigns within the realm,Half ominous, half auspicious. [Jin Shengtan's Commentary] This image portrays the emergence of a leader, yet peace remains elusive — another era of chaos. Quick Judgment on Wu Wang Hexagram Fortune Minor misfortune. Prone to fantasies, delusions, and impractical ideas. overall ; Indiscretion invites disaster. : Selfawarenes i key Avoid gred, uphold propriety, and follow rials o prevent ‘areer accidents."],"Innocence overextended: acting now brings misfortune and nothing comes of advancing."],"26.1":["Nine at the beginning","Danger is at hand. It furthers one to desist.","There is danger; it is beneficial to stop.",["The Commentary on the Images says: Danger, beneficial to halt; avoiding disaster."],["The Commentary on the Images says: Stopping when facing danger avoids disaster."],["A talented but inexperienced person (initial nine) rushes forward without sufficient virtue or wisdom, only to be restrained by the fourth","six (yin). This warns against recklessness: advancing prematurely leads to disaster due to insufficient preparation. The initial nine must also avoid conflict with the second nine (its direct superior), or minor misfortunes will follow."],"Danger ahead: it is beneficial to stop."],"26.2":["Nine in the second place","The axletrees are taken from the wagon.","The carriage body separates from the axle.",["The Commentary on the Images says: The carriage detaches from the axle; no blame in the center."],["The Commentary on the Images says: The carriage detaches from the axle, but since the second nine is centered and not rushing, there is no blame."],["With abundant wealth, there is no need to pursue officialdom — one can enjoy life at home, People in ancient Suzhou and Hangzhou embodied this: preferring trade over office, they indulged in luxury once wealthy. The second nine, secure in status and resources, succumbs to this common desire for comfort in prosperous times."],"The carriage separates from its axle: you stop on purpose."],"26.3":["Nine in the third place","A good horse that follows others.Awareness of danger, With perseverance, furthers. Practice chariot driving and armed defense daily. It furthers one to have somewhere to go.","Fine horses gallop; upholding integrity in adversity is beneficial. Daily training in chariot defense makes advancing favorable.",["The Commentary on the Images says: Advancing brings benefit; aligning with those above."],["The Commentary on the Images says: Advancing is beneficial as the third nine aligns with the fourth six."],["In prosperous eras, some use wealth to build military power — either to conquer rivals and seize the throne (like King Wen of Zhou) or to serve the court, preparing for war or famine. Regardless of intent, such efforts earn imperial praise and support."],"Fine horses gallop: with daily training and caution, advancing is favorable."],"26.4":["Six in the fourth place","The headboard of a young bull. Great good fortune.","A calf fitted with a yoke to prevent goring; great good fortune.",["The Commentary on the Images says: The fourth six brings supreme auspiciousness; there is joy."],["The Commentary on the Images says: The fourth six brings great good fortune, as there is cause for joy."],["A young calf with new horns tends to gore; ancient farmers fixed a wooden yoke to its horns, connected by a rope through its nose. When the calf charges, the rope pulls its nose, causing pain and teaching it to stop. Good habits, like taming a calf, require gradual cultivation through policies that reward virtue and punish vice."],"A headboard on the young bull: restraining early brings great good fortune."],"26.5":["Six in the fifth place","The tusk of a gelded boar.Good fortune.","A castrated boar's teeth no longer harm; auspicious.",["The Commentary on the Images says: The fifth six's auspiciousness; there is celebration."],["The Commentary on the Images says: The fifth six's good fortune is cause for celebration."],["Castration, an ancient livestock practice still used today, removes a boar's aggression while leaving its teeth intact. The second nine's violence resembles a wild boar — treating symptoms (teeth) is useless; addressing the root cause (aggression) is essential. The fifth six, gentle yet authoritative, restrains the second nine with flexibility, ensuring good fortune."],"The tusk of a gelded boar: removing the source of danger brings good fortune."],"26.6":["Nine at the top","One attains the way of heaven. Success.","The heavenly path is clear and open; success.",["The Commentary on the Images says: The heavenly road open and unobstructed; the path is fully realized."],["The Commentary on the Images says: The open heavenly path signifies the full realization of the way of accumulation."],["The hexagram uses animal husbandry to illustrate restraining and nurturing the yang lines: the initial nine is a goring calf (needing protection), the second nine is a biting boar (needing taming), and the third nine is a trained horse (ready to run), The top nine thus removes all restraints, letting the \"fine horse\" (third nine) gallop freely — signifying the full fruition of accumulation."],"The heavenly road is open: long restraint is released into success."],"27.1":["Nine at the beginning","You let your magic tortoise go, and look at me with the corners of your mouth drooping. Misfortune.","Cast aside your divine turtle (symbol of inner peace) and gaze at my gluttony — ominous,",["The Commentary on the Images says: Watching my greedy eating; this is not worthy."],["The Commentary on the Images says: Staring at my gluttony is an unworthy act."],["The divine turtle symbolizes longevity and the ability to survive without food, inspiring the ancient \"turtle breathing\" technique for immortality. The initial nine, a practitioner of this art, abandons his peaceful life to chase fame and wealth, lured by others’ indulgence — leading to disaster."],"You cast aside your own divine turtle and envy my food: giving up your inner worth is ominous."],"27.2":["Six in the second place","Turning to the summit for nourishment, deviating from the path to seek nourishment from the hill. Continuing to do this brings misfortune.","Reclining to eat, violating the principles of nourishment, and dining by a mound — military campaigns bring disaster.",["The Commentary on the Images says: The second six's campaign brings danger; his actions alienate allies."],["The Commentary on the Images says: The second six's campaign leads to disaster, as his actions isolate him from others."],["The second six, wealthy and indulgent, grows fat and lazy from overeating, Rich people often crave more even after fullness, leading to practices like taking emetics to eat again. Such excess and inactivity weaken health, ensuring defeat in times of conflict."],"Looking down for nourishment, against the proper order: a campaign brings disaster."],"27.3":["Six in the third place","Turning away from nourishment. Perseverance brings misfortune. Do not act thus for ten years. Nothing serves to further.","Contradicting the principles of nourishment, even integrity brings danger; ten years of uselessness, no gain,",["The Commentary on the Images says: Ten years of inaction; this is a great violation of the path."],["The Commentary on the Images says: Ten years of inaction result from a fundamental violation of the way of nourishment."],["The third six neglects proper nourishment, ruining his health so thoroughly that even a decade of recovery is insufficient. The Song Dynasty scholar Shao Yong, despite his fame, refused official office: though he avoided indulgence, his intense scholarly work left him too weak to serve — so he declined the emperor's offer."],"Rejecting proper nourishment: even correctness brings danger; ten years of nothing gained."],"27.4":["Six in the fourth place","Turning to the summit for provision of nourishment brings good fortune. Spying about with sharp eyes like a tiger with insatiable craving.No blame.","Reclining to eat brings good fortune; eyeing desires like a tiger and pursuing them relentlessly causes no harm,",["The Commentary on the Images says: The auspiciousness of upside-down nourishment; grace from above."],["The Commentary on the Images says: The good fortune of reclining to cat comes from the fifth six's generous benevolence."],["The fourth six indulges in pleasure without consequence, as his greed reassures the ruler (fifth six) of his loyalty, Like Qin Dynasty general Wang Jian, who demanded land and beauties from the emperor to prove he had no ambition for the throne, his desires protect him from suspicion."],"Seeking nourishment from below with fierce focus: good fortune and no blame."],"27.5":["Six in the fifth place","Turning away from the path. To remain persevering brings good fortune. One should not cross the great water.","Contradicting the principles of nourishment, but upholding integrity at home brings good fortune; do not cross great rivers.",["The Commentary on the Images says: The auspiciousness of upholding integrity at home; yielding to those above."],["The Commentary on the Images says: Upholding integrity at home brings good fortune by yielding to the wise top nine."],["The fifth six holds the throne but lacks real power, which rests with the retired ruler (top nine). He must uphold integrity and avoid bold action — like Emperor Wu of Han, who initially deferred to his grandmother Empress Dowager Dou (a Taoist adherent) before implementing his \"active governance\" reforms after her death."],"Breaking convention but staying at home with integrity brings good fortune; do not cross great rivers."],"27.6":["Nine at the top","The source of nourishment. Awareness of danger brings good fortune. It furthers one to cross the great water.","Achieving true nourishment, with apparent danger leading to good fortune; crossing great rivers is favorable.",["The Commentary on the Images says: Nourishment attained, apparent danger but auspiciousness; great celebration."],["The Commentary on the Images says: Achieving nourishment, with apparent danger leading to good fortune, brings great joy."],["The top nine represents the pinnacle of nourishment, capable of sustaining both self and others. Having accumulated sufficient vitality, it transforms weakness into strength, embodying the perfect balance of self-care and benevolence. This is the ultimate state of well-being. While overcoming obstacles is now possible, remain vigilant to avoid last-minute failure."],"The source of nourishment for all: danger turns to good fortune; crossing great rivers is favorable."],"28.1":["Six at the beginning","To spread white rushes underneath. No blame.","Offering sacrifices on a bed of white thatch; no disaster.",["The Commentary on the Images says: Using white thatch as ‘a mat; the yielding is below."],["The Commentary on the Images says: Using white thatch as a mat shows the yielding line in a subordinate position."],["Cleaning the altar and placing offerings on white thatch demonstrates profound reverence, avoiding misfortune. This mirrors the saying, \"A small gift carries great affection\" — sincerity in gesture outweighs material value."],"Offerings laid on white thatch: extreme care at the start; no blame."],"28.2":["Nine in the second place","A dry poplar sprouts at the root.An older man takes a young wife. Everything furthers.","A withered willow sprouts new growth; an old man marries a young girl — no adversity.",["The Commentary on the Images says: An old man marries a young girl; excess brings union."],["The Commentary on the Images says: An old man marrying a young girl shows the second nine (excessive yang) harmonizing with the initial six (yielding yin)."],["A withered willow sprouting new growth and an old man marrying a young girl symbolize balancing excessive yang with yin. This unconventional union corrects imbalance, showing that extraordinary measures are needed to rectify \"Great Excess.\""],"A withered willow sprouts: an old man marries a young woman; renewal, no adversity."],"28.3":["Nine in the third place","The ridgepole sags to the breaking point. Misfortune.","The ridgepole bends; ominous.",["The Commentary on the Images says: The ominous bending of the ridgepole; no support is possible."],["The Commentary on the Images says: The ridgepole bends ominously because it lacks proper support."],["Unlike the second nine, which gains support from the initial six, the third nine (yang in a yang position) lacks balance, risking collapse. The key to safety lies in blending strength with flexibility: while yang people are decisive, excess leads to recklessness, and yin's caution and tolerance provide the necessary counterbalance."],"The ridgepole sags: too much load, ominous."],"28.4":["Nine in the fourth place","The ridgepole is braced. Good fortune.If there are ulterior motives, it is humiliating.","The ridgepole rises; auspicious, yet other difficulties arise.",["The Commentary on the Images says: The auspicious rising of the ridgepole; it does not bend downward."],["The Commentary on the Images says: The ridgepole rising is auspicious because it does not bend downward."],["The fourth nine is like a damp ridgepole, bent by its connection to the initial six (a \"woman's betrayal\"), Yet since it is in the upper trigram, it bends upward — preventing the roof from collapsing, hence auspicious. Still, the dampness (symbolizing moral compromise) brings lingering anxiety."],"The ridgepole is propped up: good fortune, though other difficulties arise."],"28.5":["Nine in the fifth place","A withered poplar puts forth flowers. An older woman takes a husband.No blame. No praise.","A withered willow blooms; an old woman marries a young man — no blame, no praise.",["The Commentary on the Images says: A withered willow blooms; how long can it last? An old woman marrying a young man is also shameful."],["The Commentary on the Images says: A withered willow blooming cannot last; an old woman marrying a young man is a source of shame."],["The fifth nine (a young man) marries the top six (an old woman) out of necessity. While an extraordinary act in crisis, this union is fleeting and fruitless — mere form without substance, like a withered willow blooming briefly."],"A withered willow blooms: an old woman marries a young man; a brief flowering, no blame and no praise."],"28.6":["Six at the top","One must go through the water.It goes over one's head. Misfortune. No blame.","Wading too deep and being submerged; ominous, but no blame.",["The Commentary on the Images says: The ominous danger of crossing too deep; no blame is justified."],["The Commentary on the Images says: The danger of wading too deep is unavoidable, so no blame is warranted."],["The top six, the last remaining yin, is overwhelmed by the four yang lines below, facing certain destruction. This is not due to personal failure but inevitable fate — like Bi Gan, who sacrificed himself to admonish King Zhou of Shang; no blame can be placed on him for his noble but futile stand."],"Wading so deep that you go under: ominous, but no blame."],"29.1":["Six at the beginning","Repetition of the Abysmal. In the abyss one falls into a pit. Misfortune.","Layered danger, falling into a deep abyss — ominous.",["The Commentary on the Images says: Double Abyss, falling into a pit; losing the path leads to disaster."],["The Commentary on the Images says: Falling into layered danger results from losing the right path — disastrous."],["The initial six strays from the path, falling into a deep abyss from which escape is impossible. This disaster stems from abandoning integrity, weakness of character, and lack of support — reminding us to stay true to the right path and seek allies."],"Abyss upon abyss: falling into a deep pit is ominous."],"29.2":["Nine in the second place","The abyss is dangerous. One should strive to attain small things only.","Danger in the abyss; small requests are fulfilled.",["The Commentary on the Images says: Seeking small gains; not yet leaving the center."],["The Commentary on the Images says: Small gains are made, but one remains trapped in the abyss."],["The second nine achieves minor victories but remains trapped in the abyss, While its centered position and support from the initial six bring small gains, it cannot escape the larger crisis — reminding us that partial success does not equal safety."],"Danger in the abyss: only small requests are granted."],"29.3":["Six in the third place","Forward and backward, abyss on abyss. In danger like this, pause at first and wait, Otherwise you will fall into a pit in the abyss. Do not act in this way.","Danger in every direction, with peril lying in wait; falling into a deep abyss — do not act.",["The Commentary on the Images says: Coming and going in the abyss; ultimately fruitless."],["The Commentary on the Images says: Danger in every direction leads to ultimate failure."],["The third six is trapped in a maze of danger, unable to move forward or retreat without disaster. It must wait patiently, as haste will only worsen the crisis — reminding us to conserve strength in hopeless situations."],"Danger all around and more lying in wait: do not act."],"29.4":["Six in the fourth place","A jug of wine, a bowl of rice with it; Earthen vessels simply handed in through the window. There is certainly no blame in this.","A cup of wine and two offerings, placed in earthen jars and presented through a window — ultimately no disaster.",["The Commentary on the Images says: A cup of wine, two dishes; interaction between firm and yielding."],["The Commentary on the Images says: A cup of wine and two dishes symbolize the harmonious interaction between the fourth six (yin) and fifth nine (yang)."],["Sincere interaction and balancing strength with flexibility avert disaster — like Yu the Great, who volunteered to control the floods, working tirelessly for 13 years and earning the throne from Shun. This shows that integrity and courage are rewarded."],"A cup of wine and two bowls offered through a window: sincerity in simple form; no blame."],"29.5":["Nine in the fifth place","The abyss is not filled to overflowing, it is filled only to the rim. No blame.","The abyss does not overflow, remaining level with the bank — no disaster.",["The Commentary on the Images says: Abyss not overflowing; the center is not yet great."],["The Commentary on the Images says: The abyss does not overflow because the fifth nine (yang) at the center is not yet fully powerful.","The Commentary on the Images says: The danger is contained but not resolved — like the Shang Dynasty's decline before Tai Wu, who revived it by appointing virtuous ministers. This warns against complacency and shows that proactive leadership can prevent disaster."],[],"The abyss fills only to the rim: don't overflow; no blame."],"29.6":["Six at the top","Bound with cords and ropes,shut in between thorn- hedged prison walls:for three years one does not find the way.Misfortune.","Bound with ropes and cast into thorns, trapped for three years — ominous.",["The Commentary on the Images says: The top six loses the path; disaster lasts three years."],["The Commentary on the Images says: The top six strays from the path, facing three years of disaster."],["The top six is trapped in prison (symbolized by thorns) for three years, having violated the natural order — like water flowing upward. This shows that defying the \"way\" (dao) leads to prolonged suffering."],"Bound with ropes and thrown into thorns for three years: ominous."],"30.1":["Nine at the beginning","The footprints run crisscross.If one is seriously intent, no blame.","Acting with careful order and respect avoids disaster.",["The Commentary on the Images says: Steps in order with respect; avoiding blame."],["The Commentary on the Images says: Acting with order and respect prevents misfortune."],["The initial nine (yang in a yang position) acts rashly when first attaching to others, risking disapproval. Its saving grace is humility and respect, which prevent further mistakes — reminding us to be cautious and deferential when starting a new relationship."],"Careful, respectful first steps: you avoid blame."],"30.2":["Six in the second place","Yellow light. Supreme good fortune.","Yellow radiance (balanced virtue) brings great good fortune.",["The Commentary on the Images says: Yellow radiance brings supreme auspiciousness; attaining the middle way."],["The Commentary on the Images says: \"Yellow radiance\" brings great fortune by embodying the middle way."],["Yellow, the color of balance, symbolizes the middle way. The second six (yin in a yin position) embodies this by being gentle yet principled — attaching to others without losing integrity. This “outer flexibility, inner firmness\" is the ideal way to navigate dependence while preserving self- respect."],"Yellow radiance: balanced virtue brings great good fortune."],"30.3":["Nine in the third place","In the light of the setting sun, Men either beat the pot and sing or loudly bewail the approach of old age. Misfortune.","Light fades at dusk; failing to celebrate life leads to regret in old age — ominous.",["The Commentary on the Images says: Radiance at sunset; how long can it last?"],["The Commentary on the Images says: The sun sets, and light cannot endure forever."],["The third nine clings to power as the sun sets, refusing to retire gracefully, This leads to regret and ridicule — reminding us to accept the natural cycles of life, enjoying old age instead of clinging to past glory."],"Light fading at dusk: if you don't enjoy life while you can, you will regret it in old age."],"30.4":["Nine in the fourth place","Its coming is sudden;It flames up, dies down, is thrown away.","A sudden catastrophe brings destruction, death, and abandonment.",["The Commentary on the Images says: Sudden disaster; no escape."],["The Commentary on the Images says: A sudden disaster leaves nowhere to hide."],["The fourth nine aggressively challenges the fifth six (the ruler), bringing disaster — like Lii Bu, who betrayed every lord he served and was killed. In contrast, Liu Bei survived by being humble and patient, biding his time to build strength. This warns against overstepping in hierarchical relationships."],"A sudden blaze that burns out: destruction and abandonment."],"30.5":["Six in the fifth place","Tears in floods, sighing and lamenting. Good fortune.","Grieving deeply with tears and sighs brings good fortune.",["The Commentary on the Images says: The fifth six's auspiciousness; attached to the noble ruler."],["The Commentary on the Images says: The fifth six's fortune comes from its noble position."],["The fifth six, a compassionate ruler, grieves for societal ills — like Liu Bei, whose tears won loyalty and support. This shows that empathy and vulnerability can inspire others, turning sorrow into strength."],"Tears and sighs: honest sorrow brings good fortune."],"30.6":["Nine at the top","The king uses him to march forth and chastise. Then it is best to kill the leaders and take captive the followers. No blame.","The king campaigns successfully, defeating the enemy leader and capturing subordinates — no disaster.",["The Commentary on the Images says: The king goes to war to rectify the realm."],["The Commentary on the Images says: The king campaigns to restore order to the state."],["When most submit but some resist, the fifth six (weak) enlists the top nine (strong) to suppress dissent. By executing leaders and integrating followers, they secure loyalty — showing that a balance of force and diplomacy ensures stability."],"The king's campaign succeeds: punish the leaders, spare the followers; no blame."],"31.1":["Six at the beginning","The influence shows itself in the big toe.","Response begins at the big toc.",["The Commentary on the Images says: Influence on the big toe; intent is outward."],["The Commentary on the Images says: Responding at the big toe shows a desire to move outward."],["The hexagram uses body parts to illustrate stages of connection: the big toe represents initial, superficial attraction. This mirrors the \"sixth sense\" between people — like Zengzi, who felt his mother's call from afar due to their deep filial bond."],"Influence at the big toe: a very slight early stirring."],"31.2":["Six in the second place","The influence shows itself in the calves of the legs. Misfortune. Tarrying brings good fortune.","Response in the calf brings danger; staying at home brings good fortune.",["The Commentary on the Images says: Though ominous, peaceful dwellings bring auspiciousness; yielding avoids harm."],["The Commentary on the Images says: Despite danger, remaining at home is auspicious; yielding avoids harm."],["The calf represents eagerness to move forward, which risks appearing unrefined in courtship. The second six (yin) is advised to be patient and let the fifth nine (yang) take the initiative — true connection blossoms in its own time."],"Influence in the calf: restless moving is dangerous; staying put brings good fortune."],"31.3":["Nine in the third place","The influence shows itself in the thighs. Holds to that which follows it. To continue is humiliating.","Response in the thigh, blindly following others, leads to regret.",["The Commentary on the Images says: Influence on the thigh; unable to stay still. Intent on following others, clinging to what is low."],["The Commentary on the Images says: Response in the thigh restlessness, following others blindly and clinging to inferior impulses."],["The thigh represents blind obedience — following others without genuine feeling. The third nine (yang) rushes to connect with the top six (yin), only to be met with superficiality, reminding us that true connection cannot be forced."],"Influence in the thigh: following others blindly leads to regret."],"31.4":["Nine in the fourth place","Perseverance brings good fortune. Remorse disappears. If a man is agitated in mind, and his thoughts go hither and thither, only those friends on whom he fixes his conscious thoughts Will follow.","Upholding integrity brings good fortune and dispels regret; restless interaction, yet friends share your vision.",["The Commentary on the Images says: Upholding integrity brings auspiciousness, regret fades; no harm from response. Restless coming and going; not yet fully radiant."],["The Commentary on the Images says: Integrity prevents regret and harm; restless interaction shows the connection is not yet mature."],["The heart represents the nervous excitement of new love — secretive, yet sincere. The fourth nine (yang) and initial six (yin) share a growing connection, which, if kept virtuous, will deepen into lasting trust."],"Influence at the heart: stay steadfast; restless thoughts only attract friends who share them."],"31.5":["Nine in the fifth place","The influence shows itself in the back of the neck. No remorse.","Response in the back brings no regret.",["The Commentary on the Images says: Influence on the back; intent is shallow."],["The Commentary on the Images says: Response in the back shows the connection is superficial and unfulfilled."],["The back represents emotional detachment. The fifth nine (yang) is aloof toward the second six (yin), showing that a cold, prideful attitude leads to shallow, unfulfilling relationships."],"Influence in the back: unfelt and unforced, no regret."],"31.6":["Six at the top","The influence shows itself in the jaws, cheeks, and tongue.","Response in the cheeks, jaw, and tongue.",["The Commentary on the Images says:Influence on the cheeks, jaw, and tongue; empty flattery."],["The Commentary on the Images says: Response in the face and tongue signifies empty, flattering speech.","The mouth represents empty flattery. The top six (yin) uses words to manipulate, showing that true connection comes from the heart, not from charm. This warns against superficial relationships built on deception."],[],"Influence in the cheeks, jaw, and tongue: empty talk."],"32.1":["Six at the beginning","Seeking duration too hastily brings misfortune persistently. Nothing that would further.","Obsessively pursuing depth in commitment leads to danger; advancing is fruitless.",["The Commentary on the Images says: The danger of overly deep duration; seeking excessive depth from the start."],["The Commentary on the Images says: Danger arises from demanding too much depth too soon."],["The initial six (yin) demands immediate emotional depth in a new marriage, reflecting impatience. True duration grows gradually — rushing intimacy leads to conflict, just as rushing any goal leads to failure."],"Demanding deep commitment too early: dangerous and fruitless."],"32.2":["Nine in the second place","Remorse disappears.","No regret or remorse.",["The Commentary on the Images says: The second nine's regret fades; it endures in the middle way."],["The Commentary on the Images says: The second nine avoids regret by upholding the middle way consistently."],["The second nine (yang) balances strength with flexibility, embodying the \"middle way.\" Its centered position and alignment with the fifth six (yin) ensure stability, showing that moderation and adaptability are key to lasting success."],"Regret vanishes: balance and moderation endure."],"32.3":["Nine in the third place","He who does not give duration to his character meets with disgrace. Persistent humiliation.","Inconsistent virtue leads to humiliation; even integrity cannot avoid regret.",["The Commentary on the Images says: Failing to sustain virtue; no place to belong."],["The Commentary on the Images says: Those who lack moral consistency find no acceptance."],["The third nine (yang) is fickle, like Lii Bu — switching loyalties and earning the label \"three-surname slave.\" This warns that inconsistency in character or loyalty leads to isolation and ruin."],"Inconsistent virtue brings humiliation, and even correctness can't avoid regret."],"32.4":["Nine in the fourth place","No game in the field.","Hunting yields no birds.",["The Commentary on the Images says: Persisting in the wrong position; how can one catch birds?"],["The Commentary on the Images says: Remaining in an unsuitable position prevents success, like hunting without staying still."],["The fourth nine (yang) is restless, like a hunter who wanders too much to catch birds. This teaches that success requires focus and stillness — constant movement disrupts progress."],"Hunting in the wrong place yields no game."],"32.5":["Six in the fifth place","Giving duration to one's character through perseverance. This is good fortune for a woman, misfortune for a man.","Consistent virtue brings good fortune to women but danger to men.",["The Commentary on the Images says: Women's integrity brings good fortune; devotion to one husband. Men must uphold justice; following women leads to disaster."],["The Commentary on the Images says: Women thrive through lifelong devotion, while men must uphold principle — yielding to women leads to ruin."],["The fifth six (yin) represents traditional female virtue of lifelong fidelity, which was valued in ancient times. For men, however, excessive compliance was seen as weakness, reflecting the era's gender norms."],"Constancy in virtue: good fortune for a woman, danger for a man."],"32.6":["Six at the top","Restlessness as an enduring condition brings misfortune.","Constant upheaval leads to disaster.",["The Commentary on the Images says: Shaking duration at the top; great failure,"],["The Commentary on the Images says: Instability at the highest level leads to complete failure."],["The top six (yin) is erratic, like a ruler who constantly changes policies. This warns that inconsistency in leadership — whether in government or personal life — destroys trust and leads to failure."],"Constant upheaval and restlessness bring disaster."],"33.1":["Six at the beginning","At the tail in retreat. This is dangerous. One must not wish to undertake anything.","Falling behind in retreat brings danger; do not advance.",["The Commentary on the Images says: The danger of trailing in retreat; staying still avoids disaster."],["The Commentary on the Images says: Falling behind in retreat is dangerous, but staying put avoids harm."],["The initial six (yin) hesitates and falls behind in retreat, risking destruction. This mirrors the survival rule: a lion only needs to outrun the slowest gazelle to survive — reminding us to act promptly in crisis."],"Caught at the tail of the retreat: danger, so do not push forward."],"33.2":["Six in the second place","He holds him fast with yellow oxhide. No one can tear him loose.","Bound with yellow oxhide; no escape.",["The Commentary on the Images says: Bound with yellow oxhide; firm resolve."],["The Commentary on the Images says: Being bound with yellow oxhide symbolizes unwavering resolve."],["From the perspective of the hexagram structure. The second six (yin) refuses to retreat, showing either unyielding loyalty or foolish stubbornness, Its bond with the fifth nine (yang) is unbreakable — like being tied with oxhide, representing a commitment that cannot be shaken."],"Held fast with yellow oxhide: a firm bond that cannot be loosened."],"33.3":["Nine in the third place","A halted retreat is nerve-wracking and dangerous. To retain people as men- and maidservants brings good fortune.","Being trapped in retreat brings illness and danger; keeping servants is auspicious.",["The Commentary on the Images says: The danger of being","2 trapped in retreat; exhaustion like illness. Keeping servants is auspicious, but no great deeds are possible."],["The Commentary on the Images says: Being trapped in retreat causes exhaustion like illness. Keeping servants is favorable, but no significant achievements can be made."],["The third nine (yang) is emotionally trapped, unable to retreat freely, leading to exhaustion. This echoes Confucius’ warning about difficult relationships: balancing distance and closeness is key. Keeping servants (a form of controlled interaction) is a practical compromise when full retreat is impossible. Yet even a man of virtue will be worn to a frazzle, and incapable of achieving great things."],"Entangled while retreating: illness and danger; looking after dependents brings good fortune."],"33.4":["Nine in the fourth place","Voluntary retreat brings good fortune to the superior man and downfall to the inferior man.","Knowing when to retreat brings good fortune to the noble, but not to the petty.",["The Commentary on the Images says: The nobleman retreats well; the petty person cannot."],["The Commentary on the Images says: The nobleman retreats gracefully, while the petty person cannot let go."],["The fourth nine (yang) retreats at the peak of success, like Fan Li, who retired with Xi Shi after helping defeat Yue, avoiding Wen Zhong's fate. This contrasts with Yue Fei, who failed to retreat and was betrayed — showing that recognizing when to let go is the mark of true wisdom."],"A voluntary retreat: good fortune for the noble, a trap for the petty."],"33.5":["Nine in the fifth place","Friendly retreat. Perseverance brings good fortune.","Retiring at the height of success, with integrity, brings good fortune.",["The Commentary on the Images says: Excellent retreat with integrity brings auspiciousness; aligning with true purpose."],["The Commentary on the Images says: Retiring with integrity brings good fortune by staying true to one's purpose."],["The fifth nine (yang) embodies the ideal of noble retreat, like the Duke of Zhou, who returned power to King Cheng after stabilizing the Zhou Dynasty. This contrasts with Han Xin, who clung to power and was executed — showing that humility and adherence to principle ensure lasting legacy."],"Retiring at the right moment, with integrity: good fortune."],"33.6":["Nine at the top","Cheerful retreat. Everything serves to further.","Retreating freely brings no harm.",["The Commentary on the Images says: Free retreat brings no disadvantage; no hesitation."],["The Commentary on the Images says: Retreating freely brings no harm, as there is no hesitation."],["When the time to withdraw comes, retreat resolutely, soar high and go far, and all shall be well.Escape the snare woven by vile men and strive for great undertakings in a new world. This is no ordinary retreat, but a triumphant escape — the supreme state of withdrawal.Such were the recluses of ancient times, who entrusted their hearts and minds to mountains and rivers, finding joy in their own company. Yet they still cared about state affairs. They could be valued and summoned by emperors, and also go deep among the people to understand their sufferings;they could offer advice to wise monarchs and receive rewards, and also keep themselves safe by staying away from the vile men in power."],"A free, unburdened retreat: nothing unfavorable."],"34.1":["Nine at the beginning","Power in the toes. Continuing brings misfortune. This is certainly true.","Strength in the toes leads to disaster in battle, though sincerity remains.",["The Commentary on the Images says: Strength in the toes; sincerity leads to exhaustion."],["The Commentary on the Images says: Strength in the toes, though sincere, leads to depletion."],["The initial nine (yang) overestimates its strength, like Emperor Yang of Sui, who launched reckless campaigns and was overthrown. This warns against acting on incomplete preparation."],"Strength only in the toes: advancing too soon brings misfortune."],"34.2":["Nine in the second place","Perseverance brings good fortune.","Staying true to the path brings good fortune.",["The Commentary on the Images says: The second nine's auspiciousness comes from the middle way."],["The Commentary on the Images says: The second nine's fortune comes from embodying the middle way."],["The second nine (yang) balances strength with restraint, finding success through the \"middle way.\" Its centered position and alignment with the fifth six (yin) ensure stability, showing that patience and integrity prevail over haste."],"Staying true to the path: good fortune."],"34.3":["Nine in the third place","The inferior man works through power. The superior man does not act thus. To continue is dangerous. A goat butts against a hedge And gets its horns entangled.","Petty people rely on force, while noble people use strategy; integrity brings risk, A ram charges a hedge and gets its horns stuck,",["The Commentary on the Images says: The petty use force; the noble use strategy."],["The Commentary on the Images says: Petty people use brute force, while noble people use wisdom."],["The third nine (yang) represents brute force, like King Jic of Xia, who used violence to suppress dissent and destroyed his dynasty. This contrasts with noble strategy, showing that strength without wisdom leads to ruin."],"The petty rely on force, the noble hold back; a ram that charges a hedge gets its horns caught."],"34.4":["Nine in the fourth place","Perseverance brings good fortune, Remorse disappears. The hedge opens; there is no entanglement. Power depends upon the axle of a big cart.","Integrity dispels regret; the hedge breaks, and the ram escapes, with strength like a cart's axle.",["The Commentary on the Images says: The hedge breaks, the ram escapes; advancing is possible."],["The Commentary on the Images says: The hedge breaks because the ram pushes forward relentlessly."],["The fourth nine (yang) leads a collective breakthrough, like a ram that breaks free from a hedge by working with others. This shows that coordinated strength can overcome obstacles that individual force cannot."],"The hedge opens and the ram is free: regret vanishes, strength like a sturdy axle."],"34.5":["Six in the fifth place","Loses the goat with ease.No remorse.","Losing sheep at Yi causes no regret.",["The Commentary on the Images says: Losing sheep at Yi; mispositioned,"],["The Commentary on the Images says: Losing sheep at Yi results from being in the wrong position."],["Being in an improper position leads to loss, like losing sheep. For example, Wang Hai, an ancestor of the Shang dynasty, excelled at taming oxen and horses, and kept many herds. Riding an ox-cart, he drove his cattle and sheep to the Youyi tribe in Hebei for trade, only to be killed by the locals, who seized his livestock. Though a sovereign, Wang Hai abandoned his rightful role to engage in distant commerce — this is “improper positioning” hence the regretful outcome."],"Losing the sheep at Yi: giving up stubborn force easily, no regret."],"34.6":["Six at the top","A goat butts against a hedge. It cannot go backward, it cannot go forward. Nothing serves to further. If one notes the difficulty, this brings good fortune.","A ram gets stuck in a hedge, trapped between advance and retreat; no gain, Enduring hardship leads to good fortune.",["The Commentary on the Images says: Unable to retreat or advance; ill-omened. Enduring hardship brings auspiciousness, as misfortune is temporary."],["The Commentary on the Images says: Being trapped comes from poor planning, but enduring hardship brings relief, as misfortune is fleeting."],["The top six (yin) acts recklessly and gets trapped, but endurance leads to liberation as circumstances change. This teaches that patience and resilience turn adversity into opportunity,"],"The ram stuck in the hedge cannot advance or retreat; endure hardship and it turns to good fortune."],"35.1":["Six at the beginning","Progressing, but turned back. Perseverance brings good fortune. If one meets with no confidence, one should remain calm.No mistake.","Progress is obstructed, but integrity ensures good fortune. Lack of trust is overcome by generosity.",["The Commentary on the Images says: Advancing yet blocked; walking the path alone. Magnanimity avoids blame; not yet entrusted."],["The Commentary on the Images says: Progress is blocked because you uphold integrity alone. Magnanimity avoids blame, as you are not yet in a position of authority."],["The initial six (yin) faces office politics but remains virtuous, like a rising star targeted by rivals, Patience and generosity are key to surviving early setbacks and building trust."],"Progress is blocked: stay patient and correct; generosity overcomes the lack of trust."],"35.2":["Six in the second place","Progressing, but in sorrow. Perseverance brings good fortune. Then one obtains great happiness from one's ancestress.","Progress brings anxiety, but integrity ensures good fortune. Blessings come from a higher authority (the \"queen mother\").",["The Commentary on the Images says: Receiving great blessings through centered integrity."],["The Commentary on the Images says: Blessings come from being centered and virtuous."],["The second six (yin) feels anxious despite progress, but its cautious virtue earns recognition from the fifth six (yin, the \"queen mother\"). This shows that humility and integrity attract support even from rivals."],"Progress brings worry, but staying correct brings good fortune and blessings from a higher authority."],"35.3":["Six in the third place","Alll are in accord. Remorse disappears.","Gaining popular support eliminates regret.",["The Commentary on the Images says: Supported by the masses; intent on upward progress."],["The Commentary on the Images says: Popular support comes from a sincere desire to advance."],["The third six (yin) rises by empowering others, like a manager who promotes subordinates and is promoted in turn. This \"win-win\" progress ensures lasting success."],"You are trusted by the group: regret vanishes."],"35.4":["Nine in the fourth place","Progress like a hamster. Perseverance brings danger.","Progressing like a jack-of-all-trades rat; even integrity carries risk.",["The Commentary on the Images says: The rat's danger comes from mispositioning."],["The Commentary on the Images says: The rat's peril stems from being in the wrong role."],["The fourth nine (yang) is a \"jack-of-all-trades, master of none,\" like a rat that can do many things but excel at none. This warns against spreading oneself too thin — focus and specialization are essential for secure progress."],"Advancing like a greedy, fearful rat: precarious, even if you are in the right."],"35.5":["Six in the fifth place","Remorse disappears. Take not gain and loss to heart. Undertakings bring good fortune. Everything serves to further.","Letting go of regret and worry about loss/gain ensures smooth progress.",["The Commentary on the Images says: Do not grieve over loss or gain; advancing brings celebration."],["The Commentary on the Images says: Letting go of attachment to outcomes leads to joyful success."],["As the saying goes, “to gain, one must first let go” — just like the old frontier man whose lost horse returned with a whole herd. Had he tied the horse tightly, how could it have brought such fortune? Life often intertwines. gain and loss. The fifth six (yin), positioned nobly and supported by yang lines above and below, finds cause for celebration whether advancing or retreating, gaining or losing."],"Stop worrying about gain and loss: progress goes smoothly, good fortune."],"35.6":["Nine at the top","Making progress with the horns is permissible only for the purpose of punishing one's own city.To be conscious of danger brings good fortune. No blame. Perseverance brings humiliation.","Reaching the peak means progress stalls; only small campaigns bring merit. Risk leads to fortune, but clinging to integrity causes frustration,",["The Commentary on the Images says: Campaigning against small states shows the path is not yet bright."],["The Commentary on the Images says: Needing to attack small states reveals that true progress has not been achieved."],["The top nine (yang) hits a ceiling, like a retired emperor with no real power. To maintain relevance, it must seek trivial victories, showing that even the highest positions carry hidden costs."],"Progress at the peak is stalled: only small campaigns, close to home, bring merit."],"36.1":["Nine at the beginning","Darkening of the light during flight.He lowers his wings.","The \"light\" (virtue) falters, like a bird with drooping wings. The nobleman flees, fasting, and faces criticism from his host.",["The Commentary on the Images says: The nobleman travels; it is righteous to refuse sustenance."],["The Commentary on the Images says: The nobleman leaves, refusing to accept support from an unjust regime."],["Birds’ rhythms are closely tied to the sun’s movement. At dawn, when the sun first breaches the horizon yet light has not fully spread, birds awaken first. At dusk, before the last gleam fades, they already return to their nests. Thus, birds are highly sensitive to sunlight, In the earliest stage of Ming Yi (Brightness Hidden), the wounding of light is still distant, yet the noble person, discerning the signs, departs swiftly. This closely resembles birds returning at twilight — they do not wait for full darkness to fly home."],"The light dims and the bird's wings droop: the noble flees without eating and is criticized."],"36.2":["Six in the second place","Darkening of the light injures him in the left thigh.He gives aid with the strength of a horse.Good fortune.","Suffering a minor injury (left thigh), but rescued by a strong horse, leading to good fortune.",["The Commentary on the Images says: The second six's auspiciousness comes from yielding with principle."],["The Commentary on the Images says: Good fortune comes from balancing compliance with integrity."],["The second six (yin) suffers a setback but is rescued, showing that staying true to principle while being flexible attracts help and leads to safety."],"A wounded left thigh, rescued by a strong horse: good fortune."],"36.3":["Nine in the third place","Darkening of the light during the hunt in the south.Their great leader is captured. One must not expect perseverance too soon.","Launching a \"night raid” (southern hunt) to capture the enemy leader, but caution is needed to avoid overreach.",["The Commentary on the Images says: The intent of the southern hunt leads to great gain."],["The Commentary on the Images says: The \"southern hunt\" (strategic action) leads to significant victory,"],["When night falls and animals are deep in sleep, hunting becomes easier. In warfare, night raids are likewise a highly effective tactic for defeating the enemy. The line text describes a successful night raid: not only was the enemy defeated, but their leader was captured. Yet in such circumstances, due to the darkness and obscured vision, it is unwise to pursue relentlessly or annihilate completely."],"A southern hunt captures the great leader, but don't overreach or be hasty."],"36.4":["Six in the fourth place","He penetrates the left side of the belly. One gets at the very heart of the darkening of the light, And leaves gate and courtyard.","Gaining access to the ruler’s inner circle to understand the crisis, then withdrawing to safety.",["The Commentary on the Images says: Entering the left abdomen; gaining insight into the ruler’s true intentions."],["The Commentary on the Images says: Accessing the inner circle reveals the ruler's true motives,"],["The fourth six is a person of careful action. As a minister, one must discern whether the ruler is truly incompetent — not simply depart based on apparent inaction. When King Wei of Qi first ascended the throne, he indulged in wine and pleasure daily. Chunyu Kun, wishing to understand the king's intent, said to him: “In Qi there is a great bird that has nested in the palace courtyard for three years. It neither flies nor cries — what kind of bird is this?” King Wei replied: “If it does not fly, it will soar to the heavens; if it does not cry, it will startle all with its voice.” Through this, Chunyu Kun realized that beneath the king’s apparent neglect of state affairs lay a grand plan to reform the government. Indeed, within days, King Wei swiftly purged the corrupt officials."],"Get inside the dark circle to understand it, then leave in time."],"36.5":["Six in the fifth place","Darkening of the light as with Prince Chi. Perseverance furthers.","Embodying Jizi's virtue — staying true to purpose even in darkness.",["The Commentary on the Images says: Jizi's integrity ensures light never fades."],["The Commentary on the Images says: Jizi's unwavering integrity preserves the light of virtue."],["The fifth six is closest to the benighted ruler, deep in darkness; at such a time, one must hold fast to steadfastness. Jizi was King Zhou’s uncle, When King Zhou ruled tyrannically, Jizi could have launched a coup and taken the throne himself — but he did not. He could also have allied with other states to overthrow the tyrant — yet he refrained. Loyal to the Shang dynasty but powerless to save it, Jizi chose to feign madness. This was an act of yielding to the times and submitting to the way of heaven."],"Like Prince Jizi in darkness: hide your light but stay true to your purpose."],"36.6":["Six at the top","Not light but darkness. First he climbed up to heaven, Then he plunged into the depths of the earth.","A ruler who starts as a wise leader but descends into tyranny, like King Zhou.",["The Commentary on the Images says: Initially ascending to heaven, illuminating the realm; later falling to earth, losing principle."],["The Commentary on the Images says Starting as a brilliant ruler, then falling into corruption and losing one's way."],["The fifth six, positioned closest to the benighted ruler and immersed in darkness, must uphold steadfast integrity Jizi, uncle of King Zhou, faced the king’s tyranny. He could have staged a coup to seize power but refrained.He could also have allied with other states to overthrow the tyrant — yet he did not.Loyal to the Shang dynasty yet powerless to save it, Jizi chose to feign madness — an act of aligning with the times and submitting to heaven's way. Interpretation of Ming Yi from Tui Bei Tu, Image 15 Ming Yi + Wu Yin (Year of the Tiger) ‘Cie * Te.","2 3f","a: %","! uf","Mh ee i"],"Not light but darkness: the ruler rose to heaven and then plunged into the earth."],"37.1":["Nine at the beginning","Firm seclusion within the family.Remorse disappears.","Protecting the home from harm prevents future regret.",["The Commentary on the Images says: Securing the home; intent remains unshaken."],["The Commentary on the Images says: Securing the home reflects an unwavering commitment to family."],["The initial nine (yang) stresses the importance of early boundaries, like the \"crossbar\" ( [AJ ) that secures a home. Just as a physical barrier keeps intruders out, clear rules and discipline protect the family from moral decay."],"Set rules in the home early: regret vanishes."],"37.2":["Six in the second place","She should not follow her whims. She must attend within to the food.Perseverance brings good fortune.","The wife's role is to support, not lead, managing meals and household affairs with integrity.",["The Commentary on the Images says: The second six's auspiciousness comes from yielding and humility."],["The Commentary on the Images says: Good fortune comes from being yielding and humble in one's role."],["The second six (yin) embodies the ideal of a virtuous wife: supportive, humble, and focused on nurturing the family. Her role in managing daily life ensures the family's stability and prosperity."],"The wife's place is in the household, managing meals and affairs without a personal agenda."],"37.3":["Nine in the third place","When tempers flare up in the family, Too great severity brings remorse. Good fortune nonetheless. When woman and child dally and laugh, It leads in the end to humiliation.","Strict discipline ensures long-term good fortune, while indulgence leads to decline.",["The Commentary on the Images says: The family in discipline; no loss of principle. Women and children in levity; loss of family virtue."],["The Commentary on the Images says: Discipline preserves family principles, while indulgence erodes them."],["The third nine (yang) represents a strict patriarch. While excessive severity can cause friction, it is better than indulgence, which leads to moral laxity. This teaches that firm but fair discipline is essential for family order."],"Firm household discipline brings regret but good fortune; lax laughter leads to shame."],"37.4":["Six in the fourth place","She is the treasure of the house. Great good fortune.","Building family wealth brings great good fortune.",["The Commentary on the Images says: Enriching the family brings great auspiciousness, as it aligns with one's role."],["The Commentary on the Images says: Prosperity comes from fulfilling one's role with humility and competence."],["The fourth six (yin) represents a thrifty matriarch who builds wealth through diligence, Her success shows that humility and prudence in managing resources are key to family prosperity."],"Enriching the household: great good fortune."],"37.5":["Nine in the fifth place","As a king he approaches his family. Fear not.Good fortune.","A ruler who governs the nation like a family ensures peace and prosperity.",["The Commentary on the Images says: The king visits the family; mutual love prevails."],["The Commentary on the Images says The commentary says: A wise ruler fosters a nation where people love each other like family."],["The fifth nine (yang) represents a wise ruler who unites the nation through the same principles that unify a family: love, respect, and shared purpose. This shows that effective governance begins with strong family values."],"A ruler who treats the state like a family: peace, with nothing to fear."],"37.6":["Nine at the top","His work commands respect.In the end good fortune comes.","A leader who combines sincerity with authority ensures lasting harmony.",["The Commentary on the Images says: The auspiciousness of authority comes from self-reflection."],["The Commentary on the Images says: True authority comes from leading by example and self-discipline."],["The top nine (yang) represents a revered elder who earns respect through integrity and wisdom. This teaches that true authority is not based on age, but on virtue and selflessness,"],"Sincerity combined with authority: lasting good fortune."],"38.1":["Nine at the beginning","Remorse disappears. If you lose your horse, do not run after it; It will come back of its own accord. When you see evil people, Guard yourself against mistakes.","Minor conflicts resolve on their own; patience and avoiding confrontation prevent disaster.",["The Commentary on the Images says The Commentary on the Images says: \"Meeting a malicious person\" means to avoid blame."],["The Commentary on the Images says: When a malicious person appears, one must avoid calamity."],["The Kui hexagram addresses strategies for dealing with divergence in interpersonal relationships. The first nine represents the beginning of divergence, where conflict has just arisen and there is still room for maneuver; handled appropriately, the conflict can be resolved. At the start of the conflict, the other party may be emotional, and attempts to placate them may not be well- received. Allow both sides time for self-reflection; as long as the conflict is not further inflamed, it will gradually fade. If the other party takes the initiative to show goodwill, seize the opportunity immediately and swiftly steer toward reconciliation, transforming division into unity."],"Regret vanishes: the lost horse returns on its own; seeing bad people brings no blame."],"38.2":["Nine in the second place","One meets his lord in a narrow street.No blame.","Finding common ground in informal settings preserves loyalty and avoids trouble.",["The Commentary on the Images says: \"Meeting the master in a lane\" means he has not lost the proper way."],["The Commentary on the Images says: Meeting the master in a lane indicates that the second nine has not lost the harmonious way between master and servant."],["The second nine holds a position without authority; it cannot ascend to the hall or be received by the sovereign. It must yield and endure, going through twists and turns to meet others privately. This is like a servant of a ‘once-wealthy family that has fallen into poverty. The family members, struggling to make a living, can no longer afford to keep servants and dismiss them. One day, the master happens to meet one of these former servants in a narrow lane, and the servant still regards the old master as his lord. How could such loyalty bring disaster?"],"Meeting the master in a side lane: no blame."],"38.3":["Six in the third place","One sees the wagon dragged back, the oxen halted, a man's hair and nose cut off. Not a good beginning, but a good end.","Initial setbacks and conflict give way to resolution through outside help.",["The Commentary on the Images says: \"Seeing the cart being pulled back\" is due to an improper position, \"No good beginning but a good end\" results from meeting firmness."],["The Commentary on the Images says: The cart being pulled backward is due to an improper position. A poor start but a good end occurs because of assistance from a strong figure."],["An improper position leads to weak strength, where intentions exceed capability. The second nine and fourth nine may temporarily assert themselves and create obstacles, but ultimately they cannot prevent the meeting of the third six and top nine. Such a state of divergence is only temporary. It is like a person driving an ox-cart, overloaded with goods and with an unruly ox, who falls from the cart and injures his face and nose. Yet, with help from others, though the cart overturns, it is not destroyed."],"A cart dragged back and an ox halted: a bad start but a good end."],"38.4":["Nine in the fourth place","Isolated through opposition, one meets a like- minded man with whom one can associate in good faith. Despite the danger, no blame.","Mutual hardship fosters alliance, as sincerity overcomes isolation.",["The Commentary on the Images says: \"Mutual trust brings no blame, for their wills are aligned.\""],["The Commentary on the Images says: Interacting with sincerity brings no disaster because their intentions are in harmony.","3il"],["Feeling profoundly isolated, as if trapped in a hopeless situation. The first nine corresponds with the fourth nine. They meet in peril — both are firm and might naturally clash and repel each other. Yet sharing a similar plight and needing to escape adversity, they resolutely cooperate and interact with sincerity, much like Sun Quan and Liu Bei joining forces to resist Cao Cao."],"Isolated by opposition, you meet a like-minded person: trust brings you through danger."],"38.5":["Six in the fifth place","Remorse disappears. The companion bites his way through the wrappings. If one goes to him, how could it be a mistake?","Reconnecting with family and allies through shared celebration resolves conflict.",["The Commentary on the Images says: \"His kindred gnaw at tender meat\" — going forward brings celebration,"],["The Commentary on the Images says: When kindred feast on meat, proceeding forward will lead to joyous occasions."],["The second nine meets the fifth six through patience and subtlety, while the fifth six occupies a noble position yet remains gentle and yielding. Their union is as easy as biting tender meat — it fits at once, and once joined, divergence ceases, This describes members of a fallen wealthy family who scatter to seek livelihoods; one among them attains success and honor, then hosts a feast for his kindred. Drinking and eating together naturally avert disaster."],"Regret vanishes: reconnect with allies and family and move ahead."],"38.6":["Nine at the top","Isolated through opposition, one sees one's companion as a pig covered with dirt, as a wagon full of devils. First one draws a bow against him, then one lays the bow aside. He is not a robber; he will woo at the right time.As one goes, rain falls; then good fortune comes.","Suspicion and fear give way to clarity and harmony, as misunderstandings are resolved.",["The Commentary on the Images says: \"The good fortune of encountering rain\" means all doubts vanish."],["The Commentary on the Images says: Encountering rain brings good fortune because many doubts are dispelled."],["The top nine, at the extreme of firmness, becomes irritable and unable to think calmly. It is prone to nervousness, inevitably giving rise to baseless suspicions, misunderstandings, and disturbances, Therefore, one must analyze the situation with clarity — neither trust lightly nor doubt rashly. The","top nine is in extreme hardship; its \"solitude in divergence\" differs from that of the fourth nine. The fourth nine’s solitude stems from character, while the top nine’s solitude arises from poverty, for the Kui hexagram fundamentally signifies discord and separation caused by family hardship."],"Suspicion sees a pig covered in mud and ghosts on a cart; it clears like rain, and good fortune comes."],"39.1":["Six at the beginning","Going leads to obstructions,Coming meets with praise.","Encountering danger when advancing, returning with honor.",["The Commentary on the Images says: \"Going brings hardship, returning brings praise\" — it is fitting to wait."],["The Commentary on the Images says: Advancing leads to danger, while retreating earns honor, indicating that one should await the opportune moment,"],["The first six lacks the strength to overcome peril, yet possesses strong foresight. Thus, even before reaching the brink of danger, it recognizes the risk and retreats. This withdrawal minimizes losses and naturally earns praise. In real life, we often encounter timid individuals who actually have an advantage: they can sense danger early and take preventive measures, thereby avoiding harm."],"Going meets obstacles; turning back earns praise."],"39.2":["Six in the second place","The king's servant is beset by obstruction upon obstruction, but it is not his own fault.","The king and his ministers face severe difficulties, not caused by their own actions.",["The Commentary on the Images says: \"The king and his ministers tread in repeated difficulty, yet in the end there is no blame.\""],["The Commentary on the Images says: Though the sovereign and his ministers face repeated hardships, ultimately they will be without fault,"],["As long as one acts with caution and care, avoiding mistakes, no hardship or danger need be feared. For example, during the Red Army's 25,0001i Long March, despite overwhelming perils, the strategy was correct: they crossed grasslands, surmounted snowcapped mountains, forded rivers, shattered enemy encirclements, and ultimately marched to victory — overthrowing reactionary rule and founding the People's Republic of China."],"The king's servant faces obstruction upon obstruction, through no fault of his own."],"39.3":["Nine in the third place","Going leads to obstructions;Hence he comes back.","Encountering danger when advancing, returning in the opposite direction.",["The Commentary on the Images says: \"Going brings hardship, returning brings reversal\" — the inner lines rejoice in this."],["The Commentary on the Images says: Advancing leads to danger, returning brings a turn — the two yin lines of the inner trigram delight in the third nine's return."],["The third nine seeks to escape hardship but encounters even greater danger, halting before the peril. This is like a man whose family grows increasingly poor; he leaves home hoping to bring wealth back, only to face severe obstacles and forced to return to continue living in poverty. Yet his return brings great joy to his two wives, for despite the poverty, the family can at least be reunited."],"Going meets obstacles; returning brings you back to those who rely on you."],"39.4":["Six in the fourth place","Going leads to obstructions,Coming leads to union.","Encountering danger when advancing, returning in a human-pulled cart.",["The Commentary on the Images says: \"Going brings hardship, returning brings connection\" — this is because its position is solid and substantial."],["The Commentary on the Images says: \"Advancing leads to difficulty, returning brings connection\" is because the fourth six occupies a certain status and possesses substance,"],["The fourth six lacks the strength to escape danger on its ‘own; advancing blindly would only plunge it deeper into peril. Therefore, it must unite with the third nine and other lines, building a united front and rallying all available forces to shift the balance of power and extricate itself from adversity. For example, during the Three Kingdoms period, after Liu Bei's death, Zhuge Liang’s first priority was to establish a united front by restoring the alliance with Eastern Wu. With his rear secured, he was able to launch the southern campaigns unrestrained, capturing Meng Huo seven times and achieving a series of victories."],"Going meets obstacles; turn back and unite with others."],"39.5":["Nine in the fifth place","In the midst of the greatest obstructions, friends come.","Facing great danger, friends come to assist.",["The Commentary on the Images says: \"Great hardship brings friends\" because it is central and regulated."],["The Commentary on the Images says: Great hardship brings friends' aid because the fifth nine is firm, central, and acts with due measure."],["The fifth nine lies at the heart of hardship; as the ruler of a state, its distress is the great hardship of the realm. Yet it holds the lofty ambition to relieve this great adversity for all under heaven, and the second six follows it with unwavering loyalty. The fifth nine is no reckless hero; it understands well that \"one hero needs three helpers\" and fully employs the art of leadership to inspire subordinates to risk their lives in aid, Its actions align with the people’s will, thus gaining their support."],"Great obstruction: friends come to help."],"39.6":["Six at the top","Going leads to obstructions,coming leads to great good fortune.It furthers one to see the great man.","Encountering danger when advancing, returning with great merit, auspicious; beneficial to meet a noble person.",["The Commentary on the Images says: \"Going brings hardship, returning brings great achievement\" — its will is turned inward. \"It furthers one to see the great man\" — it follows the noble."],["The Commentary on the Images says: Advancing meets obstacles, returning brings great merit — this results from the top six uniting efforts with all. Benefiting from meeting the great man indicates that the top six follows the noble ruler."],["The auspiciousness of the top six lies in its ability to turn back when there is no way forward. Imagine a tribe struck by a flood; the top six escapes the floodwaters, only to find that while there is no water ahead, there is also no path onward. In this situation, it returns to the disaster area, unites with everyone, and together they resist the calamity. \"Many hands make light work; united hearts can move mountains.\" The return of the top six adds strength to the resistance, which is indeed auspicious."],"Going is obstructed, but returning brings great merit: seek out the great person."],"40.1":["Six at the beginning","Without blame.","No disaster or blame.",["The Commentary on the Images says: \"At the border of firm and yielding, in accordance with what is right, there is no blame.\""],["The Commentary on the Images says: The first six and the second nine balance firmness and yielding in accordance with what is right, thus there is no disaster."],["The first six is at the very bottom of the lower trigram Kan (danger) in the Jie hexagram. Kan signifies peril, so the first six is on the brink of hardship, and being soft in an odd position makes its situation unfavorable, However, due to its yin-yang harmony with the second nine and its resonance with the fourth nine, the first six avoids disaster. This is because the second nine and fourth nine can resolve the first six's peril, In other words, though the first six faces difficulty, it can be liberated — hence \"no blame.\""],"Relief begins: no blame."],"40.2":["Nine in the second place","One kills three foxes in the field and receives a yellow arrow. Perseverance brings good fortune.","Capturing three foxes in the hunt, obtaining yellow arrows, upholding integrity brings auspiciousness.",["The Commentary on the Images says: \"The second nine’s perseverance brings good fortune — it attains the central way.\""],["The Commentary on the Images says: The auspiciousness of the second nine’s adherence to the right path is because it follows the central and correct way."],["A nation that has just emerged from peril requires a stable environment, However, a handful of individuals always move against the tide of history, seeking to stir up trouble, thus hidden dangers must be purged. The second nine must rid the nation of these base and cunning elements. The moderate virtues inherent in the first six, third six, fifth six, and the second nine itself can resolve the second nine’s predicament. Therefore, as long as the second nine holds fast to the right path, it will be auspicious."],"Catching three foxes in the field and gaining a yellow arrow: clear out deceivers; staying correct is good fortune."],"40.3":["Six in the third place","If a man carries a burden on his back and nonetheless rides in a carriage, he thereby encourages robbers to draw near. Perseverance leads to humiliation
