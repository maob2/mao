/* ---------- He-Luo core (verified against the book's printed tables) ---------- */
const SEQ=["Xun","Zhong","Qian","Dui","Gen","Li","Kan","Kun","Zhen"];

/* ---------- Calendar (Four Pillars) ---------- */

let _f=null;

DRW:[1,"Resource + Wealth + Drain: fair. Some small wealth.",0],
ARW:[-1,"Resource + Wealth + Attack: unfavorable. Disputes and lost wealth.",0],
ADR:[-1,"Resource + Drain + Attack: slightly unfavorable. Illness and lost wealth.",0],
APW:[-1,"Peer + Wealth + Attack: unfavorable. Legal trouble and lost wealth.",0],
DPW:[1,"Peer + Wealth + Drain: fair. Small wealth, but only if the layout is right.",0],
ADW:[-1,"Wealth + Attack + Drain: unfavorable. Lost wealth and illness.",0],

const MTNS={Kan:[["Ren","壬"],["Zi","子"],["Gui","癸"]],Gen:[["Chou","丑"],["Gen","艮"],["Yin","寅"]],Zhen:[["Jia","甲"],["Mao","卯"],["Yi","乙"]],Xun:[["Chen","辰"],["Xun","巽"],["Si","巳"]],Li:[["Bing","丙"],["Wu","午"],["Ding","丁"]],Kun:[["Wei","未"],["Kun","坤"],["Shen","申"]],Dui:[["Geng","庚"],["You","酉"],["Xin","辛"]],Qian:[["Xu","戌"],["Qian","乾"],["Hai","亥"]]};

function judge(ds,slot,pal,o){

const vword=s=>s>=1?"Good":s===0?"Neutral":"Bad";

function App(){

    h("tbody",null,["Month","Day","Hour"].map((n,i)=>h("tr",{key:n},h("td",null,n),h("td",null,BR[[p.mb,p.db,p.hb][i]]),h("td",null,r.nums[i]),h("td",null,ELN[r.nums[i]]),h("td",null,RN[r.rels[i]]))))))),
  h("div",{className:"card"},h("h2",null,"Killing numbers to avoid"),

  h("div",{className:"card"},h("h2",null,"All time slots on this date"),

 const fmt=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
 const calcPlan=()=>{setErr("");const o={monthBasis:mb,yearBasis:yb},days=[];
  if(pmode==="g"){const n=new Date(+py,+pm,0).getDate();for(let i=1;i<=n;i++)days.push(+py+"-"+pad(pm)+"-"+pad(i))}
