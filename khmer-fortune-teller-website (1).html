/* ---------- Feng Shui calculation ---------- */
const rd=n=>{while(n>9) n=[...String(n)].reduce((a,b)=>a+ +b,0);return n;};
const TRI={1:{d:0,l:'010'},8:{d:1,l:'001'},3:{d:2,l:'100'},4:{d:3,l:'011'},9:{d:4,l:'101'},2:{d:5,l:'000'},7:{d:6,l:'110'},6:{d:7,l:'111'}};
const RULES=[[2],[0,1],[0,1,2],[],[0],[1,2],[0,2],[1]]; /* Sheng Qi, Tian Yi, Yan Nian, Fu Wei, Huo Hai, Wu Gui, Liu Sha, Jue Ming */
const TS=[0,1,1,2,3,3,4,5,5,6,7,7];
const GRID=[3,4,5,2,'c',6,1,0,7], FLY=[7,6,1,4,0,5,2,3];
function fsCalc(dateStr,gender,cy){
  const [Y,M,D0]=dateStr.split('-').map(Number);
  const by=Date.UTC(Y,M-1,D0)>=jieList(Y)[1].t?Y:Y-1;
  const yy=by>=2000?by-2000:by-1900, s=rd([...String(yy)].reduce((a,b)=>a+ +b,0));
  let kua=rd(by>=2000?(gender==='male'?9-s:6+s):(gender==='male'?10-s:5+s))||9;
  if(kua===5) kua=gender==='male'?2:8;
  const base=TRI[kua].l, rule=Array(8), byRule=Array(8);
  RULES.forEach((f,i)=>{
    const l=[...base]; f.forEach(p=>l[p]=l[p]==='1'?'0':'1');
    const k=+Object.keys(TRI).find(k=>TRI[k].l===l.join('')); rule[TRI[k].d]=i; byRule[i]=TRI[k].d;
  });
  let c=11-rd(cy); while(c>9) c-=9;
  const star=Array(8); FLY.forEach((d,k)=>{star[d]=((c-1+k+1)%9)+1;});
  const yb=((cy-4)%12+12)%12;

const SIT=['坤','艮','坎','巽','震','離','兌','乾']; /* Facing trigram = table column */
const ROWS=['離震乾兌艮坤巽坎','乾兌離震巽坎艮坤','巽坎艮坤乾兌離震','艮坤巽坎離震乾兌','震離兌乾坤艮坎巽','坎巽坤艮兌乾震離','兌乾震離坎巽坤艮','坤艮坎巽震離兌乾'];
const mtOfDeg=d=>Math.floor((((d%360)+360)%360+7.5)%360/15);
const info=ch=>MT.find(m=>m.c===ch);
const sg=n=>(n>0?'+':'')+n;

/* ---------- calculation ---------- */
function compute(doorCh,waters){
  const ft=MT_TRI[doorCh], col=SIT.indexOf(ft);
  const stars=STARS.map((s,i)=>{const t=ROWS[i][col];return {...s,t,list:[...GROUP[t]].map(info)};});
  const byMt={}; stars.forEach(s=>s.list.forEach(m=>{byMt[m.c]=s;}));
  const checks=waters.map(w=>{const m=MT[mtOfDeg(w.deg)];return {...w,m,star:byMt[m.c]};});
  return {door:info(doorCh),ft,stars,byMt,checks};
}

/* ---------- components ---------- */
const CX=110;
const pt=(r,a)=>[CX+r*Math.sin(a*Math.PI/180),CX-r*Math.cos(a*Math.PI/180)];
const sector=(i,ra,rb)=>{const a0=i*15-7.5+180,a1=a0+15,[x1,y1]=pt(ra,a0),[x2,y2]=pt(ra,a1),[x3,y3]=pt(rb,a1),[x4,y4]=pt(rb,a0);
  return `M${x1} ${y1} A${ra} ${ra} 0 0 1 ${x2} ${y2} L${x3} ${y3} A${rb} ${rb} 0 0 0 ${x4} ${y4} Z`;};

function Compass({r}){
  const doorI=MT.findIndex(m=>m.c===r.door.c);
  return html`<svg viewBox="0 0 220 220" class="w-full mx-auto" style=${{maxWidth:'380px'}} role="img" aria-label="Compass chart of the Tan Lang Nine Stars scores around the 24 Mountains">
    ${MT.map((m,i)=>{
      const s=r.byMt[m.c], good=s.s>0, op=.18+Math.abs(s.s)/130, col=good?'var(--good)':'var(--bad)';
      const [cx,cy]=pt(82,i*15+180), [sx,sy]=pt(56,i*15+180);
      return html`<g key=${m.c}>
        <path d=${sector(i,96,68)} fill=${col} fillOpacity=${op} stroke="var(--card)" strokeWidth="1"/>
        <path d=${sector(i,68,44)} fill=${col} fillOpacity=${Math.min(1,op+.3)} stroke="var(--card)" strokeWidth="1"/>
        <text x=${cx} y=${cy} textAnchor="middle" dominantBaseline="central" fontSize="11" class="cn" fill="var(--ink)">${m.c}</text>
        <text x=${sx} y=${sy} textAnchor="middle" dominantBaseline="central" fontSize="7.5" fontWeight="700" fill=${good?'#FFFFFF':'#000000'}>${sg(s.s)}</text></g>`;})}
    <circle cx=${CX} cy=${CX} r="42" fill="var(--soft)" stroke="var(--line)"/>
    <text x=${CX} y="100" textAnchor="middle" fontSize="8" fill="var(--muted)">Facing</text>
    <text x=${CX} y="120" textAnchor="middle" fontSize="22" class="cn" fill="var(--primary)">${r.ft}</text>
    <g transform=${`rotate(${doorI*15+180} ${CX} ${CX})`}><path d="M110 2 L104 13 L116 13 Z" fill="var(--primary)"/></g>
    ${r.checks.map((w,k)=>{const [x,y]=pt(103,w.deg+180);return html`<g key=${k}><circle cx=${x} cy=${y} r="7" fill="var(--water)" stroke="#fff" strokeWidth="1.5"/>
      <text x=${x} y=${y} textAnchor="middle" dominantBaseline="central" fontSize="7" fontWeight="700" fill="#fff">W${k+1}</text></g>`;})}
  </svg>`;
}

function Result({r}){
  const [only,setOnly]=useState(false);
  const rows=only?r.stars.filter(s=>s.s>0):r.stars;
  return html`<div class="card p-5 sm:p-6 mt-5 fade">
    <div class="soft p-4 text-center">
      <div class="text-xs muted">Facing (door direction)</div>
      <div class="cn text-5xl leading-tight" style=${{color:'var(--primary)'}}>${r.door.c}</div>
      <div class="font-semibold">${r.door.p} · ${r.door.l} · ${r.door.deg}°</div>
      <div class="text-sm muted">Trigram <span class="cn">${r.ft}</span> ${TRI[r.ft][0]} · ${GROUP[r.ft].split('').join(' ')}</div>
    </div>

    <h2 class="font-semibold mt-6 mb-2">Compass chart</h2>
    <${Compass} r=${r}/>
    <div class="flex justify-center gap-4 text-xs mt-2 flex-wrap">
      <span><b style=${{color:'var(--good)'}}>■</b> Auspicious</span><span><b style=${{color:'var(--bad)'}}>■</b> Inauspicious</span>
      <span><b style=${{color:'var(--primary)'}}>▲</b> Door</span>${r.checks.length>0&&html`<span><b style=${{color:'var(--water)'}}>●</b> Your water</span>`}</div>
    <p class="text-xs muted text-center mt-1">South is at the top. Outer ring: the 24 Mountains. Inner ring: the score of each direction.</p>

    <div class="flex items-center justify-between mt-6 mb-2 gap-3 flex-wrap">
      <h2 class="font-semibold">Result table</h2>
      <label class="text-sm flex items-center gap-2"><input type="checkbox" checked=${only} onChange=${e=>setOnly(e.target.checked)}/> Auspicious only</label>
    </div>
    <div class="overflow-x-auto soft"><table style=${{minWidth:'560px'}}>
      <thead><tr><th>#</th><th>Star</th><th>Nature</th><th>Score</th><th>Trigram</th><th>Directions (24 Mountains)</th></tr></thead>
      <tbody>${rows.map(s=>{const c=s.s>0?'var(--good)':'var(--bad)';return html`<tr key=${s.n}>
        <td>${s.n}</td>
        <td><span class="cn text-lg">${s.c}</span><div class="text-xs muted">${s.p} (${s.en})</div></td>
        <td style=${{color:c,fontWeight:600}}>${s.s>0?'Auspicious':'Inauspicious'}</td>
        <td style=${{color:c,fontWeight:700}}>${sg(s.s)}</td>
        <td><span class="cn text-lg">${s.t}</span> ${TRI[s.t][0]}</td>
        <td>${s.list.map(m=>html`<span key=${m.c} class="chip-tl" style=${{background:c}}><span class="cn">${m.c}</span> ${m.l} · ${m.deg}°</span>`)}</td></tr>`;})}</tbody></table></div>

    ${r.checks.length>0&&html`<h2 class="font-semibold mt-6 mb-2">Your water positions</h2>
    <div class="overflow-x-auto soft"><table style=${{minWidth:'480px'}}>
      <thead><tr><th>Water</th><th>Bearing</th><th>Mountain</th><th>Star</th><th>Result</th></tr></thead>
      <tbody>${r.checks.map((w,k)=>{const c=w.star.s>0?'var(--good)':'var(--bad)';return html`<tr key=${k}>
        <td><b>W${k+1}</b></td><td>${w.deg}°</td><td><span class="cn">${w.m.c}</span> ${w.m.p} (${w.m.l})</td>
        <td><span class="cn">${w.star.c}</span> ${w.star.p}</td>
        <td style=${{color:c,fontWeight:700}}>${sg(w.star.s)} ${w.star.s>0?'Auspicious':'Inauspicious'}</td></tr>`;})}</tbody></table></div>`}

    <h2 class="font-semibold mt-6 mb-2">Application notes</h2>
    <ul class="text-sm grid gap-2 list-disc pl-5">
      <li>Facing means the direction of the door. Each trigram stands for 2 or 4 directions of the 24 Mountains (Earth Plate).</li>
      <li>The method suits static water such as a pool, fish pond, or fountain, and also water flows.</li>
      <li>Measure a water position from the door if it is visible from the door, otherwise from the center of the house.</li>
      <li>Size matters. The larger the surface and the volume, the stronger the effect.</li>
      <li>Also check the other methods, such as Flying Stars and the Sān Yuán Water Method, so that all of them agree.</li>
    </ul>
  </div>`;
}

function App(){
  const [mode,setMode]=useState('deg'),[deg,setDeg]=useState(''),[pick,setPick]=useState('坤'),[ws,setWs]=useState(['']);
  const [err,setErr]=useState(''),[res,setRes]=useState(null);
  const num=v=>{if(v.trim()==='') return null;const n=parseFloat(v);return isNaN(n)||n<0||n>=360?NaN:n;};
  const submit=()=>{
    let door;
    if(mode==='deg'){const d=num(deg); if(d===null||isNaN(d)) return setErr('Enter the door bearing from 0 to 359.9 degrees.'); door=MT[mtOfDeg(d)].c;} else door=pick;
    const waters=[];
    for(const v of ws){const n=num(v); if(Number.isNaN(n)) return setErr('Water bearings must be from 0 to 359.9 degrees, or left empty.'); if(n!==null) waters.push({deg:n});}
    setErr(''); setRes(compute(door,waters));
  };
  const reset=()=>{setDeg('');setPick('坤');setWs(['']);setErr('');setRes(null);};
  const seg=(v,l)=>html`<button type="button" class="seg" aria-pressed=${mode===v} onClick=${()=>setMode(v)}>${l}</button>`;
  const numField=(label,val,set,ph)=>html`<label class="grid gap-1 text-sm font-semibold">${label}
    <input class="field" type="number" inputmode="decimal" min="0" max="359.9" step="0.1" placeholder=${ph} value=${val} onInput=${e=>set(e.target.value)}/></label>`;
  return html`<main class="mx-auto py-4" style=${{maxWidth:'600px'}}>
    <header class="text-center mb-6">
      <div class="cn text-5xl" style=${{color:'var(--primary)'}}>貪狼九星</div>
      <h2 class="text-lg font-semibold mt-1">Tān Láng Nine Stars of Water Calculator</h2>
      <p class="muted text-sm mt-1">Find the best and worst water positions from the facing of your house.</p>
    </header>
    <section class="card p-5 sm:p-6"><div class="grid gap-4">
      <div class="flex gap-1 p-1 soft">${seg('deg','Facing bearing')}${seg('pick','Pick facing mountain')}</div>
      ${mode==='deg'?numField('Facing direction (degrees)',deg,setDeg,'e.g. 225')
        :html`<label class="grid gap-1 text-sm font-semibold">Facing direction (24 Mountains)
          <select class="field" value=${pick} onChange=${e=>setPick(e.target.value)}>${MT.map(m=>html`<option key=${m.c} value=${m.c}>${m.c} ${m.p} (${m.l}) · ${m.deg}°</option>`)}</select></label>`}
      <div class="soft p-3 grid gap-3">
        <div class="text-sm font-semibold">Check your water <span class="muted font-normal">(optional)</span></div>
        ${ws.map((v,i)=>html`<div key=${i} class="flex gap-2 items-end"><div class="flex-1">${numField('Water '+(i+1)+' bearing',v,x=>setWs(ws.map((o,k)=>k===i?x:o)),'degrees')}</div>
          ${ws.length>1&&html`<button class="btn btn-g" aria-label=${'Remove water '+(i+1)} onClick=${()=>setWs(ws.filter((_,k)=>k!==i))}>×</button>`}</div>`)}
        ${ws.length<4&&html`<button class="btn btn-g text-sm" onClick=${()=>setWs([...ws,''])}>+ Add another water</button>`}
        <p class="text-xs muted">Measure from the door if the water is visible from it, otherwise from the center of the house.</p>
      </div>
      ${err&&html`<p role="alert" class="text-sm" style=${{color:'var(--primary)'}}>${err}</p>`}
      <div class="flex gap-3"><button class="btn btn-p flex-1" onClick=${submit}>Calculate</button><button class="btn btn-g" onClick=${reset}>Reset</button></div>
    </div></section>
    ${res&&html`<${Result} r=${res}/>`}
    <p class="text-xs muted text-center mt-6">For learning and entertainment. Based on the Tān Láng Nine Stars of Water method in “The Dragons of Water” by Master Han. For a real property, consult a qualified Feng Shui master.</p>
  </main>`;
}

return App;
})();

const {useState,useEffect,useRef}=React;
const html=htm.bind(React.createElement);
const TABS=[['bazi','八字 風水','BaZi and Kua'],['water','三元水法','San Yuan'],['ghosts','五鬼運財','Five Ghosts'],['tanlang','貪狼九星','Tān Láng']];
const TOOLS={bazi:BaziKua,water:SanYuan,ghosts:FiveGhosts,tanlang:TanLang};

/* ---------- sign up / log in (frontend only; data is kept in this browser) ---------- */
const mem={};
const store={
  get(k,d){try{const v=localStorage.getItem(k);if(v!==null)return JSON.parse(v);}catch(e){} return mem[k]!==undefined?mem[k]:d;},
  set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};
const normPhone=p=>{let d=String(p).replace(/\D/g,'');if(d.startsWith('855')&&d.length>=11)d='0'+d.slice(3);return d;};
function authenticate(mode,name,phone){
  const n=String(name).trim().replace(/\s+/g,' '), p=normPhone(phone);
  if(n.length<2) return {err:'Please enter your name.'};
  if(p.length<8||p.length>15) return {err:'Please enter a valid phone number, for example 096 241 9898.'};
  const users=store.get('kft_users',{}), u=users[p];
  if(mode==='signup'){
    if(u) return {err:'This phone number is already registered. Please log in.'};
    users[p]={name:n,created:Date.now()}; store.set('kft_users',users);
  } else {
    if(!u) return {err:'No account found for this number. Please sign up first.'};
    if(u.name.toLowerCase()!==n.toLowerCase()) return {err:'The name does not match this phone number.'};
  }
  const session={name:u?u.name:n,phone:p}; store.set('kft_session',session);
  return {session};
}

function AuthModal({start,onClose,onAuth}){
  const [mode,setMode]=useState(start),[name,setName]=useState(''),[phone,setPhone]=useState(''),[err,setErr]=useState('');
  const ref=useRef(null);
  useEffect(()=>{
    if(ref.current) ref.current.focus();
    const k=e=>{if(e.key==='Escape')onClose();};
    document.addEventListener('keydown',k);return()=>document.removeEventListener('keydown',k);
  },[]);
  const submit=()=>{const r=authenticate(mode,name,phone); if(r.err) return setErr(r.err); onAuth(r.session);};
  const enter=e=>{if(e.key==='Enter')submit();};
  const seg=(v,l)=>html`<button type="button" class="seg" aria-pressed=${mode===v} onClick=${()=>{setMode(v);setErr('');}}>${l}</button>`;
  return html`<div class="fixed inset-0 z-50 flex items-center justify-center p-4" style=${{background:'rgba(59,18,32,.5)'}} onClick=${onClose}>
    <div class="card p-5 sm:p-6 w-full fade" style=${{maxWidth:'420px'}} role="dialog" aria-modal="true" aria-labelledby="authTitle" onClick=${e=>e.stopPropagation()}>
      <div class="flex justify-between items-center mb-4">
        <h2 id="authTitle" class="text-xl font-bold">${mode==='login'?'Log in':'Sign up'}</h2>
        <button class="btn btn-g" style=${{height:'2.25rem',padding:'0 .8rem'}} aria-label="Close" onClick=${onClose}>×</button>
      </div>
      <div class="grid gap-4">
        <div class="flex gap-1 p-1 soft">${seg('login','Log in')}${seg('signup','Sign up')}</div>
        <label class="grid gap-1 text-sm font-semibold">Name
          <input ref=${ref} class="field" type="text" autoComplete="name" value=${name} onInput=${e=>setName(e.target.value)} onKeyDown=${enter}/></label>
        <label class="grid gap-1 text-sm font-semibold">Phone number
          <input class="field" type="tel" inputMode="tel" autoComplete="tel" placeholder="096 241 9898" value=${phone} onInput=${e=>setPhone(e.target.value)} onKeyDown=${enter}/></label>
        ${err&&html`<p role="alert" class="text-sm" style=${{color:'var(--primary)'}}>${err}</p>`}
        <button class="btn btn-p" onClick=${submit}>${mode==='login'?'Log in':'Create account'}</button>
        <p class="text-xs muted">Your name and phone number are saved on this device only. There is no code verification.</p>
      </div>
    </div></div>`;
}

function Shell(){
  const [tab,setTab]=useState(()=>{const h=location.hash.slice(1);return TOOLS[h]?h:'bazi';});
  const [user,setUser]=useState(()=>store.get('kft_session',null));
  const [auth,setAuth]=useState(null);
  useEffect(()=>{try{history.replaceState(null,'','#'+tab);}catch(e){}},[tab]);
  const Tool=TOOLS[tab];
  const logout=()=>{store.set('kft_session',null);setUser(null);};
  const small={height:'2.25rem',padding:'0 .9rem',fontSize:'.85rem'};
  return html`<div class="mx-auto px-4 pt-4 sm:pt-8" style=${{maxWidth:'600px'}}>
    <div class="flex justify-end items-center gap-2 mb-3" style=${{minHeight:'2.25rem'}}>
      ${user?html`<span class="text-sm muted" style=${{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>Hello, <b style=${{color:'var(--ink)'}}>${user.name}</b></span>
          <button class="btn btn-g" style=${small} onClick=${logout}>Log out</button>`
        :html`<button class="btn btn-g" style=${small} onClick=${()=>setAuth('signup')}>Sign up</button>
          <button class="btn btn-p" style=${small} onClick=${()=>setAuth('login')}>Log in</button>`}
    </div>
    <header class="text-center mb-5">
      <h1 class="text-3xl font-bold" style=${{color:'var(--primary)'}}>Khmer Fortune Teller</h1>
      <p class="muted text-sm mt-1">BaZi and Feng Shui calculators</p>
    </header>
    <nav class="card p-1 flex gap-1" role="tablist" aria-label="Calculators">
      ${TABS.map(([k,z,l])=>html`<button key=${k} role="tab" class="seg" aria-selected=${tab===k} aria-pressed=${tab===k}
        style=${{padding:'.5rem .1rem',lineHeight:1.25}} onClick=${()=>{setTab(k);window.scrollTo({top:0,behavior:'smooth'});}}>
        <span class="cn block" style=${{fontSize:'.95rem'}}>${z}</span><span class="block" style=${{fontSize:'.68rem'}}>${!user&&'🔒 '}${l}</span></button>`)}
    </nav>
    ${user?html`<div class="fade" key=${tab} style=${{paddingTop:'1rem'}}><${Tool}/></div>`
      :html`<div class="card p-6 mt-4 text-center fade">
        <div style=${{fontSize:'2.5rem',lineHeight:1}} aria-hidden="true">🔒</div>
        <h2 class="text-xl font-bold mt-3">Log in to use the calculators</h2>
        <p class="muted text-sm mt-2">Sign up with your name and phone number to open the BaZi and Kua, San Yuan Water, Five Ghosts, and Tān Láng calculators.</p>
        <div class="flex gap-3 justify-center mt-5">
          <button class="btn btn-p" onClick=${()=>setAuth('login')}>Log in</button>
          <button class="btn btn-g" onClick=${()=>setAuth('signup')}>Sign up</button>
        </div></div>`}
    <footer class="text-center text-sm muted mt-6 pt-4 pb-8" style=${{borderTop:'1px solid var(--line)'}}>By Kang Puthearoath</footer>
    ${auth&&html`<${AuthModal} start=${auth} onClose=${()=>setAuth(null)} onAuth=${u=>{setUser(u);setAuth(null);}}/>`}
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${Shell}/>`);

</script>
</body>
</html>
