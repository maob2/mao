/* ---------- BaZi calculation ---------- */
function jieList(y){
  const c=y>=2001?C21:C20, Y=y>=2001?y-2000:y-1900;
  return c.map((k,i)=>({t:Date.UTC(y,i,Math.floor(Y*0.2422+k)-Math.floor((Y-1)/4)),b:JIE_BR[i]}));
}
const idx60=(s,b)=>{for(let k=0;k<60;k++) if(k%10===s&&k%12===b) return k;};
function calc(dateStr,timeStr,gender){
  const [Y,M,D0]=dateStr.split('-').map(Number), tt=Date.UTC(Y,M-1,D0);
  const all=[...jieList(Y-1),...jieList(Y),...jieList(Y+1)];
  let mi=0; all.forEach((j,i)=>{if(j.t<=tt) mi=i;});
  const by=tt>=jieList(Y)[1].t?Y:Y-1, ys=((by-4)%10+10)%10, yb=((by-4)%12+12)%12;
  const mb=all[mi].b, ms=((ys%5)*2+2+((mb-2+12)%12))%10;
  const n=Math.round((tt-Date.UTC(2000,0,1))/864e5), di=(((54+n)%60)+60)%60, ds=di%10, db=di%12;
  const pillars=[{s:ys,b:yb},{s:ms,b:mb},{s:ds,b:db}];
  if(timeStr){const h=parseInt(timeStr,10), hb=Math.floor((h+1)/2)%12; pillars.push({s:((ds%5)*2+hb)%10,b:hb});}
  else pillars.push({s:null,b:null});
  const el=[0,0,0,0,0], dm=Math.floor(ds/2); let support=0,total=0;
  const add=(e,w)=>{el[e]+=w;total+=w;if(e===dm||e===(dm+4)%5) support+=w;};
  pillars.forEach((p,i)=>{
    if(p.s===null) return;
    if(i!==2) add(Math.floor(p.s/2),i===1?1.5:1);
    const hs=HIDDEN[p.b], bw=[1,2.5,1.5,1][i];
    hs.forEach((h,k)=>add(Math.floor(h/2),bw*HW[hs.length][k]));
  });
  const pct=Math.round(support/total*100), zi=ZMAX.findIndex(m=>pct<m);
  let gods;
  if(pct<=45) gods=[{e:(dm+4)%5,r:0},{e:dm,r:1}];
  else if(pct>=55) gods=[{e:(dm+1)%5,r:2},{e:(dm+2)%5,r:3}];
  else gods=[{e:el.indexOf(Math.min(...el)),r:4}];
  const fwd=(ys%2===0)===(gender==='male');
  const days=fwd?(all[mi+1].t-tt)/864e5:(tt-all[mi].t)/864e5, startAge=days/3, mIdx=idx60(ms,mb);
  const cycles=Array.from({length:8},(_,i)=>{
    const k=(((mIdx+(fwd?i+1:-(i+1)))%60)+60)%60, a=startAge+i*10;
    return {s:k%10,b:k%12,age:a,year:Y+Math.floor(a)};
  });
  return {pillars,el,pct,zi,gods,dm,fwd,startAge,cycles,hasHour:!!timeStr};
}

/* ---------- Feng Shui calculation ---------- */
const rd=n=>{while(n>9) n=[...String(n)].reduce((a,b)=>a+ +b,0);return n;};
const TRI={1:{d:0,l:'010'},8:{d:1,l:'001'},3:{d:2,l:'100'},4:{d:3,l:'011'},9:{d:4,l:'101'},2:{d:5,l:'000'},7:{d:6,l:'110'},6:{d:7,l:'111'}};
const RULES=[[2],[0,1],[0,1,2],[],[0],[1,2],[0,2],[1]]; /* Sheng Qi, Tian Yi, Yan Nian, Fu Wei, Huo Hai, Wu Gui, Liu Sha, Jue Ming */
const TS=[0,1,1,2,3,3,4,5,5,6,7,7];
const GRID=[3,4,5,2,'c',6,1,0,7], FLY=[7,6,1,4,0,5,2,3];
function fsCalc(dateStr,gender,cy){
  const [Y,M,D0]=dateStr.split('-').map(Number);
  const by=Date.UTC(Y,M-1,D0)>=jieList(Y)[1].t?Y:Y-1;
  const yy=by>=2000?by-2000:by-1900, s=rd([...String(yy)].reduce((a,b)=>a+ +b,0));
  let kua=rd(by>=2000?(gender==='male'?9-s:6+s):(gender==='male'?10-s:5+s))||9;
  if(kua===5) kua=gender==='male'?2:8;
  const base=TRI[kua].l, rule=Array(8), byRule=Array(8);
  RULES.forEach((f,i)=>{
    const l=[...base]; f.forEach(p=>l[p]=l[p]==='1'?'0':'1');
    const k=+Object.keys(TRI).find(k=>TRI[k].l===l.join('')); rule[TRI[k].d]=i; byRule[i]=TRI[k].d;
  });
  let c=11-rd(cy); while(c>9) c-=9;
  const star=Array(8); FLY.forEach((d,k)=>{star[d]=((c-1+k+1)%9)+1;});
  const yb=((cy-4)%12+12)%12;
  return {kua,east:[1,3,4,9].includes(kua),rule,byRule,c,star,cy,ys:((cy-4)%10+10)%10,yb,ts:TS[yb]};
}

/* ---------- components ---------- */
const polar=(p,r=80)=>{const a=Math.PI*(1-p/100);return [100+r*Math.cos(a),100-r*Math.sin(a)];};
const arc=(a,b)=>{const [x1,y1]=polar(a),[x2,y2]=polar(b);return `M${x1} ${y1} A80 80 0 0 1 ${x2} ${y2}`;};

function Gauge({pct,zi}){
  let from=0; const zones=t('zones');
  return html`<div class="mx-auto" style=${{maxWidth:'320px'}}>
    <svg viewBox="0 0 200 120" class="w-full" role="img" aria-label=${pct+'% '+zones[zi]}>
      ${ZMAX.map((m,i)=>{const s=from;from=Math.min(m,100);return html`<path key=${i} d=${arc(s,from)} fill="none" stroke=${ZCOL[i]} strokeWidth="16" opacity=${i===zi?1:.35} style=${{transition:'opacity .6s'}}/>`;})}
      <g style=${{transformOrigin:'100px 100px',transform:`rotate(${pct*1.8-90}deg)`,transition:'transform .9s cubic-bezier(.2,.8,.2,1)'}}>
        <line x1="100" y1="100" x2="100" y2="34" stroke="var(--ink)" strokeWidth="3" strokeLinecap="round"/></g>
      <circle cx="100" cy="100" r="7" fill="var(--ink)"/>
    </svg>
  </div>`;
}

function Pillar({p,i}){
  const main=i===2, label=t('pl')[i];
  if(p.s===null) return html`<div class="soft p-3 text-center flex flex-col items-center justify-center opacity-70">
    <div class="text-xs muted mb-1">${label}</div><div class="text-sm muted">${t('needTime')}</div></div>`;
  const en=t('el'), se=Math.floor(p.s/2);
  return html`<div class="p-3 text-center rounded-2xl" style=${{background:main?'var(--primary)':'var(--soft)',border:'1px solid var(--line)',color:main?'#fff':'var(--ink)'}}>
    <div class="text-xs mb-2" style=${{opacity:.85}}>${label}${main?' · '+t('dmTag'):''}</div>
    <div class="cn text-4xl leading-none">${STEMS[p.s]}</div>
    <div class="text-xs mt-1" style=${{opacity:.85}}>${STEM_PY[p.s]} · ${en[se]}</div>
    <div class="cn text-4xl leading-none mt-3">${BR[p.b]}</div>
    <div class="text-xs mt-1" style=${{opacity:.85}}>${BR_PY[p.b]} · ${t('an')[p.b]}</div>
    <div class="text-xs mt-1" style=${{opacity:.85}}>${en[BR_EL[p.b]]}</div>
  </div>`;
}

function Result({r}){
  const [tab,setTab]=useState(0), max=Math.max(...r.el,1), en=t('el'), zn=t('zones')[r.zi], zc=ZCOL[r.zi];
  return html`<div class="card p-5 sm:p-6 mt-5 fade">
    <div class="text-center">
      <div class="text-sm muted">${t('strength')}</div>
      <div class="font-bold leading-none my-2" style=${{fontSize:'4.5rem',color:zc,transition:'color .7s'}}>${r.pct}<span class="text-3xl">%</span></div>
      <div class="font-semibold mb-3" style=${{color:zc,transition:'color .7s'}}>${zn}</div>
      <${Gauge} pct=${r.pct} zi=${r.zi}/>
    </div>
    <${Tabs} labels=${t('tabs')} tab=${tab} setTab=${setTab}/>
    ${tab===0&&html`<div class="mt-5 fade">
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">${[3,2,1,0].map(i=>html`<${Pillar} key=${i} p=${r.pillars[i]} i=${i}/>`)}</div>
      <p class="text-xs muted mt-3">${t('rl')}</p></div>`}
    ${tab===1&&html`<div class="mt-5 fade">
      <p class="text-sm">${t('dmText')(STEMS[r.pillars[2].s],en[r.dm],r.pct,zn)}</p>
      <h3 class="font-semibold mt-5 mb-2">${t('gods')}</h3>
      <div class="grid gap-2">${r.gods.map(g=>html`<div key=${g.e} class="soft p-3 flex items-center gap-3">
        <div class="cn w-11 h-11 rounded-xl grid place-items-center text-2xl text-white shrink-0" style=${{background:ELC[g.e].col}}>${ELC[g.e].c}</div>
        <div><div class="font-semibold">${en[g.e]}</div><div class="text-sm muted">${t('roles')[g.r]}</div></div></div>`)}</div>
      <h3 class="font-semibold mt-5 mb-2">${t('five')}</h3>
      <div class="grid gap-2">${r.el.map((v,i)=>html`<div key=${i} class="flex items-center gap-3 text-sm">
        <span class="w-16">${en[i]}</span>
        <div class="flex-1 h-3 rounded-full soft overflow-hidden"><div class="h-full rounded-full" style=${{width:(v/max*100)+'%',background:ELC[i].col,transition:'width .8s'}}></div></div>
        <span class="w-9 text-right muted">${v.toFixed(1)}</span></div>`)}</div></div>`}
    ${tab===2&&html`<div class="mt-5 fade">
      <p class="text-sm">${t('luckText')(r.fwd?t('fwd'):t('bwd'),r.startAge.toFixed(1))}</p>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-4">${r.cycles.map((c,i)=>html`<div key=${i} class="soft p-3 text-center">
        <div class="cn text-3xl leading-none">${STEMS[c.s]}</div><div class="cn text-3xl leading-none mt-1">${BR[c.b]}</div>
        <div class="text-xs mt-2">${en[Math.floor(c.s/2)]} · ${t('an')[c.b]}</div>
        <div class="text-xs muted mt-1">${t('age')} ${Math.floor(c.age)}–${Math.floor(c.age)+9}</div>
        <div class="text-xs muted">${c.year}–${c.year+9}</div></div>`)}</div></div>`}
    ${!r.hasHour&&html`<p class="text-xs muted mt-5">${t('tip')}</p>`}
  </div>`;
}

function Tabs({labels,tab,setTab}){
  return html`<div class="flex gap-1 p-1 mt-6 soft" role="tablist">${labels.map((l,k)=>html`<button key=${k} role="tab" class="tab" aria-selected=${tab===k} onClick=${()=>setTab(k)}>${l}</button>`)}</div>`;
}

function Grid({cells}){
  return html`<div class="grid grid-cols-3 gap-2">${cells.map((c,i)=>html`<div key=${i} class="cell" style=${{background:c.bg}}>
    ${c.dot&&html`<span style=${{position:'absolute',top:6,right:6,width:9,height:9,borderRadius:'50%',background:c.dot}}></span>`}
    <div class="text-xs muted">${c.top}</div>
    <div class=${c.big.length>3?'text-sm font-bold':'text-3xl font-bold leading-tight'} style=${{color:c.col}}>${c.big}</div>
    <div style=${{fontSize:'.68rem',lineHeight:1.3}} class="muted px-1">${c.sub}</div></div>`)}</div>`;
}

function FsResult({r}){
  const [tab,setTab]=useState(0), dirs=t('dirs'), dn=t('dn'), stars=t('stars'), en=t('el');
  const G='#16a34a', R='#e11d48', GOOD=[1,4,6,8,9];
  const bz=GRID.map(d=>d==='c'?{top:t('kua'),big:String(r.kua),sub:t('grp')[r.east?0:1],bg:'var(--soft)',col:'var(--primary)'}
    :{top:dirs[d],big:dn[r.rule[d]].n,sub:dn[r.rule[d]].m,bg:r.rule[d]<4?'rgba(22,163,74,.14)':'rgba(225,29,72,.12)',col:r.rule[d]<4?G:R});
  const an=GRID.map(d=>{const s=d==='c'?r.c:r.star[d], ok=GOOD.includes(s);
    return {top:d==='c'?t('center'):dirs[d],big:String(s),sub:stars[s-1],bg:ok?'rgba(22,163,74,.10)':'rgba(225,29,72,.10)',col:ok?G:R,
      dot:d==='c'?null:(r.rule[d]<4?G:R)};});
  const list=(from,to,col)=>html`<div class="grid gap-2">${r.byRule.slice(from,to).map((d,k)=>html`<div key=${k} class="soft p-3 flex items-center gap-3">
    <div class="w-2 self-stretch rounded-full" style=${{background:col}}></div>
    <div><div class="font-semibold">${dirs[d]} · ${dn[from+k].n}</div><div class="text-sm muted">${dn[from+k].m}</div></div></div>`)}</div>`;
  return html`<div class="card p-5 sm:p-6 mt-5 fade">
    <div class="text-center">
      <div class="text-sm muted">${t('kua')}</div>
      <div class="font-bold leading-none my-2" style=${{fontSize:'5rem',color:r.east?'#16a34a':'var(--primary)',transition:'color .7s'}}>${r.kua}</div>
      <div class="font-semibold" style=${{color:r.east?'#16a34a':'var(--primary)',transition:'color .7s'}}>${t('grp')[r.east?0:1]}</div>
    </div>
    <${Tabs} labels=${t('fsTabs')} tab=${tab} setTab=${setTab}/>
    ${tab===0&&html`<div class="mt-5 fade">
      <${Grid} cells=${bz}/><p class="text-xs muted mt-2">${t('southTop')}</p>
      <h3 class="font-semibold mt-5 mb-2" style=${{color:G}}>${t('good')}</h3>${list(0,4,G)}
      <h3 class="font-semibold mt-5 mb-2" style=${{color:R}}>${t('bad')}</h3>${list(4,8,R)}</div>`}
    ${tab===1&&html`<div class="mt-5 fade">
      <h3 class="font-semibold mb-2">${t('yearInfo')} ${r.cy}</h3>
      <div class="soft p-3 flex items-center gap-4 mb-4">
        <div class="cn text-3xl leading-none text-center">${STEMS[r.ys]}<br/>${BR[r.yb]}</div>
        <div class="text-sm"><div>${STEM_PY[r.ys]} ${BR_PY[r.yb]} · ${en[Math.floor(r.ys/2)]} ${t('an')[r.yb]}</div>
          <div class="muted">${t('center')}: ${r.c}</div>
          <div class="muted">${t('taiSui')}: ${dirs[r.ts]} · ${t('suiPo')}: ${dirs[(r.ts+4)%8]}</div></div></div>
      <h3 class="font-semibold mb-2">${t('annTitle')}</h3>
      <${Grid} cells=${an}/><p class="text-xs muted mt-2">${t('southTop')} ${t('dots')}</p></div>`}
    <p class="text-xs muted mt-5">${t('fsDisc')}</p>
  </div>`;
}

function App(){
  const [lang,setLang]=useState('en'), [mode,setMode]=useState(0);
  const [date,setDate]=useState(''),[time,setTime]=useState(''),[gender,setGender]=useState('');
  const [cy,setCy]=useState(String(new Date().getFullYear()));
  const [err,setErr]=useState(''),[res,setRes]=useState(null),[fres,setFres]=useState(null);
  L=lang;
  useEffect(()=>{document.documentElement.lang=lang;},[lang]);
  const submit=()=>{
    if(!date) return setErr('eDate');
    const y=+date.slice(0,4); if(y<1901||y>2100) return setErr('eYear');
    if(!gender) return setErr('eGender');
    if(mode===0){ setErr(''); setRes(calc(date,time,gender)); }
    else { const c=+cy; if(!(c>=1901&&c<=2100)) return setErr('eCy'); setErr(''); setFres(fsCalc(date,gender,c)); }
  };
  const reset=()=>{setDate('');setTime('');setGender('');setErr('');setRes(null);setFres(null);setCy(String(new Date().getFullYear()));};
  const opt=(v,l)=>html`<button type="button" onClick=${()=>setGender(v)} aria-pressed=${gender===v} class="btn flex-1" style=${{border:'1px solid var(--line)',background:gender===v?'var(--primary)':'var(--card)',color:gender===v?'#fff':'var(--ink)'}}>${l}</button>`;
  const lb=(k,l)=>html`<button onClick=${()=>setLang(k)} aria-pressed=${lang===k} class="px-3 py-1 rounded-full text-sm" style=${{background:lang===k?'var(--primary)':'transparent',color:lang===k?'#fff':'var(--muted)'}}>${l}</button>`;
  return html`<main class="mx-auto px-4 py-6 sm:py-10" style=${{maxWidth:'560px'}}>
    <div class="flex justify-end"><div class="card flex p-1 gap-1" style=${{borderRadius:'999px'}}>${lb('en','EN')}${lb('km','ខ្មែរ')}</div></div>
    <header class="text-center mb-6 mt-2">
      <div class="cn text-5xl" style=${{color:'var(--primary)'}}>八字 風水</div>
      <h1 class="text-3xl font-bold mt-2" style=${{color:'var(--primary)'}}>Khmer Fortune Teller</h1>
      <h2 class="text-lg font-semibold mt-1">${t('title')}</h2>
      <p class="muted text-sm mt-1">${t('sub')}</p>
    </header>
    <section class="card p-5 sm:p-6">
      <div class="flex gap-1 p-1 soft mb-5" role="tablist">${[t('mBazi'),t('mFs')].map((l,k)=>html`<button key=${k} role="tab" class="tab" style=${{fontSize:'1rem'}} aria-selected=${mode===k} onClick=${()=>{setMode(k);setErr('');}}>${l}</button>`)}</div>
      <div class="grid gap-4">
        <label class="grid gap-1 text-sm font-semibold">${t('date')}
          <input class="field" type="date" min="1901-01-01" max="2100-12-31" value=${date} onInput=${e=>setDate(e.target.value)}/></label>
        ${mode===0&&html`<label class="grid gap-1 text-sm font-semibold">${t('time')} <span class="muted font-normal">${t('opt')}</span>
          <input class="field" type="time" value=${time} onInput=${e=>setTime(e.target.value)}/></label>`}
        ${mode===1&&html`<label class="grid gap-1 text-sm font-semibold">${t('cyear')}
          <input class="field" type="number" inputmode="numeric" min="1901" max="2100" value=${cy} onInput=${e=>setCy(e.target.value)}/></label>`}
        <div class="grid gap-1 text-sm font-semibold">${t('gender')}<div class="flex gap-3">${opt('female',t('female'))}${opt('male',t('male'))}</div></div>
        ${err&&html`<p role="alert" class="text-sm" style=${{color:'var(--primary)'}}>${t(err)}</p>`}
        <div class="flex gap-3"><button class="btn btn-p flex-1" onClick=${submit}>${t('calc')}</button><button class="btn btn-g" onClick=${reset}>${t('reset')}</button></div>
      </div>
    </section>
    ${mode===0&&res&&html`<${Result} r=${res}/>`}
    ${mode===1&&fres&&html`<${FsResult} r=${fres}/>`}
    ${mode===0&&html`<p class="text-xs muted text-center mt-6">${t('disc')}</p>`}
    <footer class="text-center text-sm muted mt-6 pt-4" style=${{borderTop:'1px solid var(--line)'}}>${lang==='km'?'ដោយ ':'By '}Kang Puthearoath</footer>
  </main>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
