<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khmer Fortune Teller – អត្ថន័យបៃតារ៉ូ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600;700&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<style>
:root{--bg:#FFDCE8;--card:#FFFFFF;--ink:#3B1220;--muted:#7A5560;--line:#FBCFE8;--soft:#FFF7F8;--primary:#E11D48;--primary-d:#BE123C;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans Khmer","Khmer OS Battambang","Leelawadee UI",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.85;min-height:100vh}
.card{background:var(--card);border:1px solid var(--line);border-radius:1.25rem;box-shadow:0 2px 6px rgba(190,18,60,.06),0 12px 32px rgba(190,18,60,.08)}
.soft{background:var(--soft);border:1px solid var(--line);border-radius:1rem}
.muted{color:var(--muted)}
.field{width:100%;height:3.2rem;padding:0 .9rem;font-size:16px;border-radius:.75rem;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.field:focus{outline:2px solid var(--primary);border-color:var(--primary)}
.btn{height:3rem;border-radius:.75rem;font-weight:600;padding:0 1.25rem;transition:background-color .2s,transform .1s}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--primary);color:#fff}.btn-p:hover{background:var(--primary-d)}
.btn-g{border:1px solid var(--line);color:var(--ink);background:var(--card)}.btn-g:hover{background:var(--soft)}
.seg{flex:1;padding:.55rem .5rem;border-radius:.65rem;transition:background-color .25s,color .25s;color:var(--muted)}
.seg[aria-pressed="true"]{background:var(--primary);color:#fff}
.tcard{width:130px;height:200px;border-radius:14px;border:3px solid #fff;box-shadow:0 10px 24px rgba(0,0,0,.2);display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:12px 8px;color:#fff;text-align:center;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.tcard .num{font-family:Georgia,serif;font-size:1.1rem;letter-spacing:.08em}
.tcard .sym{font-size:3rem;line-height:1}
.tcard .nm{font-size:.8rem;line-height:1.4;font-weight:600}
table{width:100%;border-collapse:separate;border-spacing:0}
th,td{padding:.7rem .8rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{font-size:.85rem;color:var(--muted);background:var(--soft)}
td.k{white-space:nowrap;font-weight:700;width:1%}
tr.hl td{background:#FFE9F0}
.tag{display:inline-block;font-size:.7rem;font-weight:600;border-radius:.5rem;padding:0 .45rem;background:var(--soft);border:1px solid var(--line);color:var(--muted);margin-left:.4rem}
.fade{animation:fade .5s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const {useState} = React;
const html = htm.bind(React.createElement);

/* ---------- Major Arcana: [English, Khmer, numeral, "general|work|money|love|health|reversed"] ---------- */
const MAJOR=[
['The Fool','ក្មេងល្ងង់','0','ការចាប់ផ្តើមថ្មី ការផ្សងព្រេង និងសេរីភាព។ ជឿជាក់លើដំណើរ ហើយហ៊ានជំហានដំបូង ប៉ុន្តែកុំប្រថុយដោយគ្មានការគិត។|ឱកាសការងារថ្មី ឬផ្លូវអាជីពថ្មី។ ស័ក្តិសមនឹងការចាប់ផ្តើមគម្រោងថ្មី។|ហិរញ្ញវត្ថុអាចរកបានងាយ ប៉ុន្តែកុំចំណាយឥតគិត។|ស្នេហាថ្មីកំពុងចាប់ផ្តើម។ អ្នកលីវអាចជួបគូនៅពេលឆាប់ៗ។|មានកម្លាំងល្អ ប៉ុន្តែប្រយ័ត្នរបួសពីការធ្វេសប្រហែស។|ការសម្រេចចិត្តខុស ភាពមិនគិតពិចារណា ឬការខ្លាចចាប់ផ្តើម។ ប្រយ័ត្នការប្រថុយហួសហេតុ។'],
['The Magician','អ្នកវេទមន្ត','I','ឆន្ទៈ ជំនាញ និងសមត្ថភាពក្នុងការបង្កើតអ្វីដែលចង់បាន។ អ្នកមានឧបករណ៍គ្រប់គ្រាន់ហើយ គឺដល់ពេលចាប់ផ្តើមធ្វើ។|ល្អសម្រាប់អ្នកលក់ អ្នកទំនាក់ទំនង គ្រូបង្រៀន និងអ្នកជំនួញ។ ជំនាញរបស់អ្នកនឹងត្រូវបានគេទទួលស្គាល់។|អាចបង្កើតប្រាក់ចំណូលពីសមត្ថភាពរបស់ខ្លួនឯង។|មានមន្តស្នេហ៍ ទាក់ទាញអ្នកដទៃ។ ត្រូវស្មោះត្រង់ និងនិយាយឱ្យច្បាស់។|ថាមពលល្អ ចិត្តមានកម្លាំង។|ល្បិចកល ការបោកបញ្ឆោត ឬមិនប្រើសមត្ថភាពឱ្យអស់។'],
['The High Priestess','បូជាចារិនីជាន់ខ្ពស់','II','ញាណ ចិត្តស្ងប់ និងអាថ៌កំបាំង។ ស្តាប់សំឡេងខាងក្នុង ហើយរង់ចាំចម្លើយដែលមិនទាន់លាតត្រដាង។|ស័ក្តិសមនឹងការស្រាវជ្រាវ ការសិក្សា និងការងារដែលត្រូវការការសង្កេតយ៉ាងជ្រៅ។ កុំប្រញាប់សម្រេចចិត្ត។|ហិរញ្ញវត្ថុមានស្ថិរភាព តែមានព័ត៌មានដែលអ្នកមិនទាន់ដឹង។ ពិនិត្យឱ្យច្បាស់មុនវិនិយោគ។|ទំនាក់ទំនងមានអាថ៌កំបាំង ឬអារម្មណ៍ដែលមិនទាន់បង្ហាញ។ អ្នកលីវអាចមានស្នេហាស្ងាត់ៗ។|ត្រូវយកចិត្តទុកដាក់លើបញ្ហាខាងក្នុង ដូចជាអ័រម៉ូន និងភាពស្ងប់នៃចិត្ត។|មិនស្តាប់ញាណ ការលាក់បាំង ឬអាថ៌កំបាំងត្រូវបានលាតត្រដាង។'],
['The Empress','ព្រះចក្រពត្តិនី','III','ភាពសម្បូរណ៍ ភាពជាម្តាយ និងការបង្កើត។ ពេលវេលាល្អសម្រាប់ថែរក្សា និងទទួលផល។|ការងារច្នៃប្រឌិត សិល្បៈ ការថែទាំ និងអាជីវកម្មដែលកំពុងរីកលូតលាស់។|ចំណូលកើនឡើង និងមានភាពសម្បូរណ៍។|ស្នេហាកក់ក្តៅ ផ្អែមល្ហែម។ អាចមានដំណឹងអំពីកូន ឬការរៀបការ។|សុខភាពល្អ ជាពិសេសចំពោះស្ត្រី។ ប្រយ័ត្នការបរិភោគលើស។|ការពឹងផ្អែកហួសហេតុ ស្នេហាស្ទះ ឬខ្វះការថែរក្សាខ្លួន។'],
['The Emperor','ព្រះចក្រពត្តិ','IV','អំណាច ការរៀបចំ និងភាពជាអ្នកដឹកនាំ។ ត្រូវមានវិន័យ និងរចនាសម្ព័ន្ធច្បាស់លាស់។|មុខតំណែងខ្ពស់ ការគ្រប់គ្រង ឬអាជីវកម្មផ្ទាល់ខ្លួន។ ស័ក្តិសមនឹងអ្នកគ្រប់គ្រង។|ហិរញ្ញវត្ថុមានស្ថិរភាព ដោយសារការគ្រប់គ្រងល្អ។|ទំនាក់ទំនងមាំមួន ប៉ុន្តែអាចមានការត្រួតត្រាលើគ្នា។|កម្លាំងល្អ ប្រយ័ត្នស្ត្រេស និងសម្ពាធឈាម។|ការប្រើអំណាចជ្រុល ភាពរឹងរូស ឬខ្វះវិន័យ។'],
['The Hierophant','បូជាចារ្យជាន់ខ្ពស់','V','ប្រពៃណី គ្រូ និងការបង្រៀន។ ធ្វើតាមច្បាប់ ទំនៀមទម្លាប់ និងស្វែងរកដំបូន្មានពីអ្នកចេះដឹង។|ការងារក្នុងស្ថាប័ន ការអប់រំ ឬសាសនា។ ត្រូវធ្វើតាមនីតិវិធី។|ហិរញ្ញវត្ថុមានស្ថិរភាពតាមវិធីប្រពៃណី។ ជៀសវាងការប្រថុយ។|ទំនាក់ទំនងដែលនាំទៅរកអាពាហ៍ពិពាហ៍ ឬការសន្យាជាផ្លូវការ។|ធ្វើតាមការណែនាំរបស់វេជ្ជបណ្ឌិត និងរក្សាទម្លាប់ល្អ។|ប្រឆាំងនឹងច្បាប់ មិនទទួលយកដំបូន្មាន ឬជំនឿងងឹតងងុល។'],
['The Lovers','គូស្នេហ៍','VI','ស្នេហា ការជ្រើសរើស និងសាមគ្គីភាព។ ការសម្រេចចិត្តសំខាន់ដែលពាក់ព័ន្ធនឹងតម្លៃពិតរបស់ខ្លួន។|ភាពជាដៃគូក្នុងអាជីវកម្ម ឬការជ្រើសរើសមិត្តរួមការងារ។|ការរួមទុនជាមួយអ្នកដទៃអាចផ្តល់ផល ប្រសិនបើទុកចិត្តគ្នា។|ស្នេហាជ្រៅ ការភ្ជាប់ចិត្ត។ អ្នកលីវអាចជួបមនុស្សពិសេស។|តុល្យភាពរវាងចិត្តនិងកាយ។ ប្រយ័ត្នអារម្មណ៍ប៉ះពាល់សុខភាព។|ការមិនត្រូវគ្នា ការនិយាយមិនស្មោះ ឬការសម្រេចចិត្តខុស។'],
['The Chariot','រទេះចម្បាំង','VII','ជ័យជម្នះដោយការគ្រប់គ្រងខ្លួន និងការតាំងចិត្ត។ ទិសដៅច្បាស់ និងការជំរុញទៅមុខ។|ការងារទាក់ទងនឹងការធ្វើដំណើរ ដឹកជញ្ជូន ឬការប្រកួតប្រជែង។ នឹងទទួលជោគជ័យប្រសិនបើអត់ធ្មត់។|ប្រាក់ចំណូលអាចមកពីការខិតខំ។ ឆ្លងកាត់ឧបសគ្គហិរញ្ញវត្ថុបាន។|ទំនាក់ទំនងរីកចម្រើន។ អ្នកលីវអាចជួបគូពេលធ្វើដំណើរ។|មានកម្លាំង ប៉ុន្តែប្រយ័ត្នអស់កម្លាំងពីការខំហួសកម្រិត។|បាត់ទិសដៅ ការគ្រប់គ្រងខ្លួនខ្សោយ ឬការប្រកួតប្រជែងដែលចាញ់។'],

 x:['ត្រូវប្រយ័ត្នឧបសគ្គ ឬការលំបាក។','ត្រូវប្រយ័ត្នការខាតបង់។','មានបញ្ហា ឬការឈឺចាប់ដែលត្រូវដោះស្រាយ។','ត្រូវយកចិត្តទុកដាក់ និងពិនិត្យសុខភាព។']};

/* ---------- build the 78 cards ---------- */
const CARDS=[];
MAJOR.forEach((m,i)=>{const f=m[3].split('|');
  CARDS.push({id:'m'+i,grp:'major',en:m[0],kh:m[1],num:m[2],sym:'✦',col:'#7C3AED',
    rows:[['general',f[0]],['work',f[1]],['money',f[2]],['love',f[3]],['health',f[4]]],rev:f[5],bySuit:false});});
SUITS.forEach(s=>MINOR[s.k].forEach((d,i)=>{const [g,r,t]=d.split('|'),sr=SUIT_READ[s.k],tr=TONE_READ[t];
  CARDS.push({id:s.k+i,grp:s.k,en:RK_EN[i]+' of '+s.en,kh:RK_KH[i]+'នៃ'+s.kh,num:i<10?String(i+1):RK_EN[i],sym:s.em,col:s.col,
    rows:[['general',g],['work',sr[0]+' '+tr[0],1],['money',sr[1]+' '+tr[1],1],['love',sr[2]+' '+tr[2],1],['health',sr[3]+' '+tr[3],1]],rev:r,bySuit:true});}));

const LABEL={general:'អត្ថន័យទូទៅ',work:'ការងារ',money:'ហិរញ្ញវត្ថុ',love:'ស្នេហា',health:'សុខភាព'};
const GROUPS=[['major','ឈុតធំ (Major Arcana)'],['wands','ឈុតដំបង (Wands)'],['cups','ឈុតពែង (Cups)'],['swords','ឈុតដាវ (Swords)'],['pentacles','ឈុតកាក់ (Pentacles)']];

/* ---------- components ---------- */
function TarotCard({c,reversed}){
  return html`<div class="tcard" style=${{background:`linear-gradient(160deg,${c.col},#1B0A12)`,transform:reversed?'rotate(180deg)':'none'}} aria-hidden="true">
    <div class="num">${c.num}</div><div class="sym">${c.sym}</div><div class="nm">${c.kh}</div></div>`;
}

function Result({c,rev,setRev}){
  const rows=[...c.rows.map(([k,t,s])=>({k,label:LABEL[k],t,s})),{k:'rev',label:'បៃត្រឡប់',t:c.rev,hl:rev}];
  return html`<div class="card p-5 sm:p-6 mt-5 fade">
    <div class="flex flex-col sm:flex-row gap-5 items-center">
      <${TarotCard} c=${c} reversed=${rev}/>
      <div class="text-center sm:text-left">
        <h2 class="text-2xl font-bold" style=${{color:'var(--primary)'}}>${c.kh}</h2>
        <div class="muted">${c.en}</div>
        <div class="flex gap-1 p-1 soft mt-3" style=${{width:'fit-content'}}>
          <button class="seg px-4" aria-pressed=${!rev} onClick=${()=>setRev(false)}>បៃត្រង់</button>
          <button class="seg px-4" aria-pressed=${rev} onClick=${()=>setRev(true)}>បៃត្រឡប់</button>
        </div>
      </div>
    </div>
    <h3 class="font-semibold mt-6 mb-2">តារាងអត្ថន័យពេញលេញ</h3>
    <div class="overflow-x-auto soft"><table style=${{minWidth:'420px'}}>
      <thead><tr><th>ប្រធានបទ</th><th>អត្ថន័យ</th></tr></thead>
      <tbody>${rows.map(r=>html`<tr key=${r.k} class=${r.hl?'hl':''}>
        <td class="k">${r.label}${r.s&&html`<span class="tag">តាមឈុត</span>`}</td><td>${r.t}</td></tr>`)}</tbody></table></div>
    ${c.bySuit&&html`<p class="text-sm muted mt-2">ជួរដែលមានស្លាក «តាមឈុត» ត្រូវបានបកស្រាយតាមលក្ខណៈនៃឈុតបៃ និងលក្ខណៈទូទៅនៃបៃនីមួយៗ។</p>`}
  </div>`;
}

function App(){
  const [id,setId]=useState(''),[rev,setRev]=useState(false);
  const c=CARDS.find(x=>x.id===id);
  const draw=()=>{const k=CARDS[Math.floor(Math.random()*CARDS.length)];setId(k.id);setRev(Math.random()<0.3);};
  const reset=()=>{setId('');setRev(false);};
  return html`<main class="mx-auto px-4 py-6 sm:py-10" style=${{maxWidth:'640px'}}>
    <header class="text-center mb-6">
      <div class="text-5xl" aria-hidden="true">🔮</div>
      <h1 class="text-3xl font-bold mt-2" style=${{color:'var(--primary)'}}>Khmer Fortune Teller</h1>
      <h2 class="text-xl font-semibold mt-1">អត្ថន័យបៃតារ៉ូ</h2>
      <p class="muted text-sm mt-1">ជ្រើសរើសឈ្មោះបៃតារ៉ូ ដើម្បីមើលអត្ថន័យពេញលេញ</p>
    </header>
    <section class="card p-5 sm:p-6"><div class="grid gap-4">
      <label class="grid gap-1 font-semibold">ជ្រើសរើសបៃតារ៉ូ
        <select class="field" value=${id} onChange=${e=>{setId(e.target.value);setRev(false);}}>
          <option value="">— សូមជ្រើសរើស —</option>
          ${GROUPS.map(([g,l])=>html`<optgroup key=${g} label=${l}>${CARDS.filter(x=>x.grp===g).map(x=>html`<option key=${x.id} value=${x.id}>${x.kh} (${x.en})</option>`)}</optgroup>`)}
        </select></label>
      <div class="flex gap-3"><button class="btn btn-p flex-1" onClick=${draw}>ចាប់ឆ្នោតបៃ</button><button class="btn btn-g" onClick=${reset}>សម្អាត</button></div>
    </div></section>
    ${c?html`<${Result} c=${c} rev=${rev} setRev=${setRev}/>`:html`<p class="text-center muted mt-6">មិនទាន់បានជ្រើសរើសបៃទេ។ សូមជ្រើសរើសបៃ ឬចុច «ចាប់ឆ្នោតបៃ»។</p>`}
    <p class="text-xs muted text-center mt-6">សម្រាប់ការសិក្សា និងកម្សាន្តប៉ុណ្ណោះ។ មិនមែនជាដំបូន្មានខាងវេជ្ជសាស្ត្រ ច្បាប់ ឬហិរញ្ញវត្ថុទេ។ អត្ថន័យគឺផ្អែកលើការបកស្រាយបៃតារ៉ូបែបរ៉ៃឌើរ-វ៉េត (Rider–Waite) ដែលគេស្គាល់ជាទូទៅ។</p>
    <footer class="text-center text-sm muted mt-6 pt-4" style=${{borderTop:'1px solid var(--line)'}}>ដោយ Kang Puthearoath</footer>
  </main>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
