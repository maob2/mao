<!DOCTYPE html>
<html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>លេខសាស្ត្រ — Khmer Numerology</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&family=Moul&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1838;--deep:#221a4a;--gold:#c9a227;--gold2:#f1dc9b;--muted:#6d6785;--line:#e6e0f0;--bg:#f5f2fb;--card:#fff;--rose:#9b2c5c}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Kantumruy Pro',system-ui,sans-serif;color:var(--ink);line-height:1.7;background:radial-gradient(circle at 20% 0%,#e9e2fb 0,transparent 45%),radial-gradient(circle at 100% 30%,#fbefe0 0,transparent 40%),var(--bg);min-height:100vh}
main{max-width:760px;margin:0 auto;padding:22px 16px 40px}
header{text-align:center;margin:6px 0 18px}.kick{color:var(--gold);letter-spacing:2px;font-size:.85rem;font-weight:600}
h1{font-family:'Moul',serif;font-weight:400;color:var(--deep);font-size:2.1rem;margin:4px 0 0;line-height:1.7}
h1 span{display:block;font-family:'Kantumruy Pro';font-weight:600;font-size:1rem;letter-spacing:4px;color:var(--gold);line-height:1.2}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 4px 18px rgba(34,26,74,.06)}
.form{display:grid;gap:12px}.form label{display:grid;gap:4px;font-weight:600;color:var(--deep);font-size:.95rem}.form small{font-weight:400;color:var(--muted);font-size:.8rem}
.field{height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;font-weight:400;background:#fdfcff;color:var(--ink);width:100%}
.field:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.row{display:flex;gap:10px}.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 26px;background:var(--deep);color:var(--gold2);cursor:pointer}
.btn:hover{background:#33296b}.btn.ghost{background:transparent;color:var(--deep);border:1px solid var(--line)}
.err{color:var(--rose);margin:0}
.badge{position:relative;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#3b2f7a,#1b1440);color:var(--gold2);font-weight:700;box-shadow:0 0 0 3px #fff,0 0 0 4.5px var(--gold)}
.badge i{position:absolute;bottom:-6px;right:-6px;font-style:normal;font-size:.62rem;background:var(--gold);color:#1b1440;border-radius:8px;padding:0 6px;font-weight:700}
.sum{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#221a4a,#3a2c78);border:0;color:#ece6ff}
.sum .nm{font-family:'Moul',serif;font-size:1.3rem;color:var(--gold2);line-height:1.8}.sum .muted{color:#c9c0ea;font-size:.92rem}
.trio{display:flex;gap:18px}.trio>div{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:.82rem;color:#d9d1f5}
.res .rh{display:flex;gap:16px;align-items:center;margin-bottom:10px}.rt{font-weight:700;font-size:1.2rem;color:var(--deep)}.ren{color:var(--muted);font-size:.85rem}
.rk{color:#8a6a10;font-size:.85rem;font-weight:600;margin-top:2px}
.lead{margin:.2rem 0 .8rem}.trait{border-left:3px solid var(--gold);padding:2px 0 2px 12px;margin:10px 0}.trait h4,.days h4{margin:0;font-size:.92rem;color:var(--deep)}
.trait p{margin:2px 0 0}.trait.shadow{border-color:#a69ac8}.trait.tip{border-color:#2e8b57}
details{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}summary{cursor:pointer;color:var(--deep);font-weight:600;font-size:.9rem}
.steps p{margin:.3rem 0;font-size:.92rem}.note{font-size:.8rem;color:var(--muted)}
.word{margin:8px 0}.letters{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}.letters span{display:inline-flex;flex-direction:column;align-items:center;min-width:28px;border:1px solid var(--line);border-radius:8px;padding:2px 4px;font-size:.85rem;background:#fbfaff}
.letters em{font-style:normal;font-weight:700;color:var(--deep);font-size:.8rem}.letters span.v{background:#fff6dd}
.days{margin-top:10px}.days div{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.days span{background:var(--deep);color:var(--gold2);border-radius:999px;padding:2px 12px;font-weight:600}
.days p{margin:2px 0 0}.mat{background:#fffaf0}
.disc{text-align:center;font-size:.8rem;color:var(--muted)}footer{text-align:center;font-size:.8rem;color:var(--muted);margin-top:18px}
.fade{animation:f .4s ease}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
@media (max-width:560px){.trio{width:100%;justify-content:space-around}h1{font-size:1.7rem}}

17BE\u1799\u1782\u17B7\u178F\u178F\u17C2\u1796\u17B8\u17A2\u17D2\u179C\u17B8\u178A\u17C2\u179B\u17A2\u17B6\u1785\u1781\u17BB\u179F \u1787\u17B6\u1787\u17B6\u1784\u179F\u17D2\u179C\u17C2\u1784\u179A\u1780\u178A\u17C6\u178E\u17C4\u17C7\u179F\u17D2\u179A\u17B6\u1799\u17D4","\u1780\u178F\u17CB\u178F\u17D2\u179A\u17B6\u1782\u17C6\u1793\u17B7\u178F\u17A2\u179C\u17B7\u1787\u17D2\u1787\u1798\u17B6\u1793\u178A\u17C2\u179B\u179C\u17B7\u179B\u179C\u179B\u17CB\u1780\u17D2\u1793\u17BB\u1784\u1785\u17B7\u178F\u17D2\u178F \u17A0\u17BE\u1799\u1794\u17D2\u178F\u17BC\u179A\u179C\u17B6\u1787\u17B6\u1794\u17D2\u179A\u1799\u17C4\u1782\u179C\u17B7\u1787\u17D2\u1787\u1798\u17B6\u1793 \u17A7. \xAB\u1781\u17D2\u1789\u17BB\u17C6\u1798\u17B7\u1793\u1791\u17B6\u1793\u17CB\u17A2\u17B6\u1785\u1792\u17D2\u179C\u17BE\u1794\u17B6\u1793\xBB \u1787\u17C6\u1793\u17BD\u179F \xAB\u1781\u17D2\u1789\u17BB\u17C6\u1798\u17B7\u1793\u17A2\u17B6\u1785\u1792\u17D2\u179C\u17BE\u1794\u17B6\u1793\xBB\u17D4"],3:["\u17A2\u17D2\u1793\u1780\u1798\u17B6\u1793\u1794\u17BB\u1782\u17D2\u1782\u179B\u17B7\u1780\u179B\u1780\u17D2\u1781\u178E\u17C8\u1791\u17B6\u1780\u17CB\u1791\u17B6\u1789 \u1796\u17BC\u1780\u17C2\u1791\u17C6\u1793\u17B6\u1780\u17CB\u1791\u17C6\u1793\u1784\u179F\u1784\u17D2\u1782\u1798 \u179F\u17BB\u1791\u17B7\u178A\u17D2\u178B\u17B7\u1793\u17B7\u1799\u1798 \u1793\u17B7\u1784\u1796\u17C4\u179A\u1796\u17C1\u1789\u178A\u17C4\u1799\u1790\u17B6\u1798\u1796\u179B\u179C\u17B7\u1787\u17D2\u1787\u1798\u17B6\u1793\u17D4","\u17A2\u17D2\u1793\u1780\u17A2\u17B6\u1785\u179F\u17D2\u1791\u17B6\u1780\u17CB\u179F\u17D2\u1791\u17BE\u179A \u1796\u17B7\u1794\u17B6\u1780\u1794\u17D2\u178F\u17C1\u1787\u17D2\u1789\u17B6\u1785\u17B7\u178F\u17D2\u178F \u17A0\u17BE\u1799\u1794\u17C2\u1784\u1785\u17C2\u1780\u1790\u17B6\u1798\u1796\u179B\u1791\u17C5\u1782\u17C4\u179B\u178A\u17C5\u1785\u17D2\u179A\u17BE\u1793\u1796\u17C1\u1780\u1780\u17D2\u1793\u17BB\u1784\u1796\u17C1\u179B\u178F\u17C2\u1798\u17BD\u1799\u17D4","\u17A0\u17B6\u178F\u17CB\u179F\u178F\u17B7 (mindfulness) \u178A\u17C4\u1799\u1795\u17D2\u178F\u17C4\u178F\u179B\u17BE\u178A\u1784\u17D2\u17A0\u17BE\u1798 \u17E1\u17E0\u2013\u17E1\u17E5 \u1793\u17B6\u1791\u17B8\u179A\u17B6\u179B\u17CB\u1790\u17D2\u1784\u17C3 \u178A\u17BE\u1798\u17D2\u1794\u17B8\u179A\u17C0\u1793\u1795\u17D2\u178F\u17C4\u178F\u179B\u17BE\u179A\u17BF\u1784\u1798\u17BD\u1799\u1798\u17D2\u178F\u1784\u1798\u17BD\u1799\u17D4"],4:["\u17A2\u17D2\u1793\u1780\u1787\u17B6\u1798\u1793\u17BB\u179F\u17D2\u179F\u1787\u17B6\u1780\u17CB\u179F\u17D2\u178F\u17C2\u1784 \u1798\u17B6\u1793\u1786\u1793\u17D2\u1791\u17C8\u179A\u17B9\u1784\u1798\u17B6\u17C6 \u178A\u17B9\u1784\u1785\u17D2\u1794\u17B6\u179F\u17CB\u1790\u17B6\u1785\u1784\u17CB\u1794\u17B6\u1793\u17A2\u17D2\u179C\u17B8 \u17A0\u17BE\u1799\u179A\u17C0\u1794\u1785\u17C6\u1795\u17C2\u1793\u1780\u17B6\u179A\u1787\u17B6\u1780\u17CB\u179F\u17D2\u178F\u17C2\u1784\u178A\u17BE\u1798\u17D2\u1794\u17B8\u179F\u1798\u17D2\u179A\u17C1\u1785\u179C\u17B6\u17D4","\u1780\u17B6\u179A\u1795\u17D2\u178F\u17C4\u178F\u1781\u17D2\u179B\u17B6\u17C6\u1784\u1796\u17C1\u1780 \u1792\u17D2\u179C\u17BE\u17B2\u17D2\u1799\u1791\u179F\u17D2\u179F\u1793\u17C8\u179A\u17B9\u1784\u178F\u17D2\u17A2\u17B9\u1784 \u1798\u17BE\u179B\u1798\u17B7\u1793\u1783\u17BE\u1789\u17B1\u1780\u17B6\u179F \u17A0\u17BE\u1799\u1796\u17C1\u179B\u1781\u17D2\u179B\u17C7\u1796\u17B7\u1794\u17B6\u1780\u1791\u17B6\u1780\u17CB\u1791\u17B6\u1789\u1791\u17D2\u179A\u1796\u17D2\u1799\u179F\u1798\u17D2\u1794\u178F\u17D2\u178F\u17B7\u17D4","\u1780\u17C6\u178E\u178F\u17CB\u17B2\u17D2\u1799\u1785\u17D2\u1794\u17B6\u179F\u17CB\u1790\u17B6\u178F\u17D2\u179A\u17BC\u179C\u1780\u17B6\u179A\u17A0\u17B7\u179A\u1789\u17D2\u1789\u179C\u178F\u17D2\u1790\u17BB\u179F\u1798\u17D2\u179A\u17B6\u1794\u17CB\u17A2\u17D2\u179C\u17B8 \u1793\u17B7\u1784\u1794\u17C9\u17BB\u1793\u17D2\u1798\u17B6\u1793 \u17A0\u17BE\u1799\u1794\u17D2\u179A\u17BE\u1780\u17B6\u179A\u179F\u17D2\u179A\u1798\u17C3\u1783\u17BE\u1789 \u1793\u17B7\u1784\u1796\u17B6\u1780\u17D2\u1799\u1794\u1789\u17D2\u1787\u17B6\u1780\u17CB\u179C\u17B7\u1787\u17D2\u1787\u1798\u17B6\u1793\u179A\u17B6\u179B\u17CB\u1790\u17D2\u1784\u17C3 \u178A\u17BE\u1798\u17D2\u1794\u17B8\u1780\u17C2\u1787\u17C6\u1793\u17BF\u17A2\u179C\u17B7\u1787\u17D2\u1787\u1798\u17B6\u1793\u17A2\u17C6\u1796\u17B8\u179B\u17BB\u1799\u17D4"],5:["\u17A2\u17D2\u1793\u1780\u1798\u17B6\u1793\u1785\u17B7\u178F\u17D2\u178F\u1794\u17BE\u1780\u1785\u17C6\u17A0 \u1785\u17D2\u1793\u17C3\u1794\u17D2\u179A\u178C\u17B7\u178F \u1794\u178F\u17CB\u1794\u17C2\u1793\u1794\u17B6\u1793 \u1782\u17B7\u178F\u1780\u17D2\u179A\u17C5\u1794\u17D2\u179A\u17A2\u1794\u17CB \u17A0\u17BE\u1799\u179A\u179F\u17CB\u1793\u17C5\u1780\u17D2\u1793\u17BB\u1784\u1796\u17C1\u179B\u1794\u1785\u17D2\u1785\u17BB\u1794\u17D2\u1794\u1793\u17D2\u1793\u1794\u17B6\u1793\u179B\u17D2\u17A2\u17D4","\u17A2\u17D2\u1793\u1780\u17A2\u17B6\u1785\u178F\u17B6\u1798\u1785\u17B7\u178F\u17D2\u178F\u1781\u17D2\u179B\u17BD\u1793\u1796\u17C1\u1780 \u178A\u17C1\u1789\u178F\u17C2\u179F\u17C1\u1785\u1780\u17D2\u178F\u17B8\u179F\u1794\u17D2\u1794\u17B6\u1799\u1794\u178E\u17D2\u178F\u17C4\u17C7\u17A2\u17B6\u179F\u1793\u17D2\u1793 \u17A0\u17BE\u1799\u1798\u17BE\u179B\u1798\u17B7\u1793\u1783\u17BE\u1789\u179A\u17BC\u1794\u1797\u17B6\u1796\u1792\u17C6\u17D4","\u1792\u17D2\u179C\u17BE\u17A2\u17C6\u1796\u17BE\u179B\u17D2\u17A2\u178F\u17BC\u1785\u1798\u17BD\u1799\u179A\u17B6\u179B\u17CB\u1790\u17D2\u1784\u17C3 \u178A\u17C4\u1799\u1798\u17B7\u1793\u179A\u17C6\u1796\u17B9\u1784\u178F\u1794\u179F\u17D2\u1793\u1784 \u17A0\u17BE\u1799\u1782\u17B7\u178F\u1782\u17BC\u179A\u1796\u17B8\u17A2\u1793\u17B6\u1782\u178F \u178A\u17C4\u1799\u1798\u17B7\u1793\u1794\u17B6\u178F\u17CB\u1794\u1784\u17CB\u1780\u17B6\u179A\u179A\u179F\u17CB\u1793\u17C5\u1780\u17D2\u1793\u17BB\u1784\u1796\u17C1\u179B\u1793\u17C1\u17C7\u17D4"],6:["\u17A2\u17D2\u1793\u1780\u1798\u17B6\u1793\u1798\u17C1\u178F\u17D2\u178F\u17B6 \u1785\u17B7\u178F\u17D2\u178F\u179F\u1794\u17D2\u1794\u17BB\u179A\u179F \u1785\u17BC\u179B\u1785\u17B7\u178F\u17D2\u178F\u1790\u17C2\u1791\u17B6\u17C6\u17A2\u17D2\u1793\u1780\u178A\u1791\u17C3 \u1793\u17B7\u1784\u1798\u17B6\u1793\u1790\u17B6\u1798\u1796\u179B\u1781\u17D2\u1796\u179F\u17CB \u1792\u17D2\u179C\u17BE\u17B2\u17D2\u1799\u179A\u1780\u17D2\u179F\u17B6\u17A2\u17B6\u1780\u1794\u17D2\u1794\u1780\u17B7\u179A\u17B7\u1799\u17B6\u179C\u17B7\u1787\u17D2\u1787\u1798\u17B6\u1793\u1794\u17B6\u1793\u1784\u17B6\u1799\u17D4","\u17A2\u17D2\u1793\u1780\u1796\u17B7\u1794\u17B6\u1780\u1790\u17D2\u179B\u17B9\u1784\u1790\u17D2\u179B\u17C2\u1784\u179A\u179C\u17B6\u1784\u1780\u17B6\u179A\u1795\u17D2\u178F\u179B\u17CB \u1793\u17B7\u1784\u1780\u17B6\u179A\u1791\u1791\u17BD\u179B\u17D4 \u1794\u17BE\u1795\u17D2\u178F\u179B\u17CB\u1785\u17D2\u179A\u17BE\u1793\u1796\u17C1\u1780 \u17A2\u17D2\u1793\u1780\u1793\u17B9\u1784\u1782\u17D2\u1798\u17B6\u1793\u17A2\u17D2\u179C\u17B8\u179F\u179B\u17CB\u179F\u1798\u17D2\u179A\u17B6\u1794\u17CB\u1781\u17D2\u179B\u17BD\u1793\u17AF\u1784\u17D4","\u1790\u17C2\u1791\u17B6\u17C6\u1781\u17D2\u179B\u17BD\u1793\u17AF\u1784\u1787\u17B6\u1798\u17BB\u1793 \u178A\u17BC\u1785\u1780\u17B6\u179A\u1796\u17B6\u1780\u17CB\u179A\u1794\u17B6\u17C6\u1784\u17A2\u17BB\u1780\u179F\u17CA\u17B8\u179F\u17C2\u1793\u1781\u17D2\u179B\u17BD\u1793\u17AF\u1784\u1798\u17BB\u1793\u1787\u17BD\u1799\u17A2\u17D2\u1793\u1780\u178A\u1791\u17C3\u1780\u17D2\u1793\u17BB\u1784\u1799\u1793\u17D2\u178F\u17A0\u17C4\u17C7\u17D4 \u179F\u179A\u179F\u17C1\u179A\u1785\u17C6\u178E\u17BB\u1785\u179B\u17D2\u17A2\u179A\u1794\u179F\u17CB\u1781\u17D2\u179B\u17BD\u1793 \u178A\u17BE\u1798\u17D2\u1794\u17B8\u179A\u17C6\u179B\u17B9\u1780\u1796\u17B8\u178F\u1798\u17D2\u179B\u17C3\u1781\u17D2\u179B\u17BD\u1793\u17AF\u1784\u17D4"],7:["\u17A2\u17D2\u1793\u1780\u179F\u17D2\u179A\u17A1\u17B6\u1789\u17CB\u179F\u1793\u17D2\u178F\u17B7\u1797\u17B6\u1796 \u1798\u17B6\u1793\u1790\u17B6\u1798\u1796\u179B\u179F\u17D2\u1784\u1794\u17CB\u179F\u17D2\u1784\u17B6\u178F\u17CB \u1796\u17BC\u1780\u17C2\u1786\u17D2\u179B\u17BB\u17C7\u1794\u1789\u17D2\u1785\u17B6\u17C6\u1784 \u17A0\u17BE\u1799\u179A\u1780\u17D2\u179F\u17B6\u1791\u17C6\u1793\u17B6\u1780\u17CB\u1791\u17C6\u1793\u1784\u179B\u17D2\u17A2\u1794\u17B6\u1793\u178A\u17C4\u1799\u1798\u17B7\u1793\u17B2\u17D2\u1799\u179C\u17B6\u1780\u17C6\u178E\u178F\u17CB\u1787\u17B8\u179C\u17B7\u178F\u1781\u17D2\u179B\u17BD\u1793\u17D4","\u17A2\u17D2\u1793\u1780\u17A2\u17B6\u1785\u1796\u17B7\u1794\u17B6\u1780\u1798\u17BE\u179B\u1783\u17BE\u1789 \u1793\u17B7\u1784\u178A\u17B9\u1784\u1782\u17BB\u178E\u1785\u17C6\u1796\u17C4\u17C7\u179A\u17BF\u1784\u179B\u17D2\u17A2\u17D7\u1780\u17D2\u1793\u17BB\u1784\u1787\u17B8\u179C\u17B7\u178F \u1796\u17D2\u179A\u17C4\u17C7\u1796\u17B9\u1784\u1781\u17D2\u179B\u17B6\u17C6\u1784\u179B\u17BE\u1780\u17B6\u179A\u179C\u17B7\u1797\u17B6\u1782\u17D4","\u179F\u179A\u179F\u17C1\u179A\u1780\u17C6\u178E\u178F\u17CB\u17A0\u17C1\u178F\u17BB\u178A\u17B9\u1784\u1782\u17BB\u178E \u17E3\u2013\u17E5 \u1799\u17C9\u17B6\u1784\u179A\u17B6\u179B\u17CB\u1790\u17D2\u1784\u17C3 \u17A0\u17BE\u1799\u17A0\u17B6\u178F\u17CB\u179F\u1798\u17B6\u1792\u17B7 \u178A\u17BE\u1798\u17D2\u1794\u17B8\u1797\u17D2\u1787\u17B6\u1794\u17CB\u1791\u17C5\u1793\u17B9\u1784\u179C\u17B7\u1785\u17B6\u179A\u178E\u1789\u17B6\u178E\u17D4"],8:["\u17A2\u17D2\u1793\u1780\u1794\u17D2\u178F\u17C1\u1787\u17D2\u1789\u17B6\u1785\u17B7\u178F\u17D2\u178F\u1781\u17D2\u179B\u17B6\u17C6\u1784 \u1795\u17D2\u178F\u17C4\u178F \u1796\u17B7\u1785\u17B6\u179A\u178E\u17B6 \u1787\u17B6\u1780\u17CB\u179F\u17D2\u178F\u17C2\u1784 \u1798\u17B6\u1793\u1791\u17C6\u1793\u17BB\u1780\u1785\u17B7\u178F\u17D2\u178F \u1793\u17B7\u1784\u1796\u17BC\u1780\u17C2\u179A\u17C0\u1794\u1785\u17C6\u17D4","\u1797\u17B6\u1796\u1787\u17B6\u1780\u17CB\u179F\u17D2\u178F\u17C2\u1784\u1796\u17C1\u1780 \u17A2\u17B6\u1785\u1794\u17B7\u1791\u1795\u17D2\u179B\u17BC\u179C\u1793\u17C3\u1780\u17D2\u178F\u17B8\u179F\u17BB\u1794\u17B7\u1793 \u1796\u17B7\u1794\u17B6\u1780\u1797\u17D2\u1787\u17B6\u1794\u17CB\u1793\u17B9\u1784\u17A2\u17B6\u179A\u1798\u17D2\u1798\u178E\u17CD \u17A0\u17BE\u1799\u1795\u17D2\u178F\u17C4\u178F\u1781\u17D2\u179B\u17B6\u17C6\u1784\u179B\u17BE\u179F\u1798\u17D2\u1797\u17B6\u179A\u17C8\u17D4","\u1791\u1791\u17BD\u179B\u179F\u17D2\u1782\u17B6\u179B\u17CB\u17A2\u17B6\u179A\u1798\u17D2\u1798\u178E\u17CD\u1781\u17D2\u179B\u17BD\u1793\u178A\u17C4\u1799\u1798\u17B7\u1793\u179C\u17B7\u1793\u17B7\u1785\u17D2\u1786\u17D0\u1799\u17D6 \u178F\u17BE\u1781\u17D2\u1789\u17BB\u17C6\u1798\u17B6\u1793\u17A2\u17B6\u179A\u1798\u17D2\u1798\u178E\u17CD\u17A2\u17D2\u179C\u17B8? \u17A0\u17C1\u178F\u17BB\u17A2\u17D2\u179C\u17B8? \u1780\u17B6\u179A\u1799\u179B\u17CB\u17A2\u17B6\u179A\u1798\u17D2\u1798\u178E\u17CD\u1787\u17BD\u1799\u17B2\u17D2\u1799\u178A\u17B9\u1784\u1785\u17D2\u1794\u17B6\u179F\u17CB\u1796\u17B8\u17A2\u17D2\u179C\u17B8\u178A\u17C2\u179B\u17A2\u17D2\u1793\u1780\u1796\u17B7\u178F\u1787\u17B6\u1785\u1784\u17CB\u1794\u17B6\u1793\u17D4"],9:["\u17A2\u17D2\u1793\u1780\u1798\u17B6\u1793\u1780\u17B7\u178F\u17D2\u178F\u17B7\u1799\u179F \u1799\u17BB\u178F\u17D2\u178F\u17B7\u1792\u1798\u17CC \u1798\u17B6\u1793\u1798\u1793\u17D2\u178F\u179F\u17D2\u1793\u17C1\u17A0\u17CD \u1793\u17B7\u1784\u1794\u17BB\u1782\u17D2\u1782\u179B\u17B7\u1780\u179B\u1780\u17D2\u1781\u178E\u17C8\u1791\u17B6\u1780\u17CB\u1791\u17B6\u1789 \u178A\u17C2\u179B\u1792\u17D2\u179C\u17BE\u17B2\u17D2\u1799\u17A2\u17D2\u1793\u1780\u178A\u1791\u17C3\u1782\u17C4\u179A\u1796\u17D4","\u17A2\u17D2\u1793\u1780\u17A2\u17B6\u1785\u1784\u1794\u17CB\u1784\u179B\u17CB\u1796\u17C1\u1780\u1793\u17B9\u1784\u1797\u17B6\u1796\u1787\u17C4\u1782\u1787\u17D0\u1799 \u17AC\u179F\u17C1\u179A\u17B8\u1797\u17B6\u1796\u17A0\u17B7\u179A\u1789\u17D2\u1789\u179C\u178F\u17D2\u1790\u17BB \u17A0\u17BE\u1799\u1787\u17C6\u1793\u17BF\u17A2\u179C\u17B7\u1787\u17D2\u1787\u1798\u17B6\u1793\u179A\u17B6\u179A\u17B6\u17C6\u1784\u1781\u17D2\u179B\u17BD\u1793\u17AF\u1784\u17D4","\u179F\u179A\u179F\u17C1\u179A\u1782\u17C4\u1 178E\u17B6\u1785\u1780\u17D2\u1793\u17BB\u1784\u179C\u17B7\u179F\u17D0\u1799\u178A\u17C2\u179B\u1781\u17D2\u179B\u17BD\u1793\u1787\u17D2\u179A\u17BE\u179F\u179A\u17BE\u179F \u17A0\u17BE\u1799\u1791\u17C6\u1793\u17BB\u1780\u1785\u17B7\u178F\u17D2\u178F\u1793\u17B9\u1784\u1780\u17BE\u1793\u17A1\u17BE\u1784\u178F\u17B6\u1798\u179C\u17D0\u1799\u17D4","\u17A2\u17D2\u1793\u1780\u17A2\u17B6\u1785\u1781\u17D2\u179C\u17C7\u1791\u17C6\u1793\u17BB\u1780\u1785\u17B7\u178F\u17D2\u178F\u178A\u17BE\u179A\u178F\u17B6\u1798\u1782\u17C6\u1793\u17B7\u178F\u1781\u17D2\u179B\u17BD\u1793 \u1796\u17B7\u179F\u17C1\u179F\u1796\u17C1\u179B\u1793\u17C5\u1780\u17D2\u179A\u17C4\u1798\u17A2\u17C6\u178E\u17B6\u1785\u17A2\u17D2\u1793\u1780\u178A\u1791\u17C3\u17D4 \u1785\u17BC\u179A\u1794\u178E\u17D2\u178F\u17BB\u17C7\u1797\u17B6\u1796\u1787\u17B6\u17A2\u17D2\u1793\u1780\u178A\u17B9\u1780\u1793\u17B6\u17C6 \u1793\u17B7\u1784\u1787\u17C6\u1793\u17B6\u1789\u179F\u17D2\u178F\u17B6\u1794\u17CB\u17D4"],2:["\u17A2\u17D2\u1793\u1780\u1798\u17B6\u1793\u179C\u17B7\u1785\u17B6\u179A\u178E\u1789\u17B6\u178E\u1781\u17D2\u179B\u17B6\u17C6\u1784 \u1787\u17B6\u17A2\u17D2\u1793\u1780\u1796\u17D2\u1799\u17B6\u1794\u17B6\u179B\u178A\u17C4\u1799\u1792\u1798\u17D2\u1798\u1787\u17B6\u178F\u17B7 \u17A0\u17BE\u1799\u17B2\u17D2\u1799\u178F\u1798\u17D2\u179B\u17C3\u1781\u17D2\u1796\u179F\u17CB\u179B\u17BE\u1791\u17C6\u1793\u17B6\u1780\u17CB\u1791\u17C6\u1793\u1784\u17D4 \u17A2\u17D2\u1793\u1780\u1785\u1784\u17CB\u1794\u1784\u17D2\u1780\u17BE\u178F\u1787\u17B8\u179C\u17B7\u178F\u178A\u17C2\u179B\u1796\u17C4\u179A\u1796\u17C1\u1789\u178A\u17C4\u1799\u1797\u17B6\u1796\u179F\u17D2\u179A\u179F\u17CB\u179F\u17D2\u17A2\u17B6\u178F \u179F\u1793\u17D2\u178F\u17B7\u1797\u17B6\u1796 \u1793\u17B7\u1784\u179F\u17BB\u1781\u178A\u17BB\u1798\u179A\u1798\u1793\u17B6\u17D4","\u17A2\u17D2\u1793\u1780\u17A2\u17B6\u1785\u1795\u17D2\u178F\u179B\u17CB\u1781\u17D2\u179B\u17BD\u1793\u17B2\u17D2\u1799\u17A2\u17D2\u1793\u1780\u178A\u1791\u17C3\u1785\u17D2\u179A\u17BE\u1793\u1796\u17C1\u1780\u17D4 \u1785\u17BC\u179A\u1795\u17D2\u178F\u17C4\u178F\u179B\u17BE\u1796\u17B7\u1797\u1796\u1781\u17B6\u1784\u1780\u17D2\u1793\u17BB\u1784 \u1793\u17B7\u1784\u1780\u17D2\u178F\u17B8\u179F\u17BB\u1794\u17B7\u1793\u179A\u1794\u179F\u17CB\u1781\u17D2\u179B\u17BD\u1793\u1795\u1784\u17D4"],3:["\u1794\u17BB\u1782\u17D2\u1782\u179B\u17B7\u1780\u179B\u1780\u17D2\u1781\u178E\u17C8 \u1793\u17B7\u1784\u179F\u17D2\u1793\u17B6\u1798\u1789\u1789\u17B9\u1798\u179A\u1794\u179F\u17CB\u17A2\u17D2\u1793\u1780 \u1791\u17B6\u1780\u17CB\u1791\u17B6\u1789\u1798\u1793\u17BB\u179F\u17D2\u179F\u1782\u17D2\u179A\u1794\u17CB\u1782\u17D2\u1793\u17B6\u17D4 \u17A2\u17D2\u1793\u1780\u179F\u17BB\u1791\u17B7\u178A\u17D2\u178B\u17B7\u1793\u17B7\u1799\u1798 \u179A\u17B8\u1780\u179A\u17B6\u1799 \u1785\u17D2\u1793\u17C3\u1794\u17D2\u179A\u178C\u17B7\u178F \u17A0\u17BE\u1799\u1796\u17BC\u1780\u17C2\u1794\u1789\u17D2\u1785\u17C1\u1789\u1782\u17C6\u1793\u17B7\u178F\u1794\u17B6\u1793\u1785\u17D2\u1794\u17B6\u179F\u17CB\u179B\u17B6\u179F\u17CB\u17D4","\u1797\u17B6\u1796\u179A\u179F\u17BE\u1794\u17A2\u17B6\u1785\u1780\u17D2\u179B\u17B6\u1799\u1787\u17B6\u1780\u17B6\u179A\u179F\u1784\u17D2\u179F\u17D0\u1799\u1781\u17D2\u179B\u17BD\u1793\u17AF\u1784 \u1793\u17B7\u1784\u1780\u17B6\u179A\u179A\u17B7\u17C7\u1782\u1793\u17CB\u1781\u17D2\u179B\u17BD\u1793\u17AF\u1784\u17D4 \u1785\u17BC\u179A\u179B\u17C2\u1784\u179F\u17C6\u17A1\u17C1\u1784\u17A2\u17D2\u1793\u1780\u179A\u17B7\u17C7\u1782\u1793\u17CB\u1780\u17D2\u1793\u17BB\u1784\u1785\u17B7\u178F\u17D2\u178F\u17D4"],4:["\u17A2\u17D2\u1793\u1780\u179F\u17D2\u1798\u17C4\u17C7\u178F\u17D2\u179A\u1784\u17CB \u1781\u17B7\u178F\u1781\u17C6 \u1791\u17BB\u1780\u1785\u17B7\u178F\u17D2\u178F\u1794\u17B6\u1793 \u1798\u17B6\u1793\u1797\u17B6\u1796\u1787\u17B6\u17A2\u17D2\u1793\u1780\u178A\u17B9\u1780\u1793\u17B6\u17C6 \u1793\u17B7\u1784\u179F\u17D2\u179A\u17A1\u17B6\u1789\u17CB\u1782\u17D2\u179A\u17BD\u179F\u17B6\u179A\u1781\u17D2\u179B\u17B6\u17C6\u1784\u17D4 \u1780\u17B6\u179A\u1781\u17B7\u178F\u1781\u17C6\u1786\u17D2\u1796\u17C4\u17C7\u1791\u17C5\u179A\u1780\u1787\u17C4\u1782\u1787\u17D0\u1799 \u1798\u1780\u178A\u17C4\u1799\u1792\u1798\u17D2\u1798\u1787\u17B6\u178F\u17B7\u17D4","\u17A2\u17D2\u1793\u1780\u17A2\u17B6\u1785\u17A2\u179F\u17CB\u1780\u1798\u17D2\u179B\u17B6\u17C6\u1784\u1796\u17D2\u179A\u17C4\u17C7\u1787\u17BD\u1799\u17A2\u17D2\u1793\u1780\u178A\u1791\u17C3 \u17A0\u17BE\u1799\u1780\u17B6\u179A\u1795\u17D2\u178F\u179B\u17CB\u178A\u17C6\u1794\u17BC\u1793\u17D2\u1798\u17B6\u1793\u1785\u17D2\u179A\u17BE\u1793\u1796\u17C1\u1780 \u17A2\u17B6\u1785\u1792\u17D2\u179C\u17BE\u17B2\u17D2\u1799\u17A0\u17B6\u1780\u17CB\u178A\u17BC\u1785\u1787\u17B6\u1794\u1789\u17D2\u1787\u17B6\u1782\u17C1\u17D4 \u1785\u17BC\u179A\u1792\u17D2\u179C\u17BE\u1780\u17B6\u179A\u1787\u17B6\u1780\u17D2\u179A\u17BB\u1798\u17D4"],5:["\u17A2\u17D2\u1793\u1780\u17B2\u17D2\u1799\u178F\u1798\u17D2\u179B\u17C3\u179F\u17C1\u179A\u17B8\u1797\u17B6\u1796\u179B\u17BE\u179F\u17A2\u17D2\u179C\u17B8\u1791\u17B6\u17C6\u1784\u17A2\u179F\u17CB\u17D4 \u17A2\u17D2\u1793\u1780\u1798\u17B6\u1793\u1791\u17C1\u1796\u1780\u17C4\u179F\u179B\u17D2\u1799 \u1785\u17D2\u1793\u17C3\u1794\u17D2\u179A\u178C\u17B7\u178F \u1785\u17B6\u1794\u17CB\u17A2\u17B6\u179A\u1798\u17D2\u1798\u178E\u17CD\u1785\u17D2\u179A\u17BE\u1793\u1795\u17D2\u1793\u17C2\u1780 \u1798\u17B6\u1793\u1798\u1793\u17D2\u178F\u179F\u17D2\u1793\u17C1\u17A0\u17CD \u1785\u1784\u17CB\u178A\u17B9\u1784\u1785\u1784\u17CB\u1783\u17BE\u1789 \u1793\u17B7\u1784\u1796\u17BC\u1780\u17C2\u1793\u17B7\u1791\u17B6\u1793\u179A\u17BF\u1784\u17D4","\u1780\u17B6\u179A\u1785\u17BC\u179B\u1785\u17B7\u178F\u17D2\u178F\u1785\u17D2\u179A\u17BE\u1793\u1799\u17C9\u17B6\u1784 \u1792\u17D2\u179C\u17BE\u17B2\u17D2\u1799\u1796\u17B7\u1794\u17B6\u1780\u1787\u17D2\u179A\u17BE\u179F\u179A\u17BE\u179F\u1798\u17BD\u1799\u17D4 \u1785\u17BC\u179A\u179A\u17C0\u1793\u1795\u17D2\u178F\u17C4\u178F\u179B\u17BE\u1780\u17B6\u179A\u1784\u17B6\u179A\u1798\u17BD\u1799 \u17A0\u17BE\u1799\u1780\u17C6\u178E\u178F\u17CB\u1796\u17D2\u179A\u17C6\u178A\u17C2\u1793\u1795\u17D2\u1791\u17B6\u179B\u17CB\u1781\u17D2\u179B\u17BD\u1793 \u178A\u17BE\u1798\u17D2\u1794\u17B8\u179A\u1780\u17D2\u179F\u17B6\u179F\u17C1\u179A\u17B8\u1797\u17B6\u1796\u1780\u17D2\u1793\u17BB\u1784\u1791\u17C6\u1793\u17B6\u1780\u17CB\u1791\u17C6\u1793\u1784\u17D4"],6:["\u17A2\u17D2\u1793\u1780\u1798\u17B6\u1793\u1780\u17B6\u179A\u1791\u1791\u17BD\u179B\u1781\u17BB\u179F\u178F\u17D2\u179A\u17BC\u179C\u1781\u17D2\u1796\u179F\u17CB\u1785\u17C6\u1796\u17C4\u17C7\u17A2\u17D2\u1793\u1780\u178A\u1791\u17C3 \u1796\u17B7\u179F\u17C1\u179F\u1798\u1793\u17BB\u179F\u17D2\u179F\u1787\u17B6\u1791\u17B8\u179F\u17D2\u179A\u17A1\u17B6\u1789\u17CB \u17A0\u17BE\u1799\u1798\u17B7\u1793\u1785\u1784\u17CB\u1792\u17D2\u179C\u17BE\u17B2\u17D2\u1799\u1793\u179A\u178E\u17B6\u1781\u1780\u1785\u17B7\u178F\u17D2\u178F\u17D4 \u17A2\u17D2\u1793\u1780\u1785\u1784\u17CB\u1794\u17B6\u1793\u1787\u17C4\u1782\u1787\u17D0\u1799 \u1796\u17D2\u179A\u1798\u1791\u17B6\u17C6\u1784\u179F\u17BB\u1781\u178A\u17BB\u1798\u179A\u1798\u1793\u17B6\u17D4","\u17A2\u17D2\u1793\u1780\u1798\u17B6\u1793\u1791\u17C6\u1793\u17C4\u179A\u1785\u1784\u17CB\u1794\u17B6\u1793\u1797\u17B6\u1796\u179B\u17D2\u17A2\u17A5\u178F\u1781\u17D2\u1785\u17C4\u17C7 \u17A0\u17BE\u1799\u1792\u17D2\u179C\u17BE\u1780\u17B6\u179A\u1787\u17BD\u1799\u1782\u17C1\u179A\u17A0\u17BC\u178F\u1781\u17B6\u178F\u1781\u17D2\u179B\u17BD\u1793\u17AF\u1784\u17D4 \u1782\u17D2\u1798\u17B6\u1793\u1793\u179A\u178E\u17B6\u1796\u17BC\u1780\u17C2\u1782\u17D2\u179A\u1794\u17CB\u1799\u17C9\u17B6\u1784\u1791\u17C1 \u1785\u17BC\u179A\u1791\u1791\u17BD\u179B\u1787\u17C6\u1793\u17BD\u1799\u1796\u17B8\u17A2\u17D2\u1793\u1780\u178A\u1791\u17C3\u1795\u1784\u17D4"],7:["\u17A2\u17D2\u1793\u1780\u1798\u17B6\u1793\u1785\u17B7\u178F\u17D2\u178F\u179F\u17D2\u179C\u17C2\u1784\u179A\u1780\u1780\u17B6\u179A\u1796\u17B7\u178F\u1780\u17D2\u1793\u17BB\u1784\u1782\u17D2\u179A\u1794\u17CB\u179F\u17D2\u1790\u17B6\u1793\u1797\u17B6\u1796 \u1785\u17B7\u178F\u17D2\u178F\u1798\u17BB\u178F\u179F\u17D2\u179A\u17BD\u1785\u178A\u17BC\u1785\u1780\u17B6\u17C6\u179A\u179F\u17D2\u1798\u17B8\u17A2\u17CA\u17B7\u1785 \u1793\u17B7\u1784\u179C\u17B7\u1785\u17B6\u179A\u178E\u1789\u17B6\u178E\u179B\u17D2\u17A2\u17D4 \u1780\u17B6\u179A\u1784\u17B6\u179A\u178A\u17C2\u179B\u1792\u17D2\u179C\u17BE\u178A\u17C4\u1799\u17AF\u1780\u179A\u17B6\u1787\u17D2\u1799 \u179F\u1798\u179F\u17D2\u179A\u1794\u1794\u17C6\u1795\u17BB\u178F\u17D4","\u1796\u17C1\u179B\u1781\u17D2\u179B\u17C7 \u1796\u17B7\u1794\u17B6\u1780\u1791\u17BB\u1780\u1785\u17B7\u178F\u17D2\u178F\u1781\u17D2\u179B\u17BD\u1793\u17AF\u1784\u17D4 \u1785\u17BC\u179A\u179A\u17C0\u1793\u1787\u17BF\u179C\u17B7\u1785\u17B6\u179A\u178E\u1789\u17B6\u178E\u17D6 \u1794\u17BE\u179F\u17C6\u17A1\u17C1\u1784\u1781\u17B6\u1784\u1780\u17D2\u1793\u17BB\u1784\u1790\u17B6\u1798\u17B6\u1793\u17A2\u17D2\u179C\u17B8\u1781\u17BB\u179F \u179C\u17B6\u1794\u17D2\u179A\u17A0\u17C2\u179B\u1787\u17B6\u178F\u17D2\u179A\u17BC\u179C\u17D4"],8:["\u17A2\u17D2\u1793\u1780\u1798\u17BE\u179B\u1783\u17BE\u1789\u179A\u17BC\u1794\u1797\u17B6\u1796\u1792\u17C6 \u1785\u17BC\u179B\u1785\u17B7\u178F\u17D2\u178F\u1780\u17B6\u1793\u17CB\u1780\u17B6\u1794\u17CB \u1796\u17BC\u1780\u17C2\u1782\u17D2\u179A\u1794\u17CB\u1782\u17D2\u179A\u1784\u1792\u1793\u1792\u17B6\u1793 \u17A0\u17BE\u1799\u178F\u17C2\u1784\u179F\u17D2\u1790\u17B7\u178F\u1780\u17D2\u1793\u17BB\u1784\u1790\u17D2\u1793\u17B6\u1780\u17CB\u178A\u17B9\u1780\u1793\u17B6\u17C6\u17D4 \u178B\u17B6\u1793\u17C8 \u1791\u17D2\u179A\u1796\u17D2\u1799 \u1793\u17B7\u1784\u17A2\u17C6\u178E\u17B6\u1785 \u1787\u17B6\u17A2\u17D2\u179C\u17B8\u178A\u17C2\u179B\u17A2\u17D2\u1793\u1780\u1785\u1784\u17CB\u1794\u17B6\u1793\u17D4","\u17A2\u17D2\u1793\u1780\u17A2\u17B6\u1785\u1798\u17B6\u1793\u17A2\u17B6\u179A\u1798\u17D2\u1798\u178E\u17CD\u1790\u17B6\u1798\u17B7\u1793\u179F\u1798\u1793\u17B9\u1784\u179
